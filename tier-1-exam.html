edural concept \"Declaración Jurada Escrita\" into the U.S. common law framework:", "opts": ["Judicial script", "Sworn document", "Affidavit", "Verification paper"], "a": 2, "fb": "The Bridge Methodology: An Affidavit is a voluntary, written statement of facts confirmed under oath. It serves as a vital tool during summary judgment and motions practice."}, {"cat": "Legal English", "stem": "Choose the option that avoids an error in register when explaining the concept of \"Statute of Frauds\" to a team member:", "opts": ["An administrative fine imposed by the court clerk for filing inaccurate papers.", "A legal rule requiring that certain types of contracts (e.g., real estate sales) must be in writing to be legally enforceable.", "The law that says all frauds are illegal in business contracts.", "The computer software used to scan for fake signatures inside Clio."], "a": 1, "fb": "Linguistic Precision: The Statute of Frauds restricts oral agreements in high-stakes transactions. Personnel must cross-reference this rule when screening oral contract disputes."}, {"cat": "Labor", "stem": "What is the purpose of \"Discovery\" in a labor dispute?", "opts": ["To obtain internal employer emails, payroll records, and performance reviews.", "To fire the manager.", "To delete the case file.", "To avoid paying court fees."], "a": 0, "fb": "Risk Mitigation: Support staff must ensure that payroll and email discovery is requested immediately to prevent document destruction."}, {"cat": "Immigration", "stem": "If a client has an \"Overstay,\" what does this mean for their admissibility?", "opts": ["It grants immediate citizenship.", "They may be subject to bars on admissibility depending on the length of unlawful presence.", "It has no impact.", "They must wait 24 hours."], "a": 1, "fb": "Risk Mitigation: Failure to flag unlawful presence (bars) can lead to clients being detained or deported upon filing."}, {"cat": "Legal English", "stem": "A prospective client calls stating they want to sue a driver for negligence. In U.S. law, Negligence is categorized under which branch of law?", "opts": ["Breach of Contract Law", "Criminal Law", "Tort Law", "Administrative Statutory Law"], "a": 2, "fb": "Linguistic Precision: Negligence is a subset of Tort Law (responsabilidad extracontractual). Misclassifying negligence as a contract issue in Litify corrupts automated template generation."}, {"cat": "Personal Injury", "stem": "Define \"Duty of Care\" in the context of negligence.", "opts": ["The duty to report accidents to the police.", "The duty to win every case.", "The duty to pay medical bills.", "The legal obligation to act in a manner that avoids causing foreseeable harm to others."], "a": 3, "fb": "Risk Mitigation: If the defendant had no duty, the case is meritless; intake must verify the duty/breach dynamic."}, {"cat": "Legal English", "stem": "An assistant logs: \"The client gave the firm the power to do her case.\" What is the formal verb used when a client officially hires a law firm?", "opts": ["To engage a legal service", "To retain a law firm", "To buy a law firm", "To sign an attorney"], "a": 1, "fb": "Linguistic Precision: To retain is the specific legal collocation used to describe the act of a client formally employing an attorney or law practice to represent them."}, {"cat": "Labor", "stem": "Define \"Discrimination\".", "opts": ["Treating an employee unfairly based on protected characteristics like race, gender, religion, or age.", "Firing for lack of performance.", "A budget cut.", "Preferring one office."], "a": 0, "fb": "Risk Mitigation: Staff must distinguish between \"unfairness\" and illegal discrimination based on protected classes."}, {"cat": "Immigration", "stem": "What is \"Dual Intent\"?", "opts": ["Intent to work and study.", "Intent to travel and live in the U.S.", "The legal concept allowing certain visa holders (like H-1B) to have both temporary and permanent residency intent.", "Intent to file two petitions at once."], "a": 2, "fb": "Risk Mitigation: Attempting immigration for visas that do not allow dual intent is a major strategic failure."}, {"cat": "Legal Software", "stem": "What does a \"Role-Based Permission\" ensure?", "opts": ["That staff only have access to the data necessary for their specific legal tasks.", "That everyone can change the password.", "That everyone can delete files.", "That the office looks clean."], "a": 0, "fb": "Risk Mitigation: Restricting access is the primary way to protect sensitive client data from accidental leaks."}, {"cat": "Legal English", "stem": "An assistant writes: \"The client wants to challenge the law because it is against the Constitution.\" What is the precise technical phrase for this type of action?", "opts": ["Statutory Veto Filing", "Contract Cancellation Pleading", "Constitutional Challenge / Judicial Review", "Civil Disobedience Motion"], "a": 2, "fb": "Linguistic Precision: A constitutional challenge executed through judicial review is the proper procedural mechanism to contest an unconstitutional statute, raising the file's register."}, {"cat": "Legal Software", "stem": "What is \"Document Management\"?", "opts": ["A structured system for creating, storing, accessing, and retiring legal documents securely.", "Simply storing files.", "Organizing desk space.", "Moving furniture."], "a": 0, "fb": "Risk Mitigation: Without management, documents are lost in digital \"swamps,\" creating massive liability risks."}, {"cat": "Legal English", "stem": "In U.S. contract disputes, what does the doctrine of \"Mitigation of Damages\" require of the non-breaching party?", "opts": ["To automatically transfer all active electronic case files from Clio Manage to Litify templates.", "To execute a general liability release within 24 calendar hours of the contract violation.", "To take reasonable, proactive steps to minimize or reduce the ongoing financial losses resulting from the adverse party's breach.", "To take active steps to artificially maximize their economic losses to inflate the future lawsuit value."], "a": 2, "fb": "Linguistic Precision: Litigants cannot sit back and let damages accumulate. Intake professionals must screen for actions showing the client attempted to mitigate damages to protect the viability of the recovery calculation."}, {"cat": "Legal English", "stem": "In U.S. civil procedure, what does a \"Motion for a More Definite Statement\" challenge?", "opts": ["The calculation of pecuniary damages inside an insurance carrier's evaluation report.", "The admissibility of hearsay statements provided by an independent witness affidavit.", "A pleading that is so vague, ambiguous, or unorganized that the responsive party cannot reasonably prepare a proper legal answer.", "The personal jurisdiction of a federal court over an out-of-state defendant."], "a": 2, "fb": "Linguistic Precision: This motion targets defective complaints under Rule 12(e). Receiving this filing requires the assistant to alert counsel to amend the file prose."}, {"cat": "Legal Software", "stem": "What is the function of a \"Workflow Automation\" (Task Chain) in a CRM?", "opts": ["To hide data from the firm.", "To make the screen look colorful.", "To send automated spam.", "To ensure every case hits mandatory procedural milestones without manual attorney intervention."], "a": 3, "fb": "Risk Mitigation: Manual task management is prone to human error; automation ensures compliance with court timelines."}, {"cat": "Labor", "stem": "In U.S. Labor law, what is the core legal distinction between an \"Employee\" and an \"Independent Contractor\"?", "opts": ["The client’s preferred language.", "The distance to the office.", "The employee's age.", "The degree of control the employer exercises over the worker's tasks and schedule."], "a": 3, "fb": "Risk Mitigation: Misclassifying a client is a catastrophic error; intake must flag specific indicators of \"control\" to set the right legal strategy."}, {"cat": "Legal English", "stem": "Under U.S. law, what does the \"Attorney-Client Privilege\" explicitly protect from disclosure?", "opts": ["Financial bank statements and corporate tax returns managed by an independent accountant.", "Written witness statements gathered by law enforcement officers at an accident scene.", "Public court filings and administrative petitions filed by the law firm.", "Confidential communications between an attorney and their client made for the purpose of obtaining or providing legal advice."], "a": 3, "fb": "Linguistic Precision: Safeguarding confidentiality prevents waiver risks. Intake staff must recognize that early client communications are covered by privilege to avoid unauthorized exposure to third parties."}, {"cat": "Legal English", "stem": "Which of the following sentences utilizes the correct professional register to document that a client provided their evidence late?", "opts": ["The client failed to provide the requested evidentiary documentation within the stipulated timeframe.", "Documentation arrived late due to client's personal problems.", "Maria sent the papers late because she forgot about the link.", "The client took too long to send us the accident photos."], "a": 0, "fb": "Register Mastery: Uses objective, professional, and precise legal phrasing (failed to provide, evidentiary documentation, stipulated timeframe) to protect the firm's timeline defense."}, {"cat": "Legal English", "stem": "What does the term \"Service of Process\" mean in U.S. civil litigation workflows?", "opts": ["The automated billing cycles executed by the accounting department.", "The technical process of uploading documents to a cloud-based CRM.", "The preparation of dynamic data sheets for a trial setting conference.", "The formal delivery of legal documents (such as a summons and complaint) to a defendant to give them official notice of a lawsuit."], "a": 3, "fb": "Linguistic Precision: Service of Process is a strict constitutional requirement for personal jurisdiction. Failing to track it properly results in the immediate dismissal of a lawsuit."}, {"cat": "General", "stem": "Define \"Deposition\".", "opts": ["A type of traffic settlement.", "A meeting with the firm's insurance.", "An out-of-court oral examination of a witness under oath.", "A document filed with the court clerk."], "a": 2, "fb": "Risk Mitigation: Preparing a client for deposition is a core Litigation duty; intake identifies the need for this preparation early."}, {"cat": "Immigration", "stem": "What is a \"Notice to Appear\" (NTA)?", "opts": ["A meeting invitation.", "A job offer.", "The document that formally starts removal proceedings in immigration court.", "A visa approval notice."], "a": 2, "fb": "Risk Mitigation: An NTA is a high-level alert; if ignored, the client will be ordered deported in absentia."}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow"><span></span><button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button></div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const score = totalScore();
    const pct = score / TOTAL;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    for(let bn=1; bn<=NUM_BATCHES; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>Exam Complete</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""}</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>Overall</strong></td><td>${score} / ${TOTAL}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${passed ? TIER_LABEL + " — PASSED" : TIER_LABEL + " — Not yet passing"}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%.</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        <span></span>
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){ state.screen = "final"; }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const score = totalScore(); const pct = score/TOTAL;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS`);
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("");
  for(let bn=1; bn<=NUM_BATCHES; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push(`OVERALL: ${score}/${TOTAL} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();
</script>

</html>
