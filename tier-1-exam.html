<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================
// Tier 1 — 150 questions, proportionally sampled

const TIER_LABEL = "Tier 1";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = ""; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Labor", "stem": "If a client has a \"Right to Sue\" letter, what is its function?", "opts": ["It is a certificate of citizenship.", "It is a warning from the employer.", "It is an automatic settlement check.", "It is a required notice from the EEOC authorizing the employee to file a lawsuit in court."], "a": 3, "fb": "Risk Mitigation: Missing the strict filing deadline after receiving a Right to Sue letter results in the permanent loss of the claim."}, {"cat": "Legal English", "stem": "An assistant logs: \"The client wants to sue because the company manufactured a bad car part that exploded.\" What is the precise technical category for this category of tort dispute?", "opts": ["Sovereign immunity action", "Structural contract breach", "Job context claim", "Products Liability"], "a": 3, "fb": "Linguistic Precision: Harm caused by defective consumer goods falls under Products Liability, which triggers distinct strict liability evidentiary frameworks during intake."}, {"cat": "Labor", "stem": "Define \"Whistleblower\".", "opts": ["An employee who exposes information about illegal or unethical activities within an organization.", "A person who plays music.", "An office manager.", "An outside contractor."], "a": 0, "fb": "Risk Mitigation: Whistleblower cases are highly complex and carry massive legal stakes; intake must flag these immediately for partners."}, {"cat": "Immigration", "stem": "What is a \"Request for Evidence\" (RFE)?", "opts": ["A request for an interview reschedule.", "A congratulatory letter from USCIS.", "A notice that the case is closed.", "A formal notice from USCIS requesting additional documents to support a pending application."], "a": 3, "fb": "Risk Mitigation: Timely tracking of RFEs in the CRM is essential; missing an RFE response deadline leads to immediate case denial."}, {"cat": "Legal English", "stem": "Under U.S. law, what is the core purpose of a \"Demand Letter\" sent during pre-litigation workflows?", "opts": ["To command a witness to appear for a formal deposition under oath.", "To request an extension of time from the clerk of the court.", "To formally serve a summons under the Federal Rules of Civil Procedure.", "To officially notify a party of a dispute, outline liability and damages, and request a financial settlement to avoid a lawsuit."], "a": 3, "fb": "Linguistic Precision: A demand letter is a pre-litigation tool. Differentiating it from a Complaint prevents catastrophic timeline errors during case setup."}, {"cat": "Legal English", "stem": "Complete the following intentional tort definition: \"The intentional creation of a reasonable apprehension of imminent harmful or offensive physical contact in another person constitutes the tort of _________.\"", "opts": ["Trespass", "Defamation", "Assault", "Battery"], "a": 2, "fb": "Linguistic Precision: Assault (amenaza de agresión) does not require actual physical impact. Intake assets must differentiate this from Battery (the actual harmful contact) to ensure the complaint fields are populated with precise counts."}, {"cat": "Legal Software", "stem": "What happens if you import a \"Lead\" into a \"Matter\" file prematurely?", "opts": ["It improves the software speed.", "The database becomes cluttered, and the firm may incur unnecessary system usage costs or compliance errors.", "You get a promotion.", "The computer reboots."], "a": 1, "fb": "Risk Mitigation: \"Lead\" vs. \"Matter\" conversion must only occur after retainer execution; early conversion compromises audit integrity."}, {"cat": "Legal Software", "stem": "Why log \"Client Communication\"?", "opts": ["To share secrets.", "To prove the lawyer is working.", "To maintain an accurate record of instructions, case developments, and expectations.", "To talk about movies."], "a": 2, "fb": "Risk Mitigation: Unrecorded communication often becomes the basis for client complaints and ethics hearings."}, {"cat": "Labor", "stem": "Why must intake notes distinguish between \"Independent Contractor\" and \"Employee\" status?", "opts": ["To find the office address.", "To choose the lawyer.", "It determines if the client is protected by labor laws like overtime and anti-discrimination statutes.", "To change the tax rate."], "a": 2, "fb": "Risk Mitigation: Misclassifying an independent contractor as an employee, or vice versa, creates immense strategic liability."}, {"cat": "Legal English", "stem": "Complete the following procedural step: \"Before a lawsuit can be officially filed against a public entity, the claimant must first file an administrative _________.\"", "opts": ["sovereign petition", "lawsuit letter", "executive motion", "government claim notice"], "a": 3, "fb": "Linguistic Precision: Suing government bodies requires a Government Claim Notice within tight timelines (e.g., 6 months). Missing this specialized operational filter results in fatal malpractice."}, {"cat": "Immigration", "stem": "What is a \"Reciprocity Schedule\"?", "opts": ["A table indicating the fees and validity of visas based on the applicant's nationality.", "A list of court judges.", "A list of visa fees for different countries.", "A document for asylum seekers."], "a": 0, "fb": "Risk Mitigation: Charging the wrong fee based on reciprocity leads to automatic petition rejection."}, {"cat": "Legal English", "stem": "Complete the following procedural step: \"A claim filed by one co-defendant against another co-defendant inside an active lawsuit is legally designated as a _________.\"", "opts": ["Third-party complaint", "Counterclaim", "Cross-claim", "Supplemental pleading"], "a": 2, "fb": "Linguistic Precision: A Cross-claim targets a co-party. Distinguishing this from a Counterclaim protects data mapping accuracy within the practice software dockets."}, {"cat": "Legal English", "stem": "Under U.S. law, what does the doctrine of \"Vicarious Liability\" mandate?", "opts": ["A legal doctrine holding one party liable for the tortious acts of another based on their relationship, most commonly an employer being liable for an employee's actions under respondeat superior.", "The automatic waiver of filing fees for pro se litigants proceeding before a state superior court clerk.", "An individual independent contractor is personally liable for all operational tax debts of their hiring agency.", "The requirement that all personal injury settlement disbursements be executed simultaneously through a federal interest escrow account."], "a": 0, "fb": "Linguistic Precision: Vicarious Liability allows the plaintiff to target the employer's insurance. Staff must systematically screen whether an adverse individual driver was on a work-related errand to anchor corporate liability."}, {"cat": "Personal Injury", "stem": "Which of the following is considered \"Special Damages\"?", "opts": ["Pain and suffering.", "Emotional distress.", "Documented medical bills and lost wages.", "Punitive damages for malice."], "a": 2, "fb": "Risk Mitigation: If special damages are not clearly categorized in the billing fields, the settlement demand package will be mathematically incomplete."}, {"cat": "Legal English", "stem": "Choose the correct translation for the Spanish legal concept \"Daño Emergente\" in a contract or tort screening file:", "opts": ["Surface Loss", "Future Problem", "Emerging Damage", "Actual Damages / Out-of-Pocket Losses"], "a": 3, "fb": "The Bridge Methodology: Actual damages or out-of-pocket losses are the correct operational equivalents under Common Law for economic losses directly suffered, avoiding literal errors like \"emerging damage.\""}, {"cat": "Labor", "stem": "What does \"EEOC\" stand for in the context of employment discrimination?", "opts": ["Equal Employment Opportunity Commission.", "Employment Entry Office Center.", "Executive Employment Oversight Court.", "Employee Ethical Oversight Committee."], "a": 0, "fb": "Linguistic Precision: Staff must identify the EEOC as the primary federal agency for discrimination claims to accurately route intake leads."}, {"cat": "Legal English", "stem": "Under U.S. Tort Law, what does the concept of \"Loss of Consortium\" compensate for?", "opts": ["The lost wages calculated by an independent accountant during a labor dispute.", "The administrative filing costs charged by the county clerk for complex litigation.", "Deprivation of the benefits of family life, including affection, companionship, and comfort, caused by tortious injury to a spouse.", "The property damage value of a commercial motor vehicle after a collision."], "a": 2, "fb": "Linguistic Precision: Loss of Consortium is a distinct non-pecuniary damage component. Support assets must interview the client's spouse to capture this parameter accurately."}, {"cat": "Legal Software", "stem": "Why is \"Cloud-Based\" software essential for offshore security?", "opts": ["It is cheaper than paper.", "It looks modern.", "It has fun icons.", "It allows real-time, encrypted access for authorized team members regardless of location."], "a": 3, "fb": "Risk Mitigation: Secure cloud access is the baseline for B2B offshore security compliance."}, {"cat": "Legal English", "stem": "Choose the option that describes the precise operational mechanism of a \"Request for Production\" (RFP):", "opts": ["A formal motion asking the trial judge to produce a final written judgment order.", "An out-of-court text notification demanding an immediate financial settlement payout.", "A discovery request compelling a party to produce physical documents, electronically stored information (ESI), or tangible things for inspection and copying.", "An internal software integration used to sync Litify files with Microsoft Outlook."], "a": 2, "fb": "Linguistic Precision: Requests for Production form the backbone of evidence collection. Support teams must tag incoming files meticulously to map them directly to specific production requests."}, {"cat": "Legal English", "stem": "Under the U.S. Constitution, which branch of government holds the exclusive power to enact and pass federal statutory laws?", "opts": ["The Executive Branch.", "The Administrative State Assembly.", "The Judicial Branch.", "The Legislative Branch (Congress)."], "a": 3, "fb": "Linguistic Precision: Recognizing that statutes originate from the Legislative Branch is a baseline requirement. Support staff must distinguish statutory codes from administrative regulations or judicial case law during initial case categorization."}, {"cat": "Legal English", "stem": "To form a legally binding contract under U.S. Common Law, what three core elements must coexist?", "opts": ["Offer, Acceptance, and a written notarized seal.", "Offer, Acceptance, and Consideration.", "Investigation, Breach, and Liquidated Damages.", "Intention, Performance, and a corporate registered agent."], "a": 1, "fb": "Linguistic Precision: Comprehending the trilogy of Offer, Acceptance, and Consideration is a baseline requirement for Tier 1. An intake assistant must recognize if a caller's dispute lacks any of these pillars to avoid routing a legally non-existent claim to active litigation folders."}, {"cat": "General", "stem": "If a client has a \"Pre-existing Condition,\" why must this be logged in Litify?", "opts": ["To charge the client an extra administrative fee.", "To automatically close the file as non-viable.", "To prevent the defense from surprising the firm with unknown medical history later in the case.", "To deny the client representation immediately."], "a": 2, "fb": "Risk Mitigation: Failing to disclose pre-existing conditions exposes the firm to \"Impeachment Risk\" and defense tactics designed to devalue the claim."}, {"cat": "Legal English", "stem": "An assistant notes: \"The client wants to sue in a different city because the judge there is better.\" What is the precise legal term for the proper geographic location of a trial?", "opts": ["District Line", "Territory", "Legal Zone", "Venue"], "a": 3, "fb": "Linguistic Precision: Venue (lugar de comisión/competencia territorial) is distinct from jurisdiction. Gathering the exact county where an accident occurred or where a contract was signed is mandatory to establish proper venue."}, {"cat": "Immigration", "stem": "Define \"Public Charge\" in modern immigration policy.", "opts": ["A visa applicant.", "An immigration judge.", "An individual likely to become primarily dependent on the government for subsistence.", "Someone who uses public parks."], "a": 2, "fb": "Risk Mitigation: Properly assessing public charge grounds is critical to determining case viability."}, {"cat": "Legal English", "stem": "Choose the correct translation and collocation for \"Mala Praxis Médica\" within a Personal Injury intake framework:", "opts": ["Medical Misconduct", "Doctor Tort Liability", "Medical Malpractice", "Medical Bad Actions"], "a": 2, "fb": "Linguistic Precision: Medical Malpractice is the specific category of tort law governing professional negligence by healthcare providers, an absolute baseline entry term."}, {"cat": "Immigration", "stem": "Define \"Non-Immigrant Visa\" (NIV).", "opts": ["A visa intended for permanent residency.", "A path to immediate citizenship.", "A visa for a temporary stay in the U.S. (e.g., B1/B2, F-1, H-1B).", "A green card holder's visa."], "a": 2, "fb": "Risk Mitigation: Treating NIV as immigrant status causes major legal hurdles during future visa renewals."}, {"cat": "Legal English", "stem": "Choose the option that avoids an error in register when explaining a \"Counterclaim\" to a reviewing partner:", "opts": ["The client wants to make a fight-back lawsuit against the driver.", "Client wants to text the opponent with a counter-demand paper.", "The defendant has asserted a Counterclaim against the plaintiff, alleging comparative fault for the property damage.", "The company demands a reverse process to delete the first complaint."], "a": 2, "fb": "Register Mastery: Employs crisp technical terminology (asserted a Counterclaim, alleging comparative fault), avoiding raw, conversational phrasing inside Clio."}, {"cat": "Labor", "stem": "What does \"At-Will Employment\" mean in the U.S. labor market?", "opts": ["The employer can terminate the employment at any time, for any legal reason, or no reason at all.", "The employee chooses their own salary.", "The employer cannot fire anyone.", "The employee must work for 10 years."], "a": 0, "fb": "Risk Mitigation: Intake must manage client expectations; \"at-will\" means termination is generally legal unless it violates anti-discrimination laws."}, {"cat": "Legal English", "stem": "In U.S. Civil Procedure, what is the legal term for the formal court notice delivered to a defendant alongside the complaint?", "opts": ["Subpoena", "Deposition", "Summons", "Affidavit"], "a": 2, "fb": "Linguistic Precision: The Summons (emplazamiento / notificación de demanda) informs the defendant of the lawsuit and the time limit to respond. Missing its verification date in Clio blocks the progression of service."}, {"cat": "Legal English", "stem": "In U.S. civil courts, what is the meaning of a \"Motion for Summary Judgment\"?", "opts": ["A post-trial motion requesting a reduction in the jury's final damage award.", "A preliminary request to change the venue of the lawsuit to another state court.", "A formal request asking the judge to decide the case, or specific claims, in a party's favor without a trial because there are no material facts in dispute.", "An administrative petition to extend the active discovery cut-off date."], "a": 2, "fb": "Linguistic Precision: A Motion for Summary Judgment (MSJ) can end a case before trial. Recognizing incoming MSJ filings triggers an urgent, non-negotiable response timeline for the attorney."}, {"cat": "Labor", "stem": "Define \"Reasonable Accommodation\" under ADA.", "opts": ["Giving the employee a promotion.", "Modifications or adjustments to a job that enable a qualified person with a disability to perform their duties.", "Buying the employee a car.", "Paying the employee to stay home."], "a": 1, "fb": "Risk Mitigation: Failure to grant reasonable accommodation is a common ADA violation; intake must capture the specific request."}, {"cat": "Legal English", "stem": "Choose the option that correctly utilizes a professional legal collocation to fill in the blank: \"The law firm reserves the right to _________ representation if a conflict of interest arises.\"", "opts": ["cancel", "break", "drop", "decline"], "a": 3, "fb": "Linguistic Precision: The precise technical collocation for choosing not to take on a case prior to formal retention is to decline representation, not conversational terms like cancel."}, {"cat": "General", "stem": "Define \"Good Moral Character\".", "opts": ["Character which measures up to the standards of average citizens of the community in which the applicant resides.", "Owning a home in the U.S.", "Having a college degree.", "Being a U.S. citizen."], "a": 0, "fb": "Risk Mitigation: Criminal history or tax issues can destroy a Good Moral Character finding; intake must capture all arrests/tickets."}, {"cat": "Legal English", "stem": "An assistant logs: \"The client says his boss promised him a bonus but it was just words.\" What is the precise legal term for un acuerdo verbal?", "opts": ["An oral agreement", "A words agreement", "A vocal commitment", "A spoken contract"], "a": 0, "fb": "Linguistic Precision: Oral agreement or oral contract is the correct legal classification. In U.S. law, \"verbal\" can mean anything expressed in words (written or spoken); oral strictly means spoken."}, {"cat": "Labor", "stem": "What does \"Wage and Hour\" refer to?", "opts": ["Salary and benefits negotiation.", "The office lunch schedule.", "Claims involving minimum wage, overtime pay, and record-keeping requirements.", "The time taken to commute."], "a": 2, "fb": "Risk Mitigation: Intake must calculate whether the client was properly compensated for overtime; miscalculating these hours misrepresents the claim value."}, {"cat": "Legal English", "stem": "Choose the correct translation and technical legal definition for the phrase \"Equitable Relief\":", "opts": ["Honorarios de éxito; la estructura de cobro basada en porcentajes de recuperación.", "Multa administrativa; la sanción económica impuesta por violar normas de tránsito.", "Compensación por daños físicos; el pago de tratamientos médicos de emergencia.", "Remedio en equidad / medida cautelar; a non-monetary remedy awarded by a court to compel or prevent a specific action (e.g., specific performance, injunction)."], "a": 3, "fb": "The Bridge Methodology: Equitable Relief provides non-monetary remedies when money cannot fix the harm. Correct categorization routes the file to specific litigation workflows."}, {"cat": "General", "stem": "What is the purpose of \"Medical Records\" in the file?", "opts": ["To verify the client's birthday.", "To find the defendant's address.", "To verify treatment history and support the damages claim.", "To check the firm's electricity bill."], "a": 2, "fb": "Risk Mitigation: Incomplete records lead to stalled negotiations."}, {"cat": "Legal English", "stem": "What does the constitutional principle of \"Due Process\" guarantee to litigants under the Fifth and Fourteenth Amendments?", "opts": ["The right to obtain a financial settlement out of court within 30 days.", "The automatic right to have all attorney fees paid by the state.", "The guarantee of a fair, structured legal proceeding and proper notice before the government can deprive an individual of life, liberty, or property.", "The option to bypass state supreme court decisions."], "a": 2, "fb": "Linguistic Precision: Due process requires notice and an opportunity to be heard. Support talent must understand this to handle administrative deadlines securely."}, {"cat": "Legal English", "stem": "What does the legal term \"Causation\" require a Plaintiff to prove in a Tort Law matter?", "opts": ["That the independent witness was physically present at the scene of the incident.", "That a direct, logical link exists showing the defendant's specific breach of duty actually caused the plaintiff's injuries.", "That the defendant intended to cause severe emotional distress to the claimant.", "That the insurance policy limits are sufficient to cover the property damage."], "a": 1, "fb": "Linguistic Precision: Without Causation (causalidad), liability cannot be established. Intake assistants must screen for intervening factors that might break the causal chain."}, {"cat": "Legal English", "stem": "Which of the following choices represents the correct professional formula for initiating a follow-up email to a corporate lead?", "opts": ["Hey there, just checking if you read my last email.", "Counsel wants to know why you haven't executed the retainer yet.", "We are writing to follow up on our initial consultation regarding your employment matter.", "I am writing this text because you haven't answered our phone calls."], "a": 2, "fb": "Register Mastery: Structures the communication neutrally and professionally (writing to follow up, initial consultation), protecting the firm’s brand authority."}, {"cat": "Immigration", "stem": "Define \"Admission\" to the U.S.", "opts": ["Signing a contract.", "Paying a fine.", "Lawful entry into the U.S. after inspection by an immigration officer.", "Obtaining a visa."], "a": 2, "fb": "Risk Mitigation: An individual who enters without inspection (EWI) has not been \"admitted,\" which fundamentally changes their legal options."}, {"cat": "Legal English", "stem": "In U.S. civil procedure, what occurs when a defendant completely fails to respond or file an answer to a formal complaint within the statutory deadline?", "opts": ["The court clerk changes the case type to criminal misdemeanor.", "The plaintiff is fined for failing to execute a settlement release.", "A Default Judgment may be entered against the defendant, meaning the plaintiff wins the relief sought due to inaction.", "The lawsuit is automatically dismissed with prejudice."], "a": 2, "fb": "Linguistic Precision: Monitoring answer deadlines prevents missing the opportunity to secure a Default Judgment, directly driving case momentum and protecting firm interests."}, {"cat": "Labor", "stem": "If a client has a \"Right to Sue\" letter, what is its function?", "opts": ["It is an automatic settlement check.", "It is a warning from the employer.", "It is a certificate of citizenship.", "It is a required notice from the EEOC authorizing the employee to file a lawsuit in court."], "a": 3, "fb": "Risk Mitigation: Missing the strict filing deadline after receiving a Right to Sue letter results in the permanent loss of the claim."}, {"cat": "Legal English", "stem": "Complete the following procedural definition: \"The formal written notification issued by a court that commands a defendant to answer a complaint within a specified timeframe is called a _________.\"", "opts": ["writ of execution", "summons", "subpœna", "demand letter"], "a": 1, "fb": "Linguistic Precision: A Summons activates personal jurisdiction. Support staff must prioritize incoming summons records to prevent missing critical filing deadlines."}, {"cat": "Immigration", "stem": "What is a \"Material Misrepresentation\" in an immigration application?", "opts": ["Correcting an old birth date.", "Providing false information that is relevant to the applicant's eligibility for a visa or benefit.", "A small typo in the middle name.", "Changing a mailing address."], "a": 1, "fb": "Risk Mitigation: Material misrepresentation leads to permanent inadmissibility; intake must audit all declarations for honesty."}, {"cat": "Immigration", "stem": "What is \"Derivation of Citizenship\"?", "opts": ["Becoming a citizen via a spouse.", "Applying for a visa.", "Winning the green card lottery.", "Obtaining U.S. citizenship automatically through a parent."], "a": 3, "fb": "Risk Mitigation: A client may already be a citizen through a parent without knowing it; failing to check this causes unnecessary filing."}, {"cat": "Legal English", "stem": "Translate and bridge the Spanish concept \"Jurisprudencia vinculante\" into the U.S. Common Law framework:", "opts": ["Bound cases", "High Court Dictionary", "Judicial Laws", "Binding Precedent / Stare Decisis"], "a": 3, "fb": "The Bridge Methodology: Binding precedent or Stare Decisis dictates that lower courts must follow the legal rulings of higher courts within the same jurisdiction, the foundation of common law analysis."}, {"cat": "Immigration", "stem": "What is a \"G-28\"?", "opts": ["A travel document.", "The Notice of Entry of Appearance as Attorney or Accredited Representative.", "A Green Card form.", "A work permit."], "a": 1, "fb": "Risk Mitigation: Without a G-28, USCIS will not communicate with the firm, creating a communication blackout."}, {"cat": "Legal English", "stem": "In U.S. contract law jurisprudence, what is the technical definition of an \"Offer\"?", "opts": ["A manifestation of willingness to enter into a bargain, made in a way that justifies another person in understanding that their assent to that bargain is invited and will conclude it.", "An internal automated task sequence generated inside Clio Grow to track a potential lead.", "A general inquiry about a company's product lines or historical service pricing.", "A formal written release executed out of court to settle an active tort dispute."], "a": 0, "fb": "Linguistic Precision: Distinguishing a firm Offer from an invitation to deal prevents the support team from logging preliminary business negotiations as binding contractual agreements inside the CRM."}, {"cat": "Labor", "stem": "Define \"Protected Class\".", "opts": ["Only management.", "Everyone who works at a company.", "Characteristics like race, gender, religion, etc., shielded from discrimination.", "Only union members."], "a": 2, "fb": "Risk Mitigation: Discrimination is only illegal if it's based on a protected class."}, {"cat": "Personal Injury", "stem": "What does \"Loss of Enjoyment\" refer to?", "opts": ["The cost of vehicle replacement.", "The impact of an injury on a client's quality of life and hobbies.", "Inability to pay medical bills.", "The time taken to call the firm."], "a": 1, "fb": "Risk Mitigation: Often overlooked during intake; capturing this impacts the 'Pain and Suffering' damage valuation."}, {"cat": "Legal English", "stem": "Choose the correct technical legal definition for the phrase \"Compensatory Damages\":", "opts": ["Financial penalties awarded exclusively to punish a corporate defendant for reckless behavior.", "Retainer deposits held in an interest-bearing attorney trust account.", "Court costs and filing fees reimbursed to a winning litigant by the court clerk.", "Money awarded to a plaintiff to indemnify them for the actual, documented losses suffered as a direct result of a legal wrong."], "a": 3, "fb": "Linguistic Precision: Compensatory damages (daños compensatorios) aim to make the plaintiff whole. Staff must map these components (medical bills, lost wages) under specific CRM categories."}, {"cat": "Legal English", "stem": "An assistant logs: \"The client wants to sue because her boss didn't give her the regular breaks required by law.\" What is the technical term for this category of labor dispute?", "opts": ["Job context claim", "Wage and Hour Violation", "Schedule breach action", "At-will employment dispute"], "a": 1, "fb": "Linguistic Precision: Failing to provide statutory rest periods is a Wage and Hour Violation under the FLSA/state codes, a vital operational keyword for labor intakes."}, {"cat": "Legal English", "stem": "An uncertified assistant documents: \"The client says she was fired because of her race.\" Which phrase replaces this note with the appropriate legal register?", "opts": ["The employee states they kicked her out due to racial problems.", "Client has a race claim because she was deleted from the team.", "The client alleges discriminatory termination based on race.", "Claimant asserts her boss is racist and executed an eviction."], "a": 2, "fb": "Register Mastery: Shifting to alleges discriminatory termination provides a clean, professional entry that aligns with the analytical requirements of the reviewing attorney."}, {"cat": "Legal English", "stem": "In U.S. courts, what is the specific function of the \"Clerk of Court\"?", "opts": ["To deliver closing arguments to a jury on behalf of a personal injury plaintiff.", "The official responsible for maintaining court records, managing the docket, issuing summonses, and collecting filing fees.", "A computer technician who programs document automation workflows inside Litify.", "An independent corporate security agent who manages escrow trust accounts out of court."], "a": 1, "fb": "Linguistic Precision: The Clerk of Court (secretario de la corte) is the operational gatekeeper of judicial records. Communicating with precision and respect with the clerk avoids fatal filing rejections."}, {"cat": "Legal English", "stem": "Complete the following evidentiary baseline standard: \"The legal rule that prevents a party from introducing external evidence to change an unambiguous, fully integrated written contract is the _________ rule.\"", "opts": ["integration", "hearsay exclusion", "parol evidence", "best evidence"], "a": 2, "fb": "Linguistic Precision: The Parol Evidence Rule blocks verbal side-deals. Staff must confirm whether the client's dispute relies entirely on unwritten external assumptions."}, {"cat": "Legal English", "stem": "In U.S. jurisprudence, what is an \"Administrative Agency\" (e.g., OSHA, EEOC, USCIS)?", "opts": ["A governmental body created by the legislature to administer, implement, and enforce specific statutory areas through specialized regulations and hearings.", "A computer software system utilized to tag and index medical records inside Litify.", "An independent mediation corporation utilized to settle commercial contract breaches out of court.", "A private law firm specialized in high-volume personal injury litigation frameworks."], "a": 0, "fb": "Linguistic Precision: Administrative Agencies manage the operational details of federal and state laws. Staff must recognize agency structures to process pre-litigation administrative filings accurately."}, {"cat": "Legal English", "stem": "In Tort Law, what does the doctrine of \"Contributory Negligence\" dictate in jurisdictions where it still applies?", "opts": ["Fault is allocated proportionately, reducing the plaintiff's award based on their share of blame.", "The manufacturing corporation absorbs 100% of liability regardless of worker error.", "The insurance carrier must issue an automatic out-of-court settlement release.", "If the plaintiff is even 1% at fault for the accident, they are completely barred from recovering any financial damages."], "a": 3, "fb": "Linguistic Precision: Unlike comparative negligence, Contributory Negligence is a total bar to recovery. Identifying even minor client fault in these states eliminates case viability."}, {"cat": "Legal English", "stem": "In U.S. legal settings, what does the word \"Affidavit\" mean?", "opts": ["A written statement confirmed by oath or affirmation, for use as evidence in court.", "A licensing document required to practice law in a state.", "A final judgment signed by a federal circuit judge.", "A financial bill sent to a client for administrative costs."], "a": 0, "fb": "Linguistic Precision: An affidavit is a baseline evidentiary document in Common Law procedure. Support staff must know its definition to request it accurately from clients during intake."}, {"cat": "Legal English", "stem": "Complete the following definition: \"The intentional and voluntary relinquishment or abandonment of a known contractual right or condition is technically termed a _________.\"", "opts": ["breach", "stipulation", "waiver", "novation"], "a": 2, "fb": "Linguistic Precision: A Waiver (renuncia a un derecho) blocks future claims. Support staff must review incoming client correspondence to spot if the client inadvertently waived a critical delivery or payment condition."}, {"cat": "Labor", "stem": "What does \"Non-Exempt\" mean under the FLSA?", "opts": ["Exempt from overtime pay.", "Eligible for overtime pay (1.5x) for hours worked over 40 per week.", "Prohibited from working.", "Not eligible for a salary."], "a": 1, "fb": "Risk Mitigation: Assisting a non-exempt client requires precise logging of all hours worked; failure to do so undermines the claim."}, {"cat": "Legal English", "stem": "Complete the structural sequence of the U.S. Federal Court hierarchy from the lowest to the highest court: \"District Court $\\rightarrow$ _________ $\\rightarrow$ Supreme Court.\"", "opts": ["Superior Trial Court", "Circuit Court of Appeals", "Municipal Court", "Bankruptcy Court"], "a": 1, "fb": "Linguistic Precision: The Federal Circuit Courts are the intermediate appellate courts. Mapping this hierarchy prevents errors when tracking active dockets in Clio."}, {"cat": "Legal English", "stem": "An uncertified assistant documents: \"The client says she was fired because of her race.\" Which phrase replaces this note with the appropriate legal register?", "opts": ["The client alleges discriminatory termination based on race.", "The employee states they kicked her out due to racial problems.", "Claimant asserts her boss is racist and executed an eviction.", "Client has a race claim because she was deleted from the team."], "a": 0, "fb": "Register Mastery: Shifting to alleges discriminatory termination provides a clean, professional entry that aligns with the analytical requirements of the reviewing attorney."}, {"cat": "Labor", "stem": "What is a \"Performance Review\"?", "opts": ["A disciplinary warning.", "A termination notice.", "An evaluation of an employee's work performance.", "An illegal action."], "a": 2, "fb": "Risk Mitigation: Performance reviews are key defense evidence for employers; capture all of them in the intake."}, {"cat": "Legal English", "stem": "Complete the following statement regarding procedural notice: \"To establish a court's personal jurisdiction over a defendant, the plaintiff must execute formal _________ by delivering the summons and complaint.\"", "opts": ["client file setup", "document mailing", "service of process", "case docket upload"], "a": 2, "fb": "Linguistic Precision: Service of Process (notificación formal) is a strict constitutional requirement rooted in due process. Failing to track and log the exact execution date in Litify results in fatal procedural dismissals."}, {"cat": "Legal English", "stem": "What does the technical collocation \"Retrospective Application\" mean when analyzing a statutory rule?", "opts": ["Filing an appeal after the standard statutory deadline has already elapsed.", "Applying a law or rule to events or actions that occurred before the law was passed.", "Automating a document template to pull data from an inactive Clio file.", "Disclosing client information to a third-party investigator without authorization."], "a": 1, "fb": "Linguistic Precision: Intake specialists must recognize this concept if a client asks whether a newly enacted law applies to their past accident or employment termination."}, {"cat": "Legal English", "stem": "What is the meaning of the legal phrase \"On Behalf Of\"?", "opts": ["As the agent, proxy, or representative of another person.", "Against the interests of a corporation.", "Under the supervision of a state appellate judge.", "In direct violation of a federal administrative statute."], "a": 0, "fb": "Linguistic Precision: Support staff must master this phrase (on behalf of our client) as it appears in every formal communication, authorization, and pleading drafted by the firm."}, {"cat": "Legal English", "stem": "Choose the correct translation and collocation for \"Mala Praxis Médica\" within a Personal Injury intake framework:", "opts": ["Medical Malpractice", "Medical Bad Actions", "Doctor Tort Liability", "Medical Misconduct"], "a": 0, "fb": "Linguistic Precision: Medical Malpractice is the specific category of tort law governing professional negligence by healthcare providers, an absolute baseline entry term."}, {"cat": "Legal English", "stem": "Complete the professional phrasing: \"The claimant alleges that the defendant's actions were the _________ cause of her economic losses.\"", "opts": ["true", "direct", "proximate", "real"], "a": 2, "fb": "Linguistic Precision: Proximate cause (causa próxima/adecuada) is the exact legal doctrine required to establish liability under U.S. Tort Law. Literal translations like \"real cause\" lack technical validity."}, {"cat": "Legal English", "stem": "Choose the option that describes the exact difference between \"Civil Law\" and \"Criminal Law\" litigation parameters in the U.S.:", "opts": ["Civil law deals with offenses against the state, while criminal law handles private disputes between citizens.", "Civil law handles private disputes between individuals or entities seeking remedies, whereas Criminal law deals with behavior categorized as an offense against society prosecuted by the state.", "Civil law requires proof beyond a reasonable doubt, while criminal law utilizes a preponderance standard.", "Civil law actions can only be brought in federal circuit courts of appeal."], "a": 1, "fb": "Linguistic Precision: Recognizing this distinction avoids severe data entry errors. Misrouting a private dispute as a criminal matter inside a CRM halts appropriate intake actions."}, {"cat": "Legal Software", "stem": "Define \"Conflict Check\" in software.", "opts": ["A system-automated query to verify if the firm already represents an adverse party in a matter.", "A performance appraisal.", "A dispute between staff.", "A debate about a motion."], "a": 0, "fb": "Risk Mitigation: Skipping the conflict check is an ethical violation that can trigger malpractice suits."}, {"cat": "Legal English", "stem": "Translate and bridge the Spanish contractual concept \"Vicios del Consentimiento / Coacción\" into the standard U.S. framework:", "opts": ["Duress / Undue Influence", "Administrative friction", "Pleading faults", "Contract errors"], "a": 0, "fb": "The Bridge Methodology: Literal translations fail here. Duress and Undue Influence are the accurate common law doctrines that render a contract voidable due to unlawful pressure or coercion, a critical screening filter."}, {"cat": "Labor", "stem": "Define \"Constructive Discharge\".", "opts": ["Being laid off due to budget cuts.", "Being fired for stealing.", "Accepting a new job elsewhere.", "Quitting due to intolerable working conditions created by the employer, treated legally as a termination."], "a": 3, "fb": "Risk Mitigation: Intake must probe why the client left; \"I quit\" is often a \"Constructive Discharge\" claim in disguise."}, {"cat": "Personal Injury", "stem": "What is the \"Statute of Limitations\"?", "opts": ["A law defining the maximum time after an incident to file a legal action.", "The distance to the nearest court.", "The time taken to type a document.", "The legal limit for attorney fees."], "a": 0, "fb": "Risk Mitigation: The most critical procedural risk factor in any PI matter."}, {"cat": "Legal English", "stem": "Which of the following sentences utilizes the correct professional register to document that a client provided their evidence late?", "opts": ["The client failed to provide the requested evidentiary documentation within the stipulated timeframe.", "Maria sent the papers late because she forgot about the link.", "The client took too long to send us the accident photos.", "Documentation arrived late due to client's personal problems."], "a": 0, "fb": "Register Mastery: Uses objective, professional, and precise legal phrasing (failed to provide, evidentiary documentation, stipulated timeframe) to protect the firm's timeline defense."}, {"cat": "Legal English", "stem": "In an employment law intake, what does the term \"Adverse Employment Action\" mean?", "opts": ["A natural disaster that prevents a business from opening.", "A material negative change in the terms, conditions, or privileges of employment (e.g., demotion, termination, wage cut).", "A fight between two employees on the company premises.", "A negative review written by a client about the law firm."], "a": 1, "fb": "Linguistic Precision: Identifying an Adverse Employment Action is a statutory requirement to establish a prima facie case of discrimination or retaliation under Title VII."}, {"cat": "Legal English", "stem": "An assistant writes: \"The client wants to sue because her boss broke the contract.\" What is the standard technical term for romper un contrato?", "opts": ["To terminate a contract", "To breach a contract", "To fracture a contract", "To void a contract"], "a": 1, "fb": "Linguistic Precision: To breach a contract is the mandatory legal collocation for failing to perform a contractual obligation without a lawful excuse."}, {"cat": "Legal English", "stem": "What does the concept of \"Subject Matter Jurisdiction\" restrict within a court system?", "opts": ["The number of independent witnesses permitted to testify under oath during a civil trial.", "The maximum financial value of punitive damages a jury can award in a tort dispute.", "A court's legal authority to hear and decide cases of a particular type, category, or nature (e.g., Bankruptcy Court handling only bankruptcy matters).", "The technical integration of third-party automation tools inside practice management systems."], "a": 2, "fb": "Linguistic Precision: Federal courts have limited Subject Matter Jurisdiction. Staff must master this concept to prevent filing standard state-law slip-and-fall claims in federal forums."}, {"cat": "Legal English", "stem": "In Tort Law, what is the precise meaning of the defense \"Assumption of Risk\"?", "opts": ["The defendant accepts legal responsibility for the plaintiff's bodily injuries.", "The insurance carrier's obligation to cover property damages after an MVA.", "The corporate employer's policy regarding independent contractors.", "A defense showing that the plaintiff voluntarily and knowingly accepted the inherent dangers of an activity, barring or reducing recovery."], "a": 3, "fb": "Linguistic Precision: Identifying facts that point to an assumption of risk allows support staff to flag critical defense vulnerabilities early in the fact-gathering process."}, {"cat": "Legal English", "stem": "Complete the following liability concept: \"When a defendant's conduct directly causes an injury, and that injury would not have occurred 'but for' the defendant's actions, the plaintiff has established Causation in _________.\"", "opts": ["Equity", "Fact / Actual Cause", "Review", "Perpetuity"], "a": 1, "fb": "Linguistic Precision: Causation in fact (or but-for causation) is the first half of the causal bridge. Tier 1 talent must extract chronological medical and factual timelines to solidify this actual cause link."}, {"cat": "Legal English", "stem": "Under the Federal Rules of Evidence, what does the rule of \"Relevance\" dictate?", "opts": ["Evidence must be stored exclusively on a secure legal tech practice management server.", "Evidence is only admissible if it is signed by a corporate notary public.", "All medical bills must be cross-referenced with property damage repair estimates.", "Evidence is admissible if it has any tendency to make a fact of consequence more or less probable than it would be without the evidence."], "a": 3, "fb": "Linguistic Precision: Relevance is the baseline filter for all evidence. Staff must learn to distinguish between facts that alter the probability of a claim and irrelevant background noise during intake filtering."}, {"cat": "Labor", "stem": "Define \"Whistleblower\".", "opts": ["An employee who exposes information about illegal or unethical activities within an organization.", "An outside contractor.", "A person who plays music.", "An office manager."], "a": 0, "fb": "Risk Mitigation: Whistleblower cases are highly complex and carry massive legal stakes; intake must flag these immediately for partners."}, {"cat": "General", "stem": "What are \"Punitive Damages\"?", "opts": ["Damages to punish the defendant.", "Costs of trial parking.", "Filing fees for the clerk.", "Damages to compensate the client."], "a": 0, "fb": "Risk Mitigation: Identifying grounds for punitive damages is a high-level strategic asset."}, {"cat": "General", "stem": "What does \"Liability\" refer to in a PI claim?", "opts": ["The total number of doctor visits.", "The cost of vehicle repairs only.", "The time taken to file a motion.", "The legal responsibility for the accident and the resulting damages."], "a": 3, "fb": "Risk Mitigation: Misunderstanding liability during intake leads to the firm taking cases with zero recovery potential."}, {"cat": "Legal English", "stem": "What does the \"Mirror Image Rule\" require under standard U.S. Common Law contract principles?", "opts": ["Both contracting parties must maintain equal financial net worth within their operating accounts.", "The contract copy must be physically identical to the template stored in Litify.", "The written agreement must be executed simultaneously before two independent trial judges.", "The acceptance must exactly match the terms of the offer without any modifications or additions; any change operates as a counter-offer."], "a": 3, "fb": "Linguistic Precision: Under the Mirror Image Rule, a modified acceptance is legally a Counter-offer. Staff must master this distinction when screening contract intakes to accurately document who is actually in breach."}, {"cat": "Labor", "stem": "What is \"Retaliation\" in an employment case?", "opts": ["Providing vacation time.", "Adverse action taken against an employee for engaging in a protected activity (e.g., complaining of discrimination).", "Giving a promotion.", "Giving a raise."], "a": 1, "fb": "Risk Mitigation: Retaliation is a separate, strong claim; staff must capture the timeline between the complaint and the adverse action."}, {"cat": "Legal English", "stem": "Under U.S. Tort Law, what does the doctrine of \"Negligence Per Se\" dictate?", "opts": ["The insurance carrier must issue an out-of-court settlement check within 30 statutory calendar days.", "The case file must be transferred from state superior court to a federal circuit court database.", "The lawsuit is automatically dismissed with prejudice if the plaintiff bears any percentage of comparative fault.", "An act is considered automatically negligent because the defendant violated a public safety statute or ordinance, establishing breach of duty as a matter of law."], "a": 3, "fb": "Linguistic Precision: Negligence Per Se bypasses the need to prove what a reasonable person would do because a statute defines it. Intake assistants must look for police citations or statutory infractions to anchor this advantage."}, {"cat": "Personal Injury", "stem": "What is a \"Tort\" in U.S. Personal Injury law?", "opts": ["A criminal offense.", "A type of traffic ticket.", "A civil wrong (other than a breach of contract) for which the law provides a remedy.", "A medical procedure."], "a": 2, "fb": "Linguistic Precision: PI cases are Tort cases; understanding this term is essential for mapping liability."}, {"cat": "General", "stem": "What is a \"Complaint\" in PI litigation?", "opts": ["A letter complaining about the lawyer.", "The initial pleading filed to commence a lawsuit and define the cause of action.", "A report from the doctor.", "A form used to pay court fees."], "a": 1, "fb": "Risk Mitigation: Incorrectly drafted complaints can be dismissed; data accuracy is vital."}, {"cat": "Personal Injury", "stem": "What is \"Pain and Suffering\"?", "opts": ["Non-economic damages for the physical and emotional distress caused by the injury.", "A medical term for a broken bone.", "The fee for medical reports.", "The cost of vehicle towing."], "a": 0, "fb": "Linguistic Precision: Translating this correctly prevents the client from believing it is a physical disease."}, {"cat": "General", "stem": "What does \"Indemnification\" mean?", "opts": ["A request for more documents.", "A court order for mediation.", "The compensation for harm or loss, often through insurance.", "A type of jury trial."], "a": 2, "fb": "Risk Mitigation: Indemnification is why we look for insurance policies; we need to know who is footing the bill."}, {"cat": "Legal English", "stem": "An assistant logs: \"The client wants to reverse the judge's order because it was completely unfair.\" What is the precise technical phrase for this type of formal request?", "opts": ["To execute a reverse motion", "To demand an administrative veto", "To cancel the order", "To file an Appeal"], "a": 3, "fb": "Linguistic Precision: To file an Appeal (interponer un recurso de apelación) is the correct procedural anchor. Support staff must use this terminology to route time-sensitive lower court rulings to appellate workflows."}, {"cat": "Personal Injury", "stem": "What is the technical function of a \"Police Report\" in an intake file?", "opts": ["To replace the need for client interviews.", "To serve as the client's final settlement demand.", "To provide a neutral account of the accident facts, parties involved, and citation status.", "To serve as the sole evidence for the court verdict."], "a": 2, "fb": "Risk Mitigation: Police reports are primary evidence. Failing to tag them correctly in Litify makes them inaccessible during initial review."}, {"cat": "Legal English", "stem": "In U.S. Tort Law, what does the legal phrase \"Eggshell Skull Rule\" imply?", "opts": ["A defendant must take the plaintiff as they find them, meaning the defendant is legally liable for all physical damages caused by their negligence, even if the plaintiff's fragile condition made the injuries much worse than expected.", "The plaintiff cannot recover damages if they had a pre-existing medical condition before the accident occurred.", "The case file must be marked as closed if the property damage fields do not exceed $5,000 inside Litify.", "The maximum financial payout for traumatic brain injuries is capped by state administrative codes."], "a": 0, "fb": "Linguistic Precision: The Eggshell Skull Rule protects plaintiffs with pre-existing frailties. Support staff must fully log all prior medical conditions during intake to ensure the attorney tracks the full scale of exacerbation damages."}, {"cat": "Personal Injury", "stem": "What is a \"Demand Letter\" in pre-litigation?", "opts": ["A letter demanding the client pays more fees.", "A document submitted to the insurance company outlining liability and damages to initiate settlement.", "A letter from the judge demanding a court appearance.", "A request for the police to arrest the driver."], "a": 1, "fb": "Risk Mitigation: A poorly drafted demand letter, lacking accurate medical data, results in lower settlement offers and prolonged cases."}, {"cat": "Legal English", "stem": "Choose the option that avoids an error in register when explaining the term \"Breach of Contract\" to a reviewing attorney:", "opts": ["Client wants to delete the contract folder because the other guy stopped doing the job.", "Company violated the side-letter deal and the client wants to make a fight.", "The plaintiff is alleging a Cause of Action for Breach of Contract due to the defendant's failure to perform their statutory payment obligations.", "The client says the boss broke the text paper agreement yesterday."], "a": 2, "fb": "Register Mastery: Utiliza anclajes terminológicos perfectos y profesionales (alleging a Cause of Action, failure to perform their statutory payment obligations), erradicando expresiones coloquiales del CRM."}, {"cat": "Labor", "stem": "What is the purpose of \"Discovery\" in a labor dispute?", "opts": ["To fire the manager.", "To delete the case file.", "To obtain internal employer emails, payroll records, and performance reviews.", "To avoid paying court fees."], "a": 2, "fb": "Risk Mitigation: Support staff must ensure that payroll and email discovery is requested immediately to prevent document destruction."}, {"cat": "Legal English", "stem": "In U.S. personal injury and tort law, what is the exact function of \"Compensatory Damages\"?", "opts": ["To cover the administrative cost of executing service of process via a licensed process server.", "To refund the initial contingency fee percentage held inside the firm's escrow account.", "To impose a financial penalty on a reckless defendant to deter similar societal behavior in the future.", "To replace or indemnify a plaintiff for their actual, documented losses—both economic and non-economic—to make them whole under the law."], "a": 3, "fb": "Linguistic Precision: Compensatory Damages make the victim whole. Support personnel must categorize these components (medical bills, lost wages) into distinct fields inside Clio or Litify to maintain file integrity."}, {"cat": "Personal Injury", "stem": "Define \"Damages\" in a personal injury context.", "opts": ["The cost of filing the lawsuit.", "The criminal penalty for speeding.", "The monetary compensation for injuries sustained.", "The attorney's retainer fee."], "a": 2, "fb": "Linguistic Precision: PI is essentially the business of quantifying damages; intake must distinguish liability from damage claims."}, {"cat": "Legal English", "stem": "An intake note reads: \"The client wants to stand up his rights.\" What is the correct legal collocation for hacer valer sus derechos in English?", "opts": ["To raise his rights", "To execute his rights", "To assert his rights", "To claim his rights"], "a": 2, "fb": "Linguistic Precision: To assert rights or to enforce rights are the correct professional collocations used in U.S. jurisprudence; literal translations like \"stand up\" onic hard drives.", "A motion filed with the judge to request an immediate transfer of court venue.", "A verbal examination conducted under oath in front of a licensed court reporter."], "a": 0, "fb": "Linguistic Precision: Interrogatories (interrogatorios escritos) require factual compilation. Intake and support assistants must capture client narratives to draft accurate preliminary responses for review."}, {"cat": "Legal English", "stem": "What does the procedural rule of \"Venue\" dictate when selecting a court for filing?", "opts": ["The specific category of damages requested in the prayer for relief.", "The geographic location or specific court district where a lawsuit may be lawfully heard and tried.", "The electronic system used to distribute automated tasks inside Clio.", "The total number of litigants permitted on a class-action roster."], "a": 1, "fb": "Linguistic Precision: Venue choices depend on where the incident occurred or where defendants reside. Staff must extract clean geographic parameters to minimize transfer delays."}, {"cat": "Legal English", "stem": "Complete the professional phrasing for an intake summary: \"The prospective client seeks to _________ a civil action for breach of contract.\"", "opts": ["build", "throw", "activate", "commence"], "a": 3, "fb": "Linguistic Precision: The precise technical verbs for initiating a lawsuit under U.S. procedural rules are to commence, to institute, or to file, never casual options like activate."}, {"cat": "Legal English", "stem": "Complete the following structural definition: \"A legal wrong committed against a person or property, resulting in civil liability and actionable damages, is known as a _________.\"", "opts": ["felony", "infraction", "breach", "tort"], "a": 3, "fb": "Linguistic Precision: Tort is the definitive common law umbrella term for civil wrongs (excluding breaches of contract), establishing the fundamental categorization of the case file."}, {"cat": "Legal English", "stem": "Under the U.S. litigation framework, what does the doctrine of \"Res Judicata\" prevent?", "opts": ["The relitigation of a claim or matter that has already been decided by a final judgment on the merits in a prior lawsuit involving the same parties.", "The filing of an appeal before a final judgment is officially signed by the trial judge.", "The execution of an oral settlement agreement without a written release.", "The prosecution of a corporate defendant under administrative regulations."], "a": 0, "fb": "Linguistic Precision: Meaning \"a matter judged,\" Res Judicata bars duplicate lawsuits. Tracking prior case histories during screening prevents the firm from wasting resources on barred claims."}, {"cat": "Legal English", "stem": "What does the procedural mechanism known as a \"Motion to Dismiss\" request from a trial judge?", "opts": ["A formal request that the court immediately terminate the lawsuit because the complaint is legally deficient or lacks valid jurisdiction.", "A signed order authorizing the deposition of an out-of-state independent witness.", "An extension of time to locate missing medical lien document records inside Litify.", "The automatic conversion of an hourly fee contract into a contingency model."], "a": 0, "fb": "Linguistic Precision: A Motion to Dismiss (moción de desestimación) can kill a case at the threshold. Tracking the arrival of this motion protects the firm from missing opposition deadlines."}, {"cat": "Legal English", "stem": "Complete the following structural sequence regarding the U.S. federal judiciary: \"U.S. District Court $\\rightarrow$ U.S. _________ $\\rightarrow$ Supreme Court of the United States.\"", "opts": ["Circuit Court of Appeals", "Municipal Claims Bureau", "Bankruptcy Appellate Panel", "Superior Trial Division"], "a": 0, "fb": "Linguistic Precision: The U.S. Circuit Court of Appeals represents the intermediate appellate tier. Accurately tracking active appellate filings prevents costly timeline errors within the firm's document control flows."}, {"cat": "Immigration", "stem": "Define \"Parole\" in an immigration context.", "opts": ["A visa extension.", "A work permit.", "Permission to enter the U.S. temporarily for urgent humanitarian reasons or public benefit.", "A prison release program."], "a": 2, "fb": "Risk Mitigation: Parole vs. Admission status creates vastly different paths to residency; misclassification is a fatal intake error."}, {"cat": "Legal English", "stem": "Choose the option that avoids an error in register when explaining the term \"Answer\" to a team member:", "opts": ["The text the driver sends to say he didn't do the accident.", "A computer notification issued by the court clerk to approve a modification of the venue.", "The defendant's initial responsive pleading, which admits or denies the plaintiff's allegations and asserts affirmative defenses.", "The verbal conversation held between the insurance carrier and the client out of court."], "a": 2, "fb": "Register Mastery: Utiliza colocaciones técnicas e impecables (responsive pleading, admits or denies, asserts affirmative defenses), erradicando el lenguaje informal de la plataforma de datos."}, {"cat": "Legal English", "stem": "Complete the following defense concept: \"A defense that bars or proportionately reduces a plaintiff's financial recovery because the plaintiff voluntarily and knowingly encountered a known danger is called _________.\"", "opts": ["Contributory waiver", "Assumption of Risk", "Pleading estoppel", "Special immunity"], "a": 1, "fb": "Linguistic Precision: Assumption of Risk is a classic affirmative defense. Capturing whether a client signed a liability waiver or ignored explicit safety warnings prevents the firm from absorbing high-risk, unprotected claims."}, {"cat": "Immigration", "stem": "What is an \"EAD\" (Employment Authorization Document)?", "opts": ["A green card.", "An official card granting the holder permission to work legally in the U.S.", "A student loan application.", "A
