<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================
// Tier 1 — 150 questions (Foundation level), rebuilt Oct 2026.
// Answer positions balanced; option lengths checked for bias. Source: scratch bank t1*.json
// ============================================================
const TIER_LABEL = "Tier 1";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwYCnCr75l6BUDyPIxPD2sbl5NvgENQWT5JFpMreAlQmg5dI85SEeecneWUVzknyzxr/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Legal Foundations & Courts", "stem": "Which branch of the U.S. federal government enacts statutes?", "opts": ["The President, through executive orders", "Congress, the legislative branch", "The Supreme Court, through its rulings", "Federal agencies, through regulations"], "a": 1, "fb": "Sources of law: Congress passes statutes. Executive orders, court decisions (case law) and agency regulations are also sources of law, but none of them is a statute."}, {"cat": "Legal Foundations & Courts", "stem": "In the U.S. federal system, a case usually starts in which court?", "opts": ["A U.S. District Court", "A U.S. Court of Appeals", "A state superior court", "The U.S. Supreme Court"], "a": 0, "fb": "Court map: District Courts are the federal trial courts. Appeals go to a Circuit Court of Appeals and, if the Supreme Court agrees to hear the case, to the Supreme Court."}, {"cat": "Legal Foundations & Courts", "stem": "Complete the federal court hierarchy, from lowest to highest: District Court → ________ → Supreme Court.", "opts": ["State Superior Court", "U.S. Court of Appeals", "U.S. Bankruptcy Court", "U.S. Court of Claims"], "a": 1, "fb": "Court map: the 13 federal Courts of Appeals (often called Circuit Courts) sit between the District Courts and the Supreme Court."}, {"cat": "Legal Foundations & Courts", "stem": "What does \"stare decisis\" require of a lower court?", "opts": ["To apply the statute even if a higher court struck it down", "To follow the opinion of the most experienced judge", "To follow precedent set by higher courts in its jurisdiction", "To decide only questions that the parties have agreed on"], "a": 2, "fb": "Common law: stare decisis means courts follow binding precedent. In Spanish this is close to \"jurisprudencia vinculante\" or \"precedente obligatorio\"."}, {"cat": "Legal Foundations & Courts", "stem": "The best English equivalent of \"jurisprudencia vinculante\" is:", "opts": ["case doctrine", "mandatory jurisprudence", "judicial legislation", "binding precedent"], "a": 3, "fb": "Translation: \"binding precedent\" is the standard term. In English, \"jurisprudence\" usually means legal philosophy, so \"mandatory jurisprudence\" is a false friend."}, {"cat": "Legal Foundations & Courts", "stem": "Which statement correctly distinguishes civil cases from criminal cases?", "opts": ["Civil cases are prosecuted by the state; criminal cases resolve private disputes", "Civil cases need proof beyond a reasonable doubt; criminal cases need a preponderance", "Civil cases are heard only in federal court; criminal cases only in state court", "Civil cases resolve private disputes; criminal cases are prosecuted by the government"], "a": 3, "fb": "Key distinction: in a civil case a plaintiff seeks a remedy such as money. In a criminal case the government prosecutes and must prove guilt beyond a reasonable doubt."}, {"cat": "Legal Foundations & Courts", "stem": "What standard of proof applies in most civil lawsuits?", "opts": ["Preponderance of the evidence", "Beyond a reasonable doubt", "Clear and convincing evidence", "Probable cause"], "a": 0, "fb": "Standards of proof: preponderance means \"more likely than not.\" Beyond a reasonable doubt is the criminal standard; clear and convincing evidence is a higher civil standard used only for some issues."}, {"cat": "Legal Foundations & Courts", "stem": "\"Subject matter jurisdiction\" refers to a court's power over:", "opts": ["the amount of time a case may last", "the county where the trial takes place", "the specific defendant being sued", "the type of case being brought"], "a": 3, "fb": "Jurisdiction: subject matter jurisdiction is power over the kind of case (e.g., bankruptcy, federal question). Power over the defendant is personal jurisdiction; the location of trial is venue."}, {"cat": "Legal Foundations & Courts", "stem": "A client wants to file in a city where \"the judge is better.\" Which term describes the proper geographic location for a trial?", "opts": ["Forum shopping", "Jurisdiction", "Venue", "Domicile"], "a": 2, "fb": "Key term: venue is the proper place (county or district) for trial. Jurisdiction is the court's power to hear the case. Trying to choose a court for advantage is called forum shopping."}, {"cat": "Legal Foundations & Courts", "stem": "What is an administrative agency, such as the EEOC or USCIS?", "opts": ["A government body that implements and enforces specific laws", "A committee of Congress that drafts new statutes", "A private organization that mediates disputes between companies for a fee", "A court that hears appeals from state trial courts"], "a": 0, "fb": "Key term: agencies are created by statute to administer an area of law. They issue regulations and decide cases, but they are not courts or private bodies."}, {"cat": "Legal Foundations & Courts", "stem": "The constitutional guarantee of \"due process\" mainly requires:", "opts": ["notice and a fair opportunity to be heard", "a jury trial in every type of hearing", "a final decision within a fixed time", "free legal representation in civil cases"], "a": 0, "fb": "Constitutional law: the Fifth and Fourteenth Amendments protect against deprivation of life, liberty or property without due process, which centers on notice and a hearing."}, {"cat": "Legal Foundations & Courts", "stem": "Who maintains court records, manages the docket, and accepts filings?", "opts": ["The magistrate judge", "The bailiff", "The court reporter", "The clerk of court"], "a": 3, "fb": "Court personnel: the clerk handles filings and records. The court reporter transcribes proceedings, the bailiff keeps order, and a magistrate judge decides certain matters."}, {"cat": "Legal Foundations & Courts", "stem": "What does \"pro se\" mean when used about a litigant?", "opts": ["Appearing through a court-appointed lawyer", "Representing oneself without a lawyer", "Paying no court fees because of poverty", "Joining a lawsuit on behalf of a group"], "a": 1, "fb": "Latin term: a pro se litigant represents himself or herself. Not paying fees because of poverty is \"in forma pauperis\"."}, {"cat": "Legal Foundations & Courts", "stem": "\"Sovereign immunity\" generally protects government entities from:", "opts": ["complying with federal regulations", "appearing in open court", "being sued without their consent", "paying taxes on public property"], "a": 2, "fb": "Key doctrine: governments cannot be sued unless they waive immunity, usually by statute. Claims against them often require a special pre-suit notice with short deadlines."}, {"cat": "Legal Foundations & Courts", "stem": "A plaintiff injured by a city bus must usually do what before suing the city?", "opts": ["Obtain a criminal conviction against the bus driver", "Get written permission from the state governor", "Wait until the regular statute of limitations has expired", "File an administrative notice of claim within a short deadline"], "a": 3, "fb": "Claims against governments: most jurisdictions require a notice of claim (for federal agencies, an administrative claim under the FTCA) within deadlines that can be much shorter than the normal limitations period."}, {"cat": "Legal Foundations & Courts", "stem": "What is an \"affidavit\"?", "opts": ["An oral statement given in court under oath", "A court order requiring a person to testify", "A written promise to appear at a hearing", "A written statement of facts sworn under oath"], "a": 3, "fb": "Key term: an affidavit (declaración jurada) is written and sworn. Oral sworn testimony outside court is a deposition; an order to testify is a subpoena."}, {"cat": "Legal Foundations & Courts", "stem": "What is a \"statute of limitations\"?", "opts": ["The deadline for filing a lawsuit after a claim arises", "The period a judgment remains enforceable", "The maximum damages a court can award", "The time a defendant has to answer a complaint after service"], "a": 0, "fb": "Key deadline: once the limitations period runs, the claim is generally barred. In Spanish it is close to \"plazo de prescripción\". The time to answer a complaint is a separate, much shorter deadline."}, {"cat": "Legal Foundations & Courts", "stem": "What does \"res judicata\" prevent?", "opts": ["Introducing evidence that was obtained illegally", "Appealing a judgment after the deadline has passed", "Relitigating a claim already decided by a final judgment", "Filing the same claim in two different courts at the same time"], "a": 2, "fb": "Latin term: res judicata (claim preclusion, \"cosa juzgada\") bars the same parties from suing again on a claim that ended in a final judgment on the merits."}, {"cat": "Legal Foundations & Courts", "stem": "Which item is NOT a primary source of U.S. law?", "opts": ["An agency regulation", "A court opinion", "A law review article", "A federal statute"], "a": 2, "fb": "Sources of law: statutes, regulations, constitutions and case law are primary sources. Law review articles and treatises are secondary sources that explain the law."}, {"cat": "Legal Foundations & Courts", "stem": "A \"plaintiff\" is:", "opts": ["the lawyer who prosecutes a crime", "the party who is sued in a civil case", "a witness called by either side", "the party who starts a civil lawsuit"], "a": 3, "fb": "Parties: the plaintiff (demandante or actor) files suit; the defendant (demandado) is sued. In criminal cases the government is the prosecution."}, {"cat": "Civil Procedure", "stem": "Which document starts a civil lawsuit in a U.S. court?", "opts": ["A summons", "A motion", "A complaint", "A demand letter"], "a": 2, "fb": "Translation trap: the Spanish \"demanda\" is a complaint in English. A demand letter is a pre-litigation letter, and the summons is the court notice served with the complaint."}, {"cat": "Civil Procedure", "stem": "What is the purpose of a \"summons\"?", "opts": ["To inform the plaintiff that the case was dismissed", "To ask the court to decide the case without a trial", "To order a witness to bring documents to a deposition", "To notify the defendant of the suit and the deadline to respond"], "a": 3, "fb": "Key term: the summons (emplazamiento) is served with the complaint. A subpoena orders a witness to appear or produce documents."}, {"cat": "Civil Procedure", "stem": "\"Service of process\" means:", "opts": ["filing the complaint electronically with the clerk of the court", "formally delivering the summons and complaint to the defendant", "sending the client a copy of every court document", "paying the court's filing fee for the complaint"], "a": 1, "fb": "Key term: service of process (notificación o emplazamiento) gives the defendant legal notice and is required for the court to exercise personal jurisdiction."}, {"cat": "Civil Procedure", "stem": "What is the defendant's first formal written response to a complaint, admitting or denying each allegation?", "opts": ["A rebuttal", "An answer", "A response brief", "A reply"], "a": 1, "fb": "Pleadings: the answer (contestación de la demanda) admits or denies allegations and raises affirmative defenses."}, {"cat": "Civil Procedure", "stem": "Which documents are \"pleadings\"?", "opts": ["Interrogatories and depositions", "The complaint and the answer", "Subpoenas and summonses", "Motions and briefs"], "a": 1, "fb": "Key term: pleadings state each side's claims and defenses (complaint, answer, counterclaim). Interrogatories are discovery; motions ask the court for an order."}, {"cat": "Civil Procedure", "stem": "A defendant sues the plaintiff back in the same lawsuit. This claim is a:", "opts": ["reply", "cross-claim", "counterclaim", "third-party claim"], "a": 2, "fb": "Claim types: a counterclaim (reconvención) goes against the opposing party. A cross-claim goes against a co-party; a third-party claim brings in someone new."}, {"cat": "Civil Procedure", "stem": "One co-defendant files a claim against another co-defendant in the same case. This is a:", "opts": ["third-party complaint", "counterclaim", "cross-claim", "intervention"], "a": 2, "fb": "Claim types: claims between parties on the same side are cross-claims. A counterclaim is filed against an opposing party."}, {"cat": "Civil Procedure", "stem": "If a defendant never responds to a properly served complaint, the plaintiff may seek a:", "opts": ["directed verdict", "default judgment", "dismissal with prejudice", "summary judgment"], "a": 1, "fb": "Key term: a default judgment (sentencia en rebeldía) can be entered after the clerk enters the defendant's default for failing to respond. Summary judgment requires a motion showing no genuine dispute of fact."}, {"cat": "Civil Procedure", "stem": "What is \"discovery\" in civil litigation?", "opts": ["The pretrial exchange of information between the parties", "The jury's deliberations after closing arguments", "The judge's review of the complaint before service", "The investigation police carry out after a crash"], "a": 0, "fb": "Key stage: discovery tools include interrogatories, requests for production, requests for admission and depositions."}, {"cat": "Civil Procedure", "stem": "Written questions that the other party must answer in writing under oath are called:", "opts": ["depositions", "requests for admission", "interrogatories", "subpoenas"], "a": 2, "fb": "Discovery tools: interrogatories are written questions answered in writing under oath. A deposition is oral questioning; requests for admission ask a party to admit or deny specific facts."}, {"cat": "Civil Procedure", "stem": "A discovery request asking a party to hand over documents and electronic files is a:", "opts": ["notice of deposition", "request for production", "request for admission", "motion to compel"], "a": 1, "fb": "Discovery tools: a request for production covers documents, ESI and tangible things. A motion to compel is filed later if the other side does not comply."}, {"cat": "Civil Procedure", "stem": "What is a \"deposition\"?", "opts": ["Testimony given to the jury during the trial", "A written statement of facts signed in front of a notary public", "A summary of the evidence prepared by the judge", "Out-of-court oral testimony given under oath and recorded"], "a": 3, "fb": "Key term: in a deposition (declaración testimonial fuera de la corte) lawyers question a witness under oath, and a court reporter records the testimony."}, {"cat": "Civil Procedure", "stem": "A \"subpoena\" is used to:", "opts": ["order a person to testify or produce documents", "request the other party's written answers", "notify a defendant that a lawsuit was filed", "ask the court to end the case early"], "a": 0, "fb": "Key term: subpoenas can reach non-parties. A subpoena duces tecum specifically orders production of documents. The summons, by contrast, notifies a defendant of the lawsuit."}, {"cat": "Civil Procedure", "stem": "A \"motion to dismiss\" argues that:", "opts": ["the evidence shows no genuine dispute of material fact", "the jury's verdict was against the weight of the evidence", "the complaint is legally insufficient even if its facts are true", "the defendant needs more time to file an answer"], "a": 2, "fb": "Motions: a motion to dismiss attacks the complaint itself (e.g., failure to state a claim, lack of jurisdiction). Arguing from the evidence that there is no factual dispute is summary judgment."}, {"cat": "Civil Procedure", "stem": "A \"motion for summary judgment\" asks the court to:", "opts": ["enter judgment because the defendant failed to respond", "send the case to mediation before discovery begins", "decide the case without trial because no material facts are disputed", "shorten the trial by limiting the number of witnesses each side may call"], "a": 2, "fb": "Motions: summary judgment (sentencia sumaria) can end a case before trial. Judgment for failure to respond is a default judgment."}, {"cat": "Civil Procedure", "stem": "A party who loses at trial and asks a higher court to review the decision is filing an:", "opts": ["appeal", "petition for rehearing en banc", "objection", "motion in limine"], "a": 0, "fb": "Key term: to appeal (apelar, interponer un recurso de apelación). An objection is raised during trial; rehearing en banc is a later request within the appellate court."}, {"cat": "Civil Procedure", "stem": "When an appellate court \"remands\" a case, it:", "opts": ["sends the case back to the lower court for further proceedings", "transfers the case to a court in another state", "refuses to hear the appeal at all", "confirms the lower court's decision without making any changes to it"], "a": 0, "fb": "Appellate terms: affirm (confirmar), reverse (revocar), remand (devolver al tribunal inferior). A court can reverse and remand in the same decision."}, {"cat": "Civil Procedure", "stem": "The party who files an appeal is called the:", "opts": ["appellee", "respondent", "appellant", "petitioner in error"], "a": 2, "fb": "Parties on appeal: the appellant (apelante) brings the appeal; the appellee (apelado) defends the lower court's decision."}, {"cat": "Civil Procedure", "stem": "What is the \"docket\" in a court case?", "opts": ["The judge's written decision on the merits", "The official list of filings and events in the case", "The file of exhibits presented at trial", "The room where the trial will take place"], "a": 1, "fb": "Key term: the docket records every filing, order and hearing. Firms monitor dockets to calendar deadlines."}, {"cat": "Civil Procedure", "stem": "Choose the precise verb: \"The prospective client wishes to ________ a civil action for breach of contract.\"", "opts": ["launch", "commence", "build", "activate"], "a": 1, "fb": "Collocation: lawsuits are commenced, filed, brought or instituted. \"Activate\", \"build\" and \"launch\" are not used with \"action\" in legal English."}, {"cat": "Civil Procedure", "stem": "A lawsuit \"dismissed with prejudice\":", "opts": ["is suspended until a related case ends", "must be refiled in a different court", "can be refiled after the defect is corrected", "cannot be filed again on the same claim"], "a": 3, "fb": "Key distinction: with prejudice is final. Without prejudice allows refiling, subject to the statute of limitations. A suspension is a stay."}, {"cat": "Civil Procedure", "stem": "Which court order temporarily pauses a lawsuit?", "opts": ["A continuance of discovery", "A stay of proceedings", "A dismissal without prejudice", "A default judgment"], "a": 1, "fb": "Key term: a stay (suspensión del procedimiento) freezes the case, for example while a bankruptcy or related case is pending. A continuance only postpones a specific date."}, {"cat": "Torts & Personal Injury", "stem": "What is a \"tort\"?", "opts": ["A dispute that must be decided by an agency", "A minor crime that is punished only with a fine", "A civil wrong, other than breach of contract", "Any failure to perform a written agreement"], "a": 2, "fb": "Key term: torts (responsabilidad civil extracontractual) include negligence, intentional torts and strict liability. Breach of contract is a separate category."}, {"cat": "Torts & Personal Injury", "stem": "A client was rear-ended by a distracted driver. Under which area of law is a negligence claim classified?", "opts": ["Criminal law", "Contract law", "Administrative law", "Tort law"], "a": 3, "fb": "Classification: negligence is a tort. The driver may also receive a traffic citation, but the injured person's claim for money is a civil tort claim."}, {"cat": "Torts & Personal Injury", "stem": "Which list states the four elements of negligence?", "opts": ["Duty, breach, causation, damages", "Duty, intent, injury, insurance", "Offer, acceptance, consideration, damages", "Intent, act, causation, harm"], "a": 0, "fb": "Elements: the plaintiff must prove a duty of care, a breach of that duty, causation (actual and proximate), and damages."}, {"cat": "Torts & Personal Injury", "stem": "\"Duty of care\" in negligence law means:", "opts": ["the obligation to act as a reasonable person would", "the obligation to report every accident to the police", "the obligation to pay a victim's medical bills after an accident", "the obligation to carry the maximum available insurance"], "a": 0, "fb": "Key term: duty of care (deber de cuidado). Whether the defendant met it is judged by the reasonable person standard."}, {"cat": "Torts & Personal Injury", "stem": "\"But for the defendant's conduct, the injury would not have happened.\" This test establishes:", "opts": ["proximate (legal) cause", "comparative fault", "actual cause (cause in fact)", "the duty of care"], "a": 2, "fb": "Causation has two parts: actual cause (the but-for test) and proximate cause, which limits liability to foreseeable consequences."}, {"cat": "Torts & Personal Injury", "stem": "Complete the sentence: \"The claimant alleges that the defendant's conduct was the ________ cause of her losses.\"", "opts": ["true", "real", "proximate", "main"], "a": 2, "fb": "Collocation: \"proximate cause\" (causa próxima o adecuada) is the legal term. \"Real cause\" or \"main cause\" are ordinary English, not legal terminology."}, {"cat": "Torts & Personal Injury", "stem": "A person raises a fist and threatens to hit someone, causing fear of immediate contact. No contact occurs. Which tort is this?", "opts": ["Defamation", "Assault", "False imprisonment", "Battery"], "a": 1, "fb": "Intentional torts: assault is the reasonable apprehension of imminent harmful contact. Battery requires actual harmful or offensive contact."}, {"cat": "Torts & Personal Injury", "stem": "Which tort involves harmful or offensive physical contact without consent?", "opts": ["Trespass to land", "Battery", "Nuisance", "Assault"], "a": 1, "fb": "Intentional torts: battery is the contact itself; assault is the fear of imminent contact. Both can occur in the same incident."}, {"cat": "Torts & Personal Injury", "stem": "A client was injured when a defective car part exploded. Which type of claim fits best?", "opts": ["Breach of warranty of habitability", "Premises liability", "Medical malpractice", "Products liability"], "a": 3, "fb": "Claim types: products liability covers injuries from defective products, often under strict liability. Premises liability covers dangerous conditions on property."}, {"cat": "Torts & Personal Injury", "stem": "A customer slips on an unmarked wet floor in a supermarket. Which type of claim fits best?", "opts": ["Professional malpractice", "Vicarious liability", "Premises liability", "Products liability"], "a": 2, "fb": "Claim types: premises liability (responsabilidad del propietario o poseedor) covers injuries caused by unsafe conditions on someone else's property."}, {"cat": "Torts & Personal Injury", "stem": "The correct English term for \"mala praxis médica\" is:", "opts": ["doctor tort", "medical negligence crime", "medical malpractice", "medical misconduct"], "a": 2, "fb": "Translation: medical malpractice is professional negligence by a healthcare provider. \"Misconduct\" usually refers to ethical or disciplinary violations."}, {"cat": "Torts & Personal Injury", "stem": "An employer is held liable for an employee's negligence committed while doing the employee's job. This is:", "opts": ["strict products liability", "vicarious liability", "negligence per se", "contributory negligence"], "a": 1, "fb": "Key doctrine: vicarious liability makes the employer answer for torts committed within the scope of employment. Intake should ask whether the at-fault driver was working at the time."}, {"cat": "Torts & Personal Injury", "stem": "A driver who ran a red light in violation of a traffic statute may be found negligent under which doctrine?", "opts": ["Negligence per se", "Strict liability", "Assumption of risk", "Res ipsa loquitur"], "a": 0, "fb": "Key doctrine: under negligence per se, violating a safety statute meant to protect people like the plaintiff can establish breach without other proof of what a reasonable person would do."}, {"cat": "Torts & Personal Injury", "stem": "In a state that follows pure contributory negligence, a plaintiff who is 10% at fault:", "opts": ["recovers the full amount of damages", "recovers only economic damages", "recovers nothing", "recovers 90% of the damages"], "a": 2, "fb": "Fault systems: contributory negligence, followed in only a few jurisdictions, bars any recovery. Under comparative negligence the award would be reduced by 10%."}, {"cat": "Torts & Personal Injury", "stem": "Under comparative negligence, a plaintiff's award is:", "opts": ["eliminated if the plaintiff was at fault at all", "doubled if the defendant was mostly at fault", "reduced by the plaintiff's own percentage of fault", "paid only by the plaintiff's own insurer"], "a": 2, "fb": "Fault systems: most states use comparative negligence. Some \"modified\" versions bar recovery if the plaintiff is 50% or 51% or more at fault."}, {"cat": "Torts & Personal Injury", "stem": "A spectator hit by a baseball at a game may face which defense?", "opts": ["Res judicata", "Assumption of risk", "Statute of frauds", "Sovereign immunity"], "a": 1, "fb": "Defenses: assumption of risk applies when a plaintiff knowingly and voluntarily accepted a known danger. Signed waivers are a common example."}, {"cat": "Torts & Personal Injury", "stem": "The \"eggshell skull\" rule means the defendant:", "opts": ["is liable only for the injuries a healthy person would have suffered", "owes nothing if the plaintiff had any pre-existing medical condition", "is liable for the full harm, even to an unusually fragile plaintiff", "may reduce damages by the cost of the plaintiff's prior medical care"], "a": 2, "fb": "Key doctrine: a fragile plaintiff can recover for the full harm caused. This is why intake must record pre-existing conditions accurately."}, {"cat": "Torts & Personal Injury", "stem": "Which item is an example of \"special\" (economic) damages?", "opts": ["Pain and suffering", "Loss of enjoyment of life", "Emotional distress and anxiety", "Medical bills and lost wages"], "a": 3, "fb": "Damages: special or economic damages can be calculated from bills and records. Pain, distress and loss of enjoyment are general (non-economic) damages."}, {"cat": "Torts & Personal Injury", "stem": "\"Pain and suffering\" is classified as:", "opts": ["nominal damages", "punitive damages", "non-economic (general) damages", "economic (special) damages"], "a": 2, "fb": "Damages: pain and suffering compensates physical and emotional distress. It has no invoice, so it is non-economic. In Spanish it is close to \"daño moral\"."}, {"cat": "Torts & Personal Injury", "stem": "Damages intended to punish especially reckless or malicious conduct are:", "opts": ["liquidated damages", "compensatory damages", "nominal damages", "punitive damages"], "a": 3, "fb": "Damages: punitive (or exemplary) damages punish and deter. Compensatory damages restore the plaintiff's actual losses."}, {"cat": "Torts & Personal Injury", "stem": "\"Loss of consortium\" compensates:", "opts": ["a spouse's loss of companionship", "the insurer's payments to the victim", "an employer's loss of a worker's services", "the injured person's lost income"], "a": 0, "fb": "Damages: loss of consortium is usually claimed by the injured person's spouse (in some states, by family members). Intake should note whether the client is married."}, {"cat": "Torts & Personal Injury", "stem": "In personal injury pre-litigation, a \"demand letter\" is usually sent to:", "opts": ["the police, to request the crash report", "the at-fault party's insurer", "the court clerk, to open a new case", "the client, to request payment of fees"], "a": 1, "fb": "Pre-litigation: the demand letter (carta de reclamación) seeks settlement before a lawsuit. It is not filed with the court."}, {"cat": "Torts & Personal Injury", "stem": "The client says the accident was on January 5; the police report says January 6. What should you do?", "opts": ["Leave the date blank until the case settles", "Use the police report date because it is official", "Use the client's date because the client was there", "Flag the discrepancy and confirm the date with the client"], "a": 3, "fb": "Intake practice: dates drive the statute of limitations. Never silently choose one source; record both and verify."}, {"cat": "Torts & Personal Injury", "stem": "Why must intake record a client's pre-existing medical conditions?", "opts": ["So the attorney can address them before the defense does", "Because they reduce the attorney's contingency fee percentage", "Because the firm must report them to the insurer at intake", "Because they automatically disqualify the claim from settlement"], "a": 0, "fb": "Intake practice: pre-existing conditions do not end a case (see the eggshell skull rule), but undisclosed history can damage the client's credibility later."}, {"cat": "Contracts", "stem": "Which three elements are required to form a contract under U.S. common law?", "opts": ["Intent, writing, and a witness", "Offer, signature, and registration", "Offer, acceptance, and notarization", "Offer, acceptance, and consideration"], "a": 3, "fb": "Formation: offer, acceptance and consideration (something of value exchanged). Most contracts do not need to be written or notarized."}, {"cat": "Contracts", "stem": "In contract law, \"consideration\" means:", "opts": ["something of value each party gives in exchange", "the time the parties spend negotiating", "a written summary of the agreement", "the respect each party shows the other"], "a": 0, "fb": "False friend: \"consideration\" is a legal term for the bargained-for exchange. It is not the Spanish \"consideración\" (respect or thought)."}, {"cat": "Contracts", "stem": "The standard term for \"romper un contrato\" (failing to perform it) is:", "opts": ["to void a contract", "to violate a contract", "to break a contract", "to breach a contract"], "a": 3, "fb": "Collocation: \"breach\" is the legal verb and noun. \"Break a contract\" is informal; voiding a contract means treating it as having no legal effect."}, {"cat": "Contracts", "stem": "The precise legal term for \"un acuerdo verbal\" (spoken, not written) is:", "opts": ["an oral agreement", "a word agreement", "a verbal agreement", "a vocal agreement"], "a": 0, "fb": "Precision: \"oral\" means spoken. In legal English \"verbal\" can mean anything in words, written or spoken, so \"oral agreement\" is clearer."}, {"cat": "Contracts", "stem": "The offeree replies to an offer with different terms. Under the common law mirror image rule, the reply is:", "opts": ["a counteroffer that rejects the original offer", "an acceptance of the original terms", "a waiver of the original offer's deadline", "a binding contract on the new terms"], "a": 0, "fb": "Formation: acceptance must match the offer exactly. A reply that changes terms is a counteroffer. (Sales of goods under the UCC follow a different rule.)"}, {"cat": "Contracts", "stem": "Which rule requires certain contracts, such as sales of land, to be in writing to be enforceable?", "opts": ["The parol evidence rule", "The mailbox rule", "The statute of frauds", "The mirror image rule"], "a": 2, "fb": "Key rule: the statute of frauds lists contracts that need a signed writing. Despite its name, it is not a fraud statute."}, {"cat": "Contracts", "stem": "Which rule generally bars evidence of earlier oral agreements that contradict a fully integrated written contract?", "opts": ["The best evidence rule", "The parol evidence rule", "The statute of frauds", "The hearsay rule"], "a": 1, "fb": "Key rule: the parol evidence rule protects the final written agreement. The statute of frauds asks whether a writing is required at all."}, {"cat": "Contracts", "stem": "A party's duty to pay arises only after the goods pass inspection. Passing inspection is a:", "opts": ["condition precedent", "condition subsequent", "liquidated damage", "warranty"], "a": 0, "fb": "Key term: a condition precedent (condición suspensiva) must occur before a duty becomes due. A condition subsequent ends an existing duty."}, {"cat": "Contracts", "stem": "Voluntarily giving up a known contractual right is called a:", "opts": ["stipulation", "rescission", "waiver", "novation"], "a": 2, "fb": "Key term: waiver (renuncia a un derecho). Novation replaces a party or obligation; rescission undoes the whole contract."}, {"cat": "Contracts", "stem": "After a breach, the injured party must take reasonable steps to limit its losses. This is the duty to:", "opts": ["indemnify damages", "mitigate damages", "liquidate damages", "waive damages"], "a": 1, "fb": "Key doctrine: mitigation of damages. Losses the plaintiff could reasonably have avoided are generally not recoverable."}, {"cat": "Contracts", "stem": "A contract signed because one party was threatened with violence may be avoided on the ground of:", "opts": ["duress", "novation", "estoppel", "consideration"], "a": 0, "fb": "Defenses: duress (coacción) and undue influence correspond to the civil-law idea of \"vicios del consentimiento\" based on pressure."}, {"cat": "Contracts", "stem": "A court orders a seller to transfer a unique property instead of paying damages. This remedy is:", "opts": ["specific performance", "restitution", "rescission", "liquidated damages"], "a": 0, "fb": "Remedies: specific performance is an equitable remedy used when money is inadequate, such as for land or unique goods."}, {"cat": "Contracts", "stem": "\"Equitable relief\" refers to:", "opts": ["a settlement shared by several defendants in proportion", "court orders such as injunctions and specific performance", "damages divided equally between the two parties", "reduced legal fees for clients with low incomes"], "a": 1, "fb": "Remedies: equitable relief orders a party to do or stop doing something. In Spanish it is close to \"medidas en equidad\" or \"tutela específica\"."}, {"cat": "Contracts", "stem": "The precise term for \"daño emergente\" in a damages analysis is:", "opts": ["emerging damage", "consequential profit", "future harm", "actual out-of-pocket loss"], "a": 3, "fb": "Translation: \"daño emergente\" is the loss actually suffered; \"lucro cesante\" is lost profits. \"Emerging damage\" is a literal and incorrect translation."}, {"cat": "Employment Law", "stem": "What does \"at-will employment\" mean?", "opts": ["The employer must give 30 days' written notice before any firing", "The employee may be fired only for documented misconduct at work", "The employee may set his or her own hours and salary", "Either side may end the job at any time for any lawful reason"], "a": 3, "fb": "Key term: at-will is the default in most states, but firing for an illegal reason, such as discrimination or retaliation, is still unlawful."}, {"cat": "Employment Law", "stem": "Which federal agency receives charges of employment discrimination?", "opts": ["The National Labor Relations Board (NLRB)", "The Occupational Safety and Health Administration (OSHA)", "The Department of Labor's Wage and Hour Division", "The Equal Employment Opportunity Commission (EEOC)"], "a": 3, "fb": "Agency map: EEOC handles discrimination charges; NLRB handles union and concerted-activity issues; Wage and Hour enforces minimum wage and overtime; OSHA handles workplace safety."}, {"cat": "Employment Law", "stem": "An EEOC \"Notice of Right to Sue\" allows the employee to:", "opts": ["return to work with back pay", "file a lawsuit in court within a limited time", "receive an automatic settlement payment", "appeal the employer's decision to the EEOC"], "a": 1, "fb": "Key deadline: for federal claims the suit generally must be filed within 90 days of receiving the notice. Calendar it immediately."}, {"cat": "Employment Law", "stem": "Under federal law, which of these is a \"protected characteristic\"?", "opts": ["Job title", "Level of education", "Religion", "Political party membership"], "a": 2, "fb": "Protected classes: federal law protects race, color, religion, sex, national origin, age (40+), disability and genetic information, among others. Some states add more categories."}, {"cat": "Employment Law", "stem": "A client says she was fired \"for no reason\" after a new manager arrived, and she has no facts suggesting a protected characteristic. Under at-will employment, this is:", "opts": ["a breach of contract in every U.S. state", "generally lawful, absent another legal protection", "automatically a wrongful termination claim", "always retaliation under federal law"], "a": 1, "fb": "Screening: unfair is not the same as illegal. Ask follow-up questions about complaints, leave, protected traits or contracts before ruling the case in or out."}, {"cat": "Employment Law", "stem": "An employee complains about sexual harassment and is demoted a week later. Which claim should intake flag?", "opts": ["Breach of non-compete", "Retaliation", "Constructive discharge", "Wage and hour violation"], "a": 1, "fb": "Key term: retaliation is adverse action taken because the employee engaged in protected activity. The short gap between complaint and demotion is important evidence."}, {"cat": "Employment Law", "stem": "A \"hostile work environment\" claim requires conduct that is:", "opts": ["related to poor office conditions such as noise", "severe or pervasive and based on a protected characteristic", "a single disagreement with a supervisor", "rude or unpleasant toward any employee"], "a": 1, "fb": "Screening: ordinary rudeness is not enough. The harassment must be tied to a protected class and be severe or pervasive."}, {"cat": "Employment Law", "stem": "Under the ADA, a \"reasonable accommodation\" is:", "opts": ["a promotion given to compensate an employee for a disability", "a transfer that the employer imposes without any discussion", "paid leave that must be given to any employee who asks for it", "a job change that lets a qualified disabled employee do the work"], "a": 3, "fb": "Key term: accommodations include modified schedules, equipment or duties. The employer and employee should engage in an interactive process."}, {"cat": "Employment Law", "stem": "Under the FLSA, a \"non-exempt\" employee is:", "opts": ["allowed to work only on a part-time basis", "excluded from overtime because of a salary", "exempt from federal minimum wage rules", "entitled to overtime after 40 hours a week"], "a": 3, "fb": "Key term: non-exempt workers earn overtime at 1.5 times the regular rate. Exempt employees, such as many salaried professionals, do not."}, {"cat": "Employment Law", "stem": "A worker was denied required rest breaks and not paid for overtime. This is a:", "opts": ["workers' compensation claim", "wage and hour claim", "whistleblower claim", "hostile work environment claim"], "a": 1, "fb": "Classification: wage and hour claims cover minimum wage, overtime, breaks and pay records. Note: meal and rest break rules come mainly from state law."}, {"cat": "Employment Law", "stem": "Which factor matters most in deciding whether a worker is an employee or an independent contractor?", "opts": ["How much control the business has over how the work is done", "Whether the worker signed a contract using the word \"contractor\"", "Whether the worker speaks the employer's language", "Whether the worker is paid weekly or monthly"], "a": 0, "fb": "Classification: labels in a contract do not decide status. Control, economic dependence and how integrated the work is all matter."}, {"cat": "Employment Law", "stem": "Why is the employee/contractor distinction important at intake?", "opts": ["It decides which court has proper venue", "Employees are not allowed to sue employers", "Independent contractors cannot hire lawyers", "Many worker protections cover only employees"], "a": 3, "fb": "Screening: a misclassified \"contractor\" may actually be an employee with overtime and other rights."}, {"cat": "Employment Law", "stem": "An employee quits because the employer made conditions intolerable. The resignation may be treated as a firing under the doctrine of:", "opts": ["constructive discharge", "reduction in force", "voluntary separation", "at-will termination"], "a": 0, "fb": "Screening: \"I quit\" does not end the analysis. Ask why the client left; constructive discharge treats the resignation as a termination."}, {"cat": "Employment Law", "stem": "Which of these is an \"adverse employment action\"?", "opts": ["A routine schedule change applied to everyone", "A move to a desk on another floor", "A manager's single critical email", "A demotion with reduced pay"], "a": 3, "fb": "Key term: an adverse action is a material negative change in pay, position or conditions, such as termination, demotion or pay cut."}, {"cat": "Employment Law", "stem": "An employee who reports illegal activity by the employer to authorities is called a:", "opts": ["whistleblower", "grievant", "claimant", "informant witness"], "a": 0, "fb": "Key term: whistleblower (denunciante). Many federal and state laws protect whistleblowers from retaliation."}, {"cat": "Employment Law", "stem": "A clause that bars a former employee from recruiting the company's clients or co-workers is a:", "opts": ["non-disparagement clause", "non-compete clause", "confidentiality clause", "non-solicitation clause"], "a": 3, "fb": "Restrictive covenants: a non-solicitation clause limits recruiting; a non-compete limits working for competitors; a confidentiality clause protects information."}, {"cat": "Employment Law", "stem": "Which federal law provides eligible employees with unpaid, job-protected leave for serious health conditions or a new child?", "opts": ["The Americans with Disabilities Act (ADA)", "The National Labor Relations Act (NLRA)", "The Family and Medical Leave Act (FMLA)", "The Fair Labor Standards Act (FLSA)"], "a": 2, "fb": "Statute map: FMLA covers leave; FLSA covers wages and overtime; ADA covers disability discrimination and accommodations; NLRA covers union and concerted activity."}, {"cat": "Employment Law", "stem": "Which item is MOST useful to request early in a discrimination intake?", "opts": ["Photos of the office building", "The client's school transcripts", "Performance reviews and the termination letter", "The employer's annual marketing plan"], "a": 2, "fb": "Evidence: reviews, write-ups and the stated reason for termination help show whether the employer's explanation is consistent."}, {"cat": "Immigration", "stem": "Which agency decides most applications for immigration benefits, such as green cards and work permits?", "opts": ["U.S. Immigration and Customs Enforcement (ICE)", "The Executive Office for Immigration Review (EOIR)", "U.S. Citizenship and Immigration Services (USCIS)", "U.S. Customs and Border Protection (CBP)"], "a": 2, "fb": "Agency map: USCIS adjudicates benefits; CBP works at the border; ICE handles interior enforcement; EOIR runs the immigration courts."}, {"cat": "Immigration", "stem": "A \"Request for Evidence\" (RFE) from USCIS means:", "opts": ["the case was closed and must be refiled", "the applicant must attend a court hearing", "USCIS needs more documents before deciding the case", "the case has been approved pending a fee"], "a": 2, "fb": "Key notice: an RFE sets a response deadline. Missing it usually leads to a decision on the existing record, often a denial, so it must be calendared immediately."}, {"cat": "Immigration", "stem": "Which document starts removal proceedings in immigration court?", "opts": ["A Notice of Action (I-797)", "A Request for Evidence (RFE)", "A Form G-28", "A Notice to Appear (NTA)"], "a": 3, "fb": "Key notice: the NTA is filed with the immigration court. Failing to appear can result in a removal order in absentia."}, {"cat": "Immigration", "stem": "Form G-28 is filed to:", "opts": ["petition for a qualifying family member abroad", "request a travel document before leaving the U.S.", "notify USCIS that a lawyer represents the client", "apply for permission to work in the U.S."], "a": 2, "fb": "Key form: the G-28 (Notice of Entry of Appearance) lets USCIS communicate with the representative about the case."}, {"cat": "Immigration", "stem": "An Employment Authorization Document (EAD) is:", "opts": ["a card that permits the holder to work for a set period", "the document that proves lawful permanent residence", "a certificate that proves U.S. citizenship by birth", "a visa stamp issued by a U.S. consulate in a passport"], "a": 0, "fb": "Key term: the EAD (permiso de trabajo) is temporary. A green card is proof of permanent residence."}, {"cat": "Immigration", "stem": "A \"green card\" is the common name for proof of:", "opts": ["a pending asylum application", "permanent resident status", "a temporary H-1B work visa", "U.S. citizenship by birth"], "a": 1, "fb": "Key term: a lawful permanent resident (LPR, residente permanente) is not a citizen. Citizenship requires naturalization, birth in the U.S., or acquisition/derivation through a parent."}, {"cat": "Immigration", "stem": "Which visa is a nonimmigrant (temporary) visa?", "opts": ["Diversity visa", "F-1 student visa", "EB-2 employment visa", "IR-1 spouse of a U.S. citizen"], "a": 1, "fb": "Visa types: nonimmigrant visas (B-1/B-2, F-1, H-1B) are temporary. IR, diversity and EB visas are immigrant visas leading to permanent residence."}, {"cat": "Immigration", "stem": "In immigration law, \"admission\" means:", "opts": ["the issuance of a visa by a U.S. consulate abroad", "the filing of any benefit application with USCIS", "any period of physical presence inside the United States", "lawful entry after inspection by an immigration officer"], "a": 3, "fb": "Key term: a person who entered without inspection (EWI) has not been admitted, which affects eligibility for many benefits. A visa alone is not an admission."}, {"cat": "Immigration", "stem": "Immigration \"parole\" is:", "opts": ["an extension of a tourist visa granted by a consulate abroad", "a type of permanent residence granted after five years", "temporary permission to enter for humanitarian or public-benefit reasons", "the early release of a noncitizen from a criminal sentence after good behavior"], "a": 2, "fb": "False friend: immigration parole is not criminal parole. Parole is also not an admission, which matters for later applications."}, {"cat": "Immigration", "stem": "Why is accumulating \"unlawful presence\" in the U.S. important?", "opts": ["It has no effect at all if the person marries a U.S. citizen", "It matters only if the person also has a criminal record", "It automatically leads to U.S. citizenship after ten years", "Departing after certain periods can trigger 3- or 10-year bars"], "a": 3, "fb": "Screening: more than 180 days of unlawful presence can trigger a 3-year bar on departure; one year or more can trigger a 10-year bar. Waivers may be available."}, {"cat": "Immigration", "stem": "Asylum protects people who fear persecution in their home country based on:", "opts": ["one of five protected grounds, such as religion or political opinion", "poverty or a lack of employment opportunities in the country", "high levels of general crime or gang violence affecting everyone in their country", "a strong desire to reunite with family living in the U.S."], "a": 0, "fb": "Key requirement: persecution must be connected to one of the five protected grounds. Asylum applications are generally due within one year of arrival, with limited exceptions."}, {"cat": "Immigration", "stem": "In a family petition (Form I-130), the U.S. citizen or permanent resident who files is the:", "opts": ["beneficiary", "petitioner", "sponsor of record", "applicant"], "a": 1, "fb": "Parties: the petitioner files for the relative; the beneficiary is the relative who will immigrate."}, {"cat": "Immigration", "stem": "A \"bona fide marriage\" in immigration law is one that:", "opts": ["was entered into to build a life together", "was celebrated in a religious ceremony", "has lasted at least five continuous years", "was registered in a U.S. state or territory"], "a": 0, "fb": "Ev const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();
</script>
