certified mail or specific email addresses)?", "opts": ["The software vendor cancels the firm's practice tech subscription.", "The platform locks out users from modifying custom field parameters across portfolios.", "Remote teams experience a sudden drop in their baseline network connection speed.", "Claims of contract termination or breach warnings can be delivered via casual text messages or loose verbal statements, generating evidentiary chaos."], "a": 3, "fb": "Risk Shielding: A strict Notice Provision (cláusula de notificaciones) standardizes contract communication. It defines exactly when and how a formal legal alert takes effect, blocking surprise defaults."}, {"cat": "General", "stem": "While auditing a multi-party transactional folder, you spot a \"Cross-Default Clause.\" What strategic impact does this clause have on the client’s risk portfolio?", "opts": ["It forces the court clerk division to merge separate civil complaint dockets into one action.", "It changes the role-based access control permissions assigned to remote case assistants.", "A default by the counterparty under one specific agreement automatically triggers a legal default under a separate, parallel contract with our client.", "It automatically cuts the contract's baseline interest rates in half during economic drops."], "a": 2, "fb": "Partner Inspection: Cross-Default Clauses link separate business agreements together, allowing our client to immediately freeze all performance pipelines if the counterparty defaults elsewhere."}, {"cat": "General", "stem": "Review this draft clause: \"This Agreement shall be interpreted as if drafted jointly by both Parties, and no presumption shall arise favoring either party as the author.\" What rule does this clause block?", "opts": ["Statute of Frauds", "Contra Proferentem Rule", "Best Evidence Rule", "Parol Evidence Rule"], "a": 1, "fb": "Linguistic Precision: This text neutralizes the \"Contra Proferentem\" rule. It prevents a court from automatically interpreting ambiguities against the firm that drafted the master contract template."}, {"cat": "Legal English", "stem": "Which limitation-of-liability phrasing most effectively excludes consequential damages AND caps direct damages?", "opts": ["Neither party is liable for anything, ever.", "Consequential damages are fine.", "In no event shall either party be liable for consequential damages; each party's aggregate liability shall not exceed the fees paid in the prior 12 months.", "Liability is capped, more or less."], "a": 2, "fb": "Effective LoL clauses pair an exclusion of indirect/consequential damages with a hard monetary cap on direct damages; the model answer does both with enforceable specificity."}, {"cat": "Legal Software", "stem": "A reliable calendaring program includes a 'no-orphan' rule requiring that:", "opts": ["deadlines auto-delete after passing", "every deadline has a responsible attorney assigned and a backup, not just a date", "only paralegals are notified", "dates are optional"], "a": 1, "fb": "Assigning ownership plus a backup for every deadline ensures accountability and resilience; an unassigned ('orphan') deadline is a malpractice risk waiting to happen."}, {"cat": "Legal Software", "stem": "For federal deadlines, a calendaring rules engine must correctly apply FRCP 6(a), which governs:", "opts": ["the filing fee", "the page limit", "electronic signatures", "how to count days, including exclusions for weekends/holidays on the last day"], "a": 3, "fb": "Rule 6(a) computation rules (counting every day but rolling the last day off weekends/legal holidays) are exactly what a properly configured rules engine automates."}, {"cat": "General", "stem": "A confidentiality clause in a settlement should typically include a carve-out permitting disclosure:", "opts": ["as required by law, subpoena, or to tax/financial advisors", "to competitors", "to social media", "to the press"], "a": 0, "fb": "Standard carve-outs allow legally compelled disclosures and disclosures to professional advisors, preventing the clause from being breached by unavoidable or legitimate needs."}, {"cat": "Legal Software", "stem": "A 'conflicts check' run in the case-management system before opening a matter is designed to:", "opts": ["detect adverse or duplicate parties to avoid ethical conflicts of interest", "verify spelling", "assign a billing code", "check the client's credit"], "a": 0, "fb": "Conflict-checking searches parties/related entities across the database to satisfy ethical duties (Model Rules 1.7/1.9) before representation begins."}, {"cat": "Legal English", "stem": "A survival clause states which obligations continue after termination. The most precise drafting:", "opts": ["Everything survives forever.", "Important sections survive.", "Some parts continue after the end.", "Sections 7 (Confidentiality), 9 (Indemnification), and 11 (Limitation of Liability) shall survive any termination or expiration."], "a": 3, "fb": "Survival clauses must enumerate the exact sections that persist; vague references ('important sections') create disputes about what actually survived."}, {"cat": "Legal English", "stem": "A motion argues the opposing claim is barred because it was already litigated to final judgment between the same parties. The precise doctrine is:", "opts": ["stare decisis", "ejusdem generis", "force majeure", "res judicata (claim preclusion)"], "a": 3, "fb": "'Res judicata' bars relitigation of claims that were or could have been raised in a prior final judgment between the same parties; the distractors are unrelated doctrines/canons."}, {"cat": "General", "stem": "A Rule 12(b)(6) motion argues that the complaint:", "opts": ["fails to state a claim upon which relief can be granted", "was filed in the wrong font", "names too many plaintiffs", "lacks a jury demand"], "a": 0, "fb": "Rule 12(b)(6) tests legal sufficiency of the pleading, accepting well-pleaded facts as true but requiring a plausible claim under Twombly/Iqbal."}, {"cat": "General", "stem": "Complete the following contract execution standard phrase: \"To guarantee that a corporate officer has the actual authority to bind an enterprise, the drafting team must request a certified Board _________ before closing.\"", "opts": ["audit", "resolution", "template", "validation"], "a": 1, "fb": "Operational Workflow: A \"Board Resolution\" (resolución del consejo de administración) verifies corporate capacity, protecting the client from future claims that the signing executive acted without corporate power."}, {"cat": "Personal Injury", "stem": "A 'limitation of liability' clause that caps damages will often carve OUT (exclude from the cap):", "opts": ["the definitions section", "routine performance obligations", "indemnification, confidentiality breaches, and gross negligence/willful misconduct", "the recitals"], "a": 2, "fb": "Standard practice excludes certain high-risk items (indemnity, IP, confidentiality, willful misconduct) from the liability cap so the wrongdoer cannot hide behind it."}, {"cat": "General", "stem": "Translate and bridge the U.S. commercial clause framework \"Forum Selection Clause\" into the conceptual register of an international legal corporate attorney:", "opts": ["Pacto de cuota litis transfronterizo; la fijación de honorarios de contingencia regulados por un arancel estatal.", "Mandamiento de ejecución prendaria; la orden judicial utilizada para rematar bienes muebles dados en garantía.", "Demanda de reconvención internacional; el escrito mediante el cual el demandado interpone pretensiones en el extranjero.", "Cláusula de prórroga de competencia / selección de foro; a provision determining the exclusive geographic court or venue where any lawsuit arising from the contract must be filed."], "a": 3, "fb": "The Bridge Methodology: A Forum Selection Clause overrides standard venue configurations. Drafting this precisely shields the firm from facing lawsuits in hostile or far-off jurisdictions."}, {"cat": "Leg nish the breaching party", "are set after the breach occurs", "always exceed actual damages", "are a reasonable pre-estimate of hard-to-measure harm, not a penalty"], "a": 3, "fb": "A liquidated-damages clause is upheld only if it reasonably forecasts damages that would be difficult to prove; a clause designed to penalize is void as a penalty."}, {"cat": "Legal Software", "stem": "When designing a cross-departmental automation (intake → legal → billing), the most common failure point to guard against is:", "opts": ["too many happy clients", "excessive accuracy", "fast performance", "broken hand-offs where a trigger fires but the downstream owner or field mapping is undefined"], "a": 3, "fb": "Automation reliability depends on explicitly defining every hand-off's owner, condition, and data mapping; undefined edges silently drop tasks and create liability."}, {"cat": "General", "stem": "How should a Tier 3 litigation manager translate \"Liquidated Damages\" to a Spanish-speaking corporate executive while explaining enforceability hurdles?", "opts": ["Amortización preferente de capital; la liquidación de activos financieros bajo supervisión.", "Recurso de reposición previa; la solicitud presentada ante un secretario de la corte.", "Daños punitivos ejemplares; una multa destinada a destruir económicamente al infractor.", "Cláusula penal o daños liquidados; una estimación anticipada y razonable de los perjuicios, invalidadas por el juez si actúan como un mero castigo."], "a": 3, "fb": "The Bridge Methodology: In common law, a liquidated damages clause is struck down if it is deemed a \"penalty\" (castigo). It must represent a reasonable forecast of damages that were difficult to estimate at drafting."}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();
</script>
