<script>
// ============================================================
// Tier 3 — 150 questions (Expert level), rebuilt Oct 2026.
// Answer positions balanced; option lengths checked for bias. Source: scratch bank t3*.json
// ============================================================
const TIER_LABEL = "Tier 3";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyLtcitp5MB6QoNl0jVXOCI7TPHot9Lj-wYJNosfrQZpnI5pmH2ECoX2Ytv5pVQt1f-/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const ALL_QUESTIONS = [{"cat": "Contract Drafting & Boilerplate", "stem": "In a master services agreement, which word most clearly imposes a mandatory obligation on a party?", "opts": ["may", "is expected to", "shall", "will endeavor to"], "a": 2, "fb": "Drafting: use \"shall\" for duties, \"may\" for discretion, and \"will\" for future facts or the drafter's choice of style. Expectations and endeavors are weaker than a binding duty."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which phrasing grants a right that the holder may choose not to exercise, without creating a duty?", "opts": ["Buyer agrees to purchase the Equipment, at its sole discretion.", "Buyer shall purchase the Equipment if Buyer considers it appropriate to do so.", "Buyer will purchase the Equipment at the end of the Term.", "Buyer shall have the option, but not the obligation, to purchase the Equipment."], "a": 3, "fb": "Drafting: \"option, but not the obligation\" creates a right without a duty. Mixing \"shall\" or \"agrees to\" with discretion creates internal contradiction."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which phrasing best makes notice a strict condition of termination?", "opts": ["Provided that notice is given, the party may terminate this Agreement.", "The party may terminate this Agreement at any time and shall then give 30 days' written notice afterwards.", "Termination is effective only if the terminating party first gives 30 days' written notice.", "The terminating party should give notice of termination where practicable."], "a": 2, "fb": "Drafting: \"only if\" makes notice a condition. \"Provided that\" is notoriously ambiguous, and \"should\" or after-the-fact notice creates at most a covenant."}, {"cat": "Contract Drafting & Boilerplate", "stem": "\"Including\" in a list is often followed by \"without limitation\" in order to:", "opts": ["make the list a representation and warranty", "prevent a court from reading the list as exhaustive", "signal that each of the listed items is a condition precedent to performance", "limit the clause to the items listed"], "a": 1, "fb": "Interpretation: \"including without limitation\" counters the expressio unius argument that listed items exclude everything else."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which sentence uses \"notwithstanding\" correctly to create an overriding provision?", "opts": ["Notwithstanding Supplier's total liability, the fees paid shall not exceed anything to the contrary.", "Supplier's liability shall not exceed fees paid, notwithstanding that it is subject to Section 9.", "Notwithstanding anything to the contrary, Supplier's total liability shall not exceed the fees paid.", "Supplier's liability, notwithstanding, shall be the fees paid if anything is contrary to it."], "a": 2, "fb": "Drafting: \"notwithstanding [other provisions]\" at the start of a sentence tells the reader this provision controls over conflicting terms."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"representation\" in a contract differs from a \"warranty\" mainly because a representation:", "opts": ["is a statement of past or present fact that may support a misrepresentation claim", "is binding only if it is repeated in the closing certificate", "is a promise about the future performance of the goods that can only support a breach of contract claim", "cannot give rise to any remedy once the contract is signed"], "a": 0, "fb": "Reps and warranties: false representations can support tort claims (and rescission), while warranties are contractual promises that a fact is true, supporting breach of contract damages. Parties often use both together."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which pair correctly signals a condition versus a covenant?", "opts": ["\"May\" signals a condition; \"provided\" signals a covenant.", "Both \"shall\" and \"only if\" signal conditions precedent.", "\"Only if\" signals a condition; \"shall\" signals a covenant.", "\"Shall\" signals a condition; \"only if\" signals a covenant."], "a": 2, "fb": "Drafting: a covenant is a promise; breach gives damages. A condition is an event that must occur before a duty arises; failure means no duty."}, {"cat": "Contract Drafting & Boilerplate", "stem": "An \"entire agreement\" clause paired with a \"no oral modification\" clause is designed to:", "opts": ["make every oral promise enforceable as long as it is later confirmed by the parties' conduct", "exclude prior side deals and require future changes to be in a signed writing", "allow either party to modify the agreement by email or text message", "ensure that the headings control the interpretation of the agreement"], "a": 1, "fb": "Boilerplate: integration addresses the past; no-oral-modification addresses the future. Courts in some states may still enforce oral modifications relied on by the parties."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which clause best prevents a counterparty from claiming that an oral promise extended a contract deadline?", "opts": ["A no-oral-modification clause", "A counterparts clause", "A survival clause", "A severability and reformation clause"], "a": 0, "fb": "Boilerplate: a no-oral-modification clause requires amendments in a signed writing. Severability only saves the rest of the contract if one term is invalid."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A severability clause is most effective when it also states that an unenforceable term will be:", "opts": ["enforced to the maximum extent permitted by law", "deemed waived by both parties automatically", "decided by the court under the other party's law", "replaced by the drafting party's preferred term"], "a": 0, "fb": "Drafting: pairing severability with reformation language invites the court to narrow an overbroad term rather than strike it entirely, where state law permits."}, {"cat": "Contract Drafting & Boilerplate", "stem": "\"No failure or delay in exercising any right shall operate as a waiver.\" This is a:", "opts": ["survival clause", "non-waiver clause", "force majeure", "merger clause"], "a": 1, "fb": "Boilerplate: non-waiver clauses protect a party that tolerated late performance in the past. Courts may still find waiver from a consistent course of conduct."}, {"cat": "Contract Drafting & Boilerplate", "stem": "\"The remedies provided in this Agreement are cumulative and not exclusive.\" This language means:", "opts": ["remedies must be pursued one after the other", "the listed contractual remedies replace all remedies available at law or in equity", "the parties keep other remedies available at law or in equity", "each remedy can be used only once during the term"], "a": 2, "fb": "Boilerplate: without this language, a court might treat a contractual remedy (such as a service credit) as the exclusive remedy."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which anti-assignment language is strongest?", "opts": ["Neither party should assign this Agreement without first talking to the other party.", "Assignment of this Agreement is discouraged unless both parties agree to it.", "A party that assigns this Agreement to an affiliate, successor, or any other third party shall notify the other party in writing within 30 days after the assignment.", "Neither party may assign this Agreement, by operation of law or otherwise, without prior written consent; any attempted assignment is void."], "a": 3, "fb": "Drafting: \"by operation of law\" captures mergers, and \"void\" (not just \"a breach\") prevents the assignment from taking effect in many jurisdictions."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"change of control\" provision in a commercial agreement usually gives the non-changing party:", "opts": ["a duty to merge with the other party's new parent company", "the right to replace the acquirer's board of directors", "a right to consent or terminate if the other party is acquired", "an automatic share of the purchase price paid by the acquirer at closing"], "a": 2, "fb": "M&A: change-of-control clauses are reviewed in due diligence because they can let key counterparties terminate after an acquisition."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"most favored nation\" pricing clause obligates the vendor to:", "opts": ["offer this customer any better terms it later gives comparable customers", "charge this customer the highest price in its national market", "sell only to customers located in the same country", "give this customer priority shipping during shortages"], "a": 0, "fb": "Commercial terms: MFN clauses require monitoring and reporting. They may also raise antitrust issues in some markets."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which survival clause is drafted most precisely?", "opts": ["Important obligations of the parties will continue after the Agreement ends.", "Any section a court considers necessary shall survive termination as required.", "All provisions of this Agreement that by their nature should reasonably survive will survive any expiration or termination.", "Sections 7 (Confidentiality), 9 (Indemnification) and 11 (Limitation of Liability) survive termination."], "a": 3, "fb": "Drafting: naming the sections avoids disputes about which obligations \"by their nature\" survive."}, {"cat": "Contract Drafting & Boilerplate", "stem": "\"This Agreement may be executed in counterparts, each of which shall be deemed an original.\" This clause allows:", "opts": ["each party to keep a different version of the agreement in force", "the parties to sign separate copies that together form one agreement", "the agreement to be valid without any signature at all", "either party to change the agreement unilaterally by signing a new copy of it"], "a": 1, "fb": "Boilerplate: counterparts clauses are usually paired with language accepting electronic and PDF signatures."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A notice clause specifying certified mail or courier, and when notice is \"deemed given,\" mainly helps avoid disputes over:", "opts": ["which court will hear disputes under the agreement", "whether the parties may assign their contract rights", "which state's substantive law governs the agreement and its interpretation", "whether and when a termination or breach notice was effective"], "a": 3, "fb": "Boilerplate: clear notice mechanics protect deadlines such as cure periods and renewal opt-outs."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which limitation-of-liability language both excludes consequential damages and caps direct damages?", "opts": ["Neither party is liable for any damages of any kind arising from this Agreement.", "Neither party is liable for consequential damages, and each party's total liability is capped at the fees paid in the prior 12 months.", "Each party's liability for consequential damages is unlimited, while all direct damages are excluded.", "Liability shall be reasonable in amount and shall be agreed by the parties after any claim."], "a": 1, "fb": "Drafting: a typical structure has a consequential damages exclusion plus a cap on direct damages. Total exclusions may be unenforceable or commercially unacceptable."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Which items are most commonly carved out of a liability cap?", "opts": ["Late payment of invoices, routine service-level credits, and minor delays in delivery", "Any claim the drafting party considers important at the time", "Indemnification, confidentiality breaches, and gross negligence or willful misconduct", "Claims arising in the first year of the contract only"], "a": 2, "fb": "Negotiation: carve-outs reflect risks that parties do not want capped. Many states also refuse to enforce caps for fraud or willful misconduct."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A promise to \"indemnify and defend\" is broader than a promise only to \"indemnify\" because it:", "opts": ["shifts all legal fees to the indemnified party", "applies only to claims brought by the indemnitor itself", "limits the indemnitor's duty to claims that are finally proven against the indemnitee at trial", "requires the indemnitor to fund the defense, often from the start of the claim"], "a": 3, "fb": "Indemnity: the duty to defend is usually triggered by allegations, before liability is decided. A duty only to indemnify typically arises after a loss is established."}, {"cat": "Contract Drafting & Boilerplate", "stem": "From the indemnitor's perspective, the phrase \"arising out of or relating to\" the services is risky because it:", "opts": ["limits coverage to claims caused solely and directly by the indemnitor's own negligence", "reaches claims with only a loose connection to the services", "excludes claims brought by third parties entirely", "requires a final judgment before any payment is due"], "a": 1, "fb": "Drafting: courts often read \"relating to\" broadly. An indemnitor may prefer \"to the extent caused by\" its negligence or breach."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"hell or high water\" clause in an equipment lease requires the lessee to:", "opts": ["insure the lessor against floods and fire", "pay rent only while the equipment is working properly and is fully serviced", "keep paying even if the equipment fails or disputes arise", "stop paying if a natural disaster occurs"], "a": 2, "fb": "Finance: these clauses make payment obligations unconditional so financing parties can rely on the payment stream. The lessee must pursue claims separately."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"cross-default\" clause means that:", "opts": ["defaults are resolved by cross-examination in arbitration", "the parties may cure defaults by crossing out the breached term", "a default under another agreement can be treated as a default under this one", "both parties are in default if either one misses a payment"], "a": 2, "fb": "Finance: cross-default clauses can trigger acceleration across several agreements, so they must be mapped during transaction review."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A \"further assurances\" clause obligates the parties to:", "opts": ["obtain additional insurance coverage every year", "sign additional documents reasonably needed to carry out the deal", "renegotiate the price in good faith whenever market conditions change significantly", "guarantee each other's debts to third parties"], "a": 1, "fb": "Boilerplate: further assurances help complete transfers, filings and registrations after closing."}, {"cat": "Contract Drafting & Boilerplate", "stem": "Choose the correct boilerplate: \"This Agreement shall be binding upon and inure to the benefit of the Parties and their respective ________.\"", "opts": ["heirs, creditors, and court-appointed receivers", "successors and permitted assigns", "shareholders and directors", "agents and employees"], "a": 1, "fb": "Boilerplate: \"permitted\" ties this clause to the anti-assignment clause so it does not authorize transfers the contract otherwise prohibits."}, {"cat": "Contract Drafting & Boilerplate", "stem": "A governing-law clause says \"governed by the laws of New York.\" To prevent New York's conflict-of-laws rules from pointing to another state's law, add:", "opts": ["\"without regard to its conflict-of-laws principles\"", "\"subject to the parties' mutual agreement in each case\"", "\"as interpreted by the courts of the drafting party\"", "\"including all applicable treaties of every nation\""], "a": 0, "fb": "Drafting: this language avoids a renvoi-type argument and makes New York substantive law apply directly."}, {"cat": "Contract Drafting & Boilerplate", "stem": "To confirm that a corporate officer has authority to sign a major agreement, the counterparty often requests:", "opts": ["a certified board resolution", "a letter from the company's outside auditor", "a copy of the officer's passport", "the officer's employment contract"], "a": 0, "fb": "Execution: a secretary's certificate attaching a board resolution and incumbency evidence supports the signer's actual authority."}, {"cat": "Contract Interpretation & Remedies", "stem": "A court construes an ambiguous clause against the party that drafted it. This rule is:", "opts": ["ejusdem generis", "the rule of the last antecedent", "contra proferentem", "expressio unius"], "a": 2, "fb": "Canons: contra proferentem is often a tiebreaker. Clauses stating that the agreement was jointly drafted try to prevent its use."}, {"cat": "Contract Interpretation & Remedies", "stem": "\"Cars, trucks, motorcycles, and other vehicles.\" A court reads \"other vehicles\" to mean similar motor vehicles, not bicycles. This canon is:", "opts": ["expressio unius", "the plain meaning rule", "ejusdem generis", "contra proferentem"], "a": 2, "fb": "Canons: ejusdem generis limits general words that follow specific ones to things of the same kind."}, {"cat": "Contract Interpretation & Remedies", "stem": "A clause lists three specific grounds for termination. A court concludes that no other grounds were intended. This canon is:", "opts": ["expressio unius est exclusio alterius", "contra proferentem", "in pari materia", "ejusdem generis"], "a": 0, "fb": "Canons: expressing one thing implies the exclusion of others. Drafters use \"including without limitation\" to avoid this result."}, {"cat": "Contract Interpretation & Remedies", "stem": "\"This Agreement shall be interpreted as if jointly drafted, and no presumption shall arise against either party.\" This clause is designed to avoid:", "opts": ["the contra proferentem rule", "the statute of frauds", "the parol evidence rule for integrated writings", "the mirror image rule"], "a": 0, "fb": "Boilerplate: joint-drafting clauses are common where both sides had counsel. Courts generally respect them."}, {"cat": "Contract Interpretation & Remedies", "stem": "When a general provision conflicts with a specific provision on the same subject, courts usually apply:", "opts": ["the specific provision", "the provision drafted last", "whichever favors the buyer", "the general provision"], "a": 0, "fb": "Interpretation: specific terms generally control over general terms, and negotiated terms control over standard printed terms."}, {"cat": "Contract Interpretation & Remedies", "stem": "Under the UCC, evidence of how the parties performed under prior contracts with each other is called:", "opts": ["course of dealing", "course of performance", "usage of trade", "parol evidence"], "a": 0, "fb": "UCC § 1-303: course of performance is conduct under the same contract; course of dealing is conduct under prior contracts; usage of trade is practice in the industry."}, {"cat": "Contract Interpretation & Remedies", "stem": "A liquidated damages clause is generally enforceable if the amount is:", "opts": ["equal to the total contract price", "agreed by both parties, whatever its size", "large enough to deter the paying party from breaching", "a reasonable estimate of damages that were hard to measure when signed"], "a": 3, "fb": "Remedies: courts strike liquidated damages that operate as penalties. This differs from many civil-law systems, where a \"cláusula penal\" is generally enforceable, sometimes subject to judicial reduction."}, {"cat": "Contract Interpretation & Remedies", "stem": "Damages that put the non-breaching party where it would have been if the contract had been performed are:", "opts": ["expectation damages", "reliance damages", "restitution damages", "nominal damages"], "a": 0, "fb": "Remedies: expectation is the default measure. Reliance damages restore costs incurred; restitution returns benefits conferred."}, {"cat": "Contract Interpretation & Remedies", "stem": "Under Hadley v. Baxendale, consequential damages are recoverable only if they were:", "opts": ["caused by an intentional or bad-faith breach of the contract", "listed in the contract's recitals", "reasonably foreseeable when the contract was made", "proven beyond a reasonable doubt at trial"], "a": 2, "fb": "Remedies: unusual losses must have been communicated or reasonably contemplated at contracting. This is why contracts often exclude consequential damages."}, {"cat": "Contract Interpretation & Remedies", "stem": "Under the common law, a contractor finishes a house with minor deviations from the plans. The owner most likely:", "opts": ["may refuse to pay anything at all", "may terminate the contract and demand a full refund of all payments", "must pay the price less damages for the defects", "must pay the full price with no deduction"], "a": 2, "fb": "Substantial performance: minor deviations do not excuse the other party's performance, but damages compensate for the shortfall. A material breach would allow suspension or termination."}, {"cat": "Contract Interpretation & Remedies", "stem": "\"Time is of the essence\" in a contract means that:", "opts": ["the contract expires automatically on the first missed deadline", "timely performance is essential, so even short delays can be a material breach", "deadlines are flexible as long as performance is eventually completed within a reasonable time", "the parties should try to perform on time, but delays are expected"], "a": 1, "fb": "Drafting: without this clause, courts often allow reasonable delays. Courts may still find waiver if a party accepts late performance."}, {"cat": "Contract Interpretation & Remedies", "stem": "An unforeseen event makes performance extremely and unreasonably costly, though still possible. Under the UCC, the seller may argue:", "opts": ["accord and satisfaction", "promissory estoppel", "anticipatory repudiation of the contract", "commercial impracticability"], "a": 3, "fb": "UCC § 2-615: impracticability requires an event whose non-occurrence was a basic assumption of the contract. Mere price increases are usually not enough."}, {"cat": "Contract Interpretation & Remedies", "stem": "Both merchants exchange forms with conflicting terms but proceed with the sale. Which UCC provision governs which terms apply?", "opts": ["Section 2-725 (statute of limitations)", "Section 2-207 (battle of the forms)", "Section 2-615 (impracticability)", "Section 2-316 (exclusion of warranties)"], "a": 1, "fb": "UCC: § 2-207 rejects the strict mirror image rule for goods. Additional terms between merchants may become part of the contract unless they materially alter it or are objected to."}, {"cat": "Contract Interpretation & Remedies", "stem": "Under UCC § 2-316, a written disclaimer of the implied warranty of merchantability generally must:", "opts": ["appear only in the invoice", "be approved by a state agency", "be signed before a notary public", "mention merchantability and be conspicuous"], "a": 3, "fb": "UCC: phrases such as \"as is\" can also exclude implied warranties. Disclaiming fitness for a particular purpose requires a conspicuous writing."}, {"cat": "Contract Interpretation & Remedies", "stem": "After a seller fails to deliver, the buyer purchases substitute goods elsewhere and sues for the price difference. Under the UCC this remedy is called:", "opts": ["rescission", "replevin", "reformation", "cover"], "a": 3, "fb": "UCC § 2-712: cover lets the buyer recover the difference between the cover price and the contract price, plus incidental and consequential damages."}, {"cat": "Contract Interpretation & Remedies", "stem": "A party asks the court to rewrite a written contract because it does not reflect what both parties actually agreed. The remedy is:", "opts": ["reformation", "specific performance", "rescission", "restitution"], "a": 0, "fb": "Remedies: reformation corrects the writing to match the true agreement, usually for mutual mistake or fraud. Rescission undoes the contract."}, {"cat": "Complex Litigation & Evidence", "stem": "Under Twombly and Iqbal, to survive a Rule 12(b)(6) motion a complaint must:", "opts": ["list every witness the plaintiff intends to call", "prove each element by a preponderance of the evidence", "plead facts that make liability plausible, not merely conceivable", "attach all evidence the plaintiff will use at trial"], "a": 2, "fb": "Pleading standard: legal conclusions are not assumed true. The complaint needs factual content supporting a reasonable inference of liability."}, {"cat": "Complex Litigation & Evidence", "stem": "Under FRCP 56, summary judgment is granted when:", "opts": ["the movant shows that it is more likely than not to win at trial", "the non-moving party has not yet completed its discovery requests", "the judge finds the movant's witnesses more credible than the opponent's witnesses", "there is no genuine dispute of material fact and the movant is entitled to judgment as a matter of law"], "a": 3, "fb": "Summary judgment: the court does not weigh credibility. It views evidence in the light most favorable to the non-movant. Rule 56(d) allows a request for more time to take discovery."}, {"cat": "Complex Litigation & Evidence", "stem": "Once the movant shows no genuine dispute, the party opposing summary judgment must:", "opts": ["file a counter-motion for summary judgment", "rely on the allegations in its own verified complaint", "request a jury trial on all remaining issues", "cite specific record evidence showing a genuine issue for trial"], "a": 3, "fb": "Opposing summary judgment: cite deposition pages, declarations and exhibits for each disputed fact. Allegations and conclusory statements are not enough."}, {"cat": "Complex Litigation & Evidence", "stem": "To defeat summary judgment, an expert declaration must:", "opts": ["state the expert's ultimate conclusion in the strongest and most definite terms possible", "be admissible under FRE 702 and explain the basis for its opinions", "be filed after the court rules on the motion", "be signed by at least two independent experts"], "a": 1, "fb": "Experts: conclusory opinions without a reliable basis (ipse dixit) do not create a genuine dispute of fact."}, {"cat": "Complex Litigation & Evidence", "stem": "A Daubert challenge to an expert's methodology is strongest when the expert cannot show that the technique:", "opts": ["is understandable to the average juror", "has been used by the expert in prior cases", "has been tested, peer-reviewed, has a known error rate, or is generally accepted", "was paid for by the party that retained the expert, or by its insurance carrier"], "a": 2, "fb": "Daubert factors: testability, peer review, error rate, standards, and general acceptance. Amended FRE 702 (2023) emphasizes that the proponent must show admissibility by a preponderance."}, {"cat": "Complex Litigation & Evidence", "stem": "A party may file a renewed motion for judgment as a matter of law after the verdict under Rule 50(b) only if it:", "opts": ["filed a motion for summary judgment before trial", "moved under Rule 50(a) before the case went to the jury", "objected on the record to the jury instructions after the verdict was read", "obtains the other party's consent to the motion"], "a": 1, "fb": "Trial practice: failing to make a Rule 50(a) motion at trial generally forfeits the post-verdict Rule 50(b) motion."}, {"cat": "Complex Litigation & Evidence", "stem": "Under FRCP 37(e), the most severe sanctions for lost ESI, such as an adverse-inference instruction, require a finding that the party:", "opts": ["lost information that was available from another source", "acted with intent to deprive the other party of the information", "did not issue a litigation hold within 24 hours", "failed to preserve the information through simple negligence or an honest mistake"], "a": 1, "fb": "Rule 37(e): if reasonable steps were not taken and the information cannot be replaced, the court may order measures to cure prejudice. Adverse inferences or dismissal require intent to deprive."}, {"cat": "Complex Litigation & Evidence", "stem": "A party inadvertently produces a privileged email. Which tool best protects against a broad waiver in federal court?", "opts": ["An FRE 502(d) order", "A litigation hold notice", "A Rule 68 offer of judgment", "A Rule 11 motion"], "a": 0, "fb": "E-discovery: a 502(d) order provides that disclosure in the case does not waive privilege, in that case or any other federal or state proceeding."}, {"cat": "Complex Litigation & Evidence", "stem": "FRCP 26(b)(1) limits discovery to non-privileged matter relevant to a claim or defense and:", "opts": ["approved in advance by the judge", "admissible in evidence at trial under the Federal Rules", "created within the past two years", "proportional to the needs of the case"], "a": 3, "fb": "Proportionality factors include the amount in controversy, the importance of the issues, access to information, resources, and burden versus benefit."}, {"cat": "Complex Litigation & Evidence", "stem": "Before filing a Rule 11 sanctions motion, the moving party must:", "opts": ["obtain the judge's permission at a status conference first", "wait until the end of trial to raise the issue", "notify the state bar of the alleged misconduct", "serve the motion and give the other party 21 days to withdraw or correct"], "a": 3, "fb": "Rule 11 safe harbor: the motion cannot be filed if the challenged paper is withdrawn or corrected within 21 days after service."}, {"cat": "Complex Litigation & Evidence", "stem": "A defendant serves a Rule 68 offer of judgment that the plaintiff rejects. If the final judgment is not more favorable than the offer, the plaintiff generally must:", "opts": ["pay the defendant's attorney's fees", "pay the costs incurred after the offer was made", "refund any pretrial settlement payments", "accept a new trial on damages only"], "a": 1, "fb": "Rule 68 shifts post-offer costs. Attorney's fees shift only if the underlying statute defines them as costs."}, {"cat": "Complex Litigation & Evidence", "stem": "Which set lists the Rule 23(a) prerequisites for a class action?", "opts": ["Duty, breach, causation, and damages for each class member", "Numerosity, commonality, typicality, and adequacy of representation", "Notice, opt-out rights, settlement approval, and reasonable attorney's fees for class counsel", "Diversity, amount in controversy, venue, and personal jurisdiction"], "a": 1, "fb": "Class actions: after Rule 23(a), the class must also fit a Rule 23(b) category, such as predominance and superiority for damages classes."}, {"cat": "Complex Litigation & Evidence", "stem": "Hundreds of similar federal product cases are sent to a single judge for coordinated pretrial proceedings. This is:", "opts": ["multidistrict litigation (MDL)", "a class action under Rule 23", "consolidation under Rule 42", "removal under 28 U.S.C. § 1441"], "a": 0, "fb": "MDL (28 U.S.C. § 1407): cases are transferred for pretrial proceedings only and must be remanded for trial unless resolved, although most settle."}, {"cat": "Complex Litigation & Evidence", "stem": "A specific issue was actually litigated and necessarily decided in a prior case. Preventing relitigation of that issue is called:", "opts": ["collateral estoppel (issue preclusion)", "judicial estoppel based on a prior inconsistent position", "res judicata (claim preclusion)", "equitable tolling"], "a": 0, "fb": "Preclusion: claim preclusion bars the whole claim; issue preclusion bars a specific issue. Judicial estoppel stops a party from taking inconsistent positions."}, {"cat": "Complex Litigation & Evidence", "stem": "In a diversity case, a federal court applies state substantive law and federal procedural law. This principle comes from:", "opts": ["the Younger doctrine", "the Erie doctrine", "the Rooker-Feldman doctrine", "the Chevron doctrine"], "a": 1, "fb": "Erie Railroad Co. v. Tompkins (1938). Statutes of limitations, for example, are treated as substantive for Erie purposes."}, {"cat": "Complex Litigation & Evidence", "stem": "After an accident, the defendant installs a new safety rail. Under FRE 407, evidence of the new rail is generally:", "opts": ["admissible to prove negligence, because the change shows the defendant knew it was at fault", "admissible only if the defendant consents", "inadmissible for every purpose at trial", "inadmissible to prove negligence, but may be admitted for other purposes"], "a": 3, "fb": "Subsequent remedial measures: FRE 407 encourages safety improvements. The evidence may be used for impeachment or to prove ownership or feasibility if disputed."}, {"cat": "Complex Litigation & Evidence", "stem": "Under FRE 408, statements made during settlement negotiations are generally:", "opts": ["inadmissible to prove or disprove the validity or amount of a disputed claim", "admissible as admissions of liability against the party who offered to settle", "privileged from discovery in every situation", "admissible only if made in writing"], "a": 0, "fb": "Settlement communications: FRE 408 has exceptions, such as proving bias. Pre-existing facts do not become inadmissible just because they were mentioned in negotiations."}, {"cat": "Complex Litigation & Evidence", "stem": "Under the learned treatise exception (FRE 803(18)), a statement from an authoritative article may be:", "opts": ["used only if its author testifies live", "read into evidence but not received as an exhibit", "admitted without establishing its reliability", "admitted as a full exhibit and sent to the jury room during deliberations"], "a": 1, "fb": "Evidence: the treatise must be established as reliable authority through testimony, admission or judicial notice. This is an effective way to impeach an opposing expert."}, {"cat": "Complex Litigation & Evidence", "stem": "On cross-examination, the purpose of a \"closing the doors\" sequence is to:", "opts": ["ask open questions so the witness can tell the full story", "commit the witness to facts that block later explanations before confronting them", "request that the judge close the courtroom to the public", "end the cross-examination before the witness can explain the answer"], "a": 1, "fb": "Advocacy: lawyers first lock in the witness's commitments with short leading questions, then present the contradiction."}, {"cat": "Complex Litigation & Evidence", "stem": "\"Res ipsa loquitur\" permits an inference of negligence when:", "opts": ["the defendant violated a safety statute designed to protect the plaintiff", "the injury was caused by an intentional act of the defendant's employee", "the injury ordinarily does not occur without negligence and the instrumentality was in the defendant's control", "the plaintiff can show that the defendant had prior similar accidents"], "a": 2, "fb": "Torts: the doctrine allows a case to reach the jury without direct proof of the specific negligent act."}, {"cat": "Complex Litigation & Evidence", "stem": "A motion argues that a new claim is barred because the same claim between the same parties already ended in a final judgment on the merits. The doctrine is:", "opts": ["the law of the case", "laches", "collateral estoppel", "res judicata (claim preclusion)"], "a": 3, "fb": "Preclusion: res judicata also bars claims that could have been raised in the first action arising from the same transaction."}, {"cat": "Complex Litigation & Evidence", "stem": "In a multi-party case, a defendant brings in a non-party it claims is liable to it for all or part of the plaintiff's claim. This is:", "opts": ["intervention under Rule 24", "a cross-claim", "interpleader", "impleader (a third-party complaint)"], "a": 3, "fb": "Joinder: impleader (Rule 14) adds a third-party defendant. Interpleader (Rule 22) is used by a stakeholder facing multiple claims to the same fund."}, {"cat": "Complex Litigation & Evidence", "stem": "An expert is impeached at deposition with her own prior published article. The most effective technique is to:", "opts": ["ask her to explain at length, in her own words, why her opinion has changed since the article was published", "lock in her current opinion, establish the article as hers, then read the contradicting passage", "attach the article to a motion for sanctions without asking about it", "object that the article is hearsay and refuse to use it"], "a": 1, "fb": "Advocacy: commit, credit, confront. A prior inconsistent statement by the expert can be used to impeach credibility."}, {"cat": "Complex Litigation & Evidence", "stem": "A \"meet and confer\" requirement before a discovery motion obligates counsel to:", "opts": ["meet in person with the judge in chambers to explain the dispute before any motion is filed", "agree to every extension the other side requests", "exchange all trial exhibits before filing any motion", "make a good-faith effort to resolve the dispute before involving the court"], "a": 3, "fb": "Discovery: courts may deny motions filed without a proper conferral certification, and local rules often specify the method."}, {"cat": "Restrictive Covenants & Employment", "stem": "For a non-compete to be enforceable in most states that allow them, it must:", "opts": ["be signed before a notary public and filed with the state labor agency within 30 days after the employee starts work", "protect a legitimate business interest and be reasonable in scope, geography, and duration", "apply to all employees regardless of their role or access to information", "last at least five years to give the employer meaningful protection"], "a": 1, "fb": "Restrictive covenants: legitimate interests include trade secrets, confidential information and customer goodwill. Several states, such as California, ban most employee non-competes."}, {"cat": "Restrictive Covenants & Employment", "stem": "A current employee is asked to sign a new non-compete with no raise, bonus, or promotion. The key enforceability issue is often:", "opts": ["whether the employer used the word \"shall\" in the covenant", "whether there was adequate consideration for the new restriction", "whether the agreement was printed on company letterhead", "whether the employee read and understood the agreement in his or her first language"], "a": 1, "fb": "Consideration: states differ on whether continued employment alone is enough for a mid-employment non-compete."}, {"cat": "Restrictive Covenants & Employment", "stem": "A non-compete signed by the seller of a business as part of the sale is generally:", "opts": ["enforced more readily, because it protects the goodwill the buyer paid for", "unenforceable in every state, because any covenant not to compete is an unreasonable restraint of trade", "enforceable only if the seller remains an employee", "limited by law to a maximum of six months"], "a": 0, "fb": "Sale-of-business covenants receive more favorable treatment than employee non-competes, even in states like California."}, {"cat": "Restrictive Covenants & Employment", "stem": "A court strikes the overbroad words of a non-compete and enforces what remains, without adding new words. This approach is the:", "opts": ["doctrine of laches", "red pencil doctrine", "blue pencil doctrine", "contra proferentem rule"], "a": 2, "fb": "Courts take three approaches: strict blue pencil (strike only), reformation (rewrite to a reasonable scope), and red pencil (void the whole covenant)."}, {"cat": "Restrictive Covenants & Employment", "stem": "An employment contract selects Texas law, but the employee lives and works in California. A California court will most likely:", "opts": ["apply Texas law because the parties chose it in a signed writing and both had the opportunity to negotiate", "enforce the non-compete for a maximum of two years", "transfer the case to Texas under the forum clause", "refuse to enforce the non-compete under California law and public policy"], "a": 3, "fb": "Choice of law: California Business & Professions Code § 16600 and Labor Code § 925 limit enforcement of out-of-state law and forum clauses against California employees."}, {"cat": "Restrictive Covenants & Employment", "stem": "If the employer's business is acquired in an asset sale, an employee non-compete may be unenforceable by the buyer when:", "opts": ["the agreement lacks an assignment clause and state law requires the employee's consent", "the buyer pays a higher price than the original employer did", "the agreement was signed electronically rather than on paper", "the employee continues working in the same position, with the same duties and salary, for the buyer"], "a": 0, "fb": "M&A: many states treat employee covenants as personal and require express assignability language or consent. In a stock sale, the employer entity usually remains the same."}, {"cat": "Restrictive Covenants & Employment", "stem": "To protect client relationships where broad non-competes face legal limits, the safest approach is often to rely on:", "opts": ["a clause requiring departing employees to pay all future lost profits", "narrowly tailored confidentiality and customer non-solicitation covenants", "an oral promise by the employee not to compete after leaving", "a lifetime ban on working for any business in the same industry anywhere in the world"], "a": 1, "fb": "Restrictive covenants: narrower covenants tied to protectable interests are more likely to be enforced, though some states also restrict non-solicitation clauses."}, {"cat": "Restrictive Covenants & Employment", "stem": "Under the Defend Trade Secrets Act, the plaintiff must show that it:", "opts": ["lost at least $75,000 because of the misappropriation", "told every employee in writing that all company information is a trade secret", "registered the information with the U.S. Patent and Trademark Office", "took reasonable measures to keep the information secret and it has value from being secret"], "a": 3, "fb": "DTSA: no registration is required, unlike patents and trademarks. Access controls, NDAs and marking documents support \"reasonable measures.\""}, {"cat": "Restrictive Covenants & Employment", "stem": "Under the DTSA, an employer that fails to give employees the required whistleblower immunity notice in confidentiality agreements may lose:", "opts": ["protection for its patents and trademarks", "exemplary damages and attorney's fees against that employee", "the ability to seek an injunction in state court", "all of its rights to sue that employee for trade secret misappropriation"], "a": 1, "fb": "DTSA (18 U.S.C. § 1833(b)): the notice must appear in agreements entered or updated after May 11, 2016, or a cross-reference to a policy can be used."}, {"cat": "Restrictive Covenants & Employment", "stem": "A \"survival clause\" in an executive employment agreement typically ensures that:", "opts": ["specified obligations, such as confidentiality, continue after employment ends", "the executive's estate inherits the executive's job title", "the agreement automatically renews every year unless either party gives written notice of termination", "the executive keeps receiving salary for life after termination"], "a": 0, "fb": "Drafting: identify surviving sections expressly. Confidentiality, restrictive covenants and indemnification are typical."}, {"cat": "Restrictive Covenants & Employment", "stem": "\"The relationship of the Parties is that of independent contractors, and nothing herein creates a ________.\" Choose the standard ending.", "opts": ["confidential or fiduciary trust account", "choice-of-law or forum-selection provision", "partnership, joint venture, or agency relationship", "binding obligation of any kind between the Parties or their affiliates"], "a": 2, "fb": "Boilerplate: this language helps prevent claims that one party can bind the other. It does not control worker classification if the facts show employment."}, {"cat": "Restrictive Covenants & Employment", "stem": "A \"garden leave\" clause typically requires an employee who has resigned to:", "opts": ["work only from home during the final week of employment", "stay on payroll for the notice period while not working for a competitor", "take unpaid leave to attend to personal matters for several weeks before the resignation takes effect", "forfeit all accrued vacation in exchange for a reference"], "a": 1, "fb": "Restrictive covenants: because the employee is paid, garden leave can be easier to enforce than a post-employment non-compete in some jurisdictions."}, {"cat": "Settlement, Liens & Tax", "stem": "A general release in a settlement agreement typically releases:", "opts": ["all future claims of any kind arising after the agreement is signed", "only claims listed in the complaint", "only claims the plaintiff knew about at signing", "all claims, known and unknown, up to the effective date"], "a": 3, "fb": "Releases: in California, releasing unknown claims requires waiving Civil Code § 1542. Releases generally cannot waive claims that arise after signing."}, {"cat": "Settlement, Liens & Tax", "stem": "A \"covenant not to sue\" differs from a release in that it:", "opts": ["extinguishes the claim completely as to every possible defendant, whether or not named in the agreement", "must be approved by a court before it is effective", "is a promise not to enforce a claim that technically continues to exist", "applies only to claims arising under a written contract"], "a": 2, "fb": "Settlement: covenants not to sue were historically used to settle with one tortfeasor without releasing others. Many states now address this by statute."}, {"cat": "Settlement, Liens & Tax", "stem": "Under IRC § 104(a)(2), settlement payments are generally excluded from gross income when they are received:", "opts": ["on account of personal physical injuries or physical sickness", "as back pay in an employment discrimination case", "for emotional distress without any physical injury", "as punitive damages in a physical injury case"], "a": 0, "fb": "Tax: emotional distress damages not arising from physical injury are generally taxable (except amounts for medical care), as are punitive damages and back pay."}, {"cat": "Settlement, Liens & Tax", "stem": "A settlement payment for emotional distress in an employment case, with no physical injury, is generally:", "opts": ["taxable income, often reported on Form 1099", "reportable only by the employer, never the employee", "taxable only if the amount exceeds $100,000", "tax-free because it is compensation for a loss"], "a": 0, "fb": "Tax: back pay is wages reported on a W-2; non-wage damages are commonly reported on Form 1099. Tax advice should come from a qualified professional."}, {"cat": "Settlement, Liens & Tax", "stem": "A structured settlement funded through a \"qualified assignment\" under IRC § 130 primarily benefits the injured claimant by:", "opts": ["eliminating the need to resolve medical liens", "allowing the claimant to receive the full amount immediately in cash, with no tax consequences at all", "providing periodic payments that remain tax-free for physical injury claims", "converting a taxable settlement into a charitable deduction"], "a": 2, "fb": "Structured settlements: the defendant's obligation is assigned to a company that buys an annuity. The tax benefit depends on the payments qualifying under § 104(a)(2)."}, {"cat": "Settlement, Liens & Tax", "stem": "Why must a personal injury settlement account for Medicare when the client is a Medicare beneficiary?", "opts": ["Medicare benefits end automatically after any settlement", "Medicare takes a fixed 50% share of all injury settlements", "Medicare has a statutory right to recover conditional payments for related treatment", "Medicare must review and approve every settlement amount before any of the funds can be paid out"], "a": 2, "fb": "Medicare Secondary Payer Act: failing to repay conditional payments can expose the parties and counsel to liability, including double damages. Future medical needs may also require planning."}, {"cat": "Settlement, Liens & Tax", "stem": "When negotiating an ERISA self-funded plan's reimbursement claim, counsel should consider that under Montanile, the plan:", "opts": ["can always recover from the plaintiff's general assets", "has no right to reimbursement once the case settles", "generally cannot enforce its equitable lien against settlement funds already spent on non-traceable items", "must reduce its reimbursement claim under every state's made-whole and common-fund doctrines"], "a": 2, "fb": "ERISA: self-funded plans may not be bound by state anti-subrogation laws. Montanile v. Board of Trustees (2016) limits recovery from dissipated funds, so plans act quickly to assert liens."}, {"cat": "Settlement, Liens & Tax", "stem": "A settlement payment recites that it is made \"without admission of liability.\" This means:", "opts": ["the defendant pays without conceding fault", "the payment can be reversed if new evidence appears", "the plaintiff keeps the right to sue again later", "the court has found that the defendant is not liable"], "a": 0, "fb": "Settlement: no-admission clauses are standard. FRE 408 also limits the use of settlements to prove liability."}, {"cat": "Settlement, Liens & Tax", "stem": "A settlement confidentiality clause should typically include a carve-out allowing disclosure:", "opts": ["to any person who asks about the case", "on the parties' social media accounts", "to members of the news media after a twelve-month waiting period", "as required by law, or to tax and financial advisors"], "a": 3, "fb": "Drafting: also consider carve-outs for government agencies and whistleblower protections, since some laws restrict confidentiality in certain claims (for example, sexual harassment under some state laws)."}, {"cat": "Settlement, Liens & Tax", "stem": "A personal injury settlement on behalf of a minor generally requires:", "opts": ["the minor's own notarized signature, plus one parent's consent", "only the signature of one parent", "court approval to protect the child's interests", "approval by the defendant's insurer alone"], "a": 2, "fb": "Minors' settlements: courts review fairness and often require funds to be placed in a blocked account or structured annuity until the child reaches majority."}, {"cat": "Settlement, Liens & Tax", "stem": "A \"Mary Carter\" agreement, where permitted, is one in which a settling defendant:", "opts": ["agrees to share the plaintiff's attorney's fees equally", "remains in the case and benefits if the plaintiff recovers from other defendants", "pays the plaintiff in full and is dismissed from the case with prejudice, with no further role at trial", "assigns its insurance policy to the court for distribution"], "a": 1, "fb": "Multi-party settlements: Mary Carter agreements are banned or must be disclosed in many states because they can mislead the jury."}, {"cat": "Settlement, Liens & Tax", "stem": "Which statement best describes a \"Pierringer\" release?", "opts": ["The settling defendant agrees to pay any judgment entered against the remaining defendants", "The plaintiff assigns its claims against the non-settling defendants to the settling defendants", "The plaintiff settles with all defendants and waives its right to any jury trial", "The plaintiff settles with some defendants and agrees to reduce its claim against the others by the settling defendants' share of fault"], "a": 3, "fb": "Multi-party settlements: Pierringer releases (from Wisconsin) protect settling defendants from contribution claims by non-settling defendants."}, {"cat": "Contract Interpretation & Remedies", "stem": "A court will usually order specific performance instead of money damages when:", "opts": ["the breaching party acted in bad faith", "damages are inadequate, for example for unique land or goods", "the plaintiff requests it in the complaint", "the contract price is above $75,000"], "a": 1, "fb": "Remedies: specific performance is equitable and discretionary. Courts rarely order it for personal services contracts."}, {"cat": "Contract Interpretation & Remedies", "stem": "Under U.S. contract law, a material breach generally allows the non-breaching party to:", "opts": ["recover punitive damages in addition to contract damages", "suspend its own performance and, if the breach is not cured, terminate and seek damages", "rescind the contract only after obtaining a court order first", "ignore the contract while keeping all benefits already received"], "a": 1, "fb": "Remedies: materiality depends on how much of the expected benefit is lost, the possibility of cure, and good faith. Wrongful termination can itself be a breach, so the attorney must evaluate materiality carefully."}, {"cat": "Cross-Border Translation", "stem": "The most accurate Spanish rendering of \"Supplier shall deliver the Goods\" in a contract is:", "opts": ["El Proveedor deberá entregar los Bienes.", "El Proveedor entregaría los Bienes.", "El Proveedor intentará entregar los Bienes.", "El Proveedor podrá entregar los Bienes."], "a": 0, "fb": "Translation: \"shall\" expresses an obligation, rendered as \"deberá\" or \"se obliga a\". \"Podrá\" means may; the conditional \"entregaría\" and \"intentará\" weaken the duty."}, {"cat": "Cross-Border Translation", "stem": "\"Indemnify, defend and hold harmless\" is best rendered in a Latin American commercial contract as:", "opts": ["indemnizar, defender y declarar inocente", "pagar, proteger y mantener sin daño moral", "compensar, litigar y liberar de toda culpa penal y responsabilidad administrativa", "indemnizar, defender y mantener indemne (o sacar en paz y a salvo)"], "a": 3, "fb": "Translation: \"mantener indemne\" and the Mexican formula \"sacar en paz y a salvo\" capture hold harmless. \"Defender\" carries the duty to defend; avoid criminal-law concepts like innocence or culpa penal."}, {"cat": "Cross-Border Translation", "stem": "The best Spanish equivalent of \"condition precedent\" is:", "opts": ["condición precedente judicial", "condición suspensiva", "obligación previa", "condición resolutoria"], "a": 1, "fb": "Translation: a condition precedent suspends the obligation until it occurs (condición suspensiva). A condition subsequent ends an existing obligation (condición resolutoria)."}, {"cat": "Cross-Border Translation", "stem": "The best Spanish equivalent of \"condition subsequent\" is:", "opts": ["condición suspensiva", "condición resolutoria", "condición posterior", "cláusula de terminación anticipada"], "a": 1, "fb": "Translation: when a condition subsequent occurs, an existing obligation ends, which corresponds to the civil-law \"condición resolutoria\"."}, {"cat": "Cross-Border Translation", "stem": "Translate: \"Las partes se someten irrevocablemente a la jurisdicción exclusiva de los tribunales federales de la Ciudad de México.\"", "opts": ["The Parties irrevocably waive any jurisdiction other than arbitration in Mexico City.", "The Parties may, if they wish, bring disputes before the federal courts of Mexico City.", "The Parties irrevocably submit to the exclusive jurisdiction of the federal courts of Mexico City.", "The Parties irrevocably agree that the federal laws in force in Mexico City shall govern and control this Agreement."], "a": 2, "fb": "Translation: this is a forum selection (jurisdiction) clause, not a governing-law clause. \"Exclusive\" and \"irrevocably submit\" must be preserved."}, {"cat": "Cross-Border Translation", "stem": "Translate: \"El presente contrato se regirá e interpretará de conformidad con las leyes del Estado de Nueva York.\"", "opts": ["This Agreement shall be submitted to the exclusive jurisdiction of the state and federal courts located in the State of New York.", "This Agreement shall be interpreted by a New York arbitrator chosen by both parties.", "This Agreement shall be signed and notarized in accordance with New York procedures.", "This Agreement shall be governed by and construed in accordance with the laws of the State of New York."], "a": 3, "fb": "Translation: \"se regirá e interpretará\" is the standard \"governed by and construed in accordance with\" formula for choice of law."}, {"cat": "Cross-Border Translation", "stem": "Why is \"cláusula penal\" not automatically translated as \"penalty clause\" in a U.S.-law contract?", "opts": ["U.S. courts treat any cláusula penal as a criminal fine that requires a prosecutor", "Under U.S. law, liquidated damages are only available in contracts for the sale of land", "U.S. courts do not enforce penalties, so the drafting must reflect a reasonable liquidated damages estimate", "Penalty clauses are enforceable in U.S. courts only if both contracting parties are companies organized under Latin American law"], "a": 2, "fb": "Cross-system risk: many civil-law systems enforce agreed penalties (sometimes with judicial reduction). Under U.S. common law, a clause labeled or functioning as a penalty is void, so the English text should be framed as liquidated damages."}, {"cat": "Cross-Border Translation", "stem": "The best Spanish equivalent of \"consideration\" in a U.S. contract is usually:", "opts": ["contraprestación", "consideración", "deferencia", "causa ilícita del contrato"], "a": 0, "fb": "False friend: \"consideración\" means respect or thought. \"Contraprestación\" conveys the bargained-for exchange, though civil-law \"causa\" is a different, broader concept."}, {"cat": "Cross-Border Translation", "stem": "\"Representations and warranties\" is best rendered in Spanish as:", "opts": ["declaraciones y garantías", "manifestaciones de voluntad y fianzas", "representaciones y garantías bancarias", "actuaciones y avales"], "a": 0, "fb": "Translation: \"declaraciones y garantías\" is the standard formula in Latin American M&A practice. \"Representaciones\" is a common anglicism, and \"fianzas\" or \"avales\" are suretyship concepts."}, {"cat": "Cross-Border Translation", "stem": "Translate: \"Cualquier modificación a este Contrato deberá constar por escrito y estar firmada por ambas partes.\"", "opts": ["Any changes to this Agreement should be confirmed by email between the Parties.", "Either Party may modify this Agreement by written notice signed by that Party alone.", "No amendment to this Agreement is effective unless in writing and signed by both Parties.", "This Agreement may be amended orally if both Parties later confirm it in writing."], "a": 2, "fb": "Translation: this is a no-oral-modification clause. The English must preserve both requirements: a writing and signatures of both parties."}, {"cat": "Cross-Border Translation", "stem": "Translate: \"Los derechos y recursos previstos en este Contrato son acumulativos y no excluyen ningún otro derecho previsto por la ley.\"", "opts": ["The rights in this Agreement may be exercised only once, and only after all other remedies provided by law have been exhausted.", "The rights and remedies provided in this Agreement are cumulative and not exclusive of any rights provided by law.", "The rights and remedies in this Agreement replace all rights and remedies provided by law.", "The rights and remedies in this Agreement accumulate interest under applicable law."], "a": 1, "fb": "Translation: \"acumulativos\" means cumulative, not exclusive. Watch for versions that reverse the meaning (replacing legal remedies) or confuse cumulative remedies with accrued interest."}, {"cat": "Cross-Border Translation", "stem": "Translate: \"El Comprador no podrá ceder sus derechos ni delegar sus obligaciones sin el consentimiento previo y por escrito del Vendedor.\"", "opts": ["Buyer may assign its rights and delegate its obligations to any affiliate after notifying Seller in writing of the transfer.", "Seller shall not assign its rights or delegate its obligations without Buyer's prior consent.", "Buyer shall not assign its rights or delegate its obligations without Seller's prior written consent.", "Buyer shall not transfer the Goods to any third party without Seller's prior written consent."], "a": 2, "fb": "Translation: \"ceder\" is assign (rights) and \"delegar\" is delegate (obligations). Notice-only language and reversed parties are common translation errors."}, {"cat": "Cross-Border Translation", "stem": "\"Caso fortuito o fuerza mayor\" is best rendered in a U.S.-style contract as:", "opts": ["an act of fortune", "an accidental breach", "a force majeure event", "an adverse change"], "a": 2, "fb": "Translation: U.S. contracts usually define force majeure events with a specific list. A material adverse change (MAC) clause is a different M&A concept."}, {"cat": "Cross-Border Translation", "stem": "The best English equivalent of \"apoderado\" in a corporate document is:", "opts": ["attorney-in-fact", "legal guardian", "attorney-at-law", "empowered lawyer"], "a": 0, "fb": "Translation: an attorney-in-fact acts under a power of attorney and need not be a lawyer. An attorney-at-law is a licensed lawyer."}, {"cat": "Cross-Border Translation", "stem": "Why should a Latin American \"notario público\" not be described simply as a \"notary public\" in English?", "opts": ["A U.S. notary public must be a licensed attorney in every state", "There is no difference; the terms are exact equivalents in both systems", "A Latin notario is a legal professional who drafts and authenticates instruments, unlike a U.S. notary", "A Latin notario is a judge of first instance who can decide contract disputes between the parties who appear before him"], "a": 2, "fb": "Cross-system risk: U.S. notaries mainly verify identity and signatures. Using \"notary (civil-law notario)\" or explaining the role avoids misleading clients, and \"notario\" fraud is a known problem in immigrant communities."}, {"cat": "Cross-Border Translation", "stem": "\"Escritura pública\" is best rendered in English as:", "opts": ["a government-issued certificate", "a public deed executed before a notary", "a public writing that must be filed with a court clerk", "a published newspaper notice"], "a": 1, "fb": "Translation: an escritura pública is a notarial instrument with special evidentiary value. Explaining the term is better than a literal \"pub const BATCH_SIZE = 50;

// Exam length, chosen on the entry screen: 1, 2 or 3 batches of 50.
// "one" and "two" draw their questions evenly from every topic; "full" is every question.
// A Proficiency Report is issued for a pass (75%+) on any length.
const LENGTH_OPTIONS = [
  { key: "one",  batches: 1, name: "One batch" },
  { key: "two",  batches: 2, name: "Two batches" },
  { key: "full", batches: Math.ceil(ALL_QUESTIONS.length / BATCH_SIZE), name: "Full exam" }
];
function lengthInfo(key){ return LENGTH_OPTIONS.find(o => o.key === key) || LENGTH_OPTIONS[LENGTH_OPTIONS.length - 1]; }
function lengthSize(key){ return Math.min(lengthInfo(key).batches * BATCH_SIZE, ALL_QUESTIONS.length); }
let MODE = "full";
let PICKED = null; // indices into ALL_QUESTIONS for a one- or two-batch exam
let QUESTIONS = ALL_QUESTIONS;
let TOTAL = QUESTIONS.length;
let NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

function pickBalanced(size){
  const byCat = new Map();
  ALL_QUESTIONS.forEach((q, i) => { if(!byCat.has(q.cat)) byCat.set(q.cat, []); byCat.get(q.cat).push(i); });
  const cats = Array.from(byCat.keys());
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const quota = new Map(cats.map(c => [c, 0]));
  let left = size;
  // Deal one question per topic per round, so every topic is covered as evenly as its pool allows.
  while(left > 0){
    let gave = false;
    for(const c of shuffle(cats.slice())){
      if(left > 0 && quota.get(c) < byCat.get(c).length){ quota.set(c, quota.get(c) + 1); left--; gave = true; }
    }
    if(!gave) break;
  }
  const out = [];
  cats.forEach(c => { out.push(...shuffle(byCat.get(c).slice()).slice(0, quota.get(c))); });
  return out.sort((a, b) => a - b); // same topic order as the Full exam
}
function applyMode(mode, picked){
  const key = lengthInfo(mode).key;
  const size = lengthSize(key);
  if(key !== "full" && size < ALL_QUESTIONS.length){
    MODE = key;
    const ok = Array.isArray(picked) && picked.length === size && new Set(picked).size === size && picked.every(i => Number.isInteger(i) && i >= 0 && i < ALL_QUESTIONS.length);
    PICKED = ok ? picked : pickBalanced(size);
    QUESTIONS = PICKED.map(i => ALL_QUESTIONS[i]);
  } else {
    MODE = "full"; PICKED = null; QUESTIONS = ALL_QUESTIONS;
  }
  TOTAL = QUESTIONS.length;
  NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);
  state.answers = new Array(TOTAL).fill(null);
  state.mode = MODE;
  state.picked = PICKED;
}
function lengthLabel(){ return lengthInfo(MODE).name + " (" + TOTAL + " questions)"; }

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
  mode: "full",
  picked: null,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function fmtPct(x){
  let v = Math.round(x*1000)/10;
  if(x < PASS_THRESHOLD && v >= PASS_THRESHOLD*100) v = Math.round(PASS_THRESHOLD*1000 - 1)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}
function totalScore(){ return scoreBetween(0, TOTAL); }

const LOGO_URL = "https://ingleslegal-hub.github.io/ingleslegal-exam/vocabulary/logo.png";

const BRANCH_OPTIONS = ["Civil", "Commercial", "Criminal", "Family", "International", "Immigration", "Labor", "Personal Injury"];
const OTHER_BRANCH = "Others";
const LEVEL_OPTIONS = ["A1", "A2", "B1", "B2", "C1", "C2"];
function lengthHint(key){
  if(!key) return "";
  const n = lengthSize(key), b = lengthInfo(key).batches, pass = Math.round(PASS_THRESHOLD*100);
  if(key === "full") return "All " + n + " questions in " + b + " batches of " + BATCH_SIZE + ". Pass at " + pass + "% to receive your Proficiency Report.";
  return n + " questions drawn evenly from every topic, in " + (b === 1 ? "one sitting" : b + " batches of " + BATCH_SIZE) + ". Pass at " + pass + "% to receive your Proficiency Report.";
}
function branchOfLaw(){
  const c = state.candidate || {};
  if(c.branch === OTHER_BRANCH) return "Other: " + (c.branchOther || "");
  return c.branch || "";
}
function profileFields(){
  const c = state.candidate || {};
  return { legalEnglishUse: c.usage || "", branchOfLaw: branchOfLaw(), englishLevel: c.englishLevel || "" };
}

  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    const opts = list => list.map(v => `<option value="${v}">${v}</option>`).join("");
    card.innerHTML = `
      <div class="entry-logo"><img src="${LOGO_URL}" alt="Ingles Legal"></div>
      <form class="entry-card" id="entryForm" novalidate>
        <div class="entry-eyebrow">Free &middot; No cost to try</div>
        <h1>${TIER_LABEL} Proficiency Exam</h1>

        <label class="first" for="inLength">Select length:</label>
        <select id="inLength"><option value="">-- Choose length --</option>${LENGTH_OPTIONS.map(o => `<option value="${o.key}">${o.name}: ${lengthSize(o.key)} questions</option>`).join("")}</select>
        <div class="entry-hint" id="lengthHint"></div>

        <label for="inUsage">How often do you use legal English in your current role?</label>
        <select id="inUsage"><option value="">-- Choose an answer --</option>${opts(USAGE_OPTIONS)}</select>

        <label for="inBranch">What branch of law are you interested in?</label>
        <select id="inBranch"><option value="">-- Choose a branch --</option>${opts(BRANCH_OPTIONS)}<option value="${OTHER_BRANCH}">Others</option></select>
        <input type="text" id="inBranchOther" placeholder="Tell us which branch" maxlength="80" style="display:none">

        <label for="inLevel">What is your level of English?</label>
        <select id="inLevel"><option value="">-- Choose your level --</option>${opts(LEVEL_OPTIONS)}</select>

        <label for="inName">Your name:</label>
        <input type="text" id="inName" placeholder="Enter your name" autocomplete="name">

        <label for="inEmail">Your email:</label>
        <input type="email" id="inEmail" placeholder="Enter your email" autocomplete="email">

        <div class="entry-error" id="entryError" role="alert"></div>
        <button type="submit" class="entry-btn">Start Exam</button>
        <div class="entry-note">Your email is used only to send you your results and feedback.</div>
      </form>
    `;
    const c = state.candidate || {};
    [["inUsage","usage"],["inBranch","branch"],["inBranchOther","branchOther"],["inLevel","englishLevel"],["inName","name"],["inEmail","email"]]
      .forEach(([id,k]) => { if(c[k]) document.getElementById(id).value = c[k]; });
    const branchSel = document.getElementById("inBranch"), otherBox = document.getElementById("inBranchOther");
    const syncOther = () => { otherBox.style.display = branchSel.value === OTHER_BRANCH ? "block" : "none"; };
    branchSel.addEventListener("change", () => { syncOther(); if(branchSel.value === OTHER_BRANCH) otherBox.focus(); });
    syncOther();
    const lenSel = document.getElementById("inLength");
    const pre = new URLSearchParams(location.search).get("length");
    if(LENGTH_OPTIONS.some(o => o.key === pre)) lenSel.value = pre;
    const showLengthHint = () => { document.getElementById("lengthHint").textContent = lengthHint(lenSel.value); };
    lenSel.addEventListener("change", showLengthHint);
    showLengthHint();
    document.getElementById("entryForm").addEventListener("submit", beginExam);
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round(((i+1)/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const lastInBatch = (i+1) % BATCH_SIZE === 0 || i+1 === TOTAL;
    const canBack = i % BATCH_SIZE !== 0; // a finished batch has already been reported, so no going back past it
    const nextLabel = lastInBatch ? (i+1 === TOTAL ? "Finish &rarr;" : "Finish batch &rarr;") : "Next &rarr;";

    card.innerHTML = `
      <div class="vq-head"><span class="vq-count">Question ${i+1} of ${TOTAL}</span><span class="vq-cat">${q.cat}</span></div>
      <div class="stem${q.stem.length > 190 ? " long" : ""}">${q.stem}</div>
      <div id="optsHolder"></div>
      <div class="navrow"><button class="btn prev" onclick="goBack()" ${canBack ? "" : "disabled"}>&larr; Previous</button><button class="btn gold next" id="nextBtn" onclick="advance()" ${given === null ? "disabled" : ""}>${nextLabel}</button></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(idx === given) cls += " selected";
      btn.className = cls;
      btn.innerHTML = opt;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${fmtPct(s/(be-bs))}</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed${MODE !== "full" ? " &middot; " + lengthInfo(MODE).name : ""}</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${fmtPct(pct)}</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${fmtPct(pct)}${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}${passed ? "" : " " + shortBy(score, completed)}</div>
      </div>
      ${topicHTML(completed)}
      ${certCardForExam(completed, partial, passed, score, pct)}
      ${nextStepHTML(completed, passed)}
      ${discountHTML()}
      ${shareHTML(fmtPct(pct))}
      ${reviewHTML(completed)}
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function shortBy(score, completed){
  const need = Math.ceil(PASS_THRESHOLD*completed - 1e-9) - score;
  return need > 0 ? "You were " + need + " correct answer" + (need === 1 ? "" : "s") + " short of passing." : "";
}
function topicStats(completed){
  const map = {}; const order = [];
  for(let i=0;i<completed;i++){
    const c = QUESTIONS[i].cat;
    if(!map[c]){ map[c] = {cat:c, right:0, total:0}; order.push(c); }
    map[c].total++; if(state.answers[i] === QUESTIONS[i].a) map[c].right++;
  }
  return order.map(c => map[c]);
}
function topicHTML(completed){
  const rows = topicStats(completed).map(t => {
    const p = t.right / t.total;
    return `<tr><td>${t.cat}</td><td>${t.right} / ${t.total}</td><td>${fmtPct(p)}</td><td class="bartd"><div class="bar ${p < PASS_THRESHOLD ? "low" : ""}"><span style="width:${Math.round(p*100)}%"></span></div></td></tr>`;
  }).join("");
  return `<h2 style="margin-top:26px">Score by topic</h2><table class="results topics"><tr><th>Topic</th><th>Score</th><th>%</th><th></th></tr>${rows}</table>`;
}
const DISCOUNT_CODE = "EXAM15";

function copyText(text, btn, label){
  const done = () => { if(!btn) return; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1800); };
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
}

function inviteText(){ return "I just took the free " + EXAM_NAME + " from Ingles Legal and thought you might want to try it: " + EXAM_URL; }
