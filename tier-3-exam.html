<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================

const TIER_LABEL = "Tier 3";
const PASS_THRESHOLD = 0.85; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = ""; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Legal Software", "stem": "A duplicate-matter or duplicate-party detection routine protects the firm mainly by:", "opts": ["hiding data from staff", "slowing intake", "preventing conflicting records, fee leakage, and missed conflicts caused by fragmented data", "increasing storage use"], "a": 2, "fb": "Deduplication keeps a single source of truth per client/matter, preserving conflict-check integrity and preventing split histories that hide risk."}, {"cat": "General", "stem": "Complete the following drafting standard: \"To prevent a counterparty from asserting that an oral promise extended a contract deadline, the agreement must feature a strict _________ clause.\"", "opts": ["integration / no-oral-waiver", "choice of law", "severability", "force majeure"], "a": 2, "fb": "Risk Shielding: Combining an Integration Clause with a No-Oral-Waiver boilerplate seals the contract boundaries, forcing all extensions or changes into a signed written document."}, {"cat": "Legal English", "stem": "In pleadings, the Latin phrase 'inter alia' signals that the list that follows is:", "opts": ["void for vagueness", "in strict order of priority", "among other things (non-exhaustive)", "exclusive and complete"], "a": 2, "fb": "'Inter alia' = 'among other things', preserving flexibility so the pleader is not bound to an exhaustive list."}, {"cat": "Legal English", "stem": "A court applies 'contra proferentem'. In drafting terms, this means an ambiguous clause will be construed:", "opts": ["in favor of the drafter", "as void", "in favor of the government", "against the party that drafted it"], "a": 3, "fb": "'Contra proferentem' resolves genuine ambiguity against the drafter — a reason sophisticated drafters eliminate ambiguity rather than rely on it."}, {"cat": "General", "stem": "From a licensee's perspective, an uncapped indemnity for 'any and all claims' is dangerous chiefly because it:", "opts": ["only covers the licensor's employees", "limits recovery to fees paid", "is unenforceable everywhere", "can exceed the contract's value and includes claims unrelated to the licensee's fault"], "a": 3, "fb": "Uncapped, fault-agnostic indemnities create potentially unlimited exposure. Sophisticated counsel negotiate a cap, a fault trigger ('to the extent caused by'), and carve-outs."}, {"cat": "General", "stem": "To defeat summary judgment, an expert declaration must:", "opts": ["merely state the expert's belief", "be admissible under Rule 702/Daubert and set forth facts, not conclusory ipse dixit", "be notarized abroad", "exceed 50 pages"], "a": 1, "fb": "A conclusory or unreliable expert opinion ('because I say so') cannot create a triable issue; the declaration must satisfy Daubert reliability and be based on sufficient facts/data."}, {"cat": "General", "stem": "When drafting an advanced Indemnification Clause, what is the critical risk of utilizing the phrase \"indemnify and defend\" compared to just \"indemnify\"?", "opts": ["It automatically limits the financial recovery limits to a flat $5,000 cap.", "It transfers the civil docket files to a federal bankruptcy channel line.", "It increases the physical storage size of the document metadata.", "It contractually obligates the indemnitor to immediately hire lawyers and pay for the ongoing litigation costs from the onset of a claim."], "a": 3, "fb": "Partner Inspection: The duty to \"defend\" is broader than the duty to indemnify. It triggers immediate out-of-pocket litigation expense obligations long before a final judgment establishes fault."}, {"cat": "Legal Software", "stem": "Storing a clause library with approved, version-controlled language supports quality because drafters:", "opts": ["assemble documents from vetted clauses instead of copying from random prior files", "write every clause from scratch", "skip legal review", "use only external forms"], "a": 0, "fb": "A governed clause library ensures consistent, current, approved language and prevents propagation of errors from ad-hoc copy-paste sourcing."}, {"cat": "General", "stem": "Complete the following drafting standard: \"To prevent a client's proprietary software design from leaking after a joint venture fails, the contract must feature a strict _________ clause.\"", "opts": ["severability", "force majeure", "choice of law", "non-disclosure / confidentiality"], "a": 3, "fb": "Risk Shielding: A robust \"Confidentiality Clause\" must feature explicit definition parameters detailing what constitutes proprietary data, backed by immediate injunctive relief rights."}, {"cat": "Legal Software", "stem": "When an automation depends on a field that staff sometimes leave blank, the most robust fix is to:", "opts": ["remove the automation", "make the field required and add a default/validation rule at the point of entry", "email reminders after the fact", "hope staff remember"], "a": 1, "fb": "Preventing bad data at the source (required + validated fields) is more reliable than downstream correction, which depends on human follow-through."}, {"cat": "General", "stem": "A 'renewed' motion for judgment as a matter of law under Rule 50(b) requires that the movant:", "opts": ["only objected to jury instructions", "first moved under Rule 50(a) before the case was submitted to the jury", "never raised the issue", "filed after appeal"], "a": 1, "fb": "Rule 50(b) is a 'renewal'; failing to move under 50(a) before submission forfeits the ability to seek JMOL after the verdict (limiting review to plain error)."}, {"cat": "General", "stem": "Review this draft text: \"The headings in this Agreement are for convenience of reference only and shall not affect its interpretation.\" What is the operational function of this boilerplate?", "opts": ["It guarantees that the bold titles of sections cannot be used by a judge to distort or alter the legal meaning of the actual contractual prose below them.", "It calculates separate billing invoices for independent remote timekeepers.", "It automatically changes the user profile permissions assigned to remote case assistants.", "It prevents formatting distortion during electronic court filings before a clerk."], "a": 0, "fb": "Linguistic Precision: A \"Headings Clause\" (cláusula de epígrafes o títulos) isolates formatting layout from substance, protecting contract architecture from accidental interpretive twists."}, {"cat": "General", "stem": "Under FRCP 56, summary judgment is granted when:", "opts": ["there is no genuine dispute of material fact and the movant is entitled to judgment as a matter of law", "one party files first", "the judge prefers one side", "the case is old"], "a": 0, "fb": "Rule 56(a) sets the 'no genuine dispute of material fact / entitled to judgment as a matter of law' standard — the foundational summary-judgment test."}, {"cat": "Legal English", "stem": "An indemnity says the indemnitor will cover 'all claims arising out of or relating to' the services. From the indemnitor's perspective, the phrase 'or relating to' is dangerous because it:", "opts": ["limits indemnity to the drafter", "has no legal effect", "narrows indemnity to direct claims only", "broadens the causal nexus well beyond direct causation, expanding exposure"], "a": 3, "fb": "'Relating to' captures attenuated connections, dramatically widening the trigger. A cautious indemnitor negotiates for 'arising out of' (direct causation) alone."}, {"cat": "Legal English", "stem": "Complete: 'The Agreement shall ____ into effect upon execution by both parties.'", "opts": ["get", "fall", "come", "turn"], "a": 2, "fb": "'Come into effect' (or 'take effect') is standard; the other verbs are not idiomatic in this legal construction."}, {"cat": "Legal English", "stem": "In a statement of facts, which choice maintains a credible, non-argumentative tone while still favoring the client?", "opts": ["The reckless defendant obviously wanted to cause harm.", "The clearly guilty defendant lied.", "The defendant did not activate the brakes before impact.", "The evil defendant ignored everyone."], "a": 2, "fb": "Effective fact sections persuade through concrete, verifiable detail rather than adjectives and conclusions, which invite objection and erode credibility."}, {"cat": "Legal Software", "stem": "An 'audit trail' in a matter-management system is valuable because it:", "opts": ["records who changed what and when, supporting accountability and defensibility", "hides user activity", "speeds up the internet", "formats pleadings"], "a": 0, "fb": "Immutable audit logs establish a defensible record of data entry and edits—critical for supervising offshore teams and for e-discovery defensibility."}, {"cat": "General", "stem": "At a deposition, an attorney may instruct a witness NOT to answer only to:", "opts": ["preserve a privilege, enforce a court limitation, or present a motion under Rule 30(d)(3)", "coach the witness", "waste time", "avoid embarrassing answers"], "a": 0, "fb": "FRCP 30(c)(2) narrowly limits 'do not answer' instructions to privilege, a court-ordered limitation, or to move to terminate for bad-faith/harassing examination."}, {"cat": "Legal English", "stem": "Which phrase best avoids the 'dangling' risk in: 'Provided that notice is given, the party may terminate'? To make the notice a strict condition, use:", "opts": ["Notice being nice, termination follows.", "The party can terminate whenever, with notice maybe.", "The party may terminate; notice is optional.", "Termination is effective only if the terminating party first gives 30 days' written notice."], "a": 3, "fb": "Recasting as 'effective only if' converts vague conditional language into an unambiguous condition precedent to the termination right."}, {"cat": "General", "stem": "Complete the following drafting rule concept: \"To prevent a counterparty from suing in a distant state based on convenience factors, the forum selection clause must be drafted as _________ rather than permissive.\"", "opts": ["mandatory", "conditional", "administrative", "alternative"], "a": 0, "fb": "Risk Shielding: Permissive clauses say \"parties may sue in New York.\" To lock down venue security, the text must be mandatory (e.g., \"jurisdiction shall be exclusive in New York\"), blocking forum-shopping."}, {"cat": "Legal English", "stem": "Which sentence best uses parallel structure to strengthen a conclusion?", "opts": ["The statute is clear, the record is undisputed, and the law is settled.", "The statute is clear, and there was a record, plus settled things about law.", "The statute; record; and settledness of law.", "Clearly the statute, undisputed record, and law being settled."], "a": 0, "fb": "Parallel triads ('X is clear, Y is undisputed, Z is settled') create rhythm and force; broken parallelism dilutes persuasive impact."}, {"cat": "Legal Software", "stem": "Under FRCP 37(e), sanctions for lost ESI depend on whether:", "opts": ["the client is wealthy", "reasonable steps to preserve were taken and whether the loss caused prejudice or was intended to deprive", "the file was large", "the case is old"], "a": 1, "fb": "Rule 37(e) focuses on failure to take reasonable preservation steps; the most severe sanctions (adverse inference, dismissal) require a finding of intent to deprive."}, {"cat": "General", "stem": "Translate and bridge the contract mechanics phrase \"Condition Precedent\" into the structural understanding of a civil law professional:", "opts": ["Recurso de reposición contractual; la solicitud presentada ante un árbitro para corregir errores ortográficos.", "Amortización preferente por mora; la liquidación de aranceles bancarios visada por un comisionado mercantil.", "Condición suspensiva / precedente; an explicit event or act that must occur or be performed before a party's contractual duty to perform becomes legally binding.", "Cláusula resolutoria expresa; la disposición que rescinde automáticamente el contrato ante un evento futuro e incierto."], "a": 2, "fb": "The Bridge Methodology: A Condition Precedent freezes contract obligations until the trigger event occurs (e.g., securing bank financing). Support assets must track these triggers to monitor compliance status."}, {"cat": "Legal Software", "stem": "After a court issues a new scheduling order, the correct system procedure is to:", "opts": ["manually change one date and ignore the rest", "update the trigger/anchor dates so the rules engine recalculates all dependent deadlines, then verify", "delete the old matter", "wait until the next deadline"], "a": 1, "fb": "Dependent deadlines cascade from anchors; updating the anchor and letting the engine recompute (then verifying) prevents orphaned or stale dates after a schedule change."}, {"cat": "Legal English", "stem": "Which construction correctly grants a permission while reserving discretion to the grantor?", "opts": ["Licensor is required to permit...", "Licensor must permit...", "Licensor may, in its sole discretion, permit...", "Licensor shall permit..."], "a": 2, "fb": "'May, in its sole discretion' preserves the grantor's freedom to refuse; 'shall/must/required' convert the permission into an obligation."}, {"cat": "Labor", "stem": "Under the FTC's evolving stance and many state laws, the safest strategy to protect client relationships without a broad non-compete is to rely on:", "opts": ["narrowly tailored confidentiality and customer non-solicitation covenants tied to actual relationships", "a penalty clause", "an oral understanding", "a nationwide lifetime non-compete"], "a": 0, "fb": "With non-competes under increasing federal and state scrutiny, protectable interests are better secured through targeted NDAs and non-solicits limited to customers the employee actually served."}, {"cat": "General", "stem": "An 'entire agreement' (integration) clause paired with a 'no oral modification' clause is designed to:", "opts": ["allow informal changes", "bar reliance on side agreements and require amendments to be in a signed writing", "void the contract", "waive all warranties"], "a": 1, "fb": "Together they invoke the parol evidence rule and channel changes into signed writings, reducing disputes over alleged oral promises or modifications."}, {"cat": "Legal Software", "stem": "A 'merge field' in a document template is:", "opts": ["a placeholder that is replaced with matter-specific data when the document is generated", "a signature line", "a billing code", "a page break"], "a": 0, "fb": "Merge fields pull structured data (client name, dates, amounts) into the template, ensuring the generated document reflects the record of truth."}, {"cat": "General", "stem": "Review this draft text: \"This Agreement may be executed in counterparts, each of which shall be deemed an original, but all of which together shall constitute one and the same instrument.\" What is the operational function of this text?", "opts": ["It blocks the automated e-signature integrations from connecting to the main platform.", "It forces the billing system to calculate separate invoices for remote timekeepers.", "It permits the parties to execute the contract by signing separate physical pages independently, combining them to form a legally binding unified instrument.", "It automatically deletes duplicate contact files stored within the main server network partition."], "a": 2, "fb": "Operational Workflow: The \"Counterparts Clause\" (cláusula de ejemplares/duplicados) is essential for cross-border transactions, enabling fast closing cycles without requiring physical presence at a single table."}, {"cat": "General", "stem": "An attorney asks you to audit a Limitation of Liability clause. Which phrase is mandatory to protect a software client from catastrophic, unpredictable financial claims?", "opts": ["\"In no event shall either party be liable for any consequential, incidental, indirect, or special damages.\"", "\"The company shall pay for all standard internet connection fees.\"", "\"Filing fees must be balanced using an automated escrow system ledger.\"", "\"The parties agree to change the user profile permissions every calendar month.\""], "a": 0, "fb": "Risk Shielding: Waiving Consequential Damages (daños consecuenciales) protects the developer from exponential liability (e.g., a software bug causing a business shutdown), capping risk to direct damages."}, {"cat": "Legal Software", "stem": "In practice-management platforms like Clio or Litify, a 'workflow' (or task chain) is best described as:", "opts": ["a single email template", "a client login page", "a predefined sequence of tasks/steps auto-generated when a matter reaches a stage", "a billing report"], "a": 2, "fb": "Workflows/task chains standardize repeatable processes (e.g., new-PI-matter checklist), reducing missed steps and supervision gaps across a team."}, {"cat": "Legal Software", "stem": "A 'template' matter type in a case-management system is used to:", "opts": ["replace the attorney", "pre-load the standard tasks, deadlines, and fields for a given case type on opening", "store client passwords", "generate invoices only"], "a": 1, "fb": "Matter templates instantiate the correct workflow, custom fields, and checklist for each practice area, ensuring consistency from the moment a file opens."}, {"cat": "Legal English", "stem": "A contract provides that if one clause is held unenforceable, the remainder stays in force. If the parties also want a court to narrow an overbroad term rather than void it, they should add:", "opts": ["a liquidated damages clause", "a reformation ('blue pencil') savings provision", "an arbitration clause", "a force majeure clause"], "a": 1, "fb": "A severability clause preserves remaining terms; adding a reformation/blue-pencil provision authorizes the court to modify (narrow) an overbroad term instead of striking it entirely."}, {"cat": "Legal English", "stem": "Which pair correctly distinguishes a condition precedent from a covenant?", "opts": ["both signal obligations equally", "'if and only if' signals a condition; 'shall' signals a covenant", "'shall' signals a condition; 'may' signals a covenant", "neither affects enforceability"], "a": 1, "fb": "Conditional language ('if', 'provided that', 'subject to') creates a condition precedent whose non-occurrence excuses performance; 'shall' creates a promise (covenant) whose breach gives rise to damages."}, {"cat": "Legal Software", "stem": "A periodic 'data hygiene' report that flags matters missing an SOL date or responsible attorney functions as a:", "opts": ["client newsletter", "marketing tool", "detective control that catches gaps before they cause harm", "billing summary"], "a": 2, "fb": "Exception reporting is a detective control; routinely surfacing incomplete critical fields lets supervisors remediate risk proactively."}, {"cat": "General", "stem": "A Daubert challenge to methodology is strongest when the expert:", "opts": ["charges high fees", "testifies frequently", "cannot show the technique is testable, peer-reviewed, has known error rates, or is generally accepted", "has fewer degrees than opposing expert"], "a": 2, "fb": "The Daubert factors (testability, peer review, error rate, general acceptance) target methodology reliability under Rule 702—not the expert's fees or popularity."}, {"cat": "General", "stem": "Under Section 2-316 of the Uniform Commercial Code (UCC), what is required to legally disclaim the Implied Warranty of Merchantability?", "opts": ["The disclaimer must be written in handwriting by a corporate secretary.", "The disclaimer must mention \"merchantability\" and, if in writing, must be highly conspicuous (e.g., capitalized or bolded).", "The text must be reviewed and approved by a federal trade commissioner.", "The data fields must be locked inside an offline practice management system."], "a": 1, "fb": "Strategic Drafting: To exclude the Implied Warranty of Merchantability under the UCC, boilerplate text must be conspicuous (conspicua/visible). Hidden or standard text results in an invalid disclaimer, leaving the client exposed to product liability."}, {"cat": "Legal English", "stem": "In a master services agreement, which word imposes a mandatory, enforceable obligation on a party rather than a mere expectation?", "opts": ["might", "shall", "should", "may"], "a": 1, "fb": "'Shall' creates a binding duty; 'should' is precatory (advisory) and 'may' is permissive. Spanish speakers often map 'debería' to 'should', weakening an obligation that the drafter intended to be mandatory."}, {"cat": "General", "stem": "A motion in limine is best used to:", "opts": ["compel discovery", "amend the complaint", "obtain a pretrial ruling excluding specific prejudicial or inadmissible evidence", "resolve the entire case"], "a": 2, "fb": "Motions in limine shape the evidentiary landscape before trial, commonly invoking FRE 402/403 to exclude irrelevant or unfairly prejudicial evidence."}, {"cat": "Legal Software", "stem": "An advanced conditional-logic template (e.g., include an arbitration clause only for commercial clients) reduces risk but introduces the need to:", "opts": ["print more copies", "disable review", "remove all clauses", "test each logic branch, since an untested condition can silently omit or insert the wrong clause"], "a": 3, "fb": "Conditional automation multiplies the paths a document can take; each branch must be QA-tested because a mis-scoped condition can insert or drop a material clause without obvious signs."}, {"cat": "General", "stem": "A brief opposing summary judgment should marshal evidence by:", "opts": ["attaching unsworn statements", "referring generally to 'the whole file'", "citing the specific record materials (depo pages, exhibits) that create each disputed fact", "relying on the complaint's allegations"], "a": 2, "fb": "Rule 56(c)(1) requires citation to particular parts of the record; general references or unsworn/inadmissible materials will not defeat the motion."}, {"cat": "General", "stem": "The tactical purpose of a 'closing the doors' sequence on cross-examination is to:", "opts": ["eliminate the witness's escape routes before confronting them with the key contradiction", "confuse the jury", "waste the clock", "flatter the witness"], "a": 0, "fb": "'Closing the doors' commits the witness to positions that foreclose explanations, so the ultimate impeaching fact lands without a ready excuse—an advanced cross technique."}, {"cat": "General", "stem": "You are reviewing a commercial lease. The clause states: \"Time is of the essence with respect to all dates and timelines defined herein.\" What does this advanced chunk legally execute?", "opts": ["It changes the server synchronization frequency parameters inside Clio Manage.", "It converts any minor delay in performance into a material breach, authorizing immediate contract termination by the non-breaching party.", "It moves the case file tracking category from a lead to an open matter screen.", "It grants the tenant an automatic 30-day extension to pay monthly rent."], "a": 1, "fb": "Risk Shielding: A \"Time is of the Essence\" clause (el plazo es un elemento esencial) removes the common law grace period for performance, making delivery dates absolute drop-dead milestones."}, {"cat": "General", "stem": "Review this draft text: \"This Agreement shall be executed in the English language, which language shall be controlling in all respects.\" What is the critical objective of this boilerplate?", "opts": ["It establishes a single controlling language framework, preventing cross-border interpretation conflicts if the document is translated into Spanish.", "It forces the billing system to calculate separate invoices for remote timekeepers.", "It automatically deletes duplicate contact files stored within the main server network partition.", "It blocks the automated e-signature integrations from connecting to the platform."], "a": 0, "fb": "Risk Shielding: A \"Controlling Language Clause\" eliminates ambiguity. Translations often fail to capture common law nuances; a controlling clause locks interpretation strictly to the English text."}, {"cat": "Labor", "stem": "Under U.S. contract law, what does a \"Material Breach\" clause authorize the non-breaching party to execute?", "opts": ["Immediately suspend their own performance, terminate the agreement, and pursue full remedies for breach of contract.", "Automatically double the financial value of prospective expectation damages without a judge's review.", "Delete the active matter database profile screen from the practice software platform workspace.", "File an automatic petition for a Writ of Certiorari before a federal circuit panel division."], "a": 0, "fb": "Linguistic Precision: Defining what constitutes a Material Breach (incumplimiento esencial) clarifies the path to termination, preventing the client from being sued for wrongful termination."}, {"cat": "Labor", "stem": "A choice-of-law clause selecting a covenant-friendly state may be disregarded where:", "opts": ["the employer prefers it", "the employee works in a state with a strong public policy against non-competes and a material connection there", "the parties initialed it", "the contract is long"], "a": 1, "fb": "Courts may refuse to apply chosen law that offends the forum state's fundamental public policy (e.g., California's near-total ban under Bus. & Prof. Code §16600)."}, {"cat": "Legal Software", "stem": "A well-designed intake-to-matter automation should include a validation rule that:", "opts": ["sends the file to the client", "auto-approves every intake", "prevents advancing a stage until required fields (e.g., SOL date, case type) are completed", "deletes incomplete records"], "a": 2, "fb": "Required-field gating enforces data completeness at the source, closing the 'supervision gap' where missing SOL dates or misclassified case types cause downstream harm."}, {"cat": "General", "stem": "Review this clause draft: \"If any provision of this Agreement is held to be invalid or unenforceable, the remaining provisions shall continue in full force and effect.\" Identify the exact technical designation:", "opts": ["Choice of Forum Provision", "Force Majeure Mandate", "Severability / Savings Clause", "Indemnification Clause"], "a": 2, "fb": "Linguistic Precision: A Severability Clause (cláusula de divisibilidad/salvaguarda) isolates invalid or illegal provisions, preventing a single flawed line from invalidating the entire multi-million dollar agreement."}, {"cat": "Legal Software", "stem": "De-duplication and email 'threading' in a review platform primarily:", "opts": ["file documents with the court", "cut review volume and cost by grouping duplicates and conversations", "encrypt files", "delete evidence"], "a": 1, "fb": "Dedup and threading reduce redundant review of identical or nested messages, lowering cost and improving consistency without discarding unique content."}, {"cat": "Labor", "stem": "What occurs under a \"Survival Clause\" inside an executive corporate employment agreement?", "opts": ["Designated provisions (such as confidentiality, non-compete, and indemnification obligations) remain legally binding even after the main contract terminates.", "The employee receives a continuous life insurance allocation funded by the firm.", "The platform automatically updates the user access logs to clear outstanding metadata.", "The contract automatically converts an independent contractor into an at-will employee."], "a": 0, "fb": "Risk Shielding: Without a Survival Clause (cláusula de supervivencia), core data protection and non-compete restrictions can expire the moment the contract lifecycle concludes."}, {"cat": "Legal Software", "stem": "A 'status trigger' that auto-generates a demand-letter task when a PI matter reaches 'Treatment Complete' primarily improves:", "opts": ["the court's calendar", "the client's diagnosis", "cycle-time consistency and reduces reliance on individual memory", "the font of the letter"], "a": 2, "fb": "Stage-based triggers standardize when key work products are produced, improving throughput and reducing variance among team members handling similar matters."}, {"cat": "Legal Software", "stem": "A 'human-in-the-loop' checkpoint should be inserted into an otherwise automated workflow specifically at:", "opts": ["high-risk decisions requiring legal judgment (e.g., approving a demand amount or filing)", "no steps", "the login screen", "every trivial step"], "a": 0, "fb": "Automation should accelerate low-judgment steps but require human review at points of legal significance, balancing efficiency against the risk of unsupervised error."}, {"cat": "Legal English", "stem": "A draft uses 'to assist to the hearing' meaning to attend. The correct verb ('asistir a') is:", "opts": ["to aid", "to assist", "to help", "to attend"], "a": 3, "fb": "Spanish 'asistir a' = to attend. English 'assist' = to help. Writing 'assist to the hearing' is a false-friend error signaling non-native drafting to a supervising attorney."}, {"cat": "Labor", "stem": "An 'assignment' of a non-compete to an acquiring company may fail where:", "opts": ["the covenant lacks assignability language and state law bars assignment without employee consent", "the buyer is larger", "the covenant is short", "the employee got a raise"], "a": 0, "fb": "Some states hold personal-services non-competes non-assignable absent express language and/or consent; buyers in M&A diligence must confirm covenants are assignable."}, {"cat": "Legal Software", "stem": "To defensibly supervise an offshore team's data entry, the strongest systemic control is:", "opts": ["trusting self-reported accuracy", "disabling the audit log", "monthly verbal check-ins only", "mandatory validation rules plus periodic audit-log review and exception reports"], "a": 3, "fb": "Combining preventive controls (required fields, format validation) with detective controls (audit-log/exception review) directly addresses the 'supervision gap' the InglésLegal B2B thesis targets."}, {"cat": "Immigration", "stem": "A 'most favored nations' pricing clause obligates a vendor to:", "opts": ["extend to this customer any better price/terms it later gives comparable customers", "provide free upgrades", "match a competitor's product", "raise prices annually"], "a": 0, "fb": "An MFN clause guarantees the beneficiary the best terms offered to similarly situated customers; drafting must define comparators and audit rights to be enforceable."}, {"cat": "General", "stem": "The Twombly/Iqbal 'plausibility' standard means a complaint must:", "opts": ["plead factual content allowing a reasonable inference of liability, beyond mere labels and conclusions", "attach all evidence", "use specific magic words", "prove the case at the pleading stage"], "a": 0, "fb": "Post-Iqbal, courts disregard conclusory allegations and ask whether the well-pleaded facts plausibly (not just possibly) state a claim."}, {"cat": "General", "stem": "The 'blue pencil' doctrine allows a court to:", "opts": ["rewrite the entire contract", "void all employment agreements", "award punitive damages", "strike or narrow an overbroad restrictive covenant to make it reasonable, where state law permits"], "a": 3, "fb": "Some states 'blue-pencil' (narrow) overbroad covenants; others (e.g., historically Virginia, Wisconsin) refuse and void the whole covenant, which is why drafting to reasonable limits matters."}, {"cat": "Legal Software", "stem": "In platforms like Relativity, 'technology-assisted review' (TAR / predictive coding) is used to:", "opts": ["delete privileged documents", "file the documents with the court", "auto-redact all PII without review", "prioritize and classify large document sets using machine learning trained on reviewer decisions"], "a": 3, "fb": "TAR ranks documents by likely relevance from a seed set of human-coded examples, dramatically reducing linear review time on large ESI volumes."}, {"cat": "General", "stem": "A Rule 30(b)(6) deposition notice requires:", "opts": ["a specific named executive to appear", "no preparation", "only written answers", "the organization to designate and prepare witnesses to testify on described topics"], "a": 3, "fb": "Rule 30(b)(6) binds the entity: it must designate representatives and prepare them on the noticed matters, and their testimony binds the organization."}, {"cat": "General", "stem": "Translate and bridge the contract parsing phrase \"Expression Unius Est Exclusion Alterius\" into the structural understanding of a civil law professional:", "opts": ["Recurso de alzada contractual; la solicitud presentada ante un árbitro para corregir vicios formales.", "Cláusula penal compensatoria; la fijación anticipada de daños destinada a castigar el dolo contractual.", "Amortización preferente por mora; la liquidación de aranceles bancarios bajo supervisión.", "La inclusión de uno implica la exclusión de otro; an interpretive rule stating that the explicit mention of one item implies the intentional exclusion of alternative items."], "a": 3, "fb": "The Bridge Methodology: Expressio Unius means lists are restrictive. If a contract says \"the company will pay for gas and toll fees,\" a judge will interpret the clause as explicitly excluding parking fees."}, {"cat": "Legal English", "stem": "'Time is of the essence' in a contract means that:", "opts": ["time will be counted in business days", "the essence of the deal is confidential", "timely performance is a material condition, and delay is a breach", "the contract has no deadline"], "a": 2, "fb": "The phrase elevates deadlines to material terms, so late performance is itself a breach entitling the other party to remedies."}, {"cat": "Personal Injury", "stem": "A 'Pierringer' (or 'Mary Carter') style settlement structure is used to:", "opts": ["settle with some defendants while preserving claims against others and allocating shared liability", "convert the case to arbitration", "release everyone at once", "waive the plaintiff's own claims"], "a": 0, "fb": "These proportionate-share settlement agreements let a plaintiff settle with some defendants while continuing against others, carefully allocating liability—drafting must comply with disclosure rules in the jurisdiction."}, {"cat": "General", "stem": "Complete the following contract drafting chunk: \"The remedies provided under this Agreement are _________ and do not exclude any other rights or remedies provided by law.\"", "opts": ["cumulative", "restricted", "alternative", "unliquidated"], "a": 0, "fb": "Linguistic Precision: A \"Cumulative Remedies\" clause (remedios acumulativos) prevents an election-of-remedies defense from blocking the client from pursuing both equitable and monetary relief."}, {"cat": "General", "stem": "A 'general release' in a settlement agreement typically releases:", "opts": ["nothing until court approval", "only the specific claim in suit", "only future claims", "all known and unknown claims up to the effective date"], "a": 3, "fb": "A general release is broad, extinguishing all claims (often 'known and unknown') as of the effective date; a specific release is narrower. In California, unknown claims require a Civil Code §1542 waiver."}, {"cat": "General", "stem": "How should a partner-ready legal assistant translate the common law term \"Hold Harmless\" into a civil law context to maintain true risk allocation?", "opts": ["Comprometerse a pagar gastos médicos menores sin admitir culpa alguna.", "Solicitar una fianza de arraigo ante el secretario judicial de la corte.", "Obligación de mantener indemne o eximir de responsabilidad a la contraparte frente a cualquier daño o reclamación de terceros.", "Cancelar el derecho de subrogación de una compañía aseguradora privada."], "a": 2, "fb": "The Bridge Methodology: \"Hold Harmless\" (sacar en paz / mantener indemne) goes beyond simple payment; it contractually protects the counterparty from facing the legal process itself, a vital distinction in cross-border corporate contracts."}, {"cat": "Labor", "stem": "Under U.S. contract law, what occurs if a boilerplate package omits a \"Severability Clause\" and a trial judge rules that a non-compete provision is illegal?", "opts": ["The judge will automatically double the expectation damages field.", "The case file will be transferred to a federal multi-district litigation queue screen.", "The practice management system will delete the active matter profile screen.", "The court may rule that the entire contract is illegal and completely void ab initio, destroying the client’s remaining contractual rights."], "a": 3, "fb": "Risk Shielding: Without a Severability Clause (cláusula de divisibilidad), an invalid or illegal provision acts as a systemic poison that can invalidate the entire contractual architecture."}, {"cat": "Legal English", "stem": "Complete the litigation collocation: 'Plaintiff respectfully ____ the Court to enter judgment in its favor.'", "opts": ["moves", "asks nicely", "tells", "demands"], "a": 0, "fb": "A party 'moves the court' for relief; 'move' is the operative verb of motion practice. 'Demand' and 'tell' are the wrong register."}, {"cat": "Legal English", "stem": "A 'representation' differs from a 'warranty' in that a representation is:", "opts": ["always non-actionable", "a promise about future performance", "a synonym with no legal difference", "a statement of present or past fact that, if false, may support a misrepresentation claim"], "a": 3, "fb": "Representations are assertions of fact inducing the contract (remedy: misrepresentation/rescission); warranties are promises that a fact is or will be true (remedy: breach of contract). Sophisticated drafting distinguishes them."}, {"cat": "General", "stem": "A structured settlement using a 'qualified assignment' under IRC §130 primarily benefits the claimant by:", "opts": ["deferring/spreading tax-favored periodic payments funded by an annuity", "waiving future medical claims", "eliminating attorney fees", "paying everything in cash immediately"], "a": 0, "fb": "Qualified assignments let the obligation to make periodic payments be assigned and funded by an annuity, preserving the §104(a)(2) exclusion across the payment stream."}, {"cat": "Personal Injury", "stem": "When a settlement resolves an ERISA plan's subrogation/reimbursement interest, counsel must account for:", "opts": ["nothing—ERISA never applies", "the plan's equitable lien and Montanile limits on recovering from dissipated funds", "only state law", "the plaintiff's credit score"], "a": 1, "fb": "Self-funded ERISA plans assert equitable reimbursement liens; Montanile v. Board of Trustees limits recovery once settlement funds are dissipated, so timing and allocation matter."}, {"cat": "Legal English", "stem": "A 'covenant not to sue' differs from a 'release' in that a covenant not to sue:", "opts": ["extinguishes the claim entirely as to everyone", "is unenforceable", "must be oral", "is a promise not to enforce a claim that technically survives, useful to preserve claims against non-parties"], "a": 3, "fb": "A release extinguishes the claim; a covenant not to sue merely promises forbearance, historically used to avoid discharging joint tortfeasors. The distinction is deliberate drafting."}, {"cat": "Legal English", "stem": "Which sentence correctly uses 'notwithstanding' to signal an overriding provision?", "opts": ["Notwithstanding the fees, we agree the weather is nice.", "We paid, notwithstanding.", "Notwithstanding is hereby deleted.", "Notwithstanding any other provision, liability shall not exceed the fees paid."], "a": 3, "fb": "'Notwithstanding X' = 'despite/regardless of X'; it makes the following clause control over conflicting terms."}, {"cat": "General", "stem": "Complete the following drafting chunk: \"This Agreement shall be binding upon and inure to the benefit of the Parties and their respective _________ and permitted assigns.\"", "opts": ["independent contractors", "successors", "trial witnesses", "business managers"], "a": 1, "fb": "Linguistic Precision: Including \"successors and permitted assigns\" (sucesores y cesionarios autorizados) ensures the contract rights and duties automatically transfer if a corporate party undergoes a merger or acquisition."}, {"cat": "Legal English", "stem": "Complete: 'This Agreement shall ____ upon and inure to the benefit of the parties' successors and assigns.'", "opts": ["tie", "attach onto", "be binding", "bind up"], "a": 2, "fb": "'Be binding upon and inure to the benefit of' is a fixed successors-and-assigns doublet; the alternatives are not idiomatic."}, {"cat": "General", "stem": "An attorney asks you to audit a Liquidated Damages provision. What risk must you flag if the clause dictates a massive, arbitrary financial penalty that bears no relation to actual projected losses?", "opts": ["The text will cause formatting distortion when uploaded to a cloud server network.", "The court clerk will reject the civil complaint layout font choices.", "The clause will be struck down by a U.S. court as an unenforceable penalty, leaving the client to prove actual damages at trial.", "The provision will automatically trigger a complete conflict-of-interest audit."], "a": 2, "fb": "Partner Inspection: Liquidated Damages must represent a reasonable pre-estimate of harm. If designed purely to punish or terrify the counterparty, it operates as a penalty, which common law courts refuse to enforce."}, {"cat": "General", "stem": "On summary judgment, once the movant shows no genuine dispute, the non-movant must:", "opts": ["do nothing", "file an answer", "request a continuance automatically", "come forward with specific evidence showing a genuine issue for trial, not rest on allegations"], "a": 3, "fb": "Under Celotex/Rule 56, the burden shifts: the non-movant must produce admissible evidence creating a triable issue; mere pleadings or conclusory denials are insufficient."}, {"cat": "Legal English", "stem": "A brief invokes 'res ipsa loquitur' to argue negligence. The doctrine permits an inference of negligence when:", "opts": ["the injury is of a kind that ordinarily does not occur absent negligence and the instrumentality was in defendant's control", "the plaintiff cannot afford an expert", "the defendant is wealthy", "the parties settled"], "a": 0, "fb": "'The thing speaks for itself' allows negligence to be inferred from the accident's nature plus defendant's exclusive control — a precise evidentiary doctrine, not a rhetorical flourish."}, {"cat": "Legal Software", "stem": "A defensible TAR workflow requires documenting the process because:", "opts": ["it guarantees zero errors", "courts assess reasonableness/good faith; transparency about seed sets and validation supports defensibility", "documentation is prohibited", "it eliminates meet-and-confer"], "a": 1, "fb": "Courts (e.g., Da Silva Moore) evaluate TAR by process reasonableness; documenting training, sampling, and validation is what makes the methodology defensible if challenged."}, {"cat": "General", "stem": "Complete the following contract interpretation rule concept: \"Under the rule of Ejusdem Generis, when general words follow a list of specific items, the general words must be interpreted to include only items of the same _________.\"", "opts": ["financial value", "state venue", "data format", "kind or class / ejusdem generis"], "a": 3, "fb": "Linguistic Precision: Ejusdem Generis governs contract parsing. If a clause says \"cats, dogs, and other animals,\" a judge will interpret \"other animals\" to mean domestic pets, not wild lions, impacting force majeure sweeps."}, {"cat": "General", "stem": "Translate and align this cross-border provision: \"Las partes se someten irrevocablemente a la jurisdicción exclusiva de los tribunales federales situados en el Condado de Cook, Illinois.\"", "opts": ["The contract features a substantive forum non conveniens exception for Illinois dockets.", "Both litigants execute a venue integration mandate to lock the dockets under Illinois codes.", "This paper says that if we fight, we must go to the Cook county room line.", "The Parties hereby irrevocably submit to the exclusive jurisdiction of the federal courts located in Cook County, Illinois."], "a": 3, "fb": "Register Mastery: This is standard, partner-ready \"Consent to Jurisdiction\" or venue selection language. Utilizing \"irrevocably submit\" blocks future jurisdictional challenges."}, {"cat": "Personal Injury", "stem": "A limitation-of-liability clause may be unenforceable as to a party's own:", "opts": ["contractual delays", "ordinary negligence", "gross negligence, fraud, or willful misconduct under many states' public policy", "minor breaches"], "a": 2, "fb": "Courts frequently refuse to enforce liability waivers for gross negligence, fraud, or intentional misconduct; sophisticated clauses expressly exclude these to avoid voiding the entire provision."}, {"cat": "Legal English", "stem": "Which verb is strongest and most appropriate to open an argument heading in a brief asserting the court must rule a certain way?", "opts": ["compels", "might support", "arguably indicates", "suggests"], "a": 0, "fb": "Persuasive brief writing uses confident, active verbs ('compels', 'requires', 'establishes'); hedging verbs undercut advocacy."}, {"cat": "General", "stem": "How should an executive legal assistant translate \"Indemnify, Defend, and Hold Harmless\" into Spanish to reflect absolute corporate risk shifting?", "opts": ["Amortizar los saldos insolutos de una cuenta fideicomisaria bajo fianza.", "Solicitar una prórroga de competencia territorial ante el secretario judicial de la corte.", "Indemnizar, defender y sacar en paz; obligándose a pagar daños, asumir la defensa legal activa y eximir de responsabilidad total a la contraparte.", "Pagar una multa administrativa ante la comisión de comercio estatal out of court."], "a": 2, "fb": "The Bridge Methodology: This triad represents the gold standard of risk allocation. To \"indemnify\" means to pay for losses; to \"defend\" means to hire and pay for lawyers; to \"hold harmless\" means to erase any liability claim footprint."}, {"cat": "General", "stem": "A 'severability' clause is most effective when paired with a provision stating that, if a term is unenforceable, the parties intend the court to:", "opts": ["enforce the term to the maximum extent permitted by law", "award attorney fees", "delete the whole contract", "refer the matter to arbitration"], "a": 0, "fb": "A reformation-style severability clause instructs the court to narrow (not merely delete) an offending term, preserving as much of the bargain as the law allows."}, {"cat": "General", "stem": "Translate and bridge this structural drafting chunk into a pristine English contract: \"Las partes acuerdan que en caso de incumplimiento, la parte infractora pagará una cantidad fija de $1,000 por día como indemnización precalculada.\"", "opts": ["Both litigants accept a mutual release to close the active contract lines.", "The parties agree to pay an dynamic penalty framework managed by a court clerk.", "The parties stipulate that in the event of a breach, the breaching party shall pay liquidated damages in the amount of $1,000 per day.", "The buyer faces an unliquidated transaction layout that violates public policy."], "a": 2, "fb": "Register Mastery: Pre-agreed damages must be drafted as \"Liquidated Damages\" (daños liquidados/perjuicios estipulados). Using terms like \"penalty\" can cause a U.S. judge to strike the clause as an unenforceable penalty."}, {"cat": "Labor", "stem": "For a non-compete signed by a current (already-employed) worker, the key contract-formation issue is often:", "opts": ["the employee's title", "the color of the ink", "the length of the document", "adequate consideration for the new restraint"], "a": 3, "fb": "Many states hold that continued at-will employment is insufficient consideration for a new non-compete; something of value (raise, bonus, promotion) may be required."}, {"cat": "Legal Software", "stem": "Preserving 'metadata' during collection matters because:", "opts": ["fields like sent-date, author, and custodian are often evidence and support authentication", "it is always privileged", "courts ignore it", "metadata slows review"], "a": 0, "fb": "Altering or stripping metadata during collection can spoliate evidence and undermine authentication (FRE 901); forensically sound collection preserves it."}, {"cat": "Legal English", "stem": "A paralegal writes that the parties reached a 'compromise' meaning a binding legal commitment. The precise English term for a binding legal obligation ('compromiso') is:", "opts": ["compromise", "composure", "undertaking / commitment", "comprise"], "a": 2, "fb": "Spanish 'compromiso' = commitment/undertaking. English 'compromise' means a mutual concession, a different concept."}, {"cat": "General", "stem": "Translate and match this operational drafting mandate: \"Cualquier modificación a este acuerdo deberá constar por escrito y estar firmada por representantes autorizados de ambas partes.\"", "opts": ["No amendment, modification, or waiver of any provision of this Agreement shall be valid unless in writing and signed by an authorized representative of each Party.", "The signatory accepts an unconscionable boilerplate adjustment to avoid a trademark trial.", "No changes can happen unless the phone crew texts the corporate manager about a deal.", "The client executes a generic modification layout pattern to alter the database tracking grids."], "a": 0, "fb": "Register Mastery: This is the standard \"No Oral Modifications\" (NOM) clause. It protects the enterprise from claims that an account executive verbally altered contract terms out of court."}, {"cat": "Legal Software", "stem": "When negotiating an ESI protocol, agreeing on 'production format' (e.g., TIFF+load file vs. native) matters because it determines:", "opts": ["the filing fee", "the color of the documents", "who wins the case", "whether metadata and usability are preserved for review and at trial"], "a": 3, "fb": "Format choices affect searchability, metadata retention, and cost; native production preserves metadata while imaged formats support redaction/Bates—an early strategic decision."}, {"cat": "Personal Injury", "stem": "In a personal-injury settlement, a 'Medicare Set-Aside' or lien resolution is required because:", "opts": ["Medicare has a statutory right of reimbursement for related medical payments", "it increases the settlement", "the plaintiff must tip the government", "insurers demand it for fun"], "a": 0, "fb": "The Medicare Secondary Payer Act gives Medicare a super-priority reimbursement right; failing to resolve liens exposes both attorney and client to liability."}, {"cat": "Legal Software", "stem": "A 'clawback' agreement / FRE 502(d) order is used in e-discovery to:", "opts": ["allow recovery of inadvertently produced privileged documents without broad waiver", "delete the opponent's data", "speed up production only", "waive all privileges"], "a": 0, "fb": "A 502(d) order protects against subject-matter waiver from inadvertent production—an essential protection when reviewing large volumes under time pressure."}, {"cat": "General", "stem": "In advanced contract interpretation, what does the doctrine \"Contra Proferentem\" mandate when analyzing an ambiguous clause?", "opts": ["The trial judge must automatically strike the entire contract array as voidable due to lack of standard validation.", "The contract must be transferred to a federal multi-district litigation pipeline screen.", "The billing department must recalculate all timekeeper entries using an interest-bearing metric.", "The ambiguity must be construed strictly against the party who drafted the clause, favorability shifting to the non-drafting side."], "a": 3, "fb": "Partner Inspection: Contra Proferentem penalizes sloppy drafting. If a remote assistant uses ambiguous language in a firm boilerplate template, a court will interpret that ambiguity in favor of the opponent."}, {"cat": "Legal English", "stem": "A clause stating the contract represents the parties' complete and final agreement, superseding prior negotiations, is called a(n):", "opts": ["assignment clause", "severability clause", "integration (merger) clause", "indemnification clause"], "a": 2, "fb": "An integration or 'merger' clause invokes the parol evidence rule to exclude prior or contemporaneous understandings not written into the contract."}, {"cat": "Legal English", "stem": "An 'indemnification' clause primarily allocates:", "opts": ["responsibility to cover another party's losses and liabilities", "intellectual-property ownership", "the venue for lawsuits", "the governing language of the contract"], "a": 0, "fb": "Indemnity shifts the risk of specified losses (including third-party claims) from the indemnitee to the indemnitor."}, {"cat": "Legal Software", "stem": "A governance control to keep automated templates legally current is:", "opts": ["a template-owner and periodic legal review so clause libraries reflect current law", "storing templates offline only", "letting any user edit templates freely", "never updating templates"], "a": 0, "fb": "Automation scales whatever the template says—including outdated clauses; assigning ownership and scheduling legal review prevents systematically propagating stale or noncompliant language."}, {"cat": "Labor", "stem": "In an M&A deal, a non-compete signed by the SELLER of a business is generally:", "opts": ["unenforceable without the seller's spouse", "limited to 30 days", "void as against public policy", "enforced more readily because it protects the goodwill the buyer paid for"], "a": 3, "fb": "Sale-of-business non-competes receive greater latitude than employment non-competes because they protect the transferred goodwill—even California permits them under §16601."}, {"cat": "General", "stem": "Review this draft chunk: \"Neither party shall be liable for any failure or delay in performance due to acts of God, war, strikes, or government regulations.\" What category of clause is this?", "opts": ["Force Majeure Clause", "Anti-assignment Clause", "Cumulative Remedies Provision", "Execution Mandate"], "a": 0, "fb": "Linguistic Precision: A Force Majeure Clause (cláusula de fuerza mayor / caso fortuito) excuses non-performance during systemic disruptions. Staff must audit lists to ensure pandemic or economic anomalies are covered."}, {"cat": "Legal Software", "stem": "A required 'case type' field at intake is important because downstream automation and reporting:", "opts": ["use it only for billing", "branch on it—misclassification routes the matter into the wrong workflow and skews metrics", "ignore it entirely", "need it only at closing"], "a": 1, "fb": "Case type drives workflow selection, deadline rules, and KPI segmentation; a wrong value silently mis-routes the entire matter."}, {"cat": "Legal Software", "stem": "Version control in a document management system (DMS) protects the firm by:", "opts": ["locking all editing forever", "deleting drafts automatically", "preserving prior versions and preventing overwrites so the authoritative draft is traceable", "emailing every version to the client"], "a": 2, "fb": "DMS version control (check-in/check-out, version history) prevents lost edits and establishes which draft is controlling—key for multi-reviewer drafting."}, {"cat": "Legal English", "stem": "Which is the precise way to grant a right that the holder can choose not to exercise, without creating a duty?", "opts": ["Buyer shall purchase...", "Buyer will be forced to purchase...", "Buyer must consider purchasing...", "Buyer shall have the option, but not the obligation, to purchase..."], "a": 3, "fb": "'Option, but not the obligation' is the canonical formulation granting a discretionary right (as in options and rights of first refusal)."}, {"cat": "Legal English", "stem": "Complete the contract collocation: the parties agree to '____ any dispute arising under this Agreement to binding arbitration.'", "opts": ["put", "give", "send", "submit"], "a": 3, "fb": "'Submit a dispute to arbitration' is the fixed legal collocation; the other verbs are not idiomatic in this construction."}, {"cat": "Legal Software", "stem": "A 'rules-based calendaring' system (e.g., CompuLaw, LawToolBox) reduces malpractice risk because it:", "opts": ["auto-calculates court deadlines from jurisdiction-specific rules when a trigger date is entered", "tracks marketing leads", "emails clients birthday cards", "stores passwords"], "a": 0, "fb": "Court-rules engines compute cascading deadlines (answers, discovery, motions) per jurisdiction, minimizing the human error that drives missed-deadline malpractice claims."}, {"cat": "Legal Software", "stem": "A best-practice reminder cadence for a hard court deadline is:", "opts": ["tiered alerts (e.g., 30/14/7/2 days) to multiple responsible users", "an alert only to the client", "no alert—trust memory", "a single alert the day it is due"], "a": 0, "fb": "Layered, redundant reminders to more than one person create resilience against any single individual's absence or oversight."}, {"cat": "Legal English", "stem": "A settlement recites that payment is made 'without prejudice'. This means:", "opts": ["the payer admits fault", "the matter is dismissed with prejudice", "the payment is final and bars all claims", "the payment does not waive rights or admit liability"], "a": 3, "fb": "'Without prejudice' preserves legal rights and disclaims admission; 'with prejudice' (e.g., a dismissal) is final and bars refiling — opposite effect."}, {"cat": "Labor", "stem": "Complete the following contract drafting chunk: \"The relationship of the Parties under this Agreement is that of independent contractors, and nothing herein shall create an employer-employee relationship or a _________.\"", "opts": ["restrictive covenant", "integration mandate", "general release", "joint venture / partnership"], "a": 3, "fb": "Linguistic Precision: Including \"joint venture or partnership\" disclaimers protects the enterprise from accidental vicarious liability or implied fiduciary obligations under state partnership acts."}, {"cat": "Legal English", "stem": "To make an assignment provision restrictive, the strongest anti-assignment language is:", "opts": ["Assignment may happen sometimes.", "Try not to assign this.", "Neither party may assign this Agreement, by operation of law or otherwise, without the other party's prior written consent, and any purported assignment in violation is void.", "Assignment is discouraged."], "a": 2, "fb": "The model pairs a consent requirement with 'by operation of law or otherwise' and a 'void' consequence, closing the merger/change-of-control loophole that bare anti-assignment clauses leave open."}, {"cat": "Personal Injury", "stem": "A trade-secret claim under the federal Defend Trade Secrets Act (DTSA) requires the plaintiff to show, among other things, that it:", "opts": ["registered the secret with the USPTO", "took reasonable measures to keep the information secret and the information derives value from secrecy", "employed the defendant for 10 years", "published the information"], "a": 1, "fb": "DTSA (and the UTSA) require reasonable secrecy measures plus independent economic value from not being generally known; trade secrets are not registered like patents."}, {"cat": "Labor", "stem": "For a non-compete to be enforceable in most states, it must protect:", "opts": ["the employee's salary", "the employer's preference to avoid competition generally", "a legitimate business interest and be reasonable in scope, geography, and duration", "the company's stock price"], "a": 2, "fb": "Courts require a protectable interest (trade secrets, goodwill, confidential information) plus reasonableness; a naked desire to suppress competition is not protectable."}, {"cat": "General", "stem": "A 'force majeure' clause excuses performance when:", "opts": ["the market shifts modestly", "performance is prevented by specified events beyond a party's reasonable control", "a party simply finds the deal unprofitable", "either party changes its mind"], "a": 1, "fb": "Force majeure excuses non-performance due to enumerated extraordinary events (acts of God, war, government action). Economic hardship alone usually does not qualify unless specifically listed."}, {"cat": "Legal English", "stem": "A choice-of-law clause reads 'governed by the laws of New York.' To prevent importing New York's conflict-of-laws rules (renvoi), add:", "opts": ["'as amended from time to time'", "'and any other laws that apply'", "'in the spirit of fairness'", "'without regard to its conflict-of-laws principles'"], "a": 3, "fb": "Adding 'without regard to conflict-of-laws principles' ensures the chosen state's substantive law applies directly, avoiding a renvoi to another jurisdiction's law."}, {"cat": "General", "stem": "Translate and bridge this critical corporate transactional chunk into a pristine English contract: \"El comprador no podrá ceder sus derechos ni delegar sus obligaciones sin el consentimiento previo y por escrito del vendedor.\"", "opts": ["The buyer cannot trade his papers unless the owner texts him about a deal.", "The customer faces an unliquidated transaction status that cancels the privity lines.", "Both parties accept a mutual release to close the active contractual assignment fields.", "Buyer shall not assign its rights nor delegate its duties under this Agreement without the prior written consent of Seller."], "a": 3, "fb": "Register Mastery: This is the baseline \"Anti-Assignment and Non-Delegation\" clause structure. Separating \"assign its rights\" from \"delegate its duties\" ensures total security over who performs the contract."}, {"cat": "General", "stem": "Complete the following drafting rule concept: \"To prevent an independent contractor from transferring their obligations to an unknown sub-vendor, the contract must feature an anti-_________ clause.\"", "opts": ["assignment / delegation", "indemnity", "integration", "merger"], "a": 0, "fb": "Risk Shielding: An \"Anti-Assignment and Non-Delegation Clause\" ensures that the specialized entity the client hired is the exact entity performing the service, protecting operational quality."}, {"cat": "Legal Software", "stem": "Integrating e-signature (e.g., DocuSign) into a matter workflow improves defensibility when the system:", "opts": ["stores only the final page", "emails a plain PDF", "skips authentication", "captures a complete audit certificate (signer identity, timestamps, IP) tied to the executed document"], "a": 3, "fb": "A tamper-evident audit certificate linking signer authentication and timestamps to the document supports enforceability and rebuts later challenges to execution."}, {"cat": "Legal English", "stem": "A Spanish-speaking associate writes that a client wants to 'demand' the employer. In precise U.S. legal English, the correct verb for initiating a lawsuit is:", "opts": ["to pretend", "to sue (or file a claim against)", "to demand", "to denounce"], "a": 1, "fb": "'Demandar' = to sue/file suit, NOT 'to demand' (which means to insist forcefully). 'Denunciar' and 'pretender' are also false friends ('report/allege' and 'to seek/claim')."}, {"cat": "Legal Software", "stem": "'ESI' in e-discovery stands for:", "opts": ["External System Interface", "Electronically Stored Information", "Evidence Submission Index", "Encrypted Server Instance"], "a": 1, "fb": "ESI = Electronically Stored Information, the FRCP term covering emails, documents, databases, texts, and other digital data subject to discovery."}, {"cat": "General", "stem": "In transactional boilerplate design, what does a \"Counterparts Clause\" explicitly authorize?", "opts": ["An automatic financial audit across all trust account escrow ledgers inside Litify.", "The court clerk division to waive all upcoming pleading submission filing charges.", "The contract to be executed via separate, independent signature pages signed by different parties at different times, forming a single binding agreement.", "It forces the prevailing party to pay the losing party's reasonable legal fees and litigation costs."], "a": 2, "fb": "Operational Workflow: The Counterparts Clause eliminates the logistical friction of international closings, allowing parties across the globe to execute a deal simultaneously."}, {"cat": "General", "stem": "Translate and match this operational drafting mandate: \"Los remedios aquí previstos son acumulativos y se suman a cualquier otro derecho reconocido por la ley.\"", "opts": ["The signatory accepts an unconscionable boilerplate adjustment to avoid a trademark trial.", "The client executes a generic modification layout pattern to alter the database tracking grids.", "The fixes listed are extra and don't stop the client from trying alternative methods.", "The rights and remedies provided under this Agreement are cumulative and are in addition to, and not in limitation of, any other rights and remedies provided by law."], "a": 3, "fb": "Register Mastery: This is the standard architecture of a \"Cumulative Remedies\" clause. It preserves the client's right to pursue multiple legal paths (e.g., both an injunction and financial damages)."}, {"cat": "Personal Injury", "stem": "Under IRS rules, a settlement payment for emotional distress NOT arising from physical injury is generally:", "opts": ["deductible by the plaintiff", "tax-free in all cases", "exempt as a gift", "taxable income to the recipient, often triggering a Form 1099"], "a": 3, "fb": "§104(a)(2) excludes damages for physical injury/sickness; purely emotional-distress or non-physical recoveries are typically taxable—an allocation issue sophisticated settlement drafting addresses."}, {"cat": "Legal English", "stem": "'Specific performance' is the appropriate remedy request when:", "opts": ["the breach is trivial", "monetary damages are inadequate, e.g., for unique real property or goods", "the plaintiff wants punitive damages", "the contract is illegal"], "a": 1, "fb": "Specific performance is an equitable remedy available where damages cannot make the plaintiff whole (uniqueness), classically in real-estate contracts."}, {"cat": "General", "stem": "Review this draft clause: \"No failure or delay by either party in exercising any right under this Agreement shall operate as a waiver thereof.\" What category of boilerplate is being executed?", "opts": ["Cumulative Remedies Provision", "Choice of Forum Mandate", "Non-Waiver Clause", "Anti-assignment Clause"], "a": 2, "fb": "Linguistic Precision: A Non-Waiver Clause (cláusula de no renuncia) protects a client who grants a temporary favor or delay to the counterparty, preventing that favor from legally extinguishing their contract enforcement rights."}, {"cat": "General", "stem": "Translate and align this cross-border provision: \"El presente contrato se interpretará y regirá de conformidad con las leyes del Estado de Nueva York.\"", "opts": ["This text states that if the parties fight, the New York code wins out of court.", "The contract features a substantive forum non conveniens exception for New York dockets.", "This Agreement shall be governed by, and construed in accordance with, the laws of the State of New York.", "Both parties execute a venue alignment to lock the dockets under New York clerks."], "a": 2, "fb": "Register Mastery: This is the definitive boilerplate \"Governing Law\" or Choice of Law phrasing. Standardizing this architecture prevents cross-border enforcement confusion."}, {"cat": "Legal Software", "stem": "Before deploying a new firm-wide automation, the safest rollout approach is to:", "opts": ["skip testing to save time", "enable it for all matters overnight", "pilot on a limited matter set, measure exceptions/errors, then scale with monitoring", "let each user build their own"], "a": 2, "fb": "Piloting with measurement surfaces broken triggers and edge cases before firm-wide exposure; staged rollout with monitoring is standard change-management discipline."}, {"cat": "Legal English", "stem": "A brief argues that a general term following a list of specific items should be read narrowly, consistent with those items. This canon is:", "opts": ["ejusdem generis", "forum non conveniens", "res judicata", "stare decisis"], "a": 0, "fb": "'Ejusdem generis' ('of the same kind') limits a catch-all to the same class as the enumerated items — a key interpretive canon in drafting disputes."}, {"cat": "General", "stem": "Under U.S. contract law, what does a \"Hell or High Water\" clause obligate a buyer or lessee to execute?", "opts": ["Delete the active matter database profile screen from the practice software platform workspace.", "File an automatic petition for a Writ of Certiorari before a federal circuit panel division.", "Automatically double the financial value of prospective expectation damages without a judge's review.", "Make all scheduled payments unconditionally and absolutely under any circumstances, completely waiving any defenses or setoffs."], "a": 3, "fb": "Linguistic Precision: Hell or High Water clauses are standard in equipment leasing. They force the lessee to continue paying the lease even if the equipment breaks down, shifting risk entirely to the user."}, {"cat": "General", "stem": "Translate and bridge the U.S. commercial clause mechanism \"Further Assurances Clause\" into the conceptual register of an international legal corporate attorney:", "opts": ["Mandamiento de ejecución forzosa prendaria; la orden de corte utilizada para secuestrar activos comerciales en garantía.", "Pacto de cuota litis transfronterizo; la fijación de honorarios de contingencia regulados por un arancel.", "Cláusula de otorgamiento de actos complementarios; a provision obligating both parties to execute any secondary documents necessary to fully carry out the contract's intent.", "Demanda de nulidad absoluta por falta de objeto; el escrito utilizado para cancelar contratos viciados de dolo."], "a": 2, "fb": "The Bridge Methodology: A Further Assurances Clause acts as an operational insurance policy. It forces the seller, for example, to sign secondary title transfer sheets post-closing if errors are found."}, {"cat": "General", "stem": "An expert is impeached at deposition by prior published writings that contradict the opinion. The most effective technique is to:", "opts": ["establish the treatise/article as authoritative, then read the contradicting passage", "adjourn the deposition", "ask the expert to summarize their resume", "object to the exhibit"], "a": 0, "fb": "Under FRE 803(18), once a work is established as a reliable authority, contradictory passages can be used to impeach—first lock in authoritativeness, then confront."}, {"cat": "Legal Software", "stem": "A key risk when using document automation for legal drafting is:", "opts": ["documents become too accurate", "templates never update", "'garbage in, garbage out'—bad or mismapped field data propagates errors across every generated document", "it eliminates the need for data"], "a": 2, "fb": "Because automation scales whatever data it is fed, field-mapping and data-validation discipline are essential; one wrong merge field can corrupt an entire document set."}, {"cat": "Legal Software", "stem": "The clearest sign a firm's automation has created 'silent failure' risk is:", "opts": ["clients are happy", "reports load fast", "matters close quickly", "tasks are marked complete by the system but no human verified the substantive work"], "a": 3, "fb": "Systems can mark steps 'done' without anyone confirming the underlying work; auditing for status-vs-substance gaps is essential to catch automation-masked errors before they cause harm."}, {"cat": "General", "stem": "In contract drafting, what is the core danger of failing to include a \"Notice Provision\" detailing explicit delivery methods (e.g.,
