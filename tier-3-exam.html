const PATHWAYS = {
  intake: { name: "Intake & Support", blurb: "Legal English for first client contact, case screening and file setup in practice-management software." },
  lit: { name: "Litigation & Management", blurb: "Procedural vocabulary, evidence processing and day-to-day case management in Personal Injury, Labor Law and Immigration." },
  trial: { name: "Trial & Strategy", blurb: "Advanced legal English, U.S. common-law structures, trial preparation and case analysis." }
};
const CAT_PATHWAY = {
  "Legal Foundations & Courts":"intake", "Register & Translation":"intake", "Legal Software & Practice":"intake",
  "Client Narrative to Legal English":"intake", "Legal Technology & Operations":"intake",
  "Civil Procedure":"lit", "Torts & Personal Injury":"lit", "Employment Law":"lit", "Immigration":"lit",
  "Damages, Insurance & Settlement":"lit", "Discovery & Evidence":"lit", "Legal Operations & E-Discovery":"lit",
  "Restrictive Covenants & Employment":"lit", "Settlement, Liens & Tax":"lit",
  "Contracts":"trial", "Motions, Trial & Appeals":"trial", "Torts, Contracts & Business Claims":"trial",
  "Complex Litigation & Evidence":"trial", "Contract Drafting & Boilerplate":"trial", "Contract Interpretation & Remedies":"trial",
  "Cross-Border Translation":"trial", "Legal Writing & Advocacy":"trial"
};
const TIER_DEFAULT = { 1:"intake", 2:"lit", 3:"trial" };
function recommendPathways(completed){
  const n = parseInt((TIER_LABEL.match(/\d+/) || ["1"])[0], 10);
  const w = {}, why = {};
  topicStats(completed).forEach(t => {
    const p = t.right / t.total;
    if(p < PASS_THRESHOLD){
      const k = CAT_PATHWAY[t.cat] || TIER_DEFAULT[n];
      w[k] = (w[k] || 0) + (PASS_THRESHOLD - p) * t.total;
      (why[k] = why[k] || []).push(t.cat);
    }
  });
  const keys = Object.keys(w).sort((a,b) => w[b] - w[a]).slice(0,2);
  if(!keys.length) return [{ key: TIER_DEFAULT[n], reason: "It matches your " + TIER_LABEL + " level." }];
  return keys.map(k => ({ key: k, reason: "Based on your results in " + why[k].join(", ") + "." }));
}
function nextStepHTML(completed, passed){
  const n = parseInt((TIER_LABEL.match(/\d+/) || ["1"])[0], 10);
  const recs = recommendPathways(completed);
  let body;
  if(passed){
    body = n < 3 ? "Great work. You are ready to take the Tier " + (n+1) + " exam. These pathways will keep building your legal English." : "Great work. You have reached the top tier. These pathways will put your legal English to work.";
  } else {
    body = "Review the answers below, then retake this exam. These pathways cover the topics where you can gain the most.";
  }
  const cards = recs.map((r, i) => {
    const p = PATHWAYS[r.key];
    return `<div class="rec"><div class="recname">${i === 0 ? '<span class="pill">Best match</span>' : '<span class="pill">Also consider</span>'}${p.name}</div><div class="recwhy">${r.reason}</div><p>${p.blurb}</p><a class="btn ${i === 0 ? "gold" : "ghost"}" href="${COURSES_URL}" target="_blank" rel="noopener">Explore ${p.name}</a></div>`;
  }).join("");
  return `<div class="nextstep"><div class="headline">Your next step</div><p>${body}</p>${cards}</div>`;
}
function filterReview(v){
  document.querySelectorAll(".review .rv").forEach(el => { el.style.display = (!v || el.dataset.cat === v) ? "" : "none"; });
}
function reviewItem(q, i){
  const given = state.answers[i];
  const ok = given === q.a;
  const L = n => String.fromCharCode(65+n);
  return `<div class="rv ${ok ? "ok" : ""}" data-cat="${q.cat}">
    <div class="rq">Question ${i+1} &middot; ${q.cat}</div>
    <div class="rs">${q.stem}</div>
    ${ok ? "" : `<div class="ra bad"><strong>Your answer:</strong> ${given === null ? "Skipped" : L(given) + ". " + q.opts[given]}</div>`}
    <div class="ra good"><strong>${ok ? "Your answer (correct):" : "Correct answer:"}</strong> ${L(q.a)}. ${q.opts[q.a]}</div>
    <div class="rationale">${q.fb}</div>
  </div>`;
}
function reviewHTML(completed){
  const missed = [], right = [];
  for(let i=0;i<completed;i++){ (state.answers[i] === QUESTIONS[i].a ? right : missed).push(i); }
  const cats = topicStats(completed).map(t => t.cat);
  let html = '<div class="review"><h2>Answer review</h2>';
  if(cats.length > 1){
    html += '<div class="filterrow">Filter by topic:<select onchange="filterReview(this.value)"><option value="">All topics</option>' + cats.map(c => '<option value="' + c.replace(/"/g,"&quot;") + '">' + c + '</option>').join("") + '</select></div>';
  }
  if(missed.length){
    html += `<p class="sub">Questions to review (${missed.length})</p>` + missed.map(i => reviewItem(QUESTIONS[i], i)).join("");
  } else {
    html += '<p class="sub">You answered every question correctly.</p>';
  }
  if(right.length){
    html += `<details class="rvgroup"><summary>Questions you answered correctly (${right.length})</summary>` + right.map(i => reviewItem(QUESTIONS[i], i)).join("") + "</details>";
  }
  return html + "</div>";
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(ev){
  if(ev) ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const length = val("inLength");
  const c = {
    usage: val("inUsage"), branch: val("inBranch"), branchOther: val("inBranchOther"),
    englishLevel: val("inLevel"), name: val("inName"), email: val("inEmail")
  };
  let msg = "";
  if(!length) msg = "Please choose the exam length.";
  else if(!c.usage) msg = "Please tell us how often you use legal English.";
  else if(!c.branch) msg = "Please choose the branch of law you are interested in.";
  else if(c.branch === OTHER_BRANCH && !c.branchOther) msg = "Please tell us which branch of law you are interested in.";
  else if(!c.englishLevel) msg = "Please choose your level of English.";
  else if(!c.name) msg = "Please enter your name.";
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) msg = "Please enter a valid email address.";
  document.getElementById("entryError").textContent = msg;
  if(msg) return;
  if(c.branch !== OTHER_BRANCH) c.branchOther = "";
  state.candidate = c;
  applyMode(length);
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
  window.scrollTo(0, 0);
}
function goBack(){
  if(state.qIndex % BATCH_SIZE === 0) return;
  state.qIndex -= 1;
  state.screen = "question";
  render();
}
function selectAnswer(idx){
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  if(state.answers[state.qIndex] === null) return;
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL, length: MODE,
      name: state.candidate.name, email: state.candidate.email, ...profileFields(),
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, length: MODE, name: state.candidate.name, email: state.candidate.email, ...profileFields(),
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed, certId: (passed && state._certId) ? state._certId : "",
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  { const p = profileFields();
    if(p.legalEnglishUse) lines.push("Legal English use: " + p.legalEnglishUse);
    if(p.branchOfLaw) lines.push("Branch of law of interest: " + p.branchOfLaw);
    if(p.englishLevel) lines.push("Self-reported English level: " + p.englishLevel); }
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Length: " + lengthLabel());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${fmtPct(s/(be-bs))})`);
  }
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${fmtPct(pct)}) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("SCORE BY TOPIC");
  topicStats(completed).forEach(t => lines.push(`${t.cat}: ${t.right}/${t.total} (${fmtPct(t.right/t.total)})`));
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
    if(given !== q.a){
      lines.push("   " + q.stem.replace(/\s+/g," "));
      lines.push("   Correct answer: " + correctLetter + ". " + q.opts[q.a]);
      lines.push("   Explanation: " + q.fb);
    }

.il-disc{padding:10px 44px 16px;font-size:10.5px;line-height:1.5;background:var(--deep);color:#9d8eab;border-top:1px solid rgba(110,90,121,.4)}
`;
const CERT_UI_CSS = `.certcard{border:1.5px solid #C9A96E;border-radius:6px;padding:20px 22px;margin:18px 0;background:linear-gradient(135deg,rgba(201,169,110,.2),rgba(201,169,110,.05));font-family:"Archivo",Arial,sans-serif;color:#F1EBDE}
.certcard .ct{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#C9A96E;font-weight:600;margin-bottom:4px}
.certcard .headline{font-size:20px;font-weight:600;color:#F1EBDE;margin-bottom:6px}
.certcard p{margin:0 0 14px;font-size:14px;line-height:1.55;color:#F1EBDE}
.certrow{display:flex;gap:10px;flex-wrap:wrap}
.certidline{margin-top:12px;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.06em;color:#C9A96E}
#certOverlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:rgba(30,18,38,.94);display:flex;flex-direction:column}
#certOverlay .certbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px;background:#1E1226;border-bottom:1px solid #6E5A79}
#certOverlay .certscroll{flex:1;overflow:auto;padding:16px 0 40px}
@media print{
  body>*:not(#certOverlay){display:none!important}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #certOverlay{position:static!important;background:none!important;display:block!important}
  #certOverlay .certbar{display:none!important}
  #certOverlay .certscroll{overflow:visible!important;padding:0!important}
  @page{size:A4 portrait;margin:0}
}
`;
let _certD = null;

function certEsc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function certNewId(prefix){
  const a = new Uint8Array(8); (window.crypto || window.msCrypto).getRandomValues(a);
  let s = ""; for(let i=0;i<a.length;i++) s += CERT_ALPHABET[a[i] % CERT_ALPHABET.length];
  return "IL-" + prefix + "-" + s;
}
function certDate(d){ return (d || new Date()).toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"}); }
function certQrSvg(text, size){
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), c = size / n; let d = "";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) d += "M"+(k*c)+","+(r*c)+"h"+c+"v"+c+"h-"+c+"z";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><path d="${d}" fill="#1E1226"/></svg>`;
}
const CERT_MARK = '<svg width="40" height="40" viewBox="0 0 40 40"><path d="M18,4 A16,16 0 0 0 18,36" fill="none" stroke="#6E5A79" stroke-width="1.5"/><path d="M18,9 A11,11 0 0 0 18,31" fill="none" stroke="#A9713F" stroke-width="2"/><path d="M18,14 A6,6 0 0 0 18,26" fill="none" stroke="#C9A96E" stroke-width="3"/><circle cx="25" cy="20" r="3" fill="#F1EBDE"/></svg>';
const CERT_DISC = "Ingles Legal exams are self-assessments of legal English. This report is not a certification, license, bar admission or official credential. Verification confirms that this ID was issued by the Ingles Legal exam system.";

function certWindowText(p, pm){
  if(p < pm) return p + "% &middot; below the pass mark, your biggest opportunity.";
  if(p <= pm + 5) return p + "% &middot; just above the pass mark, a small push makes it a strength.";
  return p + "% &middot; already solid, polishing it completes your profile.";
}
function certReportHTML(D){
  const sorted = D.skills.slice().sort((a,b) => b.p - a.p);
  const top = sorted.slice(0,3), low = sorted.slice(-2).reverse();
  const PM = D.passMark || CERT_PASS;
  const circ = 2*Math.PI*52, dash = circ*D.pct/100;
  const verify = CERT_VERIFY + "?id=" + D.id;
  const diff = Math.round((D.pct - PM)*10)/10;
  return `<div class="il-rep">
  <div class="il-hd"><svg class="il-arcs" viewBox="0 0 400 400"><g fill="none" stroke="#C9A96E"><circle cx="200" cy="200" r="190" stroke-width="1" opacity=".35"/><circle cx="200" cy="200" r="140" stroke-width="2" opacity=".5"/><circle cx="200" cy="200" r="90" stroke-width="4" opacity=".7"/></g></svg>
   <div class="il-brand">${CERT_MARK}<div class="il-wm"><b>Ingles</b>legal</div></div>
   <div class="il-kick">Exam Results</div><h1>Legal English Proficiency Report</h1>
   <div class="il-who"><div><div class="il-lbl">Prepared for</div><div class="il-nm">${certEsc(D.name)}</div><div class="il-ex">${certEsc(D.exam)}</div><span class="il-pill">${certEsc(D.level)}</span></div>
   <div class="il-dt"><div class="il-lbl">Date issued</div><div class="il-v">${certEsc(D.date)}</div></div></div></div>
  <div class="il-sc"><div class="il-ring"><svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="52" fill="none" stroke="#ebe4d6" stroke-width="9"/><circle cx="59" cy="59" r="52" fill="none" stroke="#C9A96E" stroke-width="9" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 59 59)"/></svg><div class="il-t"><b>${D.pct}%</b><span>Score</span></div></div>
   <div class="il-stats"><div class="il-stat"><div class="il-n">${D.correct} / ${D.total}</div><div class="il-l">Correct answers</div></div><div class="il-stat"><div class="il-n">${PM}%</div><div class="il-l">Pass mark</div></div><div class="il-stat"><div class="il-n">${diff >= 0 ? "+" : ""}${diff}</div><div class="il-l">Points above pass mark</div></div></div>
   <div class="il-passed">Passed</div></div>
  <div class="il-bd">
   <div class="il-ribbon">${certEsc(D.topLabel)}</div>
   <div class="il-top3">${top.map((s,i) => `<div class="il-card"><div class="il-rk">${i+1}</div><div class="il-nm">${certEsc(s.n)}</div><div class="il-pc">${s.p}%</div><div class="il-mini"><i style="width:${s.p}%"></i></div><div class="il-sb">${s.c} of ${s.t} correct</div></div>`).join("")}</div>
   <div class="il-snap"><div class="il-sec">${certEsc(D.snapLabel)}</div>
   ${sorted.map(s => `<div class="il-row"><div class="il-tn">${certEsc(s.n)}</div><div class="il-track"><div class="il-fill" style="width:${s.p}%"></div><div class="il-mk" style="left:${PM}%"></div></div><div class="il-pv">${s.p}%</div></div>`).join("")}
   <div class="il-legend">Dark marker = ${PM}% pass mark</div></div>
   <div class="il-win"><div class="il-sec">Windows of opportunity</div><div class="il-ttl">Where your next gains are</div>
    <div class="il-wgrid">${low.map(s => `<div class="il-w"><div class="il-a">Next to strengthen</div><div class="il-b">${certEsc(s.n)}</div><div class="il-c">${certWindowText(s.p, PM)}</div></div>`).join("")}</div>
    <div class="il-pw"><div class="il-l"><b>Recommended pathway:</b> ${certEsc(D.pathway)}<br>${certEsc(D.pathwayWhy)}</div><div class="il-off"><code>EXAM15</code><span>15% off any course or pathway, one use, until ${certEsc(D.offerUntil)}</span></div></div></div>
  </div>
  <div class="il-ft"><div class="il-qr">${certQrSvg(verify, 92)}</div>
   <div class="il-m"><b>VERIFY THIS REPORT</b><div class="il-id">${D.id}</div>Scan the code or visit<br><span class="il-url">${CERT_VERIFY.replace("https://","")}</span> and enter the ID.</div><div class="il-seal"><span>Ingles<br>Legal<br>Exam</span></div></div>
  <div class="il-disc">${CERT_DISC}</div></div>`;
}

function certInjectStyles(){
  if(document.getElementById("certStyles")) return;
  const st = document.createElement("style"); st.id = "certStyles"; st.textContent = CERT_CSS + CERT_UI_CSS;
  document.head.appendChild(st);
}
function certFit(on){
  const rep = document.querySelector("#certOverlay .il-rep"); if(!rep) return;
  if(on){ const h = rep.offsetHeight || 1476; rep.style.zoom = String(Math.min(794/820, 1070/h)); }
  else { rep.style.zoom = ""; certZoomToScreen(); }
}
function certZoomToScreen(){
  const rep = document.querySelector("#certOverlay .il-rep"); if(!rep) return;
  rep.style.zoom = String(Math.min(1, (window.innerWidth - 24) / 820));
}
window.addEventListener("beforeprint", () => certFit(true));
window.addEventListener("afterprint", () => certFit(false));
window.addEventListener("resize", certZoomToScreen);

function openCertificate(thenPrint){
  if(!_certD) return;
  certInjectStyles();
  closeCertificate();
  const o = document.createElement("div"); o.id = "certOverlay";
  o.innerHTML = `<div class="certbar"><button type="button" class="${_certD.btn.gold}" onclick="printCertificate()">Save as PDF / Print</button><button type="button" class="${_certD.btn.ghost}" onclick="downloadCertificateFile()">Download file</button><button type="button" class="${_certD.btn.ghost}" onclick="closeCertificate()">Close</button></div><div class="certscroll">${certReportHTML(_certD)}</div>`;
  document.body.appendChild(o); document.body.style.overflow = "hidden"; certZoomToScreen();
  if(thenPrint) setTimeout(printCertificate, 350);
}
function closeCertificate(){
  const o = document.getElementById("certOverlay"); if(o) o.remove();
  document.body.style.overflow = "";
}
function printCertificate(){ try{ window.print(); }catch(e){ alert("Printing is blocked here. Use Download file, then open it and print or save as PDF."); } }
function downloadCertificateFile(){
  if(!_certD) return;
  const html = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingles Legal Proficiency Report ' + _certD.id + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">'
    + '<style>body{margin:0;background:#cfc8bb;padding:24px}' + CERT_CSS + '@page{size:A4 portrait;margin:0}@media print{body{background:#fff;padding:0}.il-rep{zoom:.74;margin:0 auto}}</style></head><body>'
    + certReportHTML(_certD) + '</body></html>';
  const blob = new Blob([html], {type:"text/html"}), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "Ingleslegal_Proficiency_Report_" + _certD.id + ".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function certRegister(D, webhookUrl){
  if(!webhookUrl) return;
  fetch(webhookUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({
    type:"certificate", id:D.id, kind:D.kind, name:D.name, email:D.email, exam:D.exam, level:D.level,
    percent:D.pct, passMark:D.passMark, correct:D.correct, total:D.total, issuedAt:new Date().toISOString()
  })}).catch(() => {});
}
/* Shows the results-screen card and registers the certificate once. D must be complete. */
function certCardHTML(D, webhookUrl){
  certInjectStyles();
  _certD = D;
  if(!D._registered){ D._registered = true; certRegister(D, webhookUrl); }
  return `<div class="certcard"><div class="ct">Proficiency Report</div><div class="headline">Your Proficiency Report is ready</div>
    <p>You passed with <strong>${D.pct}%</strong>. Open your skills report with your strongest areas and next opportunities, save it as a PDF, or share it.</p>
    <div class="certrow"><button type="button" class="${D.btn.gold}" onclick="openCertificate()">View report</button><button type="button" class="${D.btn.ghost}" onclick="openCertificate(true)">Save as PDF</button></div>
    <div class="certidline">Report ID: ${D.id}</div></div>`;
}
function certPct1(c, t){ return Math.round(c / t * 1000) / 10; }

/* ---- Exam-specific certificate data (tier and pathway exams) ---- */
function certBuildExamData(completed, score, pct){
  const isPath = typeof PATHWAY_NAME !== "undefined";
  const mk = (n, c, t) => ({ n: n, c: c, t: t, p: certPct1(c, t) });
  const skills = isPath
    ? courseBreakdown(completed).map(r => mk(r.name, r.correct, r.total))
    : topicStats(completed).map(t => mk(t.cat, t.right, t.total));
  const sorted = skills.slice().sort((a, b) => b.p - a.p);
  const num = parseInt((TIER_LABEL.match(/\d+/) || ["1"])[0], 10);
  let pathway, why, prefix, exam, level;
  if(isPath){
    prefix = (COURSES[0].code.split("-")[1]) || "PW";
    exam = PATHWAY_NAME + " Pathway Exam";
    level = COURSES.length + "-Course Bilingual Pathway";
    pathway = PATHWAY_NAME;
    const low = sorted.slice(-2).reverse().map(s => s.n);
    why = low.length ? "Next, deepen: " + low.join(" and ") + "." : "Keep building your skills in this pathway.";
  } else {
    prefix = "T" + num;
    exam = TIER_LABEL + " Proficiency Exam" + (MODE !== "full" ? " \u00b7 " + lengthLabel() : "");
    level = (["Foundation", "Intermediate", "Advanced"][num - 1] || "Legal") + " Legal English";
    const rec = recommendPathways(completed)[0];
    pathway = PATHWAYS[rec.key].name;
    why = PATHWAYS[rec.key].blurb;
  }
  if(!state._certId) state._certId = certNewId(prefix);
  return {
    id: state._certId, kind: isPath ? "pathway" : "tier",
    name: state.candidate.name || "Candidate", email: state.candidate.email || "",
    exam: exam, level: level, date: certDate(),
    pct: Math.round(pct * 1000) / 10, passMark: Math.round(PASS_THRESHOLD * 100), correct: score, total: completed,
    topLabel: isPath ? "Strongest courses" : "Strongest skills",
    snapLabel: isPath ? "Score by course" : "Skills snapshot",
    skills: skills, pathway: pathway, pathwayWhy: why,
    offerUntil: certDate(new Date(Date.now() + 180 * 24 * 60 * 60 * 1000)),
    btn: { gold: "btn gold", ghost: "btn ghost" }
  };
}
function certCardForExam(completed, partial, passed, score, pct){
  if(partial || !passed) return "";
  if(!state._certD){ state._certD = certBuildExamData(completed, score, pct); }
  return certCardHTML(state._certD, RESULTS_WEBHOOK_URL);
}
</script>
