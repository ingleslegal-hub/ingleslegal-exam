<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingleslegal — Tier 3 Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:#B9AAC4; font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt.selected{ border-color:var(--gold); background:#faf3e4; color:var(--lifted-aubergine); box-shadow:0 0 0 1px var(--gold) inset; }
  .review h2{ margin-top:26px; }
  .rv{ border:1px solid rgba(110,90,121,.2); border-left:4px solid var(--bad); border-radius:3px; padding:14px 16px; margin:0 0 12px; font-family:"Archivo", Arial, sans-serif; background:#fff; }
  .rv.ok{ border-left-color:var(--ok); }
  .rv .rq{ font-size:12px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
  .rv .rs{ font-family:"Spectral", Georgia, serif; font-size:16px; line-height:1.5; color:var(--lifted-aubergine); margin-bottom:10px; white-space:pre-wrap; }
  .rv .ra{ font-size:14px; line-height:1.5; margin:3px 0; }
  .rv .ra.bad{ color:#7a2c1e; } .rv .ra.good{ color:#1f4d38; }
  .rv .rationale{ margin:10px 0 0; }
  details.rvgroup > summary{ cursor:pointer; font-family:"Archivo", Arial, sans-serif; font-weight:600; color:var(--lifted-aubergine); margin:8px 0 12px; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  .topics td.bartd{ width:34%; }
  .bar{ height:8px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar span{ display:block; height:100%; background:var(--gold); }
  .bar.low span{ background:var(--bad); }
  .nextstep{ border:1px solid rgba(110,90,121,.3); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:var(--light-section); }
  .nextstep .headline{ font-weight:600; font-size:16px; margin-bottom:6px; color:var(--lifted-aubergine); }
  .nextstep p{ margin:0 0 12px; font-size:14px; line-height:1.55; }
  .nextstep a.btn{ display:inline-block; text-decoration:none; }
  .filterrow{ font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:0 0 14px; }
  .filterrow select{ margin-left:8px; padding:7px 10px; border-radius:3px; border:1.5px solid rgba(110,90,121,.3); font-family:inherit; font-size:13px; }
  body.results-dark{ background:#1E1226; }
  body.results-dark .card{ background:var(--aubergine); border-color:var(--panel-line); box-shadow:0 2px 12px rgba(0,0,0,.4); }
  body.results-dark h1, body.results-dark h2{ color:var(--gold); }
  body.results-dark .sub, body.results-dark .footer-note, body.results-dark .nextstep p, body.results-dark .filterrow{ color:var(--cream); }
  body.results-dark .synctag{ color:#B9AAC4; }
  body.results-dark table.results th{ background:#1E1226; color:var(--gold); }
  body.results-dark table.results td{ border-color:rgba(110,90,121,.55); color:var(--cream); background:transparent; }
  body.results-dark table.results tr:nth-child(even) td{ background:rgba(255,255,255,.04); }
  body.results-dark .bar{ background:rgba(255,255,255,.12); }
  body.results-dark .placement{ background:#1E1226; }
  body.results-dark .nextstep{ background:#1E1226; border-color:rgba(110,90,121,.55); border-left-color:var(--gold); }
  body.results-dark .nextstep .headline{ color:var(--gold); }
  body.results-dark .rv{ background:#33213D; border-color:rgba(110,90,121,.55); border-left-color:var(--bad); }
  body.results-dark .rv.ok{ border-left-color:var(--ok); }
  body.results-dark .rv .rq{ color:var(--gold); }
  body.results-dark .rv .rs{ color:var(--cream); }
  body.results-dark .rv .ra.bad{ color:#E29585; }
  body.results-dark .rv .ra.good{ color:#7FCBA5; }
  body.results-dark .rationale{ background:rgba(201,169,110,.1); color:var(--cream); }
  body.results-dark .rationale strong{ color:var(--gold); }
  body.results-dark details.rvgroup > summary{ color:var(--cream); }
  body.results-dark .btn.ghost{ color:var(--gold); border-color:var(--gold); }
  body.results-dark .btn.ghost:hover{ background:rgba(201,169,110,.12); }
  body.results-dark .filterrow select{ background:#1E1226; color:var(--cream); border-color:var(--panel-line); }
  .offer{ border:1.5px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:linear-gradient(135deg, rgba(201,169,110,.16), rgba(201,169,110,.04)); }
  .offer .tagline{ font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:4px; }
  .offer .headline{ font-size:20px; font-weight:600; color:var(--cream); margin-bottom:6px; }
  .offer p{ margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--cream); }
  .offer .coderow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .offer code{ font-family:"Courier New", monospace; font-size:20px; letter-spacing:2px; font-weight:700; color:var(--gold); border:1.5px dashed var(--gold); padding:8px 16px; border-radius:3px; background:#1E1226; }
  .sharebox{ border:1px solid rgba(110,90,121,.55); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:#1E1226; }
  .sharebox .headline{ font-weight:600; font-size:16px; color:var(--gold); margin-bottom:6px; }
  .sharebox p{ margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--cream); }
  .sharerow{ display:flex; gap:10px; flex-wrap:wrap; }
  .sharerow a.btn{ display:inline-block; text-decoration:none; }
  .rec{ border-top:1px solid rgba(110,90,121,.55); padding-top:12px; margin-top:12px; }
  .rec .recname{ font-weight:600; color:var(--cream); font-size:15px; }
  .rec .recwhy{ font-size:13px; color:#B9AAC4; margin:2px 0 8px; }
  .rec p{ margin:0 0 10px; }
  .rec .pill{ display:inline-block; font-size:10px; letter-spacing:.6px; text-transform:uppercase; background:var(--gold); color:var(--aubergine); padding:2px 8px; border-radius:10px; margin-right:8px; font-weight:700; vertical-align:middle; }
  body.results-dark .section-label{ color:var(--gold); }
  body.results-dark .section-note{ color:var(--cream); }
  body.results-dark .coursecode{ color:var(--gold); }
  body.results-dark table.results td.below{ color:#E29585; }
  /* ===== Entry screen: matches the Career Pathway Exams menu (pathways/index.html) ===== */
  body.entry{ background:var(--aubergine); color:var(--cream); font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; }
  body.entry .topbar{ display:none; }
  body.entry .wrap{ max-width:640px; padding:32px 16px 48px; }
  body.entry .card{ background:transparent; border:none; box-shadow:none; padding:0; }
  .entry-logo{ text-align:center; margin-bottom:24px; }
  .entry-logo img{ width:100%; max-width:320px; height:auto; display:inline-block; }
  .entry-card{ background:#3D2A47; border:1px solid var(--panel-line); border-radius:14px; padding:28px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .entry-eyebrow{ text-transform:uppercase; letter-spacing:.11em; font-size:.72rem; font-weight:700; color:var(--gold); background:var(--aubergine); display:inline-block; padding:.3em .7em; border-radius:999px; margin-bottom:14px; }
  .entry-card h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:2rem; line-height:1.2; margin:0 0 .4em; color:var(--gold); letter-spacing:0; }
  .entry-card p{ line-height:1.6; color:var(--cream); margin:.3em 0 0; }
  .entry-card label{ display:block; font-size:.85rem; font-weight:600; margin:16px 0 6px; color:var(--cream); }
  .entry-card label.first{ margin-top:18px; }
  .entry-card input[type=text], .entry-card input[type=email], .entry-card select{ width:100%; font-size:1rem; font-family:inherit; padding:8px 12px; border:1px solid var(--panel-line); border-radius:8px; background:var(--aubergine); color:var(--cream); }
  .entry-card select{ font-size:.95rem; }
  .entry-card input::placeholder{ color:#9C8CA8; }
  .entry-card input:focus, .entry-card select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(216,179,100,.2); }
  .entry-card #inBranchOther{ margin-top:8px; }
  .entry-hint{ font-size:.82rem; color:#B9AAC4; margin-top:6px; line-height:1.45; }
  .entry-error{ color:#E29585; font-size:.9rem; min-height:1.3em; margin-top:14px; }
  .entry-btn{ font:inherit; font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; font-weight:700; cursor:pointer; border-radius:8px; border:none; padding:12px 20px; font-size:.95rem; background:var(--gold); color:var(--aubergine); width:100%; transition:opacity .18s ease; }
  .entry-btn:hover{ opacity:.92; }
  .entry-note{ font-size:.8rem; color:#B9AAC4; margin-top:14px; text-align:center; }
  @media (max-width:600px){ .entry-card{ padding:22px 18px; } .entry-card h1{ font-size:1.6rem; } }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }

/* ===== Vocabulary-style theme: question and batch screens (same as the pathway exams) ===== */
.logo-wrap{ text-align:center; padding:28px 16px 0; }
.logo-wrap img{ width:100%; max-width:320px; height:auto; display:inline-block; }
body.results-dark .logo-wrap{ display:none; }
body:not(.results-dark) .topbar{ display:none; }
body:not(.results-dark){ background:#2A1B33; color:#F1EBDE; font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; color-scheme:dark; }
body:not(.results-dark) .wrap, body:not(.results-dark) .progress-shell{ max-width:640px; }
body:not(.results-dark) .progress-shell{ padding-top:22px; }
body:not(.results-dark) #tabs{ display:none; }
body:not(.results-dark) .bar-outer{ background:#2A1B33; height:6px; border-radius:3px; margin-bottom:-8px; }
body:not(.results-dark) .bar-inner{ background:#C9A96E; }
body:not(.results-dark) .card{ background:#3D2A47; border:1px solid #6E5A79; border-radius:14px; padding:28px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
body:not(.results-dark) h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:2rem; line-height:1.2; margin:0 0 .4em; color:#C9A96E; }
body:not(.results-dark) h2{ font-family:'Fraunces',Georgia,serif; font-weight:600; color:#F1EBDE; }
body:not(.results-dark) .sub{ font-family:inherit; font-size:1rem; line-height:1.6; color:#F1EBDE; margin-bottom:6px; }
body:not(.results-dark) .footer-note{ font-family:inherit; color:#B9AAC4; text-align:center; }
.eyebrow{ text-transform:uppercase; letter-spacing:.11em; font-size:.72rem; font-weight:700; color:#C9A96E; background:#2A1B33; display:inline-block; padding:.3em .7em; border-radius:999px; margin-bottom:14px; font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; }
body:not(.results-dark) .field{ margin-bottom:0; font-family:inherit; }
body:not(.results-dark) .field label{ color:#F1EBDE; font-weight:600; font-size:.85rem; margin:16px 0 6px; }
body:not(.results-dark) .field input, body:not(.results-dark) .field select{ width:100%; padding:8px 12px; border:1px solid #6E5A79; border-radius:8px; background:#2A1B33; color:#F1EBDE; font-size:1rem; font-family:inherit; }
body:not(.results-dark) .field input:focus, body:not(.results-dark) .field select:focus{ outline:none; border-color:#C9A96E; box-shadow:0 0 0 2px rgba(216,179,100,.2); }
.hint{ font-size:.82rem; color:#B9AAC4; margin-top:6px; line-height:1.45; font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; }
.formerr{ color:#E29585; font-size:.9rem; min-height:1.3em; margin-top:14px; font-family:'Source Sans 3','Segoe UI',Tahoma,sans-serif; }
.vq-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:16px; }
.vq-count{ white-space:nowrap; font-size:.85rem; color:#A9713F; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.vq-cat{ font-size:.75rem; color:#C9A96E; font-weight:600; text-align:right; text-transform:uppercase; }
body:not(.results-dark) .stem{ font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:1.5rem; line-height:1.3; color:#F1EBDE; margin:0 0 16px; }
body:not(.results-dark) .stem.long{ font-size:1.12rem; font-weight:600; line-height:1.5; }
body:not(.results-dark) .opt{ background:#3D2A47; border:1px solid #6E5A79; border-radius:8px; color:#F1EBDE; padding:12px 14px; margin:8px 0 0; font-family:inherit; font-size:.95rem; font-weight:600; line-height:1.4; }
body:not(.results-dark) .opt:hover:not(:disabled){ border-color:#C9A96E; background:rgba(216,179,100,.06); }
body:not(.results-dark) .opt.selected{ border-color:#C9A96E; background:rgba(216,179,100,.15); color:#C9A96E; box-shadow:none; }
body:not(.results-dark) .navrow{ gap:12px; margin-top:22px; font-family:inherit; }
body:not(.results-dark) .btn{ background:#C9A96E; color:#2A1B33; border-radius:8px; font-family:inherit; font-weight:700; font-size:.95rem; padding:12px 20px; letter-spacing:0; }
body:not(.results-dark) .btn:hover{ background:#C9A96E; opacity:.92; }
body:not(.results-dark) .btn:disabled{ background:#C9A96E; color:#2A1B33; opacity:.4; cursor:not-allowed; }
body:not(.results-dark) .btn.ghost{ background:transparent; color:#C9A96E; border:1.5px solid #C9A96E; }
body:not(.results-dark) .btn.ghost:hover{ background:rgba(201,169,110,.12); opacity:1; }
body:not(.results-dark) .navrow .btn.next, body:not(.results-dark) .navrow .btn.gold{ flex:1; }
body:not(.results-dark) .btn.block{ width:100%; margin-top:20px; }
body:not(.results-dark) .scorebox{ font-family:inherit; }
body:not(.results-dark) .scorebox .cell{ background:#2A1B33; border-color:#6E5A79; }
body:not(.results-dark) .scorebox .num{ color:#C9A96E; font-family:inherit; }
body:not(.results-dark) .scorebox .lbl{ color:#B9AAC4; }
@media (max-width:600px){
  body:not(.results-dark) .card{ padding:22px 18px; }
  body:not(.results-dark) h1{ font-size:1.6rem; }
  body:not(.results-dark) .stem{ font-size:1.25rem; }
  body:not(.results-dark) .stem.long{ font-size:1.05rem; }
}
/* The entry screen draws its own logo inside the card area. */
body.entry .logo-wrap{ display:none; }
body.entry .card{ background:transparent; border:none; box-shadow:none; padding:0; }
@media (max-width:600px){ body.entry .card{ padding:0; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brandmark">
    <svg width="32" height="32" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M18,4 A16,16 0 0 0 18,36" fill="none" stroke="#6E5A79" stroke-width="1.5"/>
