const ALL_QUESTIONS = [{"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El tribunal se declaró sin competencia para conocer del caso.\"", "opts": ["The court refused to learn about the case.", "The court found that it lacked jurisdiction to hear the case.", "The court declared itself incompetent to know the case.", "The court said it had no competition to recognize the case."], "a": 1, "fb": "La competencia de un tribunal es \"jurisdiction\", y \"conocer de un caso\" es \"to hear a case\". \"Incompetent\" significa incapaz y \"competition\" significa rivalidad."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El actual representante legal de la sociedad firmó el contrato.\"", "opts": ["The former legal representative of the company signed the contract.", "The current legal representative of the company signed the contract.", "The acting legal representative of the company signed the contract.", "The actual legal representative of the society signed the contract."], "a": 1, "fb": "\"Actual\" en inglés significa real o verdadero, \"acting\" significa interino y \"former\" significa anterior. Una sociedad comercial es una \"company\", no una \"society\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Eventualmente, el arrendatario podrá solicitar una prórroga del contrato.\"", "opts": ["Eventually, the tenant will request a prorogation of the contract.", "Finally, the landlord may grant an extension of the lease.", "If the need arises, the tenant may request an extension of the lease.", "Occasionally, the tenant must request a renewal of the lease."], "a": 2, "fb": "\"Eventually\" significa \"con el tiempo\", no \"llegado el caso\". \"Prorogation\" es la suspensión de un parlamento. \"Podrá\" se traduce \"may\" (una facultad), no \"will\" ni \"must\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El abogado no asistió a la audiencia de conciliación.\"", "opts": ["The lawyer did not assist the conciliation audience.", "The attorney did not attend the settlement conference.", "The lawyer did not appear for the audience of conciliation.", "The attorney did not help at the reconciliation hearing."], "a": 1, "fb": "\"Asistir\" es \"to attend\" (\"to assist\" es ayudar), y \"audiencia\" no es \"audience\" (el público). En EE. UU., la audiencia con el juez para buscar un acuerdo suele llamarse \"settlement conference\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El demandante pretende una indemnización de USD 50.000.\"", "opts": ["The plaintiff seeks $50,000 in damages.", "The plaintiff intends to pay $50,000 in damages.", "The plaintiff pretends to be owed $50,000.", "The plaintiff pretends an indemnization of $50,000."], "a": 0, "fb": "\"Pretender\" en un escrito es \"to seek\". \"To pretend\" significa fingir, así que la última opción dice que el demandante finge que le deben el dinero."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El abogado ignoraba que el plazo había vencido.\"", "opts": ["The attorney knew that the deadline had passed.", "The attorney ignored that the deadline had expired.", "The attorney was unaware that the deadline had passed.", "The attorney was ignorant that the term had won."], "a": 2, "fb": "\"Ignorar\" algo (no saberlo) es \"to be unaware\". \"To ignore\" significa no hacer caso a propósito, lo que cambia la responsabilidad del abogado."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El juez rechazó la solicitud por extemporánea.\"", "opts": ["The judge postponed the motion as premature.", "The judge disestimated the motion for being extemporaneous.", "The judge granted the motion even though it was late.", "The judge denied the motion as untimely."], "a": 3, "fb": "\"Extemporáneo\" (presentado fuera de plazo) es \"untimely\". En inglés, \"extemporaneous\" significa improvisado, sin preparación."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"La abogada realizó una revisión del expediente.\"", "opts": ["The attorney realized that the case file had been revised.", "The attorney made changes to the case file.", "The attorney realized a revision of the expedient.", "The attorney conducted a review of the case file."], "a": 3, "fb": "\"Realizar\" una actividad es \"to conduct\" o \"to carry out\". \"To realize\" significa darse cuenta, y \"revision\" significa cambio o corrección, no revisión."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"La policía registró el vehículo sin orden judicial.\"", "opts": ["The police searched the vehicle without a warrant.", "The police seized the vehicle without a warrant.", "The police recorded the vehicle without a court order.", "The police registered the vehicle without a judicial order."], "a": 0, "fb": "\"Registrar\" (inspeccionar) es \"to search\". \"To register\" significa inscribir, y \"to seize\" significa incautar, que es otra actuación."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Le advertimos al cliente sobre los riesgos de ir a juicio.\"", "opts": ["We noticed the client about the risks of the trial.", "We alerted the client's risks about the judgment.", "We warned the client about the risks of going to trial.", "We advertised the client about the risks of the judgment."], "a": 2, "fb": "\"Advertir\" es \"to warn\". \"To advertise\" significa hacer publicidad, y \"to notice\" significa notar. \"Ir a juicio\" es \"going to trial\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Nuestro despacho ejerce el derecho de inmigración desde 2010.\"", "opts": ["Our office exercises the immigration right since 2010.", "Our firm has practiced immigration law since 2010.", "Our firm is practicing in the immigration right from 2010.", "Our firm has exercised immigration rights since 2010."], "a": 1, "fb": "Ejercer una profesión es \"to practice\". \"Derecho\" como disciplina es \"law\"; \"right\" es un derecho de una persona."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Los parientes del fallecido impugnaron el testamento.\"", "opts": ["The relatives of the deceased protested the will.", "The relatives of the deceased contested the testimony.", "The relatives of the deceased contested the will.", "The parents of the deceased contested the will."], "a": 2, "fb": "\"Parientes\" son \"relatives\"; \"parents\" son solo el padre y la madre. \"Testimony\" es un testimonio, e impugnar un testamento es \"to contest a will\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El acusado tiene derecho a un abogado de oficio.\"", "opts": ["The defendant has right to an office lawyer.", "The defendant is entitled to an officious lawyer.", "The defendant is entitled to a court-appointed attorney.", "The defendant has the right to an in-house attorney."], "a": 2, "fb": "El abogado que asigna el tribunal es un \"court-appointed attorney\" (o \"public defender\"). \"In-house attorney\" es el abogado interno de una empresa, y \"officious\" significa entrometido."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"La información del cliente es confidencial y sensible.\"", "opts": ["The client's information is confidential and sensible.", "The client's information is confident and sensitive.", "The client's information is trustful and sensible.", "The client's information is confidential and sensitive."], "a": 3, "fb": "\"Sensible\" (información delicada) es \"sensitive\". En inglés, \"sensible\" significa sensato, y \"confident\" significa seguro de sí mismo."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"La audiencia fue un éxito para nuestro cliente.\"", "opts": ["The hearing was an exit for our client.", "The hearing was successive for our client.", "The audience was a success for our client.", "The hearing was a success for our client."], "a": 3, "fb": "\"Éxito\" es \"success\", y \"exit\" significa salida. \"Audience\" es el público, no la audiencia judicial (\"hearing\")."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El abogado le pidió al cliente que no molestara a los testigos.\"", "opts": ["The attorney asked the client not to modify the witnesses.", "The attorney asked the client to stop being bothered by the witnesses.", "The attorney asked the client not to bother the witnesses.", "The attorney asked the client not to molest the witnesses."], "a": 2, "fb": "\"Molestar\" es \"to bother\" o \"to harass\". En inglés, \"to molest\" significa abusar sexualmente de alguien, un error muy grave en un documento legal."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Los honorarios se pagarán en efectivo.\"", "opts": ["The honoraries will be paid in cash.", "The fees will be paid effectively.", "The fees will be paid in cash.", "The fees will be paid in effective."], "a": 2, "fb": "\"En efectivo\" es \"in cash\", y \"effectively\" significa de manera eficaz. Los honorarios de un abogado son \"fees\"; \"honorarium\" es un pago simbólico, por ejemplo a un conferencista."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Guarde los documentos en la carpeta del cliente.\"", "opts": ["Keep the documents in the client's folder.", "Keep the documents in the client's carpet.", "Keep the documents in the client's portfolio.", "Keep the documents in the client's cabinet."], "a": 0, "fb": "\"Carpeta\" es \"folder\" (o \"file\"). \"Carpet\" significa alfombra, \"portfolio\" es una cartera de inversiones o de trabajos y \"cabinet\" es un mueble o archivador."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"Tenemos que resumir el expediente antes de la audiencia.\"", "opts": ["We have to resume the expedient before the audience.", "We need to summarize the case file before the hearing.", "We need to resume work on the case file before the hearing.", "We need to sum up the expedient's audience."], "a": 1, "fb": "\"Resumir\" es \"to summarize\". \"To resume\" significa reanudar, así que la tercera opción dice \"retomar el trabajo\"."}, {"cat": "Falsos amigos", "stem": "Elija la mejor traducción al inglés:\n\"El suceso ocurrió a las 10 de la noche.\"", "opts": ["The succession occurred at 10 p.m.", "The happening succeeded at 10 p.m.", "The success occurred at 10 p.m.", "The incident occurred at 10 p.m."], "a": 3, "fb": "\"Suceso\" es \"incident\" o \"event\". \"Success\" significa éxito, y \"succession\" significa sucesión, por ejemplo hereditaria."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Las partes acuerdan que el presente contrato se regirá por las leyes del Estado de Florida.\"", "opts": ["The parties agree that this Agreement shall be governed by the laws of the State of Florida.", "Both sides are OK with this contract being under Florida law.", "The parties agree that this Agreement shall govern the laws of the State of Florida.", "The parties agree that the present contract will be ruled by the laws of the State of Florida."], "a": 0, "fb": "Es la fórmula estándar de la cláusula de ley aplicable (\"governing law clause\"). Una opción tiene un registro demasiado informal para un contrato, y otra invierte el sentido: no es el contrato el que rige las leyes, sino las leyes las que rigen el contrato."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Arrendatario se obliga a pagar el canon dentro de los cinco primeros días de cada mes.\"", "opts": ["The Tenant obliges himself to pay the canon within the first five days of each month.", "The Tenant shall pay the rent within the first five days of each month.", "The Tenant may pay the rent within the first five days of each month.", "The Landlord shall pay the rent within the first five days of each month."], "a": 1, "fb": "Una obligación contractual se expresa con \"shall\". \"May\" la convierte en una facultad, y el canon de arrendamiento es la \"rent\", no \"canon\"."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Ninguna de las partes podrá ceder este contrato sin el consentimiento previo y por escrito de la otra.\"", "opts": ["Neither party may assign this Agreement without the prior written consent of the other party.", "Neither party may assign this Agreement with the prior written consent of the other party.", "Neither party shall cede this contract without the previous and written consent of the other.", "Either party may assign this Agreement without the prior written consent of the other party."], "a": 0, "fb": "Ceder un contrato es \"to assign\", y la fórmula es \"prior written consent\". Las otras dos opciones con \"assign\" cambian el sentido: una permite la cesión sin consentimiento y la otra la prohíbe aun con consentimiento."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El presente contrato constituye el acuerdo total entre las partes y reemplaza cualquier acuerdo anterior.\"", "opts": ["This Agreement constitutes a partial agreement between the parties and supplements all prior agreements.", "This Agreement constitutes the entire agreement between the parties and supersedes all prior agreements.", "This Agreement constitutes the entire agreement between the parties and is superseded by all prior agreements.", "The present contract constitutes the total accord between the parts and replaces any anterior agreement."], "a": 1, "fb": "Es la cláusula de acuerdo total (\"entire agreement clause\"). El verbo es \"supersede\" en voz activa: este contrato reemplaza a los anteriores, no al revés."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Ninguna demora en el ejercicio de un derecho constituirá una renuncia al mismo.\"", "opts": ["No delay in exercising any right shall operate as an exercise thereof.", "Any delay in exercising a right shall operate as a waiver thereof.", "No demur in the exercise of a right will constitute a resignation to it.", "No delay in exercising any right shall operate as a waiver thereof."], "a": 3, "fb": "Renunciar a un derecho es \"waiver\". \"Resignation\" es renunciar a un cargo y \"demur\" es una excepción procesal. La tercera opción dice lo contrario: que cualquier demora implica renuncia."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Vendedor garantiza que los bienes están libres de gravámenes.\"", "opts": ["The Seller warrants that the goods are free of charge.", "The Buyer warrants that the goods are free and clear of all liens and encumbrances.", "The Seller warrants that the goods are free and clear of all liens and encumbrances.", "The Seller guarantees that the goods are free of all taxes and impositions."], "a": 2, "fb": "Garantizar algo en un contrato es \"to warrant\", y los gravámenes son \"liens and encumbrances\". \"Free of charge\" significa gratis."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Las partes se comprometen a mantener la confidencialidad de la información durante la vigencia del contrato y dos años después de su terminación.\"", "opts": ["The parties undertake to keep the information confidential during the term of this Agreement and for two years after its termination.", "The parties undertake to keep the information confidential for two years, starting on the termination of this Agreement.", "The parties compromise to maintain the confidentiality during the vigency of the contract and two years after its termination.", "The parties undertake to keep the information confidential during the term of this Agreement and for two years before its termination."], "a": 0, "fb": "Comprometerse es \"to undertake\" o \"to agree\". \"To compromise\" significa ceder en una negociación o poner algo en riesgo. Las dos últimas opciones cambian el periodo de la obligación."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El incumplimiento de cualquiera de las obligaciones dará derecho a la parte cumplida a terminar el contrato.\"", "opts": ["Any breach of this Agreement shall entitle the non-breaching party to terminate it.", "Any breach of this Agreement shall oblige the non-breaching party to terminate it.", "Any breach of this Agreement shall entitle the breaching party to terminate it.", "The non-compliance of any obligation will give right to the complied party to finish the contract."], "a": 0, "fb": "La parte cumplida es la \"non-breaching party\", y \"dar derecho\" es \"to entitle\". \"Oblige\" la convertiría en una obligación."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Si alguna disposición de este contrato fuere declarada nula, las demás disposiciones conservarán su validez.\"", "opts": ["If any disposition of this contract were declared null, the other dispositions will conserve their validity.", "If any provision of this Agreement is held invalid, the remaining provisions shall be renegotiated.", "If any provision of this Agreement is held invalid, the entire Agreement shall be void.", "If any provision of this Agreement is held invalid, the remaining provisions shall remain in full force and effect."], "a": 3, "fb": "Es la cláusula de divisibilidad (\"severability clause\"). Las disposiciones de un contrato son \"provisions\"; \"disposition\" significa resolución final o temperamento."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Contratista indemnizará y mantendrá indemne al Contratante frente a cualquier reclamación de terceros.\"", "opts": ["The Contractor shall be indemnified and held harmless by the Client from any third-party claims.", "The Contractor shall indemnify and hold harmless the Client from and against any third-party claims.", "The Contractor will indemnize and maintain indemnified the Contracting from any claim of thirds.", "The Client shall indemnify and hold harmless the Contractor from and against any third-party claims."], "a": 1, "fb": "La fórmula es \"indemnify and hold harmless... from and against\". Las dos últimas opciones invierten quién protege a quién."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El precio no incluye impuestos.\"", "opts": ["The price excludes the impositions.", "The price is exclusive of taxes.", "The price is exempt from taxes.", "The price is inclusive of taxes."], "a": 1, "fb": "\"Exclusive of taxes\" significa que los impuestos se suman al precio. \"Exempt from taxes\" significa que no se pagan impuestos, que es otra cosa."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El pago se hará mediante transferencia bancaria a la cuenta que designe el Proveedor.\"", "opts": ["Payment shall be made in cash to the account designated by the Supplier.", "Payment shall be made by wire transfer to the account designated by the Supplier.", "The payment will make itself through bank transference to the account designed by the Provider.", "Payment shall be made by wire transfer to the account designated by the Customer."], "a": 1, "fb": "Se dice \"wire transfer\", y \"designate\" significa señalar o indicar; \"design\" significa diseñar."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"En caso de mora, se causarán intereses moratorios a la tasa máxima legal.\"", "opts": ["In the event of prepayment, interest shall accrue at the maximum rate permitted by law.", "In the event of late payment, interest shall be waived up to the maximum rate permitted by law.", "In the event of late payment, interest shall accrue at the maximum rate permitted by law.", "In case of moratorium, moratory interests will be caused at the maximum legal tax."], "a": 2, "fb": "Los intereses \"accrue\" (se causan) a una \"rate\" (tasa). \"Tax\" significa impuesto, y \"moratorium\" es una suspensión general de pagos."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Cualquiera de las partes podrá dar por terminado este contrato mediante aviso escrito con treinta (30) días de antelación.\"", "opts": ["Either party may terminate this Agreement upon thirty (30) days' prior written notice.", "Only the Supplier may terminate this Agreement upon thirty (30) days' prior written notice.", "Either party shall terminate this Agreement thirty (30) days after written notice.", "Any of the parts may finish this contract through written warning with thirty (30) days of anticipation."], "a": 0, "fb": "\"Podrá\" es \"may\" (una facultad); \"shall\" lo convierte en una obligación. \"De antelación\" es \"prior notice\", y \"anticipation\" significa expectativa."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Comprador tendrá un plazo de diez (10) días hábiles para inspeccionar la mercancía.\"", "opts": ["The Buyer shall have ten (10) business days to inspect the goods.", "The Buyer will have a term of ten (10) habile days to inspect the merchandise.", "The Buyer shall have ten (10) calendar days to inspect the goods.", "The Seller shall have ten (10) business days to inspect the goods."], "a": 0, "fb": "Los días hábiles son \"business days\"; los \"calendar days\" incluyen fines de semana y festivos."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Las partes renuncian expresamente a su derecho a un juicio con jurado.\"", "opts": ["The parties expressly reserve their right to a jury trial.", "The parties expressly waive their right to arbitration.", "The parties expressly resign their right to a trial with jury.", "The parties expressly waive their right to a jury trial."], "a": 3, "fb": "Renunciar a un derecho es \"to waive\". \"Resign\" es renunciar a un cargo, y \"reserve\" significa conservar el derecho."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"Las obligaciones de confidencialidad subsistirán después de la terminación del contrato.\"", "opts": ["The confidentiality obligations shall expire upon the termination of this Agreement.", "The confidentiality obligations shall come into force upon the termination of this Agreement.", "The confidentiality obligations will overlive the end of the contract.", "The confidentiality obligations shall survive the termination of this Agreement."], "a": 3, "fb": "Una obligación que sigue vigente después de terminado el contrato \"survives\" (\"survival clause\"). La última opción dice que la obligación empieza al terminar el contrato, no que continúa."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Cliente reembolsará al Despacho los gastos razonables en que incurra.\"", "opts": ["The Client will reimburse to the Dispatch the reasonable expenses it incurs.", "The Client shall reimburse the Firm for reasonable expenses incurred.", "The Firm shall reimburse the Client for reasonable expenses incurred.", "The Client shall reimburse the Firm for all expenses incurred, whether reasonable or not."], "a": 1, "fb": "El despacho de abogados es la \"Firm\", y \"dispatch\" significa envío. La fórmula es \"reimburse [alguien] for expenses incurred\"."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El presente contrato se firma en dos ejemplares del mismo tenor.\"", "opts": ["This contract is signed in two examples of the same tenor.", "This Agreement is executed in two counterparts, each of which shall be deemed an original.", "This Agreement is executed by two signatories of the same tenure.", "This Agreement shall be executed in two languages, each of which shall prevail."], "a": 1, "fb": "Cada ejemplar firmado es un \"counterpart\". \"Tenor\" es una voz de cantante y \"tenure\" es la permanencia en un cargo."}, {"cat": "Cláusulas contractuales", "stem": "Elija la mejor traducción al inglés:\n\"El Proveedor no será responsable por demoras causadas por circunstancias ajenas a su control.\"", "opts": ["The Supplier shall be liable for delays caused by circumstances beyond its reasonable control.", "The Supplier shall not be liable for delays caused by circumstances within its reasonable control.", "The Supplier shall not be liable for delays caused by circumstances beyond its reasonable control.", "The Provider will not be responsible for demurs caused by circumstances alien to its control."], "a": 2, "fb": "\"Ajeno a su control\" es \"beyond its control\", y la responsabilidad contractual es \"liable\". \"Alien\" se usa para cosas extrañas o para extranjeros."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El demandado contestó la demanda dentro del término legal.\"", "opts": ["The defendant filed an answer to the complaint within the time allowed by law.", "The plaintiff filed an answer to the complaint within the time allowed by law.", "The defendant answered the complaint after the deadline had passed.", "The defendant contested the demand within the legal term."], "a": 0, "fb": "Contestar la demanda es \"to file an answer to the complaint\". \"To contest\" significa impugnar, y \"demand\" no es la demanda judicial."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Solicito respetuosamente al Despacho que decrete el embargo de los bienes del demandado.\"", "opts": ["I respectfully request that the Court release the defendant's property from attachment.", "I respectfully request that the Court order the defendant to purchase the property.", "I respectfully solicit the Office to decree the embargo of the defendant's goods.", "I respectfully request that the Court order the attachment of the defendant's property."], "a": 3, "fb": "En un escrito, \"el Despacho\" es \"the Court\". El embargo judicial de bienes es \"attachment\" (o \"levy\"); \"embargo\" en inglés es una prohibición de comerciar con un país."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"La parte demandante apeló la sentencia de primera instancia.\"", "opts": ["The demanding party appealed the first instance sentence.", "The defendant appealed the trial court's judgment.", "The plaintiff appealed the trial court's judgment.", "The plaintiff filed a motion for reconsideration of the trial court's judgment."], "a": 2, "fb": "La sentencia de primera instancia es el \"trial court's judgment\". Una \"motion for reconsideration\" se presenta ante el mismo juez, como el recurso de reposición."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Se fija el 15 de marzo como fecha para el juicio.\"", "opts": ["The trial is set for March 15.", "The hearing on the motion is set for March 15.", "The trial was held on March 15.", "The audience of judgment is fixed for March 15."], "a": 0, "fb": "Se dice \"the trial is set for\". \"Audience of judgment\" no tiene sentido en inglés, y \"was held\" indica que el juicio ya ocurrió."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El testigo manifestó que no le constaban los hechos.\"", "opts": ["The witness stated that he had no personal knowledge of the facts.", "The witness stated that the facts were not true.", "The witness manifested that the facts did not consist to him.", "The witness refused to testify about the facts."], "a": 0, "fb": "\"No me consta\" significa no tener conocimiento personal (\"personal knowledge\"). No es lo mismo que negar los hechos."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El apoderado de la parte demandada solicitó el aplazamiento de la audiencia.\"", "opts": ["Defense counsel moved to dismiss the hearing.", "The empowered of the demanded party solicited the postponement of the audience.", "Plaintiff's counsel moved for a continuance of the hearing.", "Defense counsel moved for a continuance of the hearing."], "a": 3, "fb": "El aplazamiento de una audiencia es una \"continuance\", y pedirla al juez es \"to move for\". \"Apoderado\" no se traduce como \"empowered\"."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés (contestación de demanda):\n\"Niego los hechos 3 y 4 de la demanda por no ser ciertos.\"", "opts": ["Defendant lacks knowledge of the allegations in paragraphs 3 and 4 of the complaint.", "Defendant admits the allegations in paragraphs 3 and 4 of the complaint.", "I deny the facts 3 and 4 of the demand for not being certain.", "Defendant denies the allegations in paragraphs 3 and 4 of the complaint."], "a": 3, "fb": "En una contestación de EE. UU. se responde a las \"allegations\" de cada párrafo, en tercera persona. \"Certain\" significa seguro, no cierto."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés (en un escrito):\n\"Con el debido respeto, me permito presentar las siguientes consideraciones.\"", "opts": ["Defendant respectfully submits the following.", "Respectfully, I give myself permission to consider the following.", "With all respect, I allow the following presentations.", "With the due respect, I permit myself to present the following considerations."], "a": 0, "fb": "En un escrito de EE. UU. la fórmula es \"respectfully submits\", a menudo en tercera persona. \"Permit myself\" es un calco que no se usa."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El juzgado admitió la demanda y ordenó notificar al demandado.\"", "opts": ["The court accepted the complaint for filing and ordered service on the defendant.", "The court accepted the complaint and ordered the defendant to pay.", "The court admitted the demand and ordered to notify the demanded.", "The court dismissed the complaint and ordered service on the defendant."], "a": 0, "fb": "En EE. UU. no hay un auto admisorio como tal; lo más cercano es \"accepted for filing\". Notificar al demandado es \"service on the defendant\"."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Se condena al demandado a pagar la suma de USD 20.000 más intereses.\"", "opts": ["The defendant is sentenced to pay $20,000 plus interest.", "The demanded is condemned to pay the sum of $20,000 plus interests.", "Judgment is entered against the defendant in the amount of $20,000, plus interest.", "Judgment is entered for the defendant in the amount of $20,000, plus interest."], "a": 2, "fb": "En lo civil, \"judgment is entered against\" una parte. \"Sentenced\" es solo para penas, e \"interest\" no lleva -s en este sentido."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"La parte actora no acreditó el daño.\"", "opts": ["The plaintiff failed to report the damage.", "The acting party did not accredit the damage.", "The plaintiff failed to prove damages.", "The actor failed to credit the damages."], "a": 2, "fb": "La parte actora es el \"plaintiff\", y \"acreditar\" en un proceso es probar (\"to prove\"). \"Accredit\" significa acreditar a una institución o a un diplomático."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El juez negó la solicitud de medida cautelar.\"", "opts": ["The judge negated the solicitude of cautelar measure.", "The judge denied the request for a protective order in discovery.", "The judge granted the request for a preliminary injunction.", "The judge denied the request for a preliminary injunction."], "a": 3, "fb": "Una medida cautelar es una \"preliminary injunction\" (o \"temporary restraining order\" si es urgente). El juez \"denies\", no \"negates\"."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Las partes llegaron a un acuerdo conciliatorio que pone fin al proceso.\"", "opts": ["The parties reached a settlement that reopens the case.", "The parties reached a verdict that ends the case.", "The parties reached a settlement that ends the case.", "The parties arrived at a conciliatory accord that puts end to the process."], "a": 2, "fb": "El acuerdo que termina el pleito es un \"settlement\". \"Process\" en inglés jurídico se refiere a los documentos que se notifican (\"service of process\"), no al proceso judicial."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Se corre traslado a la parte demandada por el término de diez días.\"", "opts": ["The defendant must pay within ten days.", "Transfer is run to the demanded party for the term of ten days.", "The defendant shall have ten days to respond.", "The case is transferred to the defendant's court for ten days."], "a": 2, "fb": "\"Correr traslado\" no tiene un equivalente literal: se explica su efecto (\"shall have ten days to respond\")."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El dictamen pericial concluyó que el vehículo circulaba a exceso de velocidad.\"", "opts": ["The police report concluded that the vehicle was speeding.", "The expert witness dictated that the vehicle was circulating at excessive speed.", "The expert report concluded that the vehicle was speeding.", "The pericial dictamen concluded that the vehicle was circulating at excess of velocity."], "a": 2, "fb": "El dictamen pericial es el \"expert report\", y \"circular a exceso de velocidad\" es \"to be speeding\". Una opción cambia la fuente del informe, de un perito a la policía."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El abogado presentó un memorial solicitando copias del expediente.\"", "opts": ["The attorney requested a memorial service for the case file.", "The attorney presented a memorial soliciting copies of the expedient.", "The attorney filed a motion to seal the case file.", "The attorney filed a request for copies of the case file."], "a": 3, "fb": "En inglés, \"memorial\" significa monumento o ceremonia conmemorativa. Un memorial es un \"filing\", \"request\" o \"motion\"."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"Solicito se tenga como prueba el documento anexo.\"", "opts": ["I request that the attached document be filed under seal.", "I request that the attached document be admitted into evidence.", "I solicit that the annexed document is had as proof.", "I request that the attached document be excluded from evidence."], "a": 1, "fb": "Se dice \"admitted into evidence\". \"Filed under seal\" significa presentado con reserva, para que no sea público."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El testimonio fue tachado por el parentesco del testigo con el demandante.\"", "opts": ["The witness was impeached for bias because of his family relationship with the plaintiff.", "The witness was disqualified as an expert because of his relationship with the plaintiff.", "The witness was arrested as a suspect because he is related to the plaintiff.", "The testimony was crossed out for the kinship of the witness with the demandant."], "a": 0, "fb": "Atacar la credibilidad de un testigo es \"to impeach\" (\"impeached for bias\"). \"Crossed out\" significa tachado con una raya, literalmente."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"La sentencia fue revocada en segunda instancia.\"", "opts": ["The sentence was revoked in second instance.", "The judgment was enforced on appeal.", "The judgment was affirmed on appeal.", "The judgment was reversed on appeal."], "a": 3, "fb": "Un tribunal de apelación \"reverses\" (revoca) o \"affirms\" (confirma) una sentencia. \"Revoke\" se usa para licencias, poderes u ofertas."}, {"cat": "Escritos y actuaciones judiciales", "stem": "Elija la mejor traducción al inglés:\n\"El demandado incurrió en desacato al no cumplir la orden judicial.\"", "opts": ["The defendant committed perjury by failing to comply with the court order.", "The defendant was held in contempt of court for failing to comply with the court order.", "The defendant was held in contempt of court for appealing the court order.", "The defendant incurred in disrespect for not fulfilling the judicial order."], "a": 1, "fb": "El desacato es \"contempt of court\" (\"to be held in contempt\"). \"Perjury\" es falso testimonio bajo juramento."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Le informamos que su caso fue asignado a la abogada Martínez.\"", "opts": ["Please be advised that your case has been assigned to Attorney Martínez.", "Hey, your case went to Martínez.", "We inform you that your case has been designed to the lawyer Martínez.", "We let you know your case was signed to Attorney Martínez."], "a": 0, "fb": "\"Please be advised that\" es una fórmula formal para dar información. \"Designed\" significa diseñado, y \"Hey\" es demasiado informal para un cliente."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Agradecemos la confianza depositada en nuestro despacho.\"", "opts": ["We appreciate the confidence deposited in our dispatch.", "We are grateful of your confidence in our dispatch.", "Thanks a lot for trusting our office, buddy.", "Thank you for placing your trust in our firm."], "a": 3, "fb": "Se dice \"placing your trust in our firm\". \"Deposited\" se usa para dinero, y \"dispatch\" significa envío."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Por medio de la presente, nos permitimos informarle que...\"", "opts": ["Just a heads-up that...", "We are writing to inform you that...", "By means of the present, we permit ourselves to inform you that...", "Through this present letter, we allow ourselves to inform you that..."], "a": 1, "fb": "El inglés jurídico moderno prefiere un estilo directo: \"We are writing to inform you that...\". Las fórmulas de cortesía en español no se traducen palabra por palabra."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (cierre de carta):\n\"Sin otro particular, me despido.\"", "opts": ["Nothing else, bye.", "Sincerely,", "Without another particular, I dismiss myself.", "Without other particular, I say goodbye."], "a": 1, "fb": "La carta formal en inglés se cierra con \"Sincerely,\" (o \"Very truly yours,\") y la firma. No hace falta una frase de despedida."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (dirigiéndose al juez en audiencia):\n\"Su Señoría, la defensa no tiene más preguntas.\"", "opts": ["Your Lordship, the defense has no more asks.", "Your Honor, the defense has no further questions.", "Your Excellency, the defense does not have more questions.", "Mister Judge, the defense is done asking."], "a": 1, "fb": "En EE. UU. al juez se le dice \"Your Honor\", y la fórmula es \"no further questions\". \"Your Lordship\" es británico, y \"Your Excellency\" se usa para jefes de Estado o embajadores."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Con el fin de dar trámite a su solicitud, le agradecemos enviarnos copia de su pasaporte.\"", "opts": ["In order to process your request, please send us a copy of your passport.", "In order to process your request, we thank you for sending us a copy of your passport.", "With the end of giving procedure to your solicitude, we thank you to remit us a copy of your passport.", "To process your request, send your passport copy ASAP or else."], "a": 0, "fb": "\"Le agradecemos + infinitivo\" es una petición cortés, que en inglés se dice con \"please\". \"We thank you for sending\" agradece algo que el cliente aún no ha hecho."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Lamentamos informarle que su solicitud fue negada.\"", "opts": ["Sorry, but they said no to your application.", "We lament to inform you that your solicitude was negated.", "We regret to inform you that your application has been denied.", "Unfortunately your application got rejected, sorry!"], "a": 2, "fb": "La fórmula formal es \"We regret to inform you\". \"Lament\" significa llorar una pérdida, y \"negated\" significa anulado o contrarrestado."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Quedamos a su disposición para cualquier inquietud.\"", "opts": ["Feel free to bug us anytime.", "We remain at your disposition for any inquietude.", "We stay at your disposal for any restlessness.", "Please do not hesitate to contact us with any questions."], "a": 3, "fb": "La fórmula natural es \"Please do not hesitate to contact us\". \"Inquietude\" y \"restlessness\" significan intranquilidad, no una pregunta."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (correo al abogado de la contraparte):\n\"Apreciado colega:\"", "opts": ["Hi buddy,", "Dear Counsel:", "Appreciated colleague:", "Esteemed colleague:"], "a": 1, "fb": "Entre abogados de partes contrarias se usa \"Dear Counsel:\" o \"Dear Mr./Ms. [apellido]:\". \"Colleague\" se usa para compañeros de la misma organización."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (inicio de un escrito):\n\"El demandante, a través de su apoderado, manifiesta...\"", "opts": ["Plaintiff, through his apoderado, manifests...", "The demandant, through his empowered, manifests...", "Plaintiff, by and through his undersigned counsel, states...", "The plaintiff and his attorney say..."], "a": 2, "fb": "La fórmula estándar es \"by and through undersigned counsel\". \"Manifest\" no se usa como verbo de declaración en los escritos."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (petición final de un escrito):\n\"Por lo anterior, solicito respetuosamente al Despacho...\"", "opts": ["Therefore, I beg the Office to please...", "WHEREFORE, Plaintiff respectfully requests that the Court...", "For the above, Plaintiff solicits the Dispatch to...", "Plaintiff demands the Court to..."], "a": 1, "fb": "La sección de peticiones de un escrito de EE. UU. empieza con \"WHEREFORE\" y \"respectfully requests\". \"Demands the Court to\" es incorrecto y suena a una exigencia al juez."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (llamada con un cliente):\n\"Señora, ¿me regala su nombre completo?\"", "opts": ["Woman, give me your full name.", "Lady, do you gift me your complete name?", "Madam, can you regale me your name?", "Ma'am, may I have your full name, please?"], "a": 3, "fb": "\"¿Me regala...?\" es una forma coloquial colombiana de pedir algo con cortesía; en inglés se dice \"May I have...?\". \"Regale\" significa entretener con historias."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (reunión con un socio del despacho):\n\"Con todo respeto, discrepo de esa interpretación.\"", "opts": ["I respectfully discrepancy with that interpretation.", "No way, that is wrong.", "With all respect, I discrepate of that interpretation.", "With all due respect, I disagree with that interpretation."], "a": 3, "fb": "Se dice \"With all due respect, I disagree\". \"Discrepancy\" es un sustantivo (una diferencia entre datos), no un verbo."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"El cliente manifestó su inconformidad con el resultado.\"", "opts": ["The client expressed dissatisfaction with the outcome.", "The client manifested nonconformity with the resultant.", "The client was mad about how things went.", "The client manifested his inconformity with the result."], "a": 0, "fb": "\"Inconformidad\" es \"dissatisfaction\", y \"manifestar\" es \"to express\". \"Nonconformity\" se usa para productos que no cumplen una especificación."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Adjunto encontrará la documentación solicitada.\"", "opts": ["Please find the requested documents attached.", "Adjunct you will find the documentation required.", "Attached you will encounter the required documentation.", "Here's the stuff you wanted."], "a": 0, "fb": "\"Requested\" significa solicitado, y \"required\" significa obligatorio. \"Encounter\" significa encontrarse con algo por casualidad."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (carta al abogado de la contraparte):\n\"Le solicitamos abstenerse de contactar directamente a nuestro cliente.\"", "opts": ["Stop calling our client.", "We request you to abstain yourself of contacting our client directly.", "We ask that you refrain from contacting our client directly.", "We solicit you to abstain from contacting directly our client."], "a": 2, "fb": "La fórmula es \"refrain from\". \"Abstain\" se usa sobre todo para votaciones o para el alcohol."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Nos permitimos recordarle que el pago vence el próximo viernes.\"", "opts": ["This is a reminder that payment is due this Friday.", "We allow ourselves to remind you that the payment wins next Friday.", "We permit ourselves to remember you that the payment expires next Friday.", "Don't forget to pay on Friday, ok?"], "a": 0, "fb": "Un pago que vence está \"due\". \"Expire\" se usa para documentos y plazos, y \"remember\" no tiene complemento de persona."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"De la manera más atenta le solicitamos que firme y devuelva el documento.\"", "opts": ["We kindly ask that you sign and return the document.", "We attentively solicit your signing and returning of the document.", "Sign and send back the document.", "In the most attentive manner we solicit you to sign and return the document."], "a": 0, "fb": "La cortesía en inglés es más breve: \"We kindly ask that you...\" o \"Please sign and return...\"."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado (al final de una declaración):\n\"Declaro bajo la gravedad del juramento que lo anterior es cierto.\"", "opts": ["I declare under penalty of perjury that the following is true and correct.", "I declare under penalty of perjury that the foregoing is true and correct.", "I swear to God the above is true.", "I declare under the gravity of the oath that the anterior is certain."], "a": 1, "fb": "La fórmula legal (28 U.S.C. § 1746) es \"under penalty of perjury that the foregoing is true and correct\". \"Foregoing\" es lo anterior, y \"following\" es lo que sigue."}, {"cat": "Registro formal", "stem": "Elija la versión en inglés con el registro profesional adecuado:\n\"Agradezco de antemano su colaboración.\"", "opts": ["I thank in advance your collaboration.", "Thanks before for collaborating.", "I appreciate beforehand your collaboration.", "Thank you in advance for your assistance."], "a": 3, "fb": "Se dice \"Thank you in advance for your assistance\" (o \"cooperation\"). \"Collaboration\" sugiere trabajar juntos en un proyecto."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"acción de tutela\" a un abogado de EE. UU.?", "opts": ["a guardianship action to appoint a legal guardian for a minor (tutela)", "a petition for a writ of habeas corpus to challenge an unlawful detention", "a tutoring action in which the court supervises the plaintiff's legal education", "a constitutional action for the fast-track protection of fundamental rights (acción de tutela)"], "a": 3, "fb": "La tutela no tiene equivalente en EE. UU.: se deja el término en español y se describe su función. \"Guardianship\" es la tutela de menores o incapaces, y el habeas corpus protege solo la libertad."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"derecho de petición\" a un abogado de EE. UU.?", "opts": ["a class action petition filed on behalf of a group of consumers", "a right of first refusal to buy a property before it is offered to third parties", "a petition for a writ of certiorari asking the Supreme Court to review a case", "a formal request to a public authority (or certain private entities) that must be answered within a legal deadline"], "a": 3, "fb": "El derecho de petición se explica por su función: una solicitud formal que la entidad debe responder dentro de un plazo legal. Las otras opciones son figuras de EE. UU. que no corresponden."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"auto admisorio de la demanda\"?", "opts": ["a default judgment entered when the defendant fails to answer the complaint", "an automatic admission of liability by the defendant upon filing of the complaint", "a court order accepting the complaint and directing service on the defendant", "a confession of judgment signed by the defendant before the lawsuit is filed"], "a": 2, "fb": "\"Auto\" es una decisión judicial (order), no \"automatic\". En EE. UU. el tribunal no dicta un auto admisorio, así que se explica su efecto."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"revisor fiscal\" (de una sociedad colombiana)?", "opts": ["a statutory auditor required by law to oversee a company's accounts and compliance", "a tax prosecutor from the national tax authority assigned to the company", "the company's chief financial officer, who manages its finances and budget", "a fiscal reviser appointed by the prosecutor to investigate tax crimes"], "a": 0, "fb": "El revisor fiscal es un \"statutory auditor\", un auditor externo exigido por ley. No tiene nada que ver con la fiscalía ni con el director financiero (CFO)."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"personería jurídica\"?", "opts": ["personal jurisdiction, that is, a court's power over a particular defendant", "legal personality, that is, the status of an entity that can hold rights and obligations", "a power of attorney that allows a person to act on behalf of an entity", "legal personnel, that is, the lawyers and staff employed by an entity"], "a": 1, "fb": "\"Personería jurídica\" es \"legal personality\" (o \"legal entity status\"). \"Personal jurisdiction\" es la competencia del tribunal sobre una persona, otro concepto."}, {"cat": "Conceptos sin equivalente exacto", "stem": "¿Cuál es la mejor manera de explicar en inglés \"RUT\" (Colombia)?", "opts": ["a municipal business license required to open a commercial establishment", "Colombia's taxpayer registration (RUT), comparable to a U.S. taxpayer identification number", "Colombia's equivalent of a Social Security Number, used for retirement benefits", "the Unique Tributary Registry, a list of all tributes paid by a company"], "a": 1, "fb": "El RUT se explica como un registro tributario, comparable al \"taxpayer identification number\" (TIN) de EE. UU. \"Tributary\" significa afluente de un río."}, {"cat": "Conceptos sin equiva // Exam length: "full" = every question (a pass earns the Proficiency Report);
// "half" = HALF_SIZE questions drawn evenly from the areas (no Proficiency Report).
const HALF_SIZE = 50;
let QUESTIONS = ALL_QUESTIONS;
let TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
let NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);
let MODE = "full";
let PICKED = null; // indices into ALL_QUESTIONS for a half exam

function pickBalanced(size){
  const byCat = new Map();
  ALL_QUESTIONS.forEach((q, i) => { if(!byCat.has(q.cat)) byCat.set(q.cat, []); byCat.get(q.cat).push(i); });
  const cats = Array.from(byCat.keys());
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const base = Math.floor(size / cats.length);
  let extra = size - base * cats.length;
  const quota = new Map(cats.map(c => [c, base]));
  shuffle(cats.slice()).forEach(c => { if(extra > 0 && byCat.get(c).length > quota.get(c)){ quota.set(c, quota.get(c) + 1); extra--; } });
  const out = [];
  cats.forEach(c => { out.push(...shuffle(byCat.get(c).slice()).slice(0, quota.get(c))); });
  return out.sort((a, b) => a - b); // keep the original course order
}
function applyMode(mode, picked){
  if(mode === "half" && ALL_QUESTIONS.length > HALF_SIZE){
    MODE = "half";
    const ok = Array.isArray(picked) && picked.length === HALF_SIZE && picked.every(i => Number.isInteger(i) && i >= 0 && i < ALL_QUESTIONS.length);
    PICKED = ok ? picked : pickBalanced(HALF_SIZE);
    QUESTIONS = PICKED.map(i => ALL_QUESTIONS[i]);
  } else {
    MODE = "full"; PICKED = null; QUESTIONS = ALL_QUESTIONS;
  }
  TOTAL = QUESTIONS.length;
  NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);
  state.answers = new Array(TOTAL).fill(null);
  state.mode = MODE;
  state.picked = PICKED;
}

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
  mode: "full",
  picked: null,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function fmtPct(x){
  let v = Math.round(x*1000)/10;
  if(x < PASS_THRESHOLD && v >= PASS_THRESHOLD*100) v = Math.round(PASS_THRESHOLD*1000 - 1)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}
function totalScore(){ return scoreBetween(0, TOTAL); }

      <div class="formerr" id="formErr" role="alert"></div>

    `;
    lengthHint();
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round(((i+1)/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const lastInBatch = (i+1) % BATCH_SIZE === 0 || i+1 === TOTAL;
    const canBack = i % BATCH_SIZE !== 0; // a finished batch has already been reported, so no going back past it

    `;

    return;
  }
}

function courseBreakdown(completed){
  const rows = COURSES.map(c => ({ code: c.code, name: c.name, correct: 0, total: 0 }));
  QUESTIONS.slice(0, completed).forEach((q, i) => {
    const r = rows.find(x => x.name === q.cat);
    if(!r) return;
    r.total++;
    if(state.answers[i] !== null && state.answers[i] === q.a) r.correct++;
  });
  return rows.filter(r => r.total > 0).map(r => ({ ...r, percent: Math.round((r.correct / r.total) * 100) }));
}
function courseTableHtml(completed){
  const rows = courseBreakdown(completed);
  if(!rows.length) return "";
  const limit = Math.round(PASS_THRESHOLD * 100);
  const below = rows.filter(r => r.percent < limit);
  return `
      <div class="section-label">Puntaje por área</div>
      <div class="section-note">Cada pregunta pertenece a una de las ${COURSES.length} áreas del nivel ${LEVEL_NAME}. Las áreas por debajo de ${limit}% son las que más le conviene repasar.</div>
      <table class="results"><tr><th>Área</th><th>Puntaje</th><th>%</th></tr>${rows.map(r =>
        `<tr><td>${r.name}</td><td>${r.correct} / ${r.total}</td><td class="${r.percent < limit ? "below" : ""}">${r.percent}%</td></tr>`).join("")}
      </table>
      ${below.length ? `<div class="footer-note"><strong>Para repasar primero:</strong> ${below.map(r => r.name).join(", ")}.</div>` : `<div class="footer-note">Obtuvo ${limit}% o más en todas las áreas que respondió.</div>`}`;
}
function shortBy(score, completed){
  const need = Math.ceil(PASS_THRESHOLD*completed - 1e-9) - score;
  return need > 0 ? "Le faltaron " + need + " respuesta" + (need === 1 ? "" : "s") + " correcta" + (need === 1 ? "" : "s") + " para aprobar." : "";
}

    const s = scoreBetween(bs, be);

  }

function certPct1(c, t){ return Math.round(c / t * 1000) / 10; }

function certBuildExamData(completed, score, pct){

function certCardForExam(completed, partial, passed, score, pct){

<script>
/* ---- Shareable result card (the same block on every exam page; only IL_CARD_LANG and IL_CARD_LOGO differ).

const IL_CARD_LANG = "es";
const IL_CARD_LOGO = "../vocabulary/logo.png";
const IL_CARD_T = {
  en: { share: "Share my result card", download: "Download image", wait: "Preparing your card…", alt: "Your result card",
        done: "Image saved and post text copied. Start a LinkedIn post, add the image and paste the text.", open: "Open LinkedIn",

        done: "Imagen guardada y texto copiado. Cree una publicación en LinkedIn, agregue la imagen y pegue el texto.", open: "Abrir LinkedIn",
        name: "Mostrar mi nombre en la tarjeta" }
}[IL_CARD_LANG];
let _ilCardBlob = null, _ilCardId = null, _ilCardShowName = true;
function ilCardData(){
  if(typeof state !== "undefined" && state && state._certD) return state._certD;
  if(typeof app !== "undefined" && app && app.certId && typeof _certD !== "undefined" && _certD && _certD.id === app.certId) return _certD;
  return null;
}
function ilCardMsg(){

  if(typeof app !== "undefined" && app && app.shareMsg) return app.shareMsg;
  return "";
}
function ilCardFileName(D){ return "Ingleslegal_Result_" + D.id + ".png"; }
function ilCardImg(src){ return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function ilCardFonts(){
  if(!document.querySelector("link[data-il-card-fonts]")){
    const l = document.createElement("link"); l.rel = "stylesheet"; l.setAttribute("data-il-card-fonts", "1");
    l.href = "https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Spectral:wght@400&display=swap";
    document.head.appendChild(l);
  }
  try{
    await Promise.race([
      Promise.all(["400 80px Spectral", "600 40px Archivo", "400 40px Archivo"].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  }catch(e){}
}
function ilCardFit(x, text, maxW){
  text = String(text);
  if(x.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && x.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function ilCardRound(x, l, t, w, h, r){
  x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
  x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}
function ilCardPct(p){ return (Math.round(p * 10) / 10) + "%"; }
async function ilCardDraw(D){
  await ilCardFonts();
  const W = 1080, H = 1350, P = 72;
  const BG = "#2A1A32", GOLD = "#C9A96E", CREAM = "#F1EBDE", MUTED = "#CFC2D6", SOFT = "#A898B4", TRACK = "#4A3657", INK = "#1E1226";
  const SERIF = "Spectral, Georgia, serif", SANS = "Archivo, Arial, sans-serif";
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  // Full logo: waves, dot and wordmark (the PNG's own background matches BG).
  try{
    const logo = await ilCardImg(IL_CARD_LOGO);
    const lw = 560; x.drawImage(logo, P - 30, 40, lw, lw * logo.height / logo.width);
  }catch(e){ x.fillStyle = GOLD; x.font = "600 72px " + SANS; x.fillText("Ingleslegal", P, 140); }
  // "Passed" pill.
  x.font = "600 30px " + SANS;
  const pw = x.measureText("Passed").width + 56;
  ilCardRound(x, W - P - pw, 96, pw, 60, 30); x.fillStyle = GOLD; x.fill();
  x.fillStyle = BG; x.textBaseline = "middle"; x.fillText("Passed", W - P - pw + 28, 127); x.textBaseline = "alphabetic";
  // Report title, name, exam.
  x.fillStyle = GOLD; x.font = "600 28px " + SANS;
  if("letterSpacing" in x) x.letterSpacing = "4px";
  x.fillText("LEGAL ENGLISH PROFICIENCY REPORT", P, 300);
  if("letterSpacing" in x) x.letterSpacing = "0px";
  // Long names and exam titles shrink to fit before they are cut short.
  const ilShrink = (text, weight, size, min, family) => { x.font = weight + " " + size + "px " + family;
    while(size > min && x.measureText(String(text)).width > W - 2 * P){ size -= 1; x.font = weight + " " + size + "px " + family; } };
  if(_ilCardShowName){
    x.fillStyle = CREAM; ilShrink(D.name, "400", 84, 60, SERIF); x.fillText(ilCardFit(x, D.name, W - 2 * P), P, 392);
    x.fillStyle = MUTED; ilShrink(D.exam, "400", 36, 27, SANS); x.fillText(ilCardFit(x, D.exam, W - 2 * P), P, 456);
    x.fillStyle = SOFT; x.font = "400 30px " + SANS; x.fillText(ilCardFit(x, D.level, W - 2 * P), P, 502);
  } else {
    // Without the name, the exam title takes its place: one line if it fits, otherwise two.
    x.fillStyle = CREAM; ilShrink(D.exam, "400", 72, 56, SERIF);
    if(x.measureText(String(D.exam)).width <= W - 2 * P){
      x.fillText(D.exam, P, 392);
      x.fillStyle = MUTED; x.font = "400 36px " + SANS; x.fillText(ilCardFit(x, D.level, W - 2 * P), P, 456);
    } else {
      const words = String(D.exam).split(" "); let l1 = "";
      while(words.length && x.measureText((l1 + " " + words[0]).trim()).width <= W - 2 * P) l1 = (l1 + " " + words.shift()).trim();
      x.fillText(l1, P, 372); x.fillText(ilCardFit(x, words.join(" "), W - 2 * P), P, 440);
      x.fillStyle = SOFT; x.font = "400 30px " + SANS; x.fillText(ilCardFit(x, D.level, W - 2 * P), P, 502);
    }
  }
  // Score.
  x.fillStyle = GOLD; x.font = "400 200px " + SERIF;
  const score = ilCardPct(D.pct); x.fillText(score, P - 6, 724);
  const sw = x.measureText(score).width;
  x.fillStyle = MUTED; x.font = "400 32px " + SANS; x.fillText("Pass mark " + D.passMark + "%", P + sw + 22, 700);
  // Strongest skills (top three).
  const top = (D.skills || []).slice().sort((a, b) => b.p - a.p).slice(0, 3);
  x.fillStyle = GOLD; x.font = "600 30px " + SANS; x.fillText(D.topLabel || "Strongest skills", P, 806);
  top.forEach((s, i) => {
    const y = 862 + i * 96;
    x.font = "400 34px " + SANS; x.fillStyle = CREAM;
    const pct = ilCardPct(s.p), pctW = x.measureText(pct).width;
    x.fillText(ilCardFit(x, s.n, W - 2 * P - pctW - 30), P, y);
    x.fillText(pct, W - P - pctW, y);
    ilCardRound(x, P, y + 20, W - 2 * P, 14, 7); x.fillStyle = TRACK; x.fill();
    ilCardRound(x, P, y + 20, Math.max(14, (W - 2 * P) * Math.min(100, s.p) / 100), 14, 7); x.fillStyle = GOLD; x.fill();
  });
  // Footer: date, report ID, invitation, QR code to the verify page.
  x.fillStyle = TRACK; x.fillRect(P, 1160, W - 2 * P, 2);
  const qs = 150, qx = W - P - qs, qy = 1182;
  x.fillStyle = SOFT; x.font = "400 28px " + SANS;
  x.fillText(ilCardFit(x, D.date + " · ID " + D.id, qx - P - 24), P, 1222);
  x.fillStyle = CREAM; x.font = "600 34px " + SANS; x.fillText("Take it free at ingleslegal.com", P, 1276);
  ilCardRound(x, qx, qy, qs, qs, 12); x.fillStyle = CREAM; x.fill();
  try{
    const q = qrcode(0, "M"); q.addData(CERT_VERIFY + "?id=" + D.id); q.make();
    const n = q.getModuleCount(), cell = (qs - 20) / n;
    x.fillStyle = INK;
    for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) x.fillRect(qx + 10 + k * cell, qy + 10 + r * cell, Math.ceil(cell), Math.ceil(cell));
  }catch(e){}
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("toBlob")), "image/png"));
}
/* Draws the card as soon as the share box is on screen, so a tap can share it straight away. */
async function ilCardPrepare(){

  if(!D || !img) return;
  try{
    const key = D.id + (_ilCardShowName ? ":name" : ":noname");
    if(!_ilCardBlob || _ilCardId !== key){
      _ilCardBlob = null;
      const b = await ilCardDraw(D);
      if(key !== D.id + (_ilCardShowName ? ":name" : ":noname")) return; // the box was toggled again meanwhile
      _ilCardBlob = b; _ilCardId = key;

    img.src = URL.createObjectURL(_ilCardBlob);
    img.closest(".ilcard").classList.add("ready");

  }catch(e){
    const box = img.closest(".ilcard"); if(box) box.remove();
  }
}
function ilCardCopy(text){

  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallback); } else { fallback(); }
}
function ilCardDownload(){

function ilCardShare(btn){
