const ALL_QUESTIONS = [{"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"fiscal\" (en un proceso penal)?", "opts": ["magistrate", "fiscal officer", "tax auditor", "prosecutor"], "a": 3, "fb": "En un proceso penal, el fiscal es el \"prosecutor\" (en EE. UU. también \"district attorney\" o \"DA\"). En inglés, \"fiscal\" es un adjetivo de finanzas públicas (fiscal year = año fiscal)."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"abogado defensor\" (en un proceso penal)?", "opts": ["district attorney", "defense attorney", "bailiff", "court clerk"], "a": 1, "fb": "El abogado del acusado es el \"defense attorney\" (o \"defense counsel\"); si lo paga el Estado, es un \"public defender\". El \"district attorney\" es el fiscal y el \"bailiff\" es el alguacil de la sala."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"secretario del juzgado\" (quien lleva el expediente y recibe los escritos)?", "opts": ["law clerk", "bailiff", "court clerk", "Secretary of State"], "a": 2, "fb": "El \"court clerk\" lleva el expediente y recibe los escritos. Un \"law clerk\" es un abogado joven que ayuda al juez a investigar y redactar, y el \"Secretary of State\" es un cargo de gobierno."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"acusado\" (en un proceso penal)?", "opts": ["plaintiff", "defendant", "prosecuted witness", "accuser"], "a": 1, "fb": "En un caso penal, el acusado es el \"defendant\" (también \"the accused\"). \"Plaintiff\" solo existe en lo civil, y quien acusa es el \"prosecutor\"."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"perito\" (que declara en juicio sobre temas técnicos)?", "opts": ["character witness", "court interpreter", "eyewitness", "expert witness"], "a": 3, "fb": "El perito que declara en juicio es un \"expert witness\". El \"eyewitness\" vio los hechos y el \"character witness\" declara sobre la reputación de una persona."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"testigo presencial\"?", "opts": ["eyewitness", "attesting witness", "present witness", "character witness"], "a": 0, "fb": "Quien vio los hechos es un \"eyewitness\". Un \"attesting witness\" firma como testigo de un documento, por ejemplo de un testamento."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"apoderado\" (el abogado que representa a una parte en el expediente)?", "opts": ["guardian ad litem", "power holder", "trustee", "attorney of record"], "a": 3, "fb": "El abogado que figura como representante de la parte es el \"attorney of record\" (o \"counsel of record\"). El \"trustee\" es un fiduciario, y el \"guardian ad litem\" es la persona que el juez nombra para representar a un menor en el proceso."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"juez de primera instancia\"?", "opts": ["chief justice", "trial judge", "justice of the peace", "appellate judge"], "a": 1, "fb": "En EE. UU., el juez que conoce el caso en primera instancia es el \"trial judge\" (del \"trial court\"). El \"justice of the peace\" resuelve asuntos locales menores, y el \"chief justice\" preside un tribunal supremo."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"magistrado de la Corte Suprema\"?", "opts": ["magistrate judge", "justice", "juror", "attorney general"], "a": 1, "fb": "Los miembros de la Corte Suprema de EE. UU. son \"justices\". Un \"magistrate judge\" es un juez federal auxiliar de menor rango, así que \"magistrado\" y \"magistrate\" son falsos amigos."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"miembro del jurado\"?", "opts": ["assessor", "jurist", "juror", "jury"], "a": 2, "fb": "\"Jury\" es el grupo completo; cada miembro es un \"juror\". \"Jurist\" significa jurista, es decir, un experto en derecho."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"árbitro\" (en un arbitraje)?", "opts": ["notary", "mediator", "umpire", "arbitrator"], "a": 3, "fb": "El \"arbitrator\" decide la controversia y dicta un laudo. El \"mediator\" solo ayuda a las partes a negociar, y el \"umpire\" es el árbitro de algunos deportes, como el béisbol."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"tutor\" (de un menor, designado por el juez)?", "opts": ["tutor", "foster parent", "trustee", "guardian"], "a": 3, "fb": "El tutor legal de un menor es su \"guardian\". En inglés, \"tutor\" es un profesor particular, y el \"foster parent\" es la familia de acogida temporal."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"albacea\" (nombrado en el testamento)?", "opts": ["executor", "beneficiary", "heir", "probate judge"], "a": 0, "fb": "El albacea nombrado en el testamento es el \"executor\". Si lo nombra el juez porque no hay testamento, se le llama \"administrator\"."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"abogado litigante\"?", "opts": ["litigant", "litigator", "paralegal", "solicitor"], "a": 1, "fb": "El abogado que lleva pleitos es un \"litigator\" (o \"trial lawyer\"). \"Litigant\" es una de las partes del pleito, no su abogado, y \"solicitor\" es un tipo de abogado británico."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"asistente legal\" (quien apoya al abogado, sin ser abogado)?", "opts": ["court reporter", "process server", "legal auxiliary", "paralegal"], "a": 3, "fb": "En EE. UU., el asistente legal es un \"paralegal\" (o \"legal assistant\"). \"Legal auxiliary\" no se usa, y las otras dos opciones son oficios distintos."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"taquígrafo judicial\" (quien transcribe audiencias y declaraciones)?", "opts": ["docket clerk", "law reporter", "court interpreter", "court reporter"], "a": 3, "fb": "El \"court reporter\" transcribe audiencias y declaraciones. Un \"law reporter\" es una colección publicada de sentencias, no una persona."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"notificador\" (quien entrega la demanda al demandado)?", "opts": ["process server", "summons clerk", "courier attorney", "notifier"], "a": 0, "fb": "Quien entrega la demanda y la citación al demandado es el \"process server\" (\"process\" = los documentos que inician el proceso). \"Notifier\" no es un término jurídico."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"fiador\" (persona que garantiza la deuda de otro)?", "opts": ["trustee", "bondholder", "guarantor", "creditor"], "a": 2, "fb": "El fiador es el \"guarantor\" (también \"surety\"). El \"bondholder\" es el tenedor de bonos, y el \"creditor\" es a quien se le debe."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"acreedor\"?", "opts": ["debtor", "believer", "accreditor", "creditor"], "a": 3, "fb": "El acreedor es el \"creditor\", y el deudor es el \"debtor\". Un \"accreditor\" es una entidad que acredita la calidad de instituciones, por ejemplo de universidades."}, {"cat": "Personas y profesiones jurídicas", "stem": "¿Cuál es la traducción al inglés de \"menor de edad\"?", "opts": ["youth offender", "junior", "dependent", "minor"], "a": 3, "fb": "Una persona menor de 18 años es un \"minor\". \"Junior\" indica a un hijo con el mismo nombre o un rango inferior, y \"dependent\" es una persona a cargo (por ejemplo, para impuestos)."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"expediente\" (del proceso)?", "opts": ["brief", "expedient", "dossier fee", "case file"], "a": 3, "fb": "El expediente es el \"case file\" (el registro oficial del tribunal es el \"record\"). \"Expedient\" significa conveniente o recurso práctico, y un \"brief\" es un escrito de argumentos."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"escrito\" (cualquier documento que una parte presenta al juzgado)?", "opts": ["writ", "script", "filing", "letter rogatory"], "a": 2, "fb": "Todo documento presentado al tribunal es un \"filing\". Un \"writ\" es una orden del tribunal, y un \"letter rogatory\" es un exhorto a un tribunal extranjero."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"radicar\" (un escrito en el juzgado)?", "opts": ["to file", "to radicate", "to serve", "to settle"], "a": 0, "fb": "Los escritos se \"file\" en el tribunal. \"To serve\" es notificar o entregar a la otra parte, y \"to radicate\" no existe en inglés jurídico."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"notificar la demanda\" (al demandado)?", "opts": ["to serve the complaint", "to notify the demand", "to answer the complaint", "to file the complaint"], "a": 0, "fb": "Entregar formalmente la demanda al demandado es \"to serve the complaint\" (de ahí \"service of process\"). \"To file\" es presentarla en el tribunal y \"to answer\" es contestarla."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"contestación de la demanda\"?", "opts": ["answer", "counterclaim", "contestation", "reply"], "a": 0, "fb": "El escrito en que el demandado responde es el \"answer\". El \"counterclaim\" es la demanda de reconvención y el \"reply\" es la réplica del demandante."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"prueba documental\"?", "opts": ["paper proof", "written trial", "documentary test", "documentary evidence"], "a": 3, "fb": "Se dice \"documentary evidence\". \"Evidence\" se refiere a las pruebas, \"proof\" a la demostración de un hecho y \"test\" a un examen."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"prueba\" (cada documento u objeto marcado que se presenta en juicio)?", "opts": ["sample", "test", "exhibit", "proof"], "a": 2, "fb": "Cada documento u objeto marcado (\"Exhibit A\", \"Exhibit B\") es un \"exhibit\". \"Proof\" es la demostración en sí, no el documento."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"juzgado de familia\"?", "opts": ["family court", "probate court", "small claims court", "juvenile court"], "a": 0, "fb": "Es el \"family court\". El \"juvenile court\" juzga a menores, el \"probate court\" tramita sucesiones y el \"small claims court\" decide reclamos de poca cuantía."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"juzgado de pequeñas causas\"?", "opts": ["municipal hall", "traffic court", "small claims court", "minor causes court"], "a": 2, "fb": "Los reclamos de poca cuantía van al \"small claims court\". \"Minor causes court\" no existe, y el \"traffic court\" ve infracciones de tránsito."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"tribunal de apelación\"?", "opts": ["trial court", "court of appeals", "court of claims", "district court"], "a": 1, "fb": "El tribunal que revisa las sentencias es el \"court of appeals\" (o \"appellate court\"). El \"trial court\" y el \"district court\" federal son tribunales de primera instancia."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"decisión del juez sobre una solicitud\" (durante el proceso)?", "opts": ["sentence", "verdict", "ruling", "failure"], "a": 2, "fb": "La decisión sobre una solicitud u objeción es un \"ruling\". \"Failure\" significa fracaso (falso amigo de \"fallo\"), el \"verdict\" lo da el jurado y \"sentence\" es la pena."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"solicitud\" (que una parte presenta pidiendo al juez una orden)?", "opts": ["request for admission", "solicitation", "summons", "motion"], "a": 3, "fb": "Se dice \"motion\" (\"motion to dismiss\", \"motion for continuance\"). \"Solicitation\" puede significar inducir a alguien a cometer un delito o buscar clientes, y un \"request for admission\" es un medio de prueba."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"citación\" (documento que acompaña la demanda y llama al demandado a responder)?", "opts": ["summons", "subpoena", "warrant", "citation"], "a": 0, "fb": "El \"summons\" llama al demandado a responder. El \"subpoena\" cita a un testigo, y \"citation\" suele ser una multa de tránsito o una cita de jurisprudencia."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"jurisprudencia\" (sentencias anteriores que sirven de precedente)?", "opts": ["legal doctrine", "jurisprudence", "case law", "legislation"], "a": 2, "fb": "Las sentencias que sirven de precedente son \"case law\" (o \"precedent\"). En inglés, \"jurisprudence\" suele significar filosofía o teoría del derecho."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"plazo\" (para presentar un escrito)?", "opts": ["delay", "deadline", "term", "extension"], "a": 1, "fb": "El plazo para presentar algo es el \"deadline\". \"Delay\" es un retraso, \"extension\" es una prórroga y \"term\" se refiere a una duración (por ejemplo, la de un contrato)."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"suspensión del proceso\" (por orden del juez)?", "opts": ["stay", "recess", "suspension", "dismissal"], "a": 0, "fb": "Cuando el juez detiene el proceso temporalmente, hay un \"stay\" (\"stay of proceedings\"). \"Dismissal\" pone fin al caso y \"recess\" es un receso breve en una audiencia."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"archivo del caso\" (el juez lo da por terminado sin decidir el fondo)?", "opts": ["closing argument", "dismissal", "filing", "archive"], "a": 1, "fb": "Terminar el caso sin decidir el fondo es un \"dismissal\". \"Filing\" es presentar un escrito y \"archive\" se refiere al lugar donde se guardan documentos."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"alegatos de conclusión\"?", "opts": ["conclusion allegations", "closing arguments", "final pleadings", "opening statements"], "a": 1, "fb": "Al final del juicio, los abogados presentan sus \"closing arguments\". Los \"opening statements\" son las exposiciones iniciales, y \"allegations\" son los hechos que se afirman en la demanda."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"sala de audiencias\"?", "opts": ["courtroom", "chambers", "audience hall", "court registry"], "a": 0, "fb": "Las audiencias se celebran en el \"courtroom\". \"Chambers\" es el despacho privado del juez, y \"audience\" significa público."}, {"cat": "Tribunales y proceso", "stem": "¿Cuál es la traducción al inglés de \"transcripción\" (de lo dicho en una audiencia)?", "opts": ["brief", "court docket", "hearing act", "transcript"], "a": 3, "fb": "El texto de lo dicho en la audiencia es el \"transcript\". El \"docket\" es la lista de actuaciones del caso y un \"brief\" es un escrito de argumentos."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"acta\" (de una reunión de junta directiva)?", "opts": ["certificate", "deed", "act", "minutes"], "a": 3, "fb": "El acta de una reunión son las \"minutes\", siempre en plural (\"the board approved the minutes\"). \"Act\" es una ley del Congreso y \"deed\" es una escritura de propiedad."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"firma\" (el nombre escrito a mano en un documento)?", "opts": ["signature", "sign", "firm", "signing bonus"], "a": 0, "fb": "El nombre escrito a mano es la \"signature\". \"Firm\" significa empresa o despacho (\"law firm\"), y \"sign\" es un letrero o el verbo firmar."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"despacho de abogados\"?", "opts": ["law firm", "law school", "bar association", "lawyer dispatch"], "a": 0, "fb": "Se dice \"law firm\". La \"bar association\" es el colegio de abogados, y \"dispatch\" significa envío."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"sociedad anónima\"?", "opts": ["anonymous society", "sole proprietorship", "corporation", "partnership"], "a": 2, "fb": "La sociedad anónima equivale a la \"corporation\". \"Partnership\" es una sociedad de personas, y \"sole proprietorship\" es una empresa unipersonal sin sociedad."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"socio\" (de un despacho de abogados, uno de sus dueños)?", "opts": ["associate", "of counsel", "partner", "paralegal"], "a": 2, "fb": "Los dueños del despacho son los \"partners\". Un \"associate\" es un abogado empleado que aún no es socio, y \"of counsel\" es un abogado vinculado al despacho que no es ni socio ni empleado común."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"contrato de trabajo\"?", "opts": ["employment agreement", "collective bargaining agreement", "job description", "work order"], "a": 0, "fb": "Se dice \"employment agreement\" (o \"employment contract\"). El \"collective bargaining agreement\" es la convención colectiva con un sindicato, y un \"work order\" es una orden de trabajo."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"contrato de compraventa\" (de una casa)?", "opts": ["buy-sell agreement", "sales commission agreement", "purchase and sale agreement", "lease-to-own agreement"], "a": 2, "fb": "Se dice \"purchase and sale agreement\" (o \"purchase agreement\"). Un \"buy-sell agreement\" regula la compra de la participación de un socio que se retira o fallece."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"factura\"?", "opts": ["quote", "facture", "invoice", "receipt"], "a": 2, "fb": "Se dice \"invoice\" (también \"bill\"). \"Receipt\" es un recibo, y \"quote\" es una cotización."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"recibo\" (comprobante de que se hizo un pago)?", "opts": ["receipt", "recipe", "reception", "invoice"], "a": 0, "fb": "El comprobante de pago es el \"receipt\". \"Recipe\" significa receta de cocina, y \"invoice\" es la factura que se emite antes del pago."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"pagaré\"?", "opts": ["promissory note", "money order", "bill of lading", "I will pay note"], "a": 0, "fb": "El pagaré es una \"promissory note\". El \"bill of lading\" es un conocimiento de embarque, y el \"money order\" es un giro postal."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"fecha de vencimiento\" (de una factura)?", "opts": ["issue date", "due date", "closing date", "effective date"], "a": 1, "fb": "El último día para pagar es el \"due date\". \"Effective date\" es la fecha de entrada en vigor, \"issue date\" la de emisión y \"closing date\" la de cierre de una operación."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"cotización\" (el precio que se ofrece por un servicio)?", "opts": ["quote", "retainer", "cotization", "invoice"], "a": 0, "fb": "Una cotización es un \"quote\" (o \"estimate\"). \"Cotization\" no se usa en inglés, y la factura (\"invoice\") se emite después."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"anticipo de honorarios\" (que el cliente paga al contratar al abogado)?", "opts": ["hourly rate", "retainer", "flat fee", "filing fee"], "a": 1, "fb": "El pago anticipado al abogado es el \"retainer\". \"Hourly rate\" es la tarifa por hora, \"filing fee\" es la tasa judicial y \"flat fee\" es una tarifa fija."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"cuota litis\" (el abogado cobra un porcentaje de lo que gane el cliente)?", "opts": ["quota litis", "flat fee", "court costs", "contingency fee"], "a": 3, "fb": "En EE. UU. se dice \"contingency fee\". Es el modelo habitual en casos de lesiones personales: si no hay recuperación, no hay honorarios."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"cédula de ciudadanía\" (Colombia)?", "opts": ["national ID card", "green card", "Social Security card", "citizenship certificate"], "a": 0, "fb": "Es el \"national ID card\" (o \"national identity card\"). El \"citizenship certificate\" acredita la ciudadanía adquirida, y la \"Social Security card\" muestra el número de seguro social estadounidense."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"pasaporte vigente\"?", "opts": ["expired passport", "provisional passport", "valid passport", "vigent passport"], "a": 2, "fb": "Un documento vigente es \"valid\" (y una ley o contrato vigente está \"in force\" o \"in effect\"). \"Vigent\" no se usa en inglés corriente."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"registro civil de nacimiento\"?", "opts": ["civil birth registry act", "birth certificate", "baptismal record", "birth announcement"], "a": 1, "fb": "Para USCIS y otros trámites se usa \"birth certificate\". El \"baptismal record\" es la partida de bautismo, que solo reemplaza al registro civil en casos excepcionales."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"apostilla\"?", "opts": ["notarization", "apostle", "certified translation", "apostille"], "a": 3, "fb": "Se dice \"apostille\", el certificado que valida un documento público para usarlo en otro país del Convenio de La Haya. \"Notarization\" es una autenticación ante un notario."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"traducción certificada\" (como la que exige USCIS)?", "opts": ["sworn statement", "notarized copy", "certified translation", "literal translation"], "a": 2, "fb": "USCIS pide una \"certified translation\": una traducción completa con una declaración del traductor de que es competente y de que la traducción es exacta."}, {"cat": "Contratos, negocios y documentos", "stem": "¿Cuál es la traducción al inglés de \"membrete\" (del papel de una empresa)?", "opts": ["header file", "stamp", "letterhead", "membership"], "a": 2, "fb": "El encabezado impreso con el nombre y los datos de la empresa es el \"letterhead\". \"Membership\" es la calidad de miembro, y \"stamp\" es un sello."}, {"cat": "Derecho penal", "stem": "¿Cuál es la traducción al inglés de \"orden de captura\"?", "opts": ["arrest warrant", "capture order", "subpoena", "search warrant"], "a": 0, "fb": "Se dice \"arrest warrant\". El \"search warrant\" es una orden de allanamiento, el \"subpoena\" es una citación para comparecer o entregar documentos y \"capture order\" no se usa."}, {"cat": "Derecho penal", "stem": "¿Cuál es la traducción al inglés de \"denuncia\" (ante la policía, por un robo)?", "opts": ["police report", "denunciation", "indictment", "lawsuit"], "a": 0, "fb": "Ante la policía se hace un \"police report\" (denunciar un delito = to report a crime). \"Denunciation\" es una crítica o condena pública, \"lawsuit\" es una demanda civil e \"indictment\" es la acusación del gran jurado."}, {"cat": "Derecho penal", "stem": "¿Cuál es la traducción al inglés de \"orden de allanamiento\"?", "opts": ["restraining order", "raid order", "search warrant", "bench warrant"], "a": 2, "f const HALF_SIZE = 50;

let TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
let NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);
let MODE = "full";
let PICKED = null; // indices into ALL_QUESTIONS for a half exam

function pickBalanced(size){
  const byCat = new Map();
  ALL_QUESTIONS.forEach((q, i) => { if(!byCat.has(q.cat)) byCat.set(q.cat, []); byCat.get(q.cat).push(i); });
  const cats = Array.from(byCat.keys());
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const base = Math.floor(size / cats.length);
  let extra = size - base * cats.length;
  const quota = new Map(cats.map(c => [c, base]));
  shuffle(cats.slice()).forEach(c => { if(extra > 0 && byCat.get(c).length > quota.get(c)){ quota.set(c, quota.get(c) + 1); extra--; } });
  const out = [];
  cats.forEach(c => { out.push(...shuffle(byCat.get(c).slice()).slice(0, quota.get(c))); });
  return out.sort((a, b) => a - b); // keep the original course order
}
function applyMode(mode, picked){
  if(mode === "half" && ALL_QUESTIONS.length > HALF_SIZE){
    MODE = "half";
    const ok = Array.isArray(picked) && picked.length === HALF_SIZE && picked.every(i => Number.isInteger(i) && i >= 0 && i < ALL_QUESTIONS.length);
    PICKED = ok ? picked : pickBalanced(HALF_SIZE);
    QUESTIONS = PICKED.map(i => ALL_QUESTIONS[i]);
  } else {
    MODE = "full"; PICKED = null; QUESTIONS = ALL_QUESTIONS;
  }
  TOTAL = QUESTIONS.length;
  NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);
  state.answers = new Array(TOTAL).fill(null);
  state.mode = MODE;
  state.picked = PICKED;
}

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function fmtPct(x){
  let v = Math.round(x*1000)/10;
  if(x < PASS_THRESHOLD && v >= PASS_THRESHOLD*100) v = Math.round(PASS_THRESHOLD*1000 - 1)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}

    const q = QUESTIONS[i];
    const pct = Math.round(((i+1)/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const lastInBatch = (i+1) % BATCH_SIZE === 0 || i+1 === TOTAL;
    const canBack = i % BATCH_SIZE !== 0; // a finished batch has already been reported, so no going back past it
    const nextLabel = lastInBatch ? (i+1 === TOTAL ? "Terminar &rarr;" : "Terminar bloque &rarr;") : "Siguiente &rarr;";

    card.innerHTML = `
      <div class="vq-head"><span class="vq-count">Pregunta ${i+1} de ${TOTAL}</span><span class="vq-cat">${q.cat}</span></div>
      <div class="stem${q.stem.length > 190 ? " long" : ""}">${q.stem}</div>
      <div id="optsHolder"></div>
      <div class="navrow"><button class="btn prev" onclick="goBack()" ${canBack ? "" : "disabled"}>&larr; Anterior</button><button class="btn gold next" id="nextBtn" onclick="advance()" ${given === null ? "disabled" : ""}>${nextLabel}</button></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(idx === given) cls += " selected";
      btn.className = cls;
      btn.innerHTML = opt;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Bloque ${bn} de ${NUM_BATCHES} terminado</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">Este bloque</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Puntaje del bloque</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Detenerme aquí y ver mis resultados</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continuar con el siguiente bloque" : "Ver resultados finales"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Bloque ${bn} (P${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${fmtPct(s/(be-bs))}</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Examen detenido: resultados provisionales" : "Examen terminado"}</h1>
      <div class="sub">${state.candidate.name || "Candidato"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; Nivel ${LEVEL_NAME} &middot; ${completed} de ${TOTAL} preguntas respondidas${MODE === "half" ? " &middot; Medio examen" : ""}</div>
      <table class="results"><tr><th>Sección</th><th>Puntaje</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Total hasta ahora" : "Total"}</strong></td><td>${score} / ${completed}</td><td>${fmtPct(pct)}</td></tr>
      </table>
      ${courseTableHtml(completed)}
      <div class="placement">
        <div class="headline">${EXAM_TITLE} &middot; ${LEVEL_NAME}: ${passed ? "APROBADO" : "Aún no aprobado"}${partial ? " (provisional)" : ""}</div>
        <div>El puntaje mínimo para aprobar es ${Math.round(PASS_THRESHOLD*100)}%. Usted obtuvo ${fmtPct(pct)}${partial ? ", con base en " + completed + " de " + TOTAL + " preguntas." : "."}${passed ? "" : " " + shortBy(score, completed)}</div>
      </div>
      ${certCardForExam(completed, partial, passed, score, pct)}
      ${passed && !partial ? shareHTML(fmtPct(pct), true) : ""}
      ${nextStepHTML(completed, passed)}
      ${discountHTML()}
      ${passed && !partial ? "" : shareHTML(fmtPct(pct), false)}
      ${reviewHTML(completed)}
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Descargar mis resultados</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Seguir respondiendo</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Enviando sus resultados..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "En unos minutos también recibirá sus resultados por correo." : "Use Descargar mis resultados para guardar una copia."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function courseBreakdown(completed){
  const rows = COURSES.map(c => ({ code: c.code, name: c.name, correct: 0, total: 0 }));
  QUESTIONS.slice(0, completed).forEach((q, i) => {
    const r = rows.find(x => x.name === q.cat);
    if(!r) return;
    r.total++;
    if(state.answers[i] !== null && state.answers[i] === q.a) r.correct++;
  });
  return rows.filter(r => r.total > 0).map(r => ({ ...r, percent: Math.round((r.correct / r.total) * 100) }));
}
function courseTableHtml(completed){
  const rows = courseBreakdown(completed);
  if(!rows.length) return "";
  const limit = Math.round(PASS_THRESHOLD * 100);
  const below = rows.filter(r => r.percent < limit);
  return `
      <div class="section-label">Puntaje por área</div>
      <div class="section-note">Cada pregunta pertenece a una de las ${COURSES.length} áreas del nivel ${LEVEL_NAME}. Las áreas por debajo de ${limit}% son las que más le conviene repasar.</div>
      <table class="results"><tr><th>Área</th><th>Puntaje</th><th>%</th></tr>${rows.map(r =>
        `<tr><td>${r.name}</td><td>${r.correct} / ${r.total}</td><td class="${r.percent < limit ? "below" : ""}">${r.percent}%</td></tr>`).join("")}
      </table>
      ${below.length ? `<div class="footer-note"><strong>Para repasar primero:</strong> ${below.map(r => r.name).join(", ")}.</div>` : `<div class="footer-note">Obtuvo ${limit}% o más en todas las áreas que respondió.</div>`}`;
}
function shortBy(score, completed){
  const need = Math.ceil(PASS_THRESHOLD*completed - 1e-9) - score;
  return need > 0 ? "Le faltaron " + need + " respuesta" + (need === 1 ? "" : "s") + " correcta" + (need === 1 ? "" : "s") + " para aprobar." : "";
}
function topicStats(completed){
  const map = {}; const order = [];
  for(let i=0;i<completed;i++){
    const c = QUESTIONS[i].cat;
    if(!map[c]){ map[c] = {cat:c, right:0, total:0}; order.push(c); }
    map[c].total++; if(state.answers[i] === QUESTIONS[i].a) map[c].right++;
  }
  return order.map(c => map[c]);
}

function copyText(text, btn, label){
  const done = () => { if(!btn) return; btn.textContent = "Copiado"; setTimeout(() => { btn.textContent = label; }, 1800); };
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
}

function reviewHTML(completed){

    html += '<div class="filterrow">Filtrar por área:<select onchange="filterReview(this.value)"><option value="">Todas las áreas</option>' + cats.map(c => '<option value="' + c.replace(/"/g,"&quot;") + '">' + c + '</option>').join("") + '</select></div>';

}
function renderTabs(){

function startWith(name, email, length){
  applyMode(length === "half" ? "half" : "full");
  state.candidate.name = name;
  state.candidate.email = email;
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function goBack(){
  if(state.qIndex % BATCH_SIZE === 0) return;
  state.qIndex -= 1;
  state.screen = "question";
  render();
}
function selectAnswer(idx){
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  if(state.answers[state.qIndex] === null) return;
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL, length: MODE,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, length: MODE, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed, certId: (passed && state._certId) ? state._certId : "",
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Resultados enviados." : "No se pudieron enviar automáticamente. Use Descargar mis resultados.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "No se pudieron enviar automáticamente. Use Descargar mis resultados.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;

const SAVE_KEY = "ingleslegal_translation_" + LEVEL_KEY;
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers)){
      const half = s.mode === "half";
      const expected = half ? HALF_SIZE : ALL_QUESTIONS.length;
      if(s.answers.length === expected && (!half || (Array.isArray(s.picked) && s.picked.length === HALF_SIZE))) return s;
    }
  }catch(e){}
  return null;
}

// Hand-off from pathways/index.html (menu). Name and email travel in sessionStorage, never in the URL.
const LAUNCH_KEY = "ingleslegal_pathway_launch";
function readLaunch(){
  try{
    const raw = sessionStorage.getItem(LAUNCH_KEY);
    if(!raw) return null;
    sessionStorage.removeItem(LAUNCH_KEY);
    const d = JSON.parse(raw);
    const here = EXAM_URL.split("/").pop();
    if(d && d.exam === here && typeof d.name === "string" && typeof d.email === "string" && d.name.trim() && EMAIL_RE.test(d.email.trim()) && Date.now() - Number(d.ts) < 10*60*1000){
      return { name: d.name.trim(), email: d.email.trim(), length: d.length === "half" ? "half" : "full" };
    }
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
const launch = readLaunch();
if(saved && confirm("Tiene un examen en curso (pregunta " + (saved.qIndex + 1) + " de " + (saved.mode === "half" ? HALF_SIZE : ALL_QUESTIONS.length) + "). ¿Desea continuar donde lo dejó?")){
  applyMode(saved.mode, saved.picked);
  state = saved;
} else {
  clearProgress();
  if(launch){ startWith(launch.name, launch.email, launch.length); }
}

function certInjectStyles(){
  if(document.getElementById("certStyles")) return;
  const st = document.createElement("style"); st.id = "certStyles"; st.textContent = CERT_CSS + CERT_UI_CSS;
  document.head.appendChild(st);
}
function certFit(on){
  const rep = document.querySelector("#certOverlay .il-rep"); if(!rep) return;
  if(on){ const h = rep.offsetHeight || 1476; rep.style.zoom = String(Math.min(794/820, 1070/h)); }
  else { rep.style.zoom = ""; certZoomToScreen(); }
}
function certZoomToScreen(){
  const rep = document.querySelector("#certOverlay .il-rep"); if(!rep) return;
  rep.style.zoom = String(Math.min(1, (window.innerWidth - 24) / 820));
}
window.addEventListener("beforeprint", () => certFit(true));
window.addEventListener("afterprint", () => certFit(false));
window.addEventListener("resize", certZoomToScreen);

function openCertificate(thenPrint){
  if(!_certD) return;
  certInjectStyles();
  closeCertificate();
  const o = document.createElement("div"); o.id = "certOverlay";
  o.innerHTML = `<div class="certbar"><button type="button" class="${_certD.btn.gold}" onclick="printCertificate()">Guardar como PDF / Imprimir</button><button type="button" class="${_certD.btn.ghost}" onclick="downloadCertificateFile()">Descargar archivo</button><button type="button" class="${_certD.btn.ghost}" onclick="closeCertificate()">Cerrar</button></div><div class="certscroll">${certReportHTML(_certD)}</div>`;
  document.body.appendChild(o); document.body.style.overflow = "hidden"; certZoomToScreen();
  if(thenPrint) setTimeout(printCertificate, 350);
}
function closeCertificate(){

function certRegister(D, webhookUrl){

    type:"certificate", id:D.id, kind:D.kind, name:D.name, email:D.email, exam:D.exam, level:D.level,

  const skills = courseBreakdown(completed).map(r => mk(en(r.name), r.correct, r.total));
  const pw = IL_PATHWAY_INFO[NEXT_PATHWAY];
  if(!state._certId) state._certId = certNewId(CERT_PREFIX);

    exam: "Legal Translation Exam (Spanish to English): " + LEVEL_EN, level: LEVEL_EN + " Legal Translation", date: certDate(),
    pct: Math.round(pct * 1000) / 10, passMark: Math.round(PASS_THRESHOLD * 100), correct: score, total: completed,

function certCardForExam(completed, partial, passed, score, pct){

<script>
/* ---- Shareable result card (the same block on every exam page; only IL_CARD_LANG and IL_CARD_LOGO differ).

}

function ilCardImg(src){ return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function ilCardFonts(){
  if(!document.querySelector("link[data-il-card-fonts]")){
    const l = document.createElement("link"); l.rel = "stylesheet"; l.setAttribute("data-il-card-fonts", "1");

    ]);

}
function ilCardFit(x, text, maxW){
  text = String(text);
  if(x.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && x.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function ilCardRound(x, l, t, w, h, r){
  x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
  x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}

async function ilCardDraw(D){

      x.fillStyle = MUTED; x.font = "400 36px " + SANS; x.fillText(ilCardFit(x, D.level, W - 2 * P), P, 456);
    } else {
      const words = String(D.exam).split(" "); let l1 = "";
      while(words.length && x.measureText((l1 + " " + words[0]).trim()).width <= W - 2 * P) l1 = (l1 + " " + words.shift()).trim();
      x.fillText(l1, P, 372); x.fillText(ilCardFit(x, words.join(" "), W - 2 * P), P, 440);
      x.fillStyle = SOFT; x.font = "400 30px " + SANS; x.fillText(ilCardFit(x, D.level, W - 2 * P), P, 502);
    }
  }
  // Score.
  x.fillStyle = GOLD; x.font = "400 200px " + SERIF;
  const score = ilCardPct(D.pct); x.fillText(score, P - 6, 724);
  const sw = x.measureText(score).width;
  x.fillStyle = MUTED; x.font = "400 32px " + SANS; x.fillText("Pass mark " + D.passMark + "%", P + sw + 22, 700);
  // Strongest skills (top three).
  const top = (D.skills || []).slice().sort((a, b) => b.p - a.p).slice(0, 3);
  x.fillStyle = GOLD; x.font = "600 30px " + SANS; x.fillText(D.topLabel || "Strongest skills", P, 806);
  top.forEach((s, i) => {
    const y = 862 + i * 96;
    x.font = "400 34px " + SANS; x.fillStyle = CREAM;
    const pct = ilCardPct(s.p), pctW = x.measureText(pct).width;
    x.fillText(ilCardFit(x, s.n, W - 2 * P - pctW - 30), P, y);
    x.fillText(pct, W - P - pctW, y);
    ilCardRound(x, P, y + 20, W - 2 * P, 14, 7); x.fillStyle = TRACK; x.fill();
    ilCardRound(x, P, y + 20, Math.max(14, (W - 2 * P) * Math.min(100, s.p) / 100), 14, 7); x.fillStyle = GOLD; x.fill();
  });
  // Footer: date, report ID, invitation, QR code to the verify page.
  x.fillStyle = TRACK; x.fillRect(P, 1160, W - 2 * P, 2);
  const qs = 150, qx = W - P - qs, qy = 1182;
  x.fillStyle = SOFT; x.font = "400 28px " + SANS;
  x.fillText(ilCardFit(x, D.date + " · ID " + D.id, qx - P - 24), P, 1222);
  x.fillStyle = CREAM; x.font = "600 34px " + SANS; x.fillText("Take it free at ingleslegal.com", P, 1276);
  ilCardRound(x, qx, qy, qs, qs, 12); x.fillStyle = CREAM; x.fill();
  try{
    const q = qrcode(0, "M"); q.addData(CERT_VERIFY + "?id=" + D.id); q.make();
    const n = q.getModuleCount(), cell = (qs - 20) / n;
    x.fillStyle = INK;
    for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) x.fillRect(qx + 10 + k * cell, qy + 10 + r * cell, Math.ceil(cell), Math.ceil(cell));
  }catch(e){}
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("toBlob")), "image/png"));
}
/* Draws the card as soon as the share box is on screen, so a tap can share it straight away. */
async function ilCardPrepare(){
  const D = ilCardData(), img = document.getElementById("ilCardImg"), hint = document.getElementById("ilCardHint");
  if(!D || !img) return;
  try{
    const key = D.id + (_ilCardShowName ? ":name" : ":noname");
    if(!_ilCardBlob || _ilCardId !== key){
      _ilCardBlob = null;
      const b = await ilCardDraw(D);
      if(key !== D.id + (_ilCardShowName ? ":name" : ":noname")) return; // the box was toggled again meanwhile
      _ilCardBlob = b; _ilCardId = key;
    }
    if(img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(_ilCardBlob);
    img.closest(".ilcard").classList.add("ready");
    if(hint) hint.textContent = "";
  }catch(e){
    const box = img.closest(".ilcard"); if(box) box.remove();
  }
}
function ilCardCopy(text){
  if(!text) return;
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(t); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallback); } else { fallback(); }
}
function ilCardDownload(){
  const D = ilCardData(); if(!D || !_ilCardBlob) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(_ilCardBlob); a.download = ilCardFileName(D);
  document.body.appendChild(a); a.click(); a.remove();
}
function ilCardShare(btn){
  const D = ilCardData(), hint = document.getElementById("ilCardHint");
  if(!D) return;
  if(!_ilCardBlob){ if(hint) hint.textContent = IL_CARD_T.wait; ilCardPrepare(); return; }
  const msg = ilCardMsg();
  const file = new File([_ilCardBlob], ilCardFileName(D), { type: "image/png" });
  if(navigator.canShare && navigator.share && navigator.canShare({ files: [file] })){
    ilCardCopy(msg);
    navigator.share({ files: [file], text: msg }).catch(() => {});
    return;
  }
  ilCardDownload();
  ilCardCopy(msg);
  if(hint) hint.innerHTML = IL_CARD_T.done + ' <a href="https://www.linkedin.com/feed/?shareActive=true" target="_blank" rel="noopener">' + IL_CARD_T.open + "</a>";
}
/* "Show my name on the card": redraws the card with or without the candidate's name. */
function ilCardToggleName(cb){
  _ilCardShowName = !!cb.checked;
  const hint = document.getElementById("ilCardHint");
  if(hint) hint.textContent = IL_CARD_T.wait;
  ilCardPrepare();
}
function ilCardHTML(){
  const D = ilCardData(); if(!D) return "";
  if(!document.getElementById("ilCardCss")){
    const s = document.createElement("style"); s.id = "ilCardCss";
    s.textContent = ".ilcard{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 16px}"
      + ".ilcard img{width:190px;aspect-ratio:4/5;border-radius:6px;background:#2A1A32;border:1px solid rgba(201,169,110,.45);display:block}"
      + ".ilcard:not(.ready) img{visibility:hidden}"
      + ".ilcard-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}"
      + ".ilcard-hint{font-size:13px;line-height:1.5;opacity:.9}.ilcard-hint a{color:#C9A96E}"
      + ".ilcard-name{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.4;cursor:pointer;color:#F1EBDE}"
      + ".ilcard-name input{width:16px;height:16px;margin:0;accent-color:#C9A96E;cursor:pointer}";
    document.head.appendChild(s);
  }
  setTimeout(ilCardPrepare, 0);
  const b = D.btn || { gold: "btn gold", ghost: "btn ghost" };
  return `<div class="ilcard"><img id="ilCardImg" alt="${IL_CARD_T.alt}"><div class="ilcard-side">`
    + `<button type="button" class="${b.gold}" onclick="ilCardShare(this)">${IL_CARD_T.share}</button>`
    + `<button type="button" class="${b.ghost}" onclick="ilCardDownload()">${IL_CARD_T.download}</button>`
    + `<label class="ilcard-name"><input type="checkbox" id="ilCardName" ${_ilCardShowName ? "checked" : ""} onchange="ilCardToggleName(this)">${IL_CARD_T.name}</label>`
    + `<div class="ilcard-hint" id="ilCardHint" aria-live="polite">${IL_CARD_T.wait}</div></div></div>`;
}
