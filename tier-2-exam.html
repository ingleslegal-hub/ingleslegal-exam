<script>
// ============================================================
// Tier 2 — 150 questions (Advanced professional level), rebuilt Oct 2026.
// Answer positions balanced; option lengths checked for bias. Source: scratch bank t2*.json
// ============================================================
const TIER_LABEL = "Tier 2";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyLtcitp5MB6QoNl0jVXOCI7TPHot9Lj-wYJNosfrQZpnI5pmH2ECoX2Ytv5pVQt1f-/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Discovery & Evidence", "stem": "Under the Federal Rules of Evidence, \"hearsay\" is:", "opts": ["any written document that was prepared before the lawsuit began", "any statement made by a witness who is not physically present in the courtroom at trial", "an out-of-court statement offered to prove the truth of what it asserts", "testimony about events the witness saw but did not participate in"], "a": 2, "fb": "Definition (FRE 801): the key test is purpose. The same out-of-court words may be admissible if offered for another purpose, such as showing that a warning was given."}, {"cat": "Discovery & Evidence", "stem": "The plaintiff offers the defendant driver's statement at the scene: \"I'm sorry, I was texting.\" How is it treated under the FRE?", "opts": ["As inadmissible hearsay because it was made out of court", "As admissible only if the driver is unavailable to testify", "As privileged because it was an apology to the victim", "As an opposing party's statement, which is not hearsay"], "a": 3, "fb": "FRE 801(d)(2): a party's own statement offered against that party is excluded from the hearsay definition, so no hearsay exception (and no showing of unavailability) is needed."}, {"cat": "Discovery & Evidence", "stem": "A patient tells an ER doctor, \"The car hit my left side and my neck hurts.\" Why is this statement usually admissible?", "opts": ["It was made for medical diagnosis or treatment", "It was made under oath to a licensed professional", "It is a statement against the patient's interest", "It was recorded by a public official on duty"], "a": 0, "fb": "FRE 803(4): statements made for, and reasonably pertinent to, medical diagnosis or treatment are an exception because patients have a strong motive to be truthful. Statements about fault generally are not covered."}, {"cat": "Discovery & Evidence", "stem": "To admit hospital billing records without calling a live witness, the firm can usually rely on:", "opts": ["the insurance adjuster's acceptance of the bills", "an affidavit from the attorney who requested the records from the hospital", "a records custodian's certification under FRE 902(11)", "a letter from the client confirming the amounts"], "a": 2, "fb": "Business records: FRE 803(6) is the hearsay exception, and FRE 902(11) lets a custodian's written certification establish authenticity. Many states have similar procedures."}, {"cat": "Discovery & Evidence", "stem": "Which hearsay exception requires that the declarant be unavailable as a witness?", "opts": ["Business record", "Statement for medical diagnosis", "Statement against interest", "Excited utterance"], "a": 2, "fb": "FRE 804: exceptions such as statement against interest and former testimony require unavailability (death, privilege, lack of memory, etc.). FRE 803 exceptions apply regardless of availability."}, {"cat": "Discovery & Evidence", "stem": "Under FRE 401, evidence is relevant if it:", "opts": ["is supported by at least one live witness", "is more helpful to the party who offers it", "was obtained through formal discovery requests", "makes a fact of consequence more or less probable"], "a": 3, "fb": "Relevance is a low threshold. Relevant evidence can still be excluded, for example under FRE 403 when unfair prejudice substantially outweighs its probative value."}, {"cat": "Discovery & Evidence", "stem": "\"Impeachment\" of a witness at trial means:", "opts": ["calling the witness back for more questions", "asking the judge to hold the witness in contempt", "removing the witness from the case", "attacking the witness's credibility"], "a": 3, "fb": "Evidence: common impeachment methods include prior inconsistent statements, bias, and prior convictions. It is not related to the political meaning of removing an official."}, {"cat": "Discovery & Evidence", "stem": "A party fails to answer requests for admission within 30 days after service. Under FRCP 36, the matters are generally:", "opts": ["automatically extended", "deemed admitted", "deemed denied", "struck from the record"], "a": 1, "fb": "Risk: unanswered RFAs are admitted by default, which can decide key issues. The court may allow withdrawal of an admission, but relief is not guaranteed."}, {"cat": "Discovery & Evidence", "stem": "Under FRCP 33, absent agreement or court order, each party may serve how many interrogatories on another party, including discrete subparts?", "opts": ["Unlimited", "50", "10", "25"], "a": 3, "fb": "Rule 33(a)(1) limits interrogatories to 25, including discrete subparts. More require a stipulation or leave of court. State rules may differ."}, {"cat": "Discovery & Evidence", "stem": "When a party withholds documents as privileged, FRCP 26(b)(5) requires it to:", "opts": ["deliver the items to the judge for safekeeping", "notify the opposing party's client directly", "destroy any copies kept outside the firm", "describe the withheld items in a privilege log"], "a": 3, "fb": "Privilege log: the description must allow the other side to assess the claim without revealing the privileged content. Withholding without a log risks waiver or sanctions."}, {"cat": "Discovery & Evidence", "stem": "Notes an attorney prepares in anticipation of litigation are generally protected by:", "opts": ["the attorney-client privilege only", "the work-product doctrine", "the Fifth Amendment privilege", "the common interest doctrine"], "a": 1, "fb": "Work product (FRCP 26(b)(3)) protects materials prepared in anticipation of litigation, even when no client communication is involved. Opinion work product receives the strongest protection."}, {"cat": "Discovery & Evidence", "stem": "Two co-defendants' lawyers share a joint strategy memo. Which doctrine may prevent waiver of privilege?", "opts": ["The common interest doctrine", "The work-product waiver rule", "The collateral source rule", "The crime-fraud exception"], "a": 0, "fb": "Common interest (joint defense) allows parties with a shared legal interest to exchange privileged material without waiving protection. The crime-fraud exception removes privilege instead."}, {"cat": "Discovery & Evidence", "stem": "Opposing counsel notices repeated depositions of the client's relatives to harass them. Which motion fits best?", "opts": ["A motion for a protective order", "A motion for a more definite statement", "A motion to compel", "A motion in limine"], "a": 0, "fb": "FRCP 26(c): a protective order shields a party from annoyance, embarrassment, oppression or undue burden. A motion to compel is the opposite: it forces discovery."}, {"cat": "Discovery & Evidence", "stem": "Before filing a motion to compel discovery in federal court, the movant must certify that it:", "opts": ["obtained the court clerk's prior approval", "served the motion on the opposing party's client", "paid the opposing party's attorney's fees", "conferred in good faith to resolve the dispute"], "a": 3, "fb": "Meet and confer: FRCP 37(a)(1) requires a good-faith conferral certification. Many local rules add specific procedures."}, {"cat": "Discovery & Evidence", "stem": "A non-party hospital must bring patient records to a deposition. The correct instrument is a:", "opts": ["letter of preservation", "subpoena duces tecum", "request for production", "notice of deposition"], "a": 1, "fb": "FRCP 45: requests for production only bind parties. Non-parties are compelled by subpoena; \"duces tecum\" means bring documents with you."}, {"cat": "Discovery & Evidence", "stem": "A deposition notice to a corporation under FRCP 30(b)(6) requires the corporation to:", "opts": ["allow inspection of its offices and equipment", "produce its chief executive officer for questioning", "designate and prepare a witness to testify on listed topics", "answer written questions under oath within thirty days of service"], "a": 2, "fb": "Rule 30(b)(6): the organization chooses the witness, who must be prepared on the topics, and the testimony binds the organization."}, {"cat": "Discovery & Evidence", "stem": "Under FRCP 30(c)(2), an attorney may instruct a witness not to answer a deposition question only to:", "opts": ["avoid questions that are irrelevant, repetitive, or poorly phrased", "preserve a privilege, enforce a court order, or present a motion to limit", "prevent answers that could weaken the client's position at trial", "protect the witness from questions that may be embarrassing"], "a": 1, "fb": "Depositions: other objections are stated on the record and the witness still answers. Improper instructions can lead to sanctions."}, {"cat": "Discovery & Evidence", "stem": "When litigation is reasonably anticipated, a firm sends the client a litigation hold. Its purpose is to:", "opts": ["freeze the client's bank accounts until trial", "stop the opposing party from filing the suit", "delay all court deadlines until the settlement negotiations have ended", "suspend routine deletion of potentially relevant evidence"], "a": 3, "fb": "Preservation: the duty to preserve begins when litigation is reasonably anticipated. Loss of evidence can lead to spoliation sanctions."}, {"cat": "Discovery & Evidence", "stem": "The destruction or loss of evidence that a party had a duty to preserve is called:", "opts": ["conversion", "laches", "subornation", "spoliation"], "a": 3, "fb": "Key term: spoliation can lead to sanctions such as adverse-inference instructions. For lost ESI, FRCP 37(e) sets the standards."}, {"cat": "Discovery & Evidence", "stem": "Producing a spreadsheet in \"native format\" means producing it:", "opts": ["as a flat image converted to PDF or TIFF", "as a summary chart prepared by counsel", "as a printed copy signed by the custodian", "as the original file, with formulas and metadata"], "a": 3, "fb": "E-discovery: native files preserve formulas and metadata that images lose. Parties often negotiate production format in an ESI protocol."}, {"cat": "Discovery & Evidence", "stem": "Under FRCP 26(a)(2), a retained expert's disclosure must generally include:", "opts": ["copies of all the expert's prior cases", "a sworn statement from opposing counsel", "the expert's personal tax returns", "a written report signed by the expert"], "a": 3, "fb": "Expert reports must contain the opinions and their basis, the facts considered, exhibits, qualifications, prior testimony for four years, and compensation."}, {"cat": "Discovery & Evidence", "stem": "In federal court, an expert's methodology can be challenged under FRE 702 in a:", "opts": ["Miranda hearing", "Daubert motion", "Batson challenge", "Brady motion"], "a": 1, "fb": "Expert evidence: the judge acts as gatekeeper, testing whether the expert's methods are reliable and reliably applied. Batson, Brady and Miranda are criminal law doctrines."}, {"cat": "Discovery & Evidence", "stem": "Under FRCP 37(c)(1), a party that fails to disclose a witness as required may be barred from using that witness unless the failure was:", "opts": ["approved by the opposing party's client", "corrected before the final pretrial order", "substantially justified or harmless", "caused by a scheduling conflict"], "a": 2, "fb": "Exclusion sanction: Rule 37(c)(1) is designed to prevent surprise at trial. Courts may also impose other sanctions."}, {"cat": "Discovery & Evidence", "stem": "Under FRE 902, which document is self-authenticating?", "opts": ["An unsigned email from the defendant", "A certified copy of a public record", "A photograph taken by the client", "A handwritten note found at the scene"], "a": 1, "fb": "Self-authentication: certified public records, official publications and newspapers need no witness to authenticate them. The other items require authentication under FRE 901."}, {"cat": "Discovery & Evidence", "stem": "An evasive or incomplete discovery answer is treated, under FRCP 37(a)(4), as:", "opts": ["a waiver of objections", "a failure to answer", "a partial admission", "a timely response"], "a": 1, "fb": "Rule 37(a)(4) lets the requesting party move to compel when answers are evasive or incomplete."}, {"cat": "Motions, Trial & Appeals", "stem": "A defendant argues that, even if every fact in the complaint is true, the law gives no remedy. The correct motion is a:", "opts": ["Rule 56 motion for summary judgment", "Rule 50 motion for judgment as a matter of law", "Rule 12(e) motion for more definite statement", "Rule 12(b)(6) motion to dismiss"], "a": 3, "fb": "Rule 12(b)(6) tests the legal sufficiency of the complaint. Summary judgment looks at evidence; Rule 50 is made at trial."}, {"cat": "Motions, Trial & Appeals", "stem": "A complaint is so vague that the defendant cannot reasonably prepare a response. The defendant may move for a:", "opts": ["judgment on the pleadings", "protective order", "more definite statement", "directed verdict"], "a": 2, "fb": "Rule 12(e): the motion must point out the defects and the details needed. It is filed before the responsive pleading."}, {"cat": "Motions, Trial & Appeals", "stem": "Complete: \"Plaintiff moves to ________ the affirmative defenses as legally insufficient under Rule 12(f).\"", "opts": ["quash", "vacate", "dismiss", "strike"], "a": 3, "fb": "Collocation: you move to strike pleadings or defenses, quash a subpoena, vacate a judgment, and dismiss a claim."}, {"cat": "Motions, Trial & Appeals", "stem": "After the pleadings close, a party asks the court to rule based only on the complaint and answer. This is a motion for:", "opts": ["a new trial", "summary judgment", "judgment on the pleadings", "default judgment"], "a": 2, "fb": "Rule 12(c): it is decided on the pleadings alone, without discovery materials. If outside evidence is considered, it is treated as summary judgment."}, {"cat": "Motions, Trial & Appeals", "stem": "Before trial, the defense asks the court to exclude evidence of a prior settlement. This is a:", "opts": ["motion for remittitur", "motion in limine", "motion to compel", "motion to quash"], "a": 1, "fb": "Trial practice: motions in limine resolve evidence disputes before the jury hears them. Remittitur reduces an excessive verdict after trial."}, {"cat": "Motions, Trial & Appeals", "stem": "The questioning of prospective jurors to select a jury is called:", "opts": ["certiorari", "en banc", "voir dire", "sua sponte"], "a": 2, "fb": "Trial terms: voir dire is jury selection. En banc means all judges of an appellate court; sua sponte means on the court's own initiative; certiorari is Supreme Court review."}, {"cat": "Motions, Trial & Appeals", "stem": "A defendant sued in state court moves the case to federal court. This procedure is called:", "opts": ["remand", "removal", "abstention", "transfer of venue"], "a": 1, "fb": "Watch the pair: removal moves a case from state to federal court; remand sends it back to state court (and, on appeal, back to a lower court)."}, {"cat": "Motions, Trial & Appeals", "stem": "Federal diversity jurisdiction requires complete diversity of citizenship and an amount in controversy of more than:", "opts": ["$10,000", "$150,000", "$50,000", "$75,000"], "a": 3, "fb": "28 U.S.C. § 1332: the amount must exceed $75,000, exclusive of interest and costs, and no plaintiff may share citizenship with any defendant."}, {"cat": "Motions, Trial & Appeals", "stem": "A federal court hears a state-law claim because it arises from the same facts as a federal claim in the case. This is:", "opts": ["pendent venue", "diversity jurisdiction", "concurrent jurisdiction", "supplemental jurisdiction"], "a": 3, "fb": "28 U.S.C. § 1367: supplemental jurisdiction covers claims forming part of the same case or controversy (a common nucleus of operative fact)."}, {"cat": "Motions, Trial & Appeals", "stem": "To sue, a plaintiff must have \"standing,\" which requires:", "opts": ["a concrete injury that the defendant caused and a court can remedy", "enough money to pay all the costs of the litigation through trial", "a prior written demand sent to the defendant", "residence in the same state as the trial court"], "a": 0, "fb": "Standing (legitimación): injury in fact, causation and redressability. Without standing, the court must dismiss."}, {"cat": "Motions, Trial & Appeals", "stem": "In most federal civil cases, a notice of appeal must be filed within how many days after entry of judgment?", "opts": ["60 days", "30 days", "10 days", "90 days"], "a": 1, "fb": "FRAP 4(a)(1)(A): 30 days, or 60 days when the United States or its officer or agency is a party. State deadlines vary, so always check the applicable rule."}, {"cat": "Motions, Trial & Appeals", "stem": "A judge raises an issue \"sua sponte.\" This means the judge:", "opts": ["acted at the request of both parties", "acted on the court's own initiative", "decided the issue without a written order", "delegated the issue to a magistrate"], "a": 1, "fb": "Latin term: sua sponte (de oficio). For example, a court may dismiss for lack of subject matter jurisdiction sua sponte."}, {"cat": "Motions, Trial & Appeals", "stem": "A non-party organization files a brief to help an appellate court decide an important legal issue. It is called an:", "opts": ["amicus curiae", "guardian ad litem", "real party in interest", "intervenor"], "a": 0, "fb": "Appellate terms: an amicus curiae (friend of the court) is not a party. An intervenor joins the case as a party; a guardian ad litem represents a minor or incapacitated person."}, {"cat": "Motions, Trial & Appeals", "stem": "An appellate court finds a trial error that did not affect the outcome. It will usually treat the error as:", "opts": ["reversible error", "structural error", "plain error", "harmless error"], "a": 3, "fb": "Appeals: only prejudicial (reversible) errors, those that affected substantial rights, justify reversal. Harmless errors do not."}, {"cat": "Motions, Trial & Appeals", "stem": "A party disobeys a court order to produce documents. The court may hold the party in:", "opts": ["default", "contempt", "abeyance", "arrears"], "a": 1, "fb": "Sanctions: contempt (desacato) can bring fines or other sanctions. FRCP 37(b) also lists sanctions for violating discovery orders."}, {"cat": "Motions, Trial & Appeals", "stem": "To modify a federal scheduling order, a party must generally show:", "opts": ["good cause", "financial hardship", "the other side's consent", "excusable neglect only"], "a": 0, "fb": "FRCP 16(b)(4): a schedule may be modified only for good cause and with the judge's consent. Agreement between the parties alone is not enough."}, {"cat": "Motions, Trial & Appeals", "stem": "An insurer asks a court to state whether its policy covers a claim, without seeking damages. This is an action for a:", "opts": ["writ of mandamus", "default judgment", "preliminary injunction", "declaratory judgment"], "a": 3, "fb": "Remedies: a declaratory judgment defines the parties' rights. Coverage disputes are a common example."}, {"cat": "Motions, Trial & Appeals", "stem": "A party needs to stop an imminent harm for a few days until a hearing can be held. The fastest remedy is a:", "opts": ["writ of execution", "permanent injunction", "temporary restraining order", "declaratory judgment"], "a": 2, "fb": "Injunctive relief: a TRO is short-term and can sometimes be issued without notice. A preliminary injunction follows a hearing; a permanent injunction comes with final judgment."}, {"cat": "Motions, Trial & Appeals", "stem": "An appellate court reviews a pure question of law using which standard?", "opts": ["Clearly erroneous", "Substantial evidence", "Abuse of discretion", "De novo"], "a": 3, "fb": "Standards of review: legal questions are reviewed de novo (fresh). Factual findings get deference (clearly erroneous), and discretionary rulings are reviewed for abuse of discretion."}, {"cat": "Damages, Insurance & Settlement", "stem": "Physical therapy invoices, prescription costs, and diagnostic bills are classified as:", "opts": ["general (non-economic) damages", "special (economic) damages", "punitive damages", "nominal damages"], "a": 1, "fb": "Damages: each special damages item should be supported by an invoice or record in the demand package."}, {"cat": "Damages, Insurance & Settlement", "stem": "Mental anguish, permanent scarring, and loss of enjoyment of life are classified as:", "opts": ["general (non-economic) damages", "consequential damages", "liquidated damages", "special (economic) damages"], "a": 0, "fb": "Damages: general damages are subjective. Detailed client descriptions of daily-life impact help the attorney support these amounts."}, {"cat": "Damages, Insurance & Settlement", "stem": "\"Exemplary damages\" is another name for:", "opts": ["compensatory damages", "punitive damages", "nominal damages", "statutory damages"], "a": 1, "fb": "Terminology: exemplary and punitive damages both punish egregious conduct and deter others. Some states cap or restrict them."}, {"cat": "Damages, Insurance & Settlement", "stem": "A client's car was fully repaired, but its resale value dropped because of the accident history. This loss is called:", "opts": ["loss of use", "diminished value", "total loss", "depreciation"], "a": 1, "fb": "Property damage: diminished value (depreciación por siniestro) is the loss in market value after repair. Loss of use is the cost of not having the car, such as a rental."}, {"cat": "Damages, Insurance & Settlement", "stem": "The collateral source rule generally means that the defendant's liability is:", "opts": ["not reduced by payments the plaintiff got from independent sources", "reduced by any health insurance payments the plaintiff received", "limited to the amount of the plaintiff's own insurance policy", "shifted to the plaintiff's health insurer after a settlement"], "a": 0, "fb": "Damages: the rule keeps a defendant from benefiting from the plaintiff's insurance. Many states have modified it by statute, so check local law."}, {"cat": "Damages, Insurance & Settlement", "stem": "The plaintiff's health insurer paid her medical bills and now claims part of the settlement. This right is called:", "opts": ["contribution", "indemnity", "setoff", "subrogation"], "a": 3, "fb": "Liens: subrogation lets the insurer step into the insured's shoes to recover what it paid. Resolving these claims is part of settlement distribution."}, {"cat": "Damages, Insurance & Settlement", "stem": "Under the made-whole doctrine, where it applies, an insurer generally cannot enforce subrogation until:", "opts": ["the case has gone to a jury verdict", "the insured has been fully compensated", "the attorney's fees have been doubled", "the insurer has paid the policy limits"], "a": 1, "fb": "Liens: the made-whole doctrine protects clients whose recovery does not cover all their losses. Plan language and ERISA can limit it."}, {"cat": "Damages, Insurance & Settlement", "stem": "Personal Injury Protection (PIP) coverage in no-fault states pays:", "opts": ["the insured's medical costs and lost wages regardless of fault", "punitive damages awarded against a reckless driver", "property damage to the vehicle after any collision", "the other driver's damages only when the insured is at fault"], "a": 0, "fb": "Insurance: PIP pays the policyholder's own benefits up to a limit, regardless of fault. No-fault states may limit lawsuits unless an injury threshold is met."}, {"cat": "Damages, Insurance & Settlement", "stem": "An umbrella policy provides:", "opts": ["coverage only for weather-related property damage", "excess liability coverage above primary policy limits", "a refund of premiums if no claims are filed", "health coverage for passengers in the insured's car"], "a": 1, "fb": "Insurance: umbrella coverage applies after the primary policy is exhausted. Asset and policy searches can reveal additional coverage."}, {"cat": "Damages, Insurance & Settlement", "stem": "An insurance policy section that lists perils or situations NOT covered is the:", "opts": ["insuring agreement", "endorsements section", "exclusions section", "declarations page"], "a": 2, "fb": "Policy structure: the declarations page lists the insured, limits and premium; the insuring agreement grants coverage; exclusions remove coverage; endorsements modify the policy."}, {"cat": "Damages, Insurance & Settlement", "stem": "An insurer unreasonably refuses to settle a clear-liability claim within policy limits, exposing its insured to an excess verdict. This may give rise to a claim for:", "opts": ["promissory estoppel", "unjust enrichment", "bad faith", "conversion"], "a": 2, "fb": "Insurance: bad-faith claims arise from an insurer's unreasonable handling of claims. Time-limited demands are often used to test the insurer's response."}, {"cat": "Damages, Insurance & Settlement", "stem": "A \"time-limited demand\" sent to an insurer:", "opts": ["requests the insurer's complete claim file before mediation begins", "asks the court to order the insurer to pay within 30 days", "offers to settle within policy limits if accepted by a deadline", "extends the statute of limitations until the insurer responds"], "a": 2, "fb": "Settlement: many states regulate these demands by statute. Missing a required term can weaken a later bad-faith argument, so follow the attorney's checklist precisely."}, {"cat": "Damages, Insurance & Settlement", "stem": "The total amount the insurer pays to settle, before fees, costs, and liens are deducted, is the:", "opts": ["gross settlement", "net settlement", "structured settlement", "policy limit"], "a": 0, "fb": "Settlement math: gross minus fees, case costs and liens equals the client's net recovery."}, {"cat": "Damages, Insurance & Settlement", "stem": "When settlement funds clear the trust account, the firm prepares a document showing fees, costs, liens, and the client's net amount. This is the:", "opts": ["retainer agreement", "settlement statement", "closing letter", "release of all claims"], "a": 1, "fb": "Trust accounting: the settlement (distribution) statement is signed by the client before funds are disbursed from the IOLTA or trust account."}, {"cat": "Damages, Insurance & Settlement", "stem": "A client who signs a general release in exchange for payment generally:", "opts": ["gives up claims arising from the incident, including future ones", "keeps all claims against the insurer's own insured", "releases only the claims listed in the police report", "may reopen the claim if her injuries become worse in the months after signing"], "a": 0, "fb": "Releases are generally final. Clients must understand they cannot later ask for more, even if the injury worsens."}, {"cat": "Damages, Insurance & Settlement", "stem": "A settlement release keeps a pending workers' compensation claim alive by using a:", "opts": ["merger clause", "choice-of-law clause", "carve-out clause", "no-waiver clause"], "a": 2, "fb": "Drafting: a carve-out expressly excludes certain claims or parties from the release. Without it, broad release language may cover them."}, {"cat": "Damages, Insurance & Settlement", "stem": "A settlement agreement clause that prohibits disclosing the amount and terms to third parties is a:", "opts": ["severability clause", "non-disparagement clause", "confidentiality clause", "integration clause"], "a": 2, "fb": "Settlement terms: confidentiality limits disclosure of terms. Non-disparagement prohibits negative statements about the other party."}, {"cat": "Damages, Insurance & Settlement", "stem": "A client receives medical treatment now, and the provider agrees to be paid from the future settlement. The document that secures this arrangement is a:", "opts": ["hold harmless letter", "reservation of rights letter", "letter of protection", "letter of representation"], "a": 2, "fb": "PI practice: a letter of protection (LOP) promises the provider payment from any recovery. These balances must be tracked as liens. A reservation of rights letter comes from an insurer questioning coverage."}, {"cat": "Damages, Insurance & Settlement", "stem": "The adjuster wants credit for medical payments the insurer already made before settlement. This is a request for a:", "opts": ["contribution", "remittitur", "rebate", "setoff"], "a": 3, "fb": "Settlement math: a setoff (or offset) reduces the payment by amounts already paid. Check whether the policy and state law allow it."}, {"cat": "Damages, Insurance & Settlement", "stem": "\"Pre-judgment interest\" is interest that accrues:", "opts": ["on attorney's fees after the case is closed", "on the plaintiff's medical bills while unpaid", "on damages before the final judgment is entered", "on a judgment after it has been entered"], "a": 2, "fb": "Interest: pre-judgment interest compensates for delay before judgment; post-judgment interest runs after entry of judgment. Availability and rates are set by law."}, {"cat": "Damages, Insurance & Settlement", "stem": "A survey of jury verdicts for similar injuries in the same venue is used mainly to:", "opts": ["determine whether the court has jurisdiction", "calculate the statute of limitations", "support the valuation of the claim", "choose which judge will hear the case"], "a": 2, "fb": "Valuation: verdict and settlement research gives objective support for a demand amount."}, {"cat": "Damages, Insurance & Settlement", "stem": "A hospital bills a patient for the difference between its charges and the amount the patient's insurer paid under their contract. This is:", "opts": ["balance billing", "subrogation", "upcoding", "double billing"], "a": 0, "fb": "Medical billing: balance billing is restricted in many situations by state law and the federal No Surprises Act. Upcoding means billing for a more expensive service than provided."}, {"cat": "Damages, Insurance & Settlement", "stem": "A demand package with disorganized, unexplained bills usually leads the adjuster to:", "opts": ["pay the full policy limits", "undervalue the claim", "refer the claim to court", "waive the medical liens"], "a": 1, "fb": "Practice: clear chronologies and itemized special damages make the claim easier to evaluate and harder to discount."}, {"cat": "Damages, Insurance & Settlement", "stem": "\"Lien resolution\" before disbursing settlement funds means:", "opts": ["transferring the liens to the defendant's insurer", "delaying payment of liens until the client agrees", "negotiating and paying valid claims by providers and payers", "asking the court to dismiss all liens automatically"], "a": 2, "fb": "Settlement: unresolved liens can create liability for the firm. Medicare, Medicaid and ERISA plans have special rules."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A store failed to clean a spilled liquid it knew about, and a customer fell. The key issue in a premises liability claim is usually whether the store:", "opts": ["owned the building where the store operates", "posted its hours of operation at the entrance", "had liability insurance on the date of the fall", "knew or should have known of the hazard"], "a": 3, "fb": "Premises liability: notice (actual or constructive) and a failure to fix or warn are central. Photos, incident reports and video help prove notice."}, {"cat": "Torts, Contracts & Business Claims", "stem": "\"Res ipsa loquitur\" allows an inference of negligence when:", "opts": ["the defendant has admitted fault in a signed written statement", "the plaintiff was partly at fault for the accident", "the accident ordinarily does not happen without negligence", "a statute was violated by the defendant"], "a": 2, "fb": "Key doctrine: the instrument causing harm is usually within the defendant's control. Violating a statute is negligence per se, a different doctrine."}, {"cat": "Torts, Contracts & Business Claims", "stem": "Pills containing glass fragments from the factory involve which type of product defect?", "opts": ["Manufacturing defect", "Warning defect", "Design defect", "Marketing defect"], "a": 0, "fb": "Products liability: a manufacturing defect affects specific units that differ from the intended design. A design defect affects the whole product line."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A former manager tells other employers false statements that damage a client's professional reputation. The main claim is:", "opts": ["invasion of privacy", "malicious prosecution", "defamation", "abuse of process"], "a": 2, "fb": "Torts: defamation is a false statement of fact, published to others, that harms reputation. Slander is spoken; libel is written."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A competitor knowingly induces a client's customer to break a signed contract. The claim is:", "opts": ["tortious interference", "unjust enrichment claim", "promissory estoppel claim", "breach of fiduciary duty"], "a": 0, "fb": "Business torts: the defendant must know of the contract and intentionally and improperly cause its breach. Interference with prospective relationships is a related tort."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A business partner secretly takes company funds to open a competing business. Which claim fits best?", "opts": ["Negligence per se", "Breach of fiduciary duty", "Breach of warranty", "Tortious interference"], "a": 1, "fb": "Business claims: partners and officers owe duties of loyalty and care. Taking company assets may also support conversion claims."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A factory's noxious smoke repeatedly interferes with a neighbor's use and enjoyment of her home. The claim is:", "opts": ["public nuisance", "private nuisance", "inverse condemnation", "trespass to chattels"], "a": 1, "fb": "Property torts: private nuisance is a substantial, unreasonable interference with use and enjoyment of land. Public nuisance affects the community at large."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A contractor performs work without a valid contract, and the owner keeps the benefit. The contractor can seek the reasonable value of the work under:", "opts": ["res judicata", "in pari delicto", "quantum meruit", "respondeat superior"], "a": 2, "fb": "Quasi-contract: quantum meruit (as much as he deserves) prevents unjust enrichment by awarding the reasonable value of services provided."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A person reasonably relies on a promise to her detriment, but there was no consideration. She may still recover under:", "opts": ["the mailbox rule", "promissory estoppel", "accord and satisfaction", "the parol evidence rule"], "a": 1, "fb": "Contracts: promissory estoppel enforces a promise when reliance was reasonable and foreseeable and injustice can be avoided only by enforcement."}, {"cat": "Torts, Contracts & Business Claims", "stem": "Before performance is due, a party clearly states it will not perform. This is:", "opts": ["frustration of purpose", "substantial performance", "impossibility", "anticipatory repudiation"], "a": 3, "fb": "Contracts: anticipatory repudiation allows the other party to treat the contract as breached immediately and to seek damages."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A seller induced a buyer to sign a contract by making a knowingly false statement. The buyer may claim:", "opts": ["mutual mistake", "fraud in the inducement", "fraud in the factum", "unconscionability"], "a": 1, "fb": "Contracts: fraud in the inducement makes the contract voidable. Fraud in the factum (deceit about the nature of the document itself) can make it void."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A contract term is so one-sided and oppressive that a court refuses to enforce it. This doctrine is:", "opts": ["impracticability", "illusory promise", "novation", "unconscionability"], "a": 3, "fb": "Contracts: courts usually look for both procedural unconscionability (unfair bargaining process) and substantive unconscionability (unfair terms)."}, {"cat": "Torts, Contracts & Business Claims", "stem": "\"We will buy as many units as we decide we want, if any.\" This is an example of an:", "opts": ["illusory promise", "option contract", "output contract", "implied warranty"], "a": 0, "fb": "Contracts: an illusory promise commits the promisor to nothing, so it cannot serve as consideration. A requirements contract, by contrast, binds the buyer to purchase what it actually needs."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A debtor sends a check marked \"paid in full\" to settle a genuinely disputed debt, and the creditor cashes it. This may result in:", "opts": ["a novation of the contract", "anticipatory repudiation", "accord and satisfaction", "a waiver of consideration"], "a": 2, "fb": "Contracts: the creditor's acceptance can discharge the disputed claim. UCC § 3-311 sets specific requirements."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A clause stating that the written contract is the parties' complete agreement and replaces earlier understandings is a(n):", "opts": ["integration (merger) clause", "indemnification clause", "force majeure clause", "severability clause"], "a": 0, "fb": "Contracts: integration clauses support application of the parol evidence rule to exclude prior side agreements."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A clause in which one party agrees to cover the other party's losses from third-party claims is an:", "opts": ["exculpatory clause", "acceleration clause", "arbitration clause", "indemnification clause"], "a": 3, "fb": "Contracts: indemnity shifts risk of third-party claims. An exculpatory clause releases a party from its own liability to the other party."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A signed waiver stating that a customer cannot hold a gym responsible for injuries is an:", "opts": ["exculpatory clause", "integration clause", "indemnification clause", "liquidated damages clause"], "a": 0, "fb": "Contracts: exculpatory clauses are often enforced for ordinary negligence but usually not for gross negligence or intentional misconduct."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A clause requiring all lawsuits under the contract to be filed in Miami-Dade County courts is a:", "opts": ["forum selection clause", "venue waiver clause", "arbitration clause", "choice-of-law clause"], "a": 0, "fb": "Contracts: forum selection decides where disputes are heard; choice of law decides which jurisdiction's law applies. Contracts often have both."}, {"cat": "Employment Law", "stem": "In a discrimination case, the employer says the employee was fired for lateness. The employee shows others were late and not fired. The employee is arguing that the reason is:", "opts": ["pretext", "a bona fide occupational qualification", "an after-acquired justification", "a business necessity defense"], "a": 0, "fb": "Burden shifting (McDonnell Douglas): after the employer gives a legitimate reason, the employee can show it is a pretext for discrimination. Comparator evidence is common."}, {"cat": "Employment Law", "stem": "Under the FLSA, an employer that fails to pay required overtime may owe back pay plus an equal amount as:", "opts": ["consequential damages", "punitive damages", "nominal damages", "liquidated damages"], "a": 3, "fb": "FLSA remedies: liquidated damages generally double the back pay unless the employer proves good faith and reasonable grounds. Attorney's fees are also recoverable."}, {"cat": "Employment Law", "stem": "A supervisor knows employees answer work emails at home after hours but does not pay for that time. Under the FLSA \"suffer or permit\" standard, this time is generally:", "opts": ["payable only if pre-approved", "compensable work time", "voluntary and unpaid", "exempt from overtime rules"], "a": 1, "fb": "Wage and hour: if the employer knows or should know of the work, it must pay for it. Employers cannot ignore off-the-clock work they allow."}, {"cat": "Employment Law", "stem": "Whether an employee qualifies for the FLSA administrative exemption depends mainly on:", "opts": ["the employee's salary and actual job duties", "the employee's job title in the handbook", "whether the employee works in an office or from home", "the employee's years of experience in the industry"], "a": 0, "fb": "Exemptions: titles do not control. Duties and salary tests decide, which is why misclassification claims are common."}, {"cat": "Employment Law", "stem": "The federal law requiring covered employers (generally 100 or more employees) to give 60 days' notice of a plant closing or mass layoff is the:", "opts": ["ADEA", "WARN Act", "FMLA", "ERISA"], "a": 1, "fb": "Statute map: WARN covers mass layoffs; FMLA covers leave; ERISA covers benefit plans; ADEA covers age discrimination (40 and older). Some states have stricter \"mini-WARN\" laws."}, {"cat": "Employment Law", "stem": "After a firing, the employer discovers the employee lied on her résumé, which would have led to termination anyway. Under the after-acquired evidence doctrine, this usually:", "opts": ["eliminates the discrimination claim entirely", "limits back pay to the date of discovery", "doubles the damages for the employer", "requires the employee to repay her wages"], "a": 1, "fb": "Damages: after-acquired evidence does not excuse discrimination, but it generally cuts off back pay and reinstatement (McKennon v. Nashville Banner)."}, {"cat": "Employment Law", "stem": "A restaurant manager keeps part of the tips customers leave for servers. Under the FLSA, this is:", "opts": ["unlawful retention of employee tips", "a lawful tip-pooling arrangement", "a deduction for business expenses", "a permitted tip credit"], "a": 0, "fb": "Wage and hour: the FLSA prohibits employers, managers and supervisors from keeping employees' tips. Valid tip pools are limited to eligible employees."}, {"cat": "Employment Law", "stem": "Non-union employees are fired for jointly complaining about unsafe conditions. Which agency and law are most relevant?", "opts": ["The NLRB, under the NLRA's protection of concerted activity", "OSHA, under the ADA's reasonable accommodation rules", "The EEOC, under Title VII's ban on workplace discrimination", "The Department of Labor, under the Family and Medical Leave Act"], "a": 0, "fb": "Labor law: Section 7 of the NLRA protects concerted activity even for non-union workers. OSHA also has whistleblower protections with very short filing deadlines."}, {"cat": "Employment Law", "stem": "An employee is fired for refusing to falsify reports sent to a government agency. In many states, this may support a claim for:", "opts": ["breach of the implied warranty of habitability", "negligent hiring, supervision and retention of the manager", "wrongful termination in violation of public policy", "constructive discharge under federal law"], "a": 2, "fb": "At-will exceptions: most states recognize a public-policy exception for firings based on refusing to break the law. Specific whistleblower statutes may also apply."}, {"cat": "Employment Law", "stem": "Federal age discrimination protection under the ADEA applies to workers who are:", "opts": ["40 or older", "55 or older", "65 or older", "50 or older"], "a": 0, "fb": "ADEA covers employees 40 and older at employers with 20 or more employees. Some state laws are broader."}, {"cat": "Employment Law", "stem": "To be eligible for FMLA leave, an employee generally must have worked for a covered employer for at least:", "opts": ["90 days with no unexcused absences", "12 months and 1,250 hours in the past year", "24 months as a full-time employee", "6 months and 500 hours in the past year"], "a": 1, "fb": "FMLA eligibility also requires 50 employees within 75 miles of the worksite. Some state leave laws are broader."}, {"cat": "Employment Law", "stem": "In a state with its own fair employment agency, an EEOC charge must generally be filed within how many days of the discriminatory act?", "opts": ["2 years", "300 days", "90 days", "180 days in every case"], "a": 1, "fb": "Deadlines: the default is 180 days, extended to 300 days where a state or local agency enforces a similar law. Intake should record the exact date of each act."}, {"cat": "Employment Law", "stem": "An employee is fired two days after returning from maternity leave. Which claim should intake flag first?", "opts": ["Negligent infliction of emotional distress only", "Breach of a non-compete or non-solicitation clause", "Pregnancy discrimination and FMLA retaliation", "Wage and hour misclassification of the position"], "a": 2, "fb": "Screening: timing close to protected leave is important evidence. The Pregnancy Discrimination Act, the Pregnant Workers Fairness Act and the FMLA may all be relevant."}, {"cat": "Employment Law", "stem": "A contractor pays workers in cash \"off the books\" to avoid taxes and insurance. Which issue should be flagged first?", "opts": ["Possible breach of a forum selection clause", "Possible defamation by the contractor", "Possible misclassification and unpaid wages", "Possible products liability exposure for workers"], "a": 2, "fb": "Screening: off-the-books pay often hides misclassification, unpaid overtime and missing workers' compensation coverage."}, {"cat": "Employment Law", "stem": "The legal framework where the employee makes a prima facie case, the employer gives a legitimate reason, and the employee shows pretext is called:", "opts": ["the Chevron deference test", "McDonnell Douglas burden shifting", "the Twombly plausibility test", "the Daubert reliability test"], "a": 1, "fb": "Discrimination law: McDonnell Douglas Corp. v. Green (1973) set this framework for circumstantial-evidence cases."}, {"cat": "Immigration", "stem": "The spouse of a U.S. citizen is classified as an:", "opts": ["F3 preference relative", "immediate relative", "F1 preference relative", "F2A preference relative"], "a": 1, "fb": "Family categories: immediate relatives (spouses, unmarried children under 21, and parents of adult citizens) have no annual numerical limit. F2A covers spouses and children of permanent residents."}, {"cat": "Immigration", "stem": "In a family preference case, the \"priority date\" is generally:", "opts": ["the date the beneficiary last entered the United States", "the date the petition was approved", "the date of the green card interview at the consulate", "the date USCIS received the properly filed petition"], "a": 3, "fb": "Priority date: it marks the beneficiary's place in line and appears on the I-797 receipt notice. Compare it with the monthly Visa Bulletin."}, {"cat": "Immigration", "stem": "Which agency publishes the monthly Visa Bulletin?", "opts": ["The Department of Labor", "USCIS", "The National Visa Center alone", "The U.S. Department of State"], "a": 3, "fb": "Agency map: the State Department publishes the Visa Bulletin, which shows which priority dates are current by category and country."}, {"cat": "Immigration", "stem": "Form I-864, Affidavit of Support, is a:", "opts": ["sponsor's enforceable promise to financially support the immigrant", "request to waive the government filing fee for the green card", "sworn statement by the couple that their marriage is genuine", "sworn declaration listing the immigrant's entire criminal history"], "a": 0, "fb": "Key form: the sponsor must meet income requirements, and the government or the immigrant can enforce the obligation."}, {"cat": "Immigration", "stem": "A couple married less than two years before the green card was approved. The spouse receives conditional residence and must later file:", "opts": ["Form I-130 to start a new petition", "Form I-751 to remove conditions", "Form N-400 to naturalize immediately", "Form I-485 to adjust status again"], "a": 1, "fb": "Conditional residence: the I-751 is generally filed jointly in the 90 days before the two-year card expires. Missing it can terminate status."}, {"cat": "Immigration", "stem": "Form I-601A allows certain applicants to:", "opts": ["seek an unlawful-presence waiver before leaving for a consular interview", "replace a green card that was lost, stolen, or badly damaged", "apply for asylum after the one-year filing deadline has passed", "request a work permit while an appeal is pending before the BIA"], "a": 0, "fb": "Provisional waiver: it reduces the time families spend apart by deciding the unlawful-presence waiver while the applicant is still in the U.S. It requires a qualifying relative and proof of extreme hardship."}, {"cat": "Immigration", "stem": "Which status may be available to victims of certain crimes who help law enforcement?", "opts": ["U nonimmigrant status", "H-2A status", "Temporary Protected Status", "T nonimmigrant status"], "a": 0, "fb": "Humanitarian relief: U visas require certification of helpfulness (Form I-918 Supplement B). T visas are for trafficking victims; TPS is based on country conditions."}, {"cat": "Immigration", "stem": "Temporary Protected Status (TPS) is granted based on:", "opts": ["cooperation with police in an ongoing criminal investigation", "a family relationship to a U.S. citizen or resident", "a qualifying offer of employment from a U.S. company", "conditions in the home country, such as war or disaster"], "a": 3, "fb": "TPS is designated by country and can be extended or terminated. It provides work authorization but is not itself a path to a green card."}, {"cat": "Immigration", "stem": "An immigration judge denies asylum because it was filed late, but the person may still qualify for protection with a higher standard of proof. This is:", "opts": ["deferred action", "cancellation of removal", "voluntary departure", "withholding of removal"], "a": 3, "fb": "Relief: withholding has no one-year deadline but requires showing it is more likely than not that the person will be persecuted. It does not lead to a green card."}, {"cat": "Immigration", "stem": "A person in expedited removal who expresses fear of returning will usually receive a:", "opts": ["credible fear interview", "biometrics appointment only", "naturalization interview", "consular interview"], "a": 0, "fb": "Asylum process: an asylum officer decides whether there is a significant possibility of establishing eligibility. A positive finding generally leads to proceedings or further review."}, {"cat": "Immigration", "stem": "After USCIS approves an I-130 for a beneficiary abroad, the case is usually sent to the:", "opts": ["National Visa Center", "immigration court", "Administrative Appeals Office", "Board of Immigration Appeals"], "a": 0, "fb": "Process map: the NVC collects fees and documents and schedules the consular interview. The BIA and AAO hear appeals; immigration courts handle removal."}, {"cat": "Immigration", "stem": "Appeals from an immigration judge's decision generally go to the:", "opts": ["U.S. District Court", "Board of Immigration Appeals (BIA)", "Administrative Appeals Office (AAO)", "Department of State"], "a": 1, "fb": "Appeals: EOIR's BIA reviews immigration judge decisions. The AAO reviews many USCIS decisions. Further review may be available in a federal court of appeals."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Me caí en el pasillo del hotel porque la alfombra estaba rota y suelta, y no había ninguna señal.\" Choose the best case-note summary.", "opts": ["The client's fall conclusively establishes the hotel's liability for negligence per se under state law.", "The client tripped in the hotel walk because the floor fabric was broken and there was no tag on it.", "The hotel is strictly liable under products liability law for a defect in the carpet it purchased.", "Client reports a fall on torn, loose hotel carpet with no warning sign; possible premises liability."], "a": 3, "fb": "Register: a good note records the facts neutrally and names the possible claim without overstating it. Liability still has to be proven."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El camión de la basura me pegó por atrás cuando yo estaba parado en el semáforo.\" Choose the best summary.", "opts": ["The client's stopped car was rear-ended by a garbage truck at a light.", "The garbage truck driver committed the intentional tort of battery.", "The trash car hit my back while I was standing still at the light post.", "The client was involved in a head-on collision with a city vehicle."], "a": 0, "fb": "Translation: \"pegar por atrás\" is a rear-end collision. Note also that a city garbage truck may trigger government-claim notice rules."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Me despidieron porque me negué a alterar los informes contables que iban para el gobierno.\" Choose the best summary.", "opts": ["They fired me because I didn't want to fix the math sheets for the government people.", "The client was lawfully terminated under at-will employment for insubordination.", "The client alleges she was fired for refusing to falsify reports to the government.", "The client resigned after a disagreement about accounting software settings."], "a": 2, "fb": "Register: \"alleges termination for refusing to falsify\" captures the key facts for a possible public-policy or whistleblower claim without deciding the outcome."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El dueño del local me cortó la luz y el agua para obligarme a salir antes de que termine el contrato.\" Choose the best summary.", "opts": ["The building boss cut off my power and water lines to push me out of the shop early.", "The tenant abandoned the premises and is in breach of the commercial lease agreement.", "The landlord allegedly cut off utilities to force the client out before the lease ended.", "The landlord validly terminated the commercial lease under its force majeure clause."], "a": 2, "fb": "Legal issues to flag: possible constructive eviction and violation of laws against self-help eviction. The note should state facts as allegations."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El contrato dice que si hay un problema, las leyes de Nueva York son las que mandan.\" Which clause is the client describing?", "opts": ["A choice-of-law clause", "A severability clause", "An arbitration clause", "A forum selection clause"], "a": 0, "fb": "Contracts: choice of law selects the governing law; a forum selection clause selects the court; the two are often confused."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Firmé un papel donde decía que si pasaba algo, yo no podía culpar a la empresa.\" What did the client most likely sign?", "opts": ["A mandatory arbitration agreement", "A liability waiver", "A confidentiality agreement", "An indemnification agreement"], "a": 1, "fb": "Terminology: a waiver of liability releases the company in advance. It may not cover gross negligence, so the attorney needs a copy."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Mi ex-esposo no ha pagado la pensión de los niños que ordenó el juez.\" Choose the best summary.", "opts": ["My ex-husband did not pay the kids' pension that the judge ordered last year.", "The former spouse is in breach of an alimony contract with the client.", "The client's former spouse has failed to pay court-ordered child support.", "The client's former spouse owes retirement benefits to the children."], "a": 2, "fb": "Translation: \"pensión de los niños\" is child support, not a pension. Unpaid support may be enforced through contempt or wage garnishment."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El juez paró todo el caso hasta que se resuelva el otro juicio.\" Choose the best summary.", "opts": ["The judge stopped the whole case until the other trial finishes up.", "The court dismissed the case with prejudice because of the other suit.", "The court stayed the case pending resolution of the related action.", "The court remanded the case back to the trial court for a new trial."], "a": 2, "fb": "Terminology: a stay pauses proceedings. Dismissal ends the case; remand sends it back to a lower court."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El ajustador dice que como no traía puesto el cinturón, no me van a pagar nada.\" Choose the best summary.", "opts": ["The adjuster is denying the claim because the client was not wearing a seatbelt.", "The adjuster says because I wasn't wearing the belt they won't pay me nothing at all.", "The insurer has accepted liability but disputes the medical bills.", "The client is barred from recovery as a matter of law in every state."], "a": 0, "fb": "Screening: the \"seatbelt defense\" varies widely by state. Some states exclude seatbelt evidence; others allow it to reduce damages. Do not tell the client the claim is barred."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Compré un carro nuevo que ha entrado al taller cinco veces en un mes por la misma falla del motor.\" Which law should intake flag?", "opts": ["The state statute of frauds", "The Federal Tort Claims Act", "The state lemon law", "The Fair Debt Collection Practices Act"], "a": 2, "fb": "Consumer law: lemon laws cover new vehicles with defects that are not fixed after a reasonable number of repair attempts. The federal Magnuson-Moss Warranty Act may also apply."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El hospital filtró mis expedientes médicos en redes sociales.\" Which claim fits best?", "opts": ["Medical malpractice by a provider", "False imprisonment by hospital staff", "Defamation by libel in writing", "Public disclosure of private facts"], "a": 3, "fb": "Torts: true but private facts disclosed publicly support a privacy claim, not defamation, which requires falsity. A HIPAA complaint may also be possible, but HIPAA has no private right of action."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"La empresa me hizo firmar la renuncia amenazándome con un arma.\" Choose the most accurate summary.", "opts": ["The client alleges she signed the resignation under threat of physical harm.", "The client committed fraud in the inducement when she signed.", "The resignation is valid because the client signed it voluntarily.", "The company forced me to sign a goodbye note by putting a weapon on top of the desk."], "a": 0, "fb": "Contracts: duress by physical threat can make the document unenforceable. The incident may also involve criminal conduct; flag it for the attorney immediately."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Ellos registraron un nombre casi idéntico al mío para confundir a mis clientes.\" Which claims should be flagged?", "opts": ["Malicious prosecution and abuse of process", "Trademark infringement and unfair competition", "Breach of fiduciary duty and fraud in the factum", "Conversion and trespass to chattels"], "a": 1, "fb": "Intellectual property: the key test is likelihood of consumer confusion. Registration status and first use dates are important intake facts."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"La aerolínea perdió mis maletas con mis herramientas y por eso perdí tres contratos.\" The lost contracts are best described as:", "opts": ["liquidated damages", "punitive damages", "nominal damages", "consequential damages"], "a": 3, "fb": "Damages: lost profits flowing from the loss are consequential damages. International flights are governed by the Montreal Convention, which limits baggage liability."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Mi socio mayoritario me sacó de las decisiones y cambió los accesos a las cuentas.\" Which issue fits best?", "opts": ["Possible negligence per se", "Possible constructive eviction", "Possible anticipatory repudiation", "Possible minority shareholder oppression"], "a": 3, "fb": "Corporate law: excluding a minority owner from management and finances may support oppression or fiduciary duty claims. Ask for the operating or shareholder agreement."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El hospital me cobró una factura gigante aunque mi seguro ya les había pagado lo acordado.\" Choose the best summary.", "opts": ["The insurer now holds a subrogation lien against the client's settlement.", "The provider billed the client beyond the insurer's contracted payment.", "The hospital committed medical malpractice by overcharging the client.", "The clinic mailed me a huge bill even though my protection paid all of it."], "a": 1, "fb": "Terminology: this is balance billing. In-network providers generally cannot bill beyond the contracted amount, and federal and state laws restrict surprise bills."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Mi ex-jefe anda diciendo mentiras sobre mí a otras empresas para que no me contraten.\" Choose the best summary.", "opts": ["The client has a claim for breach of a non-compete agreement against the former employer.", "My old boss goes around telling lies about me to other shops so they won't give me a job.", "The former employer is liable for retaliation under the FLSA for giving negative references.", "The former employer allegedly tells prospective employers false statements about the client."], "a": 3, "fb": "Torts: false statements of fact may support defamation and tortious interference claims. Truth and certain reference privileges are possible defenses."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"El patrón se queda con parte de las propinas que nos dejan los clientes.\" Choose the best summary.", "opts": ["The employees committed conversion by keeping customers' payments.", "The boss keeps the extra cash that the visitors drop on our tables.", "The employer allegedly keeps a portion of the employees' tips.", "The employer is lawfully operating a mandatory employee tip pool."], "a": 2, "fb": "Wage and hour: employers and managers may not keep employees' tips under the FLSA. State law may add further protections."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"Me caí en la banqueta porque estaba rota y levantada.\" If the sidewalk belongs to the city, what should intake flag first?", "opts": ["The short deadline to file a notice of claim against the city", "The client's right to sue the city in small claims court", "The two-year statute of limitations for all PI claims", "The need to send a demand letter to the city's insurer only"], "a": 0, "fb": "Government claims: notice-of-claim deadlines can be as short as a few months. Calendar it immediately and confirm who owns the sidewalk."}, {"cat": "Legal Technology & Operations", "stem": "To trace who changed a billing entry and when, the operations analyst should review the system's:", "opts": ["backup schedule", "document template", "audit trail", "data dictionary"], "a": 2, "fb": "Security: an audit trail logs who viewed, created, edited or deleted records, with timestamps."}, {"cat": "Legal Technology & Operations", "stem": "The system will not save a new client profile because the date of birth field is blank. This is caused by a:", "opts": ["required-field validation rule", "duplicate detection alert", "role-based permission error", "data synchronization loop"], "a": 0, "fb": "Data quality: validation rules stop incomplete records at the point of entry, which is cheaper than fixing them later."}, {"cat": "Legal Technology & Operations", "stem": "Requiring a password plus a code from a phone app to log in is an example of:", "opts": ["encryption at rest", "role-based access", "single sign-on", "multi-factor authentication"], "a": 3, "fb": "Security: MFA greatly reduces the risk of account takeover. Single sign-on lets one login access several systems, but it is not MFA by itself."}, {"cat": "Legal Technology & Operations", "stem": "\"Encryption at rest\" protects data that is:", "opts": ["stored on servers or devices", "being sent by email", "printed on paper files", "displayed on the screen"], "a": 0, "fb": "Security: encryption at rest protects stored data; encryption in transit protects data moving across networks. Both are standard expectations."}, {"cat": "Legal Technology & Operations", "stem": "Under a \"least privilege\" access model, users:", "opts": ["can see all files but cannot edit them", "receive only the access their tasks require", "receive full access to every matter after a trial period", "must request access to every file daily"], "a": 1, "fb": "Security: least privilege limits damage from mistakes or compromised accounts."}, {"cat": "Legal Technology & Operations", "stem": "Two systems keep overwriting each other's updates and creating duplicate records. This problem is a:", "opts": ["data synchronization loop", "disaster recovery event", "validation rule conflict", "metadata scrubbing error"], "a": 0, "fb": "Integrations: define which system is the source of truth for each field and whether sync is one-way or two-way."}, {"cat": "Legal Technology & Operations", "stem": "Before moving the firm from one practice-management system to another, the most important planning step is:", "opts": ["deleting closed matters to save space", "switching off backups during the move", "asking clients to resend their documents", "mapping each old field to its new field"], "a": 3, "fb": "Data migration: field mapping, test migrations and validation reports prevent lost or corrupted data."}, {"cat": "Legal Technology & Operations", "stem": "A firm needs to track blood-alcohol level in DUI matters, but the standard template has no such field. The solution is a:", "opts": ["audit log", "custom field", "merge token", "task chain"], "a": 1, "fb": "Configuration: custom fields capture case-specific data and make it reportable on dashboards."}, {"cat": "Legal Technology & Operations", "stem": "An automated rule notifies a supervising attorney when a court deadline task is still open two days before the due date. This is an:", "opts": ["exception report", "conflict alert", "intake rule", "escalation trigger"], "a": 3, "fb": "Supervision: escalation triggers route risk to someone with authority before a deadline is missed."}, {"cat": "Legal Technology & Operations", "stem": "On an operations dashboard, \"overdue tasks\" are tasks that:", "opts": ["have been reassigned to another user", "are still incomplete after their due date", "were completed after a reminder", "are due later this week or month"], "a": 1, "fb": "Metrics: \"open\" or \"outstanding\" tasks are not yet done; \"overdue\" tasks are past due, which is the higher-risk measure."}, {"cat": "Legal Technology & Operations", "stem": "Before sending a Word file to opposing counsel, the assistant removes tracked changes and hidden comments. This step is called:", "opts": ["version control", "data deduplication", "document assembly", "metadata scrubbing"], "a": 3, "fb": "Confidentiality: hidden metadata can reveal internal comments and strategy. (In discovery, removing metadata from produced files may be improper; follow the ESI protocol.)"}, {"cat": "Legal Technology & Operations", "stem": "In a document template, a placeholder like {Client.FirstName} that fills in automatically is a:", "opts": ["merge field", "custom script", "metadata tag", "validation rule"], "a": 0, "fb": "Document automation: merge fields pull data from the matter record. Wrong source data will be copied into every document."}, {"cat": "Legal Technology & Operations", "stem": "Which feature best ensures that the team never files an outdated draft?", "opts": ["Emailing drafts to everyone after each edit", "Saving every draft to personal desktops", "Version control in the document management system", "Renaming the final file \"FINAL-final\""], "a": 2, "fb": "Document management: version control keeps one authoritative current version and a history of changes."}, {"cat": "Legal Technology & Operations", "stem": "A \"disaster recovery plan\" for a law firm's systems sets out:", "opts": ["how staff will respond to angry clients after a lost case at trial", "how attorneys will divide cases after a merger", "how data and systems will be restored after an outage or breach", "how the firm markets services after natural disasters"], "a": 2, "fb": "Continuity: tested backups, recovery time targets and clear responsibilities are the core of a disaster recovery plan."}, {"cat": "Legal Technology & Operations", "stem": "A document that defines the meaning, format, and allowed values of every field in the firm's systems is a:", "opts": ["data dictionary", "clause library", "privilege log", "style guide"], "a": 0, "fb": "Data governance: a data dictionary ensures that a field such as \"Date of Incident\" means the same thing to everyone."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A restaurant serves food contaminated with bacteria, and a customer is hospitalized. Under the UCC, which warranty claim may apply?", "opts": ["Breach of the implied warranty of habitability", "Breach of the covenant of quiet enjoyment", "Breach of the implied warranty of merchantability", "Breach of an express warranty of title"], "a": 2, "fb": "Products and warranties: food sold by a merchant must be fit for its ordinary purpose. Negligence and strict products liability claims may also apply. Habitability and quiet enjoyment are landlord-tenant concepts."}, {"cat": "Torts, Contracts & Business Claims", "stem": "A defendant files a baseless lawsuit mainly to force the plaintiff to drop an unrelated claim. Which tort addresses misuse of legal process for an improper purpose?", "opts": ["Tortious interference", "Malicious mischief", "Abuse of process", "Negligent misrepresentation"], "a": 2, "fb": "Torts: abuse of process targets using legal procedure for a collateral purpose, such as extortion. Malicious prosecution, a related tort, requires that the prior case ended in the plaintiff's favor."}, {"cat": "Client Narrative to Legal English", "stem": "Client: \"La medicina para la presión que compré tenía trozos de vidrio adentro de las pastillas.\" Choose the best summary.", "opts": ["The pressure medicine I bought had pieces of glass inside the pills.", "The manufacturer is liable for a design defect affecting all of its medications sold nationwide.", "The client found glass fragments inside blood-pressure pills; possible manufacturing defect.", "The pharmacy committed medical malpractice by filling the client's prescription."], "a": 2, "fb": "Products liability: foreign objects in specific units point to a manufacturing defect. Ask the client to keep the bottle, the pills and the receipt."}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function fmtPct(x){
  let v = Math.round(x*1000)/10;
  if(x < PASS_THRESHOLD && v >= PASS_THRESHOLD*100) v = Math.round(PASS_THRESHOLD*1000 - 1)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  document.body.classList.toggle("results-dark", state.screen === "final");
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. Correct answers and explanations are included in your final report, and you'll see a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div class="navrow"><span></span><button class="btn gold" id="nextBtn" onclick="advance()" ${given === null ? "disabled" : ""}>${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(idx === given) cls += " selected";
      btn.className = cls;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${fmtPct(s/(be-bs))}</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${fmtPct(pct)}</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${fmtPct(pct)}${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}${passed ? "" : " " + shortBy(score, completed)}</div>
      </div>
      ${topicHTML(completed)}
      ${certCardForExam(completed, partial, passed, score, pct)}
      ${nextStepHTML(completed, passed)}
      ${discountHTML()}
      ${shareHTML(fmtPct(pct))}
      ${reviewHTML(completed)}
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function shortBy(score, completed){
  const need = Math.ceil(PASS_THRESHOLD*completed - 1e-9) - score;
  return need > 0 ? "You were " + need + " correct answer" + (need === 1 ? "" : "s") + " short of passing." : "";
}
function topicStats(completed){
  const map = {}; const order = [];
  for(let i=0;i<completed;i++){
    const c = QUESTIONS[i].cat;
    if(!map[c]){ map[c] = {cat:c, right:0, total:0}; order.push(c); }
    map[c].total++; if(state.answers[i] === QUESTIONS[i].a) map[c].right++;
  }
  return order.map(c => map[c]);
}
function topicHTML(completed){
  const rows = topicStats(completed).map(t => {
    const p = t.right / t.total;
    return `<tr><td>${t.cat}</td><td>${t.right} / ${t.total}</td><td>${fmtPct(p)}</td><td class="bartd"><div class="bar ${p < PASS_THRESHOLD ? "low" : ""}"><span style="width:${Math.round(p*100)}%"></span></div></td></tr>`;
  }).join("");
  return `<h2 style="margin-top:26px">Score by topic</h2><table class="results topics"><tr><th>Topic</th><th>Score</th><th>%</th><th></th></tr>${rows}</table>`;
}
const DISCOUNT_CODE = "EXAM15";
const DISCOUNT_PCT = 15;

function copyText(text, btn, label){
  const done = () => { if(!btn) return; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1800); };
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
}
function discountHTML(){
