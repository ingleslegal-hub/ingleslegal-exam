<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================

const TIER_LABEL = "Tier 2";
const PASS_THRESHOLD = 0.8; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = ""; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Labor", "stem": "Choose the option that avoids an error in register when detailing an \"Unfair Labor Practice\" (ULP) charge to a senior partner:", "opts": ["The employer has engaged in an Unfair Labor Practice (ULP) under the NLRA by interfering with the employees' right to engage in concerted protected activity.", "We closed the payroll screen because the workers are doing a split strike job loop.", "The company is acting totally crazy because they locked out the union guys.", "The supervisor executed a contract violation to clear the system metadata logs."], "a": 0, "fb": "Register Mastery: Utiliza la terminología institucional de la National Labor Relations Act (Unfair Labor Practice, NLRA, concerted protected activity), asegurando un registro impecable."}, {"cat": "General", "stem": "What does the advanced legal doctrine \"Common Interest Privilege\" (Joint Defense Privilege) protect from discovery disclosure?", "opts": ["The system access logs recorded automatically by cloud-based practice management networks.", "Public communications shared between competing corporate entities out of court.", "Confidential communications shared between separate parties who share a common legal interest, made to develop a joint legal strategy.", "Financial ledger spreadsheets detailing the firm's monthly software subscription fees."], "a": 2, "fb": "Risk Mitigation: Common Interest Privilege preserves protections when co-plaintiffs or co-defendants share data. Staff must tag these communications carefully to prevent waiver claims."}, {"cat": "Legal English", "stem": "In federal civil procedure, what does the advanced doctrine of \"Supplemental Jurisdiction\" allow a federal court to do?", "opts": ["Hear additional state-law claims that lack independent federal jurisdiction, provided they arise from the same nucleus of operative facts as the main federal claim.", "Automatically appeal a state superior court verdict directly to the U.S. Supreme Court dockets.", "Restrict the number of interrogatories defense counsel can serve during pre-trial discovery.", "Fine a plaintiff for filing a complaint that lacks proper subject matter jurisdiction fields."], "a": 0, "fb": "Linguistic Precision: Under 28 U.S.C. § 1367, Supplemental Jurisdiction (competencia conexa/complementaria) clusters related claims together. Staff must look for shared facts to avoid splitting lawsuits inefficiently."}, {"cat": "Personal Injury", "stem": "What does the legal phrase \"Time-Limited Demand\" (policy-limits demand) impose on an insurance carrier?", "opts": ["An automatic extension of the state superior court statute of limitations.", "A strict deadline, backed by bad-faith liability triggers, within which the insurer must pay policy limits to settle the claim.", "A suggested schedule for setting up an informal phone call with the adjuster.", "A restriction on the number of medical reports the firm can submit."], "a": 1, "fb": "Risk Mitigation: Time-Limited Demands are powerful tools. Missing the adjuster's response window or failing to provide pristine compliance documentation can ruin bad-faith leverage."}, {"cat": "Legal Software", "stem": "Complete the following system audit command: \"To trace the origin of a corrupted billing entry, the operations analyst must review the platform's unalterable digital _________.\"", "opts": ["audit trail", "budget spreadsheet", "document template", "scheduling calendar"], "a": 0, "fb": "Risk Mitigation: The \"Audit Trail\" records every user login, view, edit, and deletion. It acts as the definitive security track to pinpoint exactly who made a critical error."}, {"cat": "Legal English", "stem": "Translate and align: \"Mi ex-socio sacó todo el dinero de la cuenta de la empresa y abrió su propio negocio enfrente.\"", "opts": ["The partner processed a condition precedent, validating the firm's strict liability screens.", "The co-founder committed a severe breach of fiduciary duty, conversion of corporate assets, and a violation of the duty of loyalty.", "My old partner emptied the business bank account and set up a shop across the street.", "The business associate secured a contract waiver to eliminate all operational liability fields."], "a": 1, "fb": "The Bridge Methodology: Stealing corporate funds to launch a competing enterprise violates the breach of fiduciary duty (incumplimiento de deberes fiduciarios) and the duty of loyalty."}, {"cat": "General", "stem": "Complete the following evaluation framework requirement: \"Compensation awarded for objective out-of-pocket financial losses like diagnostics, physical therapy invoices, and prescription costs is classified as _________ Damages.\"", "opts": ["General", "Special / Economic", "Non-Pecuniary", "Punitive"], "a": 1, "fb": "Linguistic Precision: Out-of-pocket costs are \"Special/Economic Damages\" (daños pecuniarios/especiales). Every line item must be backed by a medical invoice file inside Litify to survive an insurance audit."}, {"cat": "General", "stem": "Translate and bridge the pre-litigation concept \"Indemnification and Hold Harmless Agreement\" into the structural understanding of a civil law professional:", "opts": ["Mandamiento de ejecución de sentencia extranjera; la orden judicial utilizada para validar fallos civiles transfronterizos.", "Convenio de pago de costas procesales; la liquidación de aranceles judiciales visada por el secretario de la corte.", "Acuerdo de indemnización y exoneración de responsabilidad; a contract clause where one party assumes the liability inherent in a situation, promising to defend and pay for any damages incurred by the other party.", "Demanda de nulidad absoluta por falta de objeto; el escrito utilizado para cancelar contratos viciados de dolo."], "a": 2, "fb": "The Bridge Methodology: An Indemnification and Hold Harmless Clause (cláusula de saneamiento e indemnidad) shifts third-party risk, a vital clause to parse inside corporate settlement packages."}, {"cat": "Legal English", "stem": "A client notes: \"Me caí en el pasillo del hotel porque la alfombra estaba rota y suelta, y no había ninguna señal.\" Which transformation is correct?", "opts": ["The claimant sustained injuries due to a dangerous premises condition (defective carpeting), establishing a cause of action for Premises Liability based on failure to maintain and failure to warn.", "Plaintiff slipped because the building had a bad asset design and zero validation text.", "I tripped in the hotel walk because the floor fabric was bad and they missed a tag.", "The incident occurred under strict products liability because the rug lacked safety warnings."], "a": 0, "fb": "The Bridge Methodology: Torn carpets inside a business constitute a dangerous premises condition, placing the matter squarely under a Premises Liability framework."}, {"cat": "General", "stem": "Complete the following motion entry: \"Opposing counsel has scheduled three repetitive depositions of our client's family members; we will move for a _________ Order under Rule 26(c).\"", "opts": ["Summary", "Strike", "Protective", "Compel"], "a": 2, "fb": "Linguistic Precision: A \"Protective Order\" (orden de protección procesal) blocks discovery methods designed to cause undue burden, annoyance, or harassment."}, {"cat": "General", "stem": "Complete the following civil procedure rule concept: \"If a party fails to provide initial disclosures under Rule 26(a), Rule 37(c)(1) mandates that the missing information is automatically _________ at trial unless the failure was substantially justified or harmless.\"", "opts": ["admitted", "tolled", "excluded / barred", "stayed"], "a": 2, "fb": "Risk Mitigation: Rule 37(c)(1) contains an automatic \"exclusion sanction\" (sanción de exclusión obligatoria). Failing to disclose a witness or exhibit early bars its use at trial."}, {"cat": "General", "stem": "Translate and bridge the negotiation analytic term \"Diminution of Value\" into the structural understanding of an offshore litigation coordinator:", "opts": ["Depreciación del valor comercial; the loss in market value of a piece of property (such as a vehicle) following an accident and subsequent repair.", "Retención de dividendos preferenciales; la penalidad financiera aplicada a accionistas morosos.", "Amortización de activos preferentes; el cálculo contable utilizado para liquidar deudas corporativas.", "Recurso de alzada administrativa; la apelación formal presentada ante una comisión de seguros estatal."], "a": 0, "fb": "The Bridge Methodology: Diminution of Value (depreciación por daño inherente) is a separate damage category; even if a car is fully fixed, its history cuts its resale value, which must be claimed."}, {"cat": "General", "stem": "What is the precise legal operational purpose of a \"Redaction Log\" when producing corporate documents?", "opts": ["To track the billable hours spent reviewing physical files out of court.", "To systematically document the specific text or metadata removed from produced files based on privacy, trade secrets, or irrelevance.", "To notify the court clerk that discovery has been completed.", "To request an extension for answering written interrogatories."], "a": 1, "fb": "Risk Mitigation: Withholding text via redactions requires an explicit \"Redaction Log\". Redacting files blindly without logging can trigger severe judicial fines or orders to un-redact."}, {"cat": "Legal English", "stem": "In commercial contract litigation, what is the meaning of the advanced term \"Unconscionability\"?", "opts": ["A contract or provision that is so incredibly unfair, one-sided, and oppressive to one party that a court will refuse to enforce it.", "A contract that was executed outside the geographic boundaries of the United States.", "An automated task chain that has been corrupted by a software programming conflict.", "A business agreement that lacks a registered agent for service of process."], "a": 0, "fb": "The Bridge Methodology: Unconscionability (lesión enorme/cláusula leonina) invalidates boilerplate text. Spotting unconscionable clauses during contract parsing flags high-leverage defenses early."}, {"cat": "Legal Software", "stem": "Complete the following legal tech milestone entry: \"To streamline client onboarding, we integrated an _________ signature solution into Clio Grow, reducing the retainer execution window to minutes.\"", "opts": ["automatic", "analogue", "independent", "electronic / e-signature"], "a": 3, "fb": "Operational Workflow: Utilizing \"Electronic Signatures\" (firmas electrónicas) optimizes the conversion pipeline, allowing immediate activation of matter automated workflows."}, {"cat": "Legal English", "stem": "Translate and align: \"El doctor me recetó unas pastillas equivocadas que me causaron un sangrado interno grave.\"", "opts": ["The medical guy gave me the wrong pills and caused a heavy blood leak in my body.", "The case lacks ripeness because the claimant is processing pharmacy record retrieval fields.", "The physician breached the standard of care by executing an improper medication prescription, establishing a medical malpractice claim for internal injuries.", "The medical provider is immune from tort actions until the supervisor signs a recovery sheet."], "a": 2, "fb": "Risk Mitigation: Prescribing incorrect drugs falls under medical malpractice (mala praxis médica) and requires tracking pharmacy logs and prescribing standard indices."}, {"cat": "Legal English", "stem": "A client notes: \"Me despidieron porque me negué a alterar los informes contables que iban para el gobierno.\" What is the precise transformation?", "opts": ["They booted me because I didn't want to fix the math sheets for the politicians.", "The employer executed a wrongful termination in violation of public policy, following the employee's refusal to commit an illegal act (accounting fraud).", "The employee faces a constructive discharge because management corrupted the SEC metadata fields.", "The supervisor terminated an at-will relationship, breaking the commercial integration clause."], "a": 1, "fb": "Linguistic Precision: Firing an employee for refusing to break the law triggers an action for wrongful termination in violation of public policy, overriding standard at-will employment limits."}, {"cat": "Legal English", "stem": "Translate and bridge the U.S. litigation mechanism \"Motion for Judgment on the Pleadings\" into the structural understanding of a civil law professional:", "opts": ["Recurso de casación formal; la impugnación extraordinaria presentada para anular una sentencia definitiva por vicios de forma.", "Demanda de reconvención comercial; el escrito mediante el cual el demandado interpone una pretensión autónoma contra el actor.", "Mandamiento de embargo preventivo; la solicitud utilizada para congelar bienes del demandado al inicio del litigio.", "Moción de fallo basada puramente en los escritos iniciales; a formal request under Rule 12(c) asking the judge to rule in a party's favor based strictly on the complaint and answer, without expanding into discovery."], "a": 3, "fb": "The Bridge Methodology: A Motion for Judgment on the Pleadings resolves cases when the text of the pleadings themselves leaves no material facts in dispute, a key mechanism to accelerate case closure."}, {"cat": "General", "stem": "Under U.S. insurance law, what does a \"No-Fault Clause\" (PIP) inside an auto policy mandate?", "opts": ["The case file is automatically routed to a federal bankruptcy division docket line.", "The insurer only pays for property damage if the client bears zero liability fault.", "The carrier pays for immediate medical expenses and lost wages up to a certain limit regardless of who caused the vehicular accident.", "The law firm assumes absolute financial responsibility for paying off hospital balances."], "a": 2, "fb": "Linguistic Precision: PIP coverage (protección contra lesiones personales) bypasses fault determinations, allowing the support team to secure immediate medical reimbursement."}, {"cat": "Legal English", "stem": "Choose the option that defines the exact meaning of the term \"Unjust Enrichment\":", "opts": ["A corporate entity increasing its market share by deploying deceptive digital advertising tools.", "A type of jury verdict that awards punitive damages exceeding state statutory liability limits.", "A quasi-contractual principle stating that a person who retains a benefit provided by another must pay restitution if retaining it would be fundamentally unfair.", "The financial process of moving retainer funds from an interest-bearing escrow account to an operational bank account."], "a": 2, "fb": "The Bridge Methodology: Unjust Enrichment (enriquecimiento injusto / sin causa) forms the basis for restitution claims when a formal written contract fails or is absent."}, {"cat": "Labor", "stem": "Complete the following system audit standard phrase: \"To verify if an employee is truly exempt under the administrative exemption, the compliance manager must execute a comprehensive _________ audit.\"", "opts": ["geographic", "job duties / salary", "timeline", "age"], "a": 1, "fb": "Risk Mitigation: Employers frequently misclassify workers based purely on job titles; running a \"Job Duties and Salary Audit\" triggers the detection of systemic wage violations."}, {"cat": "Legal Software", "stem": "What does the performance metric \"Overdue Tasks\" indicate on an operations manager's control dashboard?", "opts": ["The billable hours compiled by senior associates that have not been invoiced to insurance carriers.", "The total number of open personal injury matters currently pending a formal trial setting.", "The custom field parameters that require structural data cleansing protocols across portfolios.", "System generated procedural items or deadlines that remain uncompleted past their designated target date, signaling high risk."], "a": 3, "fb": "Supervision Gap: A high volume of Overdue Tasks highlights a breakdown in remote case management. This dashboard alert flags exactly where the supervision gap is widening."}, {"cat": "Legal English", "stem": "Choose the option that defines the exact meaning of the term \"Standing\" (Standing to Sue):", "opts": ["The internal performance tier assigned to an offshore legal assistant inside the firm.", "The financial capacity of a plaintiff to pay for deposition transcripts out of pocket.", "The legal right of a party to bring a lawsuit, requiring a concrete, individual injury in fact that is legally redressable by the court.", "The chronological sequence of motions listed on the active state superior docket screen."], "a": 2, "fb": "Linguistic Precision: Without Standing (legitimación activa), a lawsuit is legally dead on arrival. Screening for a direct, personalized injury during intake eliminates non-viable files."}, {"cat": "Legal English", "stem": "Choose the option that defines the exact meaning of the term \"Exemplary Damages\":", "opts": ["The processing fees charged by a licensed process server to execute service of process.", "Financial compensation awarded strictly to cover documented out-of-pocket medical bills.", "The internal quality control checklist used by managers to audit data entry files.", "An alternative common law designation for punitive damages, intended to punish egregious conduct and set an example for society."], "a": 3, "fb": "Linguistic Precision: Exemplary Damages and Punitive Damages are functionally synonymous under common law register rules, signaling high-leverage case files."}, {"cat": "Legal English", "stem": "In U.S. Tort Law, what does the \"Eggshell Skull Rule\" mandate when calculating compensatory damages?", "opts": ["The insurance company has the right to deny coverage if the property damage is minor.", "A tortfeasor is legally liable for all consequences of their negligence, even if the plaintiff's pre-existing frailty made the final injuries much worse than expected.", "The case file must be transferred automatically to a federal circuit appellate division.", "Damages are capped at a flat rate if the plaintiff had any prior health issues before the crash."], "a": 1, "fb": "The Bridge Methodology: The Eggshell Skull Rule protects fragile plaintiffs. Litigation support teams must meticulously log pre-existing conditions to track the full scale of exacerbation damages."}, {"cat": "Personal Injury", "stem": "Complete the following pre-litigation analytic standard: \"A written analysis that evaluates jury verdict trends for similar injuries in the same geographic venue is a Verdict _________ Survey.\"", "opts": ["Conversion", "Search / Valuation", "Distribution", "Retention"], "a": 1, "fb": "Operational Workflow: Running a \"Verdict Survey\" provides the empirical data required to back a demand figure, preventing the firm from underselling a high-value tort case."}, {"cat": "Personal Injury", "stem": "What is the primary function of a \"Litigation Hold Letter\" (Preservation Notice)?", "opts": ["An administrative motion filed to request a change of judicial venue.", "A formal directive ordering a party or entity to preserve all potentially relevant evidence, documents, and ESI when litigation is anticipated.", "A contract assigning contingency fee percentages to offshore counsel.", "To demand immediate financial compensation from an insurance adjuster."], "a": 1, "fb": "Risk Mitigation: Failing to issue a timely Litigation Hold allows the adverse party to destroy key records without facing Spoliation sanctions, crippling the case."}, {"cat": "Legal English", "stem": "Translate and align: \"El camión de la basura me pegó por atrás cuando yo estaba parado completamente en el semáforo.\"", "opts": ["The public driver faces removal proceedings because the incident report logged an administrative felony.", "The client was involved in a rear-end collision; the adverse commercial vehicle struck the plaintiff's stationary vehicle, establishing clear liability.", "The trash vehicle hit my back end while I was sitting still at the light post.", "The city transit operator committed a false imprisonment tort, triggering an immediate stay of proceedings."], "a": 1, "fb": "Linguistic Precision: Being struck while stopped is a rear-end collision (colisión por alcance posterior). Stationary status shifts the presumption of fault entirely to the adverse operator."}, {"cat": "General", "stem": "What does the legal mechanism known as a \"Stipulation\" achieve during a pre-litigation settlement negotiation?", "opts": ["An automatic dismissal of the claim with prejudice by a state judge.", "A formal agreement between opposing parties admitting or settling a specific fact or issue, removing it from active dispute.", "The encryption protocol used to lock case files inside CasePacer.", "An administrative fee fine applied by the court clerk division."], "a": 1, "fb": "The Bridge Methodology: A Stipulation (estipulación/acuerdo procesal) narrows the issues. Support teams must log stipulations carefully to prevent re-litigating resolved facts."}, {"cat": "General", "stem": "Under U.S. law, what occurs when a client signs a \"Release of All Claims\" document?", "opts": ["The client can reopen the lawsuit if their medical diagnosis worsens later.", "The case file is automatically duplicated and routed to a federal bankruptcy division.", "The client gives up all current and future rights to sue any party regarding the specified incident in exchange for the settlement compensation.", "The attorney assumes personal responsibility for paying off outstanding hospital balances."], "a": 2, "fb": "Risk Mitigation: Executing a Release (finiquito absoluto) is permanent. Support teams must ensure clients understand that signing means they cannot ask for more money later."}, {"cat": "Legal English", "stem": "What does the advanced contract doctrine \"Promissory Estoppel\" provide when a formal agreement is missing?", "opts": ["Punitive damage inguistic Precision: This mechanism utilizing a Custodian Affidavit streamlines document processing, allowing immediate case-file readiness for summary judgment motions."}, {"cat": "General", "stem": "Complete the following pre-litigation analytics phrase: \"To build a rock-solid demand for lost profits, a commercial litigation manager must audit the client’s historical net _________ statements.\"", "opts": ["expense", "liability", "tax", "income / financial"], "a": 3, "fb": "Linguistic Precision: Lost profit demands cannot rely on gross revenue numbers; the firm must back the claim with objective \"net income/financial statements\" to survive defensive audits."}, {"cat": "Personal Injury", "stem": "In pre-litigation terminology, what does the \"Made-Whole Doctrine\" protect a client against?", "opts": ["An insurance company exercising its subrogation rights before the injured client has been fully compensated for their total losses.", "An independent contractor seeking unpaid overtime wages under the FLSA.", "The court clerk dismissing a complaint due to minor typographical errors.", "The practice management platform converting a lead file into a matter entry early."], "a": 0, "fb": "The Bridge Methodology: The Made-Whole Doctrine stops health insurers from taking a cut of the settlement if the client's payout didn't cover their actual total damages, keeping more money in the client's pocket."}, {"cat": "Legal English", "stem": "A client states: \"La comida del restaurante tenía veneno para ratas y terminé tres días internado en terapia intensiva.\" Which transformation is correct?", "opts": ["The consumer faces a toxic tort defect, canceling the commercial insurance policy lines.", "The restaurant executed an unconscionable material breach of an integrated hospitality contract.", "The restaurant food had rat poison and I spent days in the heavy medical room.", "The plaintiff ingested contaminated food product, triggering claims for strict products liability, breac const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow"><span></span><button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button></div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const score = totalScore();
    const pct = score / TOTAL;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    for(let bn=1; bn<=NUM_BATCHES; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>Exam Complete</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""}</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>Overall</strong></td><td>${score} / ${TOTAL}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      <div class="placement">
        <div class="headline">${passed ? TIER_LABEL + " — PASSED" : TIER_LABEL + " — Not yet passing"}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%.</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        <span></span>
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">Results and feedback will also be emailed to you shortly.</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){ state.screen = "final"; }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const score = totalScore(); const pct = score/TOTAL;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS`);
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("");
  for(let bn=1; bn<=NUM_BATCHES; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push(`OVERALL: ${score}/${TOTAL} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
