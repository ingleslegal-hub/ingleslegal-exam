<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  table.results td.below{ color:var(--bad); font-weight:600; }
  .coursecode{ color:var(--bronze); font-weight:600; margin-right:6px; }
  .section-label{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:15px; color:var(--lifted-aubergine); margin:22px 0 4px; }
  .section-note{ font-family:"Archivo", Arial, sans-serif; font-size:12.5px; color:var(--body-on-light); margin:0 0 4px; line-height:1.5; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================
// Personal Injury Pathway — 100 questions covering the 8 courses of the
// Personal Injury Case Specialist pathway (IL-PI-01 to IL-PI-08).

const TIER_LABEL = "Personal Injury Pathway";
const PATHWAY_NAME = "Personal Injury Case Specialist";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwYCnCr75l6BUDyPIxPD2sbl5NvgENQWT5JFpMreAlQmg5dI85SEeecneWUVzknyzxr/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "PI English Foundations", "stem": "What are the four elements of a negligence claim?", "opts": ["Offer, acceptance, consideration and breach", "Duty, breach, causation and damages", "Intent, act, causation and harm", "Notice, hearing, decision and appeal"], "a": 1, "fb": "Key concept: The plaintiff must prove that the defendant owed a duty, breached it, and caused damages. \"Offer, acceptance, consideration\" belongs to contract law."}, {"cat": "PI English Foundations", "stem": "In a personal injury file, \"liability\" means:", "opts": ["the list of the client's injuries", "the attorney's fee percentage", "the amount of the insurance policy", "legal responsibility for the harm"], "a": 3, "fb": "Key term: \"Liability is disputed\" means the insurer denies that its insured is legally responsible. It is a different question from the value of the damages."}, {"cat": "PI English Foundations", "stem": "In a car crash claim, the injured person claiming against the at-fault driver's insurer is the ____; the at-fault driver who bought the policy is the ____.", "opts": ["insured; claimant", "beneficiary; underwriter", "adjuster; carrier", "claimant; insured"], "a": 3, "fb": "Key term: Keeping the parties straight in letters (claimant, insured, carrier, adjuster) is basic PI English and prevents misdirected correspondence."}, {"cat": "PI English Foundations", "stem": "What does an insurance adjuster do?", "opts": ["Represents the injured client in negotiations", "Decides the case as a neutral judge after hearing both the claimant and the insured driver", "Investigates, evaluates and negotiates the claim for the insurer", "Treats the client's injuries and writes medical reports"], "a": 2, "fb": "Key term: The adjuster works for the insurer. Staff are professional with adjusters but never forget whose interests they protect."}, {"cat": "PI English Foundations", "stem": "The attorney says, \"Send the letter of representation to the carrier.\" Here, \"carrier\" means:", "opts": ["the client's vehicle", "the insurance company", "the client's employer", "the delivery company"], "a": 1, "fb": "Key term: In insurance English, the carrier is the insurer that issued the policy."}, {"cat": "PI English Foundations", "stem": "The at-fault driver has \"25/50/25\" liability limits. What do the first two numbers mean?", "opts": ["The driver was 25% at fault and the claimant 50% at fault", "$25,000 for property damage per person and $50,000 per vehicle", "Up to $25,000 in bodily injury coverage per person and $50,000 per accident", "A $25 deductible and a $50 copay for each medical visit the claimant makes after the accident"], "a": 2, "fb": "Key concept: Split limits list bodily injury per person, bodily injury per accident, and property damage. The third number here is $25,000 in property damage coverage."}, {"cat": "PI English Foundations", "stem": "Which is an accurate plain-English explanation of a contingency fee?", "opts": ["The insurance company always pays the attorney's fee separately, in addition to the client's settlement.", "The client pays a fixed fee up front, whatever the result.", "A percentage of the recovery; if there is no recovery, the client owes no attorney's fee. Costs follow the agreement.", "The client pays the attorney by the hour, with a deposit at the start that is refunded if the case does not settle within a year."], "a": 2, "fb": "Client communication: Staff explain the fee structure in general terms; the retainer agreement controls the exact percentage and how costs are treated."}, {"cat": "PI English Foundations", "stem": "In negligence, \"causation\" means:", "opts": ["the reason the client decided to hire the firm, which must be stated in the retainer agreement", "the time between the accident and the first doctor visit, which insurers require to be less than 72 hours", "the link showing that the defendant's breach actually and foreseeably caused the injury", "the insurance company's reason for denying the claim"], "a": 2, "fb": "Key concept: Causation has two parts: actual cause and proximate (foreseeable) cause. Insurers often attack causation when treatment is delayed."}, {"cat": "PI English Foundations", "stem": "In medical records, \"Dx\" stands for:", "opts": ["diagnosis", "dosage", "discharge", "doctor's exam"], "a": 0, "fb": "Medical English: Common abbreviations include Dx (diagnosis), Tx (treatment), Hx (history) and Rx (prescription)."}, {"cat": "PI English Foundations", "stem": "A record says \"Pt s/p MVA.\" What does \"s/p\" mean?", "opts": ["Suspected pain from a motor vehicle accident", "Special patient in a motor vehicle accident", "Status post (after) a motor vehicle accident", "Soft-tissue pain in a motor vehicle accident"], "a": 2, "fb": "Medical English: \"s/p\" means status post, that is, after an event or procedure. MVA means motor vehicle accident."}, {"cat": "PI English Foundations", "stem": "Which of these is a soft-tissue injury?", "opts": ["A second-degree burn", "A traumatic brain injury", "A whiplash strain of the neck muscles and ligaments", "A fractured femur that required surgery and a metal plate"], "a": 2, "fb": "Medical English: Soft-tissue injuries affect muscles, ligaments and tendons. Insurers often value them lower, so documentation of treatment matters."}, {"cat": "PI English Foundations", "stem": "In physical therapy notes, \"ROM\" means:", "opts": ["return of mobility", "rate of medication", "record of measurement", "range of motion"], "a": 3, "fb": "Medical English: Reduced range of motion is a measurable sign of injury that supports the damages claim."}, {"cat": "PI English Foundations", "stem": "Which explanation of \"damages\" to a Spanish-speaking client is accurate?", "opts": ["\"Damages\" means a fine the other driver pays to the government.", "\"Damages\" means the doctor's written report about every injury you suffered in the accident.", "\"Damages\" means only the damage to your car, which the body shop estimates after the accident.", "\"Damages\" means the money the law can award for your losses, such as bills, lost wages and pain."], "a": 3, "fb": "Translation point: In Spanish this is \"daños y perjuicios\" or \"indemnización.\" In English, \"damages\" (plural) is money compensation, not physical damage."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "How does U.S. negligence law differ from Latin American civil-code extracontractual liability?", "opts": ["Latin American courts use juries for all tort cases, while U.S. courts never use juries in civil cases.", "There is no real difference; both systems apply the same written civil code, translated into each language.", "The U.S. has one federal tort code that applies in every state.", "U.S. negligence rules come mainly from court decisions and vary by state, not from general code articles."], "a": 3, "fb": "The Bridge: Civil-code lawyers start from code articles on fault. U.S. torts are built on common law precedent and state statutes, so the state matters."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "Under pure comparative negligence, a plaintiff who is 30% at fault with $100,000 in damages can recover:", "opts": ["$30,000", "$70,000", "$100,000", "$0"], "a": 1, "fb": "Calculation: Pure comparative negligence reduces the award by the plaintiff's percentage of fault: $100,000 minus 30% equals $70,000."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "Under a modified comparative negligence rule with a 51% bar, a plaintiff found 60% at fault recovers:", "opts": ["60% of the damages", "the full damages", "nothing", "40% of the damages"], "a": 2, "fb": "Key concept: In 51%-bar states, a plaintiff recovers only if their fault is 50% or less. In 50%-bar states, they must be less than 50% at fault."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "What is pure contributory negligence?", "opts": ["A rule that divides damages equally between two defendants.", "A rule under which any fault by the plaintiff, even 1%, can bar recovery; few jurisdictions still use it.", "A rule that reduces the plaintiff's damages in exact proportion to the plaintiff's own percentage of fault.", "A rule that applies only when the plaintiff is a minor."], "a": 1, "fb": "Key concept: Contributory negligence survives in a handful of jurisdictions, such as Alabama, Maryland, North Carolina, Virginia and the District of Columbia."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "Special damages are:", "opts": ["damages awarded only for emotional distress", "compensation for pain and suffering and the loss of enjoyment of life after the accident", "economic losses that can be calculated, such as medical bills and lost wages", "damages meant to punish the defendant for reckless driving, paid on top of the settlement"], "a": 2, "fb": "Key term: Specials are proven with bills, receipts and wage records. They are the base of the demand."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "General damages are:", "opts": ["lost wages and loss of future earning capacity, proven with pay stubs and tax returns", "non-economic losses such as pain and suffering and loss of enjoyment of life", "court costs and filing fees", "medical bills, pharmacy receipts and the cost of travel to every medical appointment"], "a": 1, "fb": "Key term: General damages have no invoice. Their value depends on the injury, the treatment and how the client's life was affected."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "What is the purpose of punitive damages?", "opts": ["To reimburse the plaintiff's medical bills when the defendant's insurance limits are too low to pay them", "To punish especially reckless or malicious conduct and deter it, not to compensate", "To compensate the plaintiff's family for lost wages", "To pay the attorney's fee in addition to the settlement, so the client keeps the full recovery"], "a": 1, "fb": "Key concept: Punitive damages are rare, require egregious conduct and are often limited by state law."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "In a PI file, the Spanish term \"daño moral\" is best expressed in U.S. legal English as:", "opts": ["damage to the defendant's reputation", "non-economic damages, such as pain, suffering or emotional distress", "moral damages that a judge awards to punish the defendant's bad behavior", "punitive damages"], "a": 1, "fb": "False friend: \"Moral damages\" is not a standard U.S. term. The closest concept is non-economic (general) damages."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "In a PI context, \"indemnización\" is usually best translated as:", "opts": ["compensation (or damages)", "an insurance premium paid each month", "an indemnity bond", "indemnification"], "a": 0, "fb": "False friend: In English, \"indemnification\" is usually a contractual duty to cover another party's losses. A client asking about their \"indemnización\" wants to know about compensation."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "In a liability narrative, \"culpa\" is best translated as:", "opts": ["sin or moral blame", "punishment", "fault (or negligence)", "guilt, in the criminal sense"], "a": 2, "fb": "False friend: \"Guilt\" belongs to criminal law. In a civil negligence summary, \"culpa\" means fault."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "At a U.S. jury trial, who decides the amount of general damages?", "opts": ["The treating doctor", "The insurance adjuster", "The court clerk, using a fixed table", "The jury (or the judge in a bench trial)"], "a": 3, "fb": "The Bridge: Civil-law systems often leave damages to the judge. In the U.S., juries decide damages, which is why insurers evaluate jury risk when they negotiate."}, {"cat": "Civil Liability to U.S. Negligence", "stem": "What does \"duty of care\" mean?", "opts": ["The doctor's duty to bill the patient accurately", "The insurer's obligation to pay any claim within 30 days after it receives the police report and the medical bills", "The attorney's duty to keep client information confidential, even after the case is closed", "The legal obligation to act as a reasonably careful person would to avoid foreseeable harm"], "a": 3, "fb": "Key concept: Drivers owe a duty to others on the road; property owners owe duties to visitors. The scope of the duty depends on the relationship and state law."}, {"cat": "PI Intake & Sign-Ups", "stem": "In a PI intake, the \"date of loss\" is:", "opts": ["the date the client signed the retainer", "the date the insurer denied the claim", "the date the accident or incident happened", "the date the client first saw a doctor"], "a": 2, "fb": "Key term: The date of loss starts the limitation period and appears on every claim letter. It must be exact."}, {"cat": "PI Intake & Sign-Ups", "stem": "Which case is a premises liability claim?", "opts": ["A shopper slips on an unmarked wet floor in a grocery store and breaks her wrist.", "A worker is injured by a defective machine at his own workplace during a regular shift.", "A patient is harmed by a surgeon's mistake.", "A driver rear-ends another car at a red light while texting, and the other driver hurts his neck."], "a": 0, "fb": "Case types: Premises liability covers dangerous conditions on someone else's property. Workplace injuries usually go through workers' comp, and surgical errors are medical malpractice."}, {"cat": "PI Intake & Sign-Ups", "stem": "In a rideshare accident intake, which question is critical?", "opts": ["How much the passenger tipped the driver", "Whether the driver's app was on and whether a ride had been accepted or was in progress", "The color, model and license plate of the rideshare vehicle, as shown on the receipt in the app", "The driver's star rating in the app and the number of complaints filed against him by passengers"], "a": 1, "fb": "Coverage point: Rideshare insurance changes depending on the app status, so this answer decides which policy and limits apply."}, {"cat": "PI Intake & Sign-Ups", "stem": "What is a letter of representation (LOR)?", "opts": ["The client's authorization to release medical records", "The fee agreement signed by the client, which the firm sends to the insurer to prove it represents the client", "The complaint filed in court that starts a lawsuit against both the at-fault driver and his insurance company", "A letter telling insurers the firm represents the client and that communication must go through the firm"], "a": 3, "fb": "Key document: The LOR opens the claim, requests coverage information and stops the adjuster from contacting the client directly."}, {"cat": "PI Intake & Sign-Ups", "stem": "What does a HIPAA authorization allow?", "opts": ["The firm to sign settlement documents for the client", "Medical providers to release the client's protected health information to the firm", "The court to order an independent medical exam", "The insurer to take a recorded statement from the client about the accident and the injuries"], "a": 1, "fb": "Key document: Without a valid HIPAA authorization, providers will not send records. It is part of the sign-up packet."}, {"cat": "PI Intake & Sign-Ups", "stem": "The retainer agreement in a PI case is:", "opts": ["the contract between the client and the firm setting out the fee, costs and scope of representation", "a letter to every insurer involved in the accident requesting the policy limits and the declarations page", "a court order requiring the defendant to pay the client's medical bills while the case is pending in court", "the medical provider's treatment plan"], "a": 0, "fb": "Key document: The retainer must be signed before the firm acts for the client. Staff explain it; the attorney answers legal questions about it."}, {"cat": "PI Intake & Sign-Ups", "stem": "Which set of data is essential at a motor vehicle accident intake?", "opts": ["Only the client's name and phone number, so the attorney can call back later and collect all the other details personally", "Date, time and place; parties and vehicles; insurers and claim numbers; police report; witnesses; injuries and treatment", "The other driver's social media accounts and employer reviews", "The client's favorite hospital and preferred pharmacy"], "a": 1, "fb": "Intake skill: Missing data at sign-up delays every later step. A complete intake lets staff open claims and request records the same week."}, {"cat": "PI Intake & Sign-Ups", "stem": "In a dog bite intake, what should staff capture?", "opts": ["Only whether the client was afraid of dogs before", "Only the breed and size of the dog, because the breed alone decides whether the owner is liable in every state", "The owner's identity and address, where the bite happened, the dog's history, the animal control report and the injuries", "The veterinarian's opinion on the dog's behavior, nothing else"], "a": 2, "fb": "Intake skill: Owner identity leads to insurance (often homeowner's or renter's), and reports and photos prove the incident."}, {"cat": "PI Intake & Sign-Ups", "stem": "A client says: \"Me chocaron por detrás en un semáforo.\" What is the accurate English intake note?", "opts": ["Client hit a traffic light with the back of his car.", "Client crashed into the car behind him at a traffic light.", "Client was sideswiped while turning at an intersection.", "Client was rear-ended while stopped at a traffic light."], "a": 3, "fb": "Translation accuracy: \"Me chocaron por detrás\" means another vehicle hit the client from behind. Getting the direction wrong changes liability."}, {"cat": "PI Intake & Sign-Ups", "stem": "Why should witness information be collected as early as possible?", "opts": ["Insurers refuse to open claims without three witnesses.", "Witness statements replace the need for a police report.", "Witnesses must sign the retainer agreement within 30 days, or the firm cannot use their statements later in the case.", "Witnesses become harder to find and memories fade; an early independent account can prove liability."], "a": 3, "fb": "Evidence point: Independent witnesses are often decisive when drivers tell different stories."}, {"cat": "PI Intake & Sign-Ups", "stem": "What is a claim number?", "opts": ["The number the insurer assigns to the claim, used on every letter and call", "The police report number assigned by the officer who responded to the accident", "The client's own insurance policy number, printed on the declarations page and the insurance card", "The court case number"], "a": 0, "fb": "Key term: Mail without the correct claim number is often misfiled at the insurance company."}, {"cat": "PI Intake & Sign-Ups", "stem": "A new client says the other driver's adjuster called asking for a recorded statement. What should staff do?", "opts": ["Tell the client not to give a statement and to refer the adjuster to the firm; notify the attorney and confirm the LOR was sent.", "Tell the client to sign any forms the adjuster sends.", "Tell the client to ignore all calls from any insurer, including his own, until the case is completely finished.", "Encourage the client to give the statement quickly, because insurers pay faster when the client cooperates from the start."], "a": 0, "fb": "Within role: Statements to the adverse insurer can harm the claim. The client's own policy may impose cooperation duties, so the attorney decides how to handle the client's own carrier."}, {"cat": "PI Intake & Sign-Ups", "stem": "At intake, how should the statute of limitations be handled?", "opts": ["Identify the date of loss and calendar the limitation deadline at once for the attorney to confirm; it varies by state and claim.", "Let the client decide whether the deadline matters, since the client alone will decide whether to file a lawsuit and is the one who loses the case if it is missed.", "Assume a five-year deadline, which applies to every injury claim in every state, and calendar it from the date of the first doctor visit.", "Wait until the demand stage to look at the deadline."], "a": 0, "fb": "Deadline control: Limitation periods differ by state and claim (and can be shorter for claims against government entities). A missed statute date can end the case."}, {"cat": "Medical Records & Treatment", "stem": "On a medical bill, a CPT code identifies:", "opts": ["the patient's diagnosis", "the procedure or service performed", "the hospital's tax number", "the prescribed medication"], "a": 1, "fb": "Medical billing: CPT codes describe what was done (for example, an MRI or a therapy session). They are used to check bills line by line."}, {"cat": "Medical Records & Treatment", "stem": "An ICD-10 code identifies:", "opts": ["the procedure", "the date of service", "the provider's license", "the diagnosis"], "a": 3, "fb": "Medical billing: ICD-10 codes describe the condition treated, which helps link treatment to the accident."}, {"cat": "Medical Records & Treatment", "stem": "What is an itemized bill?", "opts": ["The insurer's explanation of benefits for the policy", "A one-line statement showing only the balance due after insurance payments", "A bill that lists each service with its date, code and charge", "A letter from the doctor describing the injury"], "a": 2, "fb": "Key document: Insurers and lienholders need itemized bills to verify the medical specials in a demand."}, {"cat": "Medical Records & Treatment", "stem": "Why is a \"gap in treatment\" a problem in a PI case?", "opts": ["It means the client's health insurance has expired and the providers will stop sending records.", "Insurers use it to argue that the injury healed or was caused by something else.", "It doubles the value of the general damages.", "It automatically ends the attorney-client relationship."], "a": 1, "fb": "Risk control: Staff track appointments, flag gaps quickly and record the reason (for example, transportation or work) for the attorney."}, {"cat": "Medical Records & Treatment", "stem": "What is a letter of protection (LOP)?", "opts": ["A court order that protects the client from collection agencies while the case is pending, issued at the attorney's request", "An insurance policy that covers the attorney's mistakes", "A letter that protects the client from giving a recorded statement", "A promise that a provider will be paid from the settlement, so the client can treat without paying up front"], "a": 3, "fb": "Key term: LOP providers become lienholders on the settlement, so they must be tracked carefully for disbursement."}, {"cat": "Medical Records & Treatment", "stem": "What is a medical chronology?", "opts": ["A date-ordered summary of each visit: provider, complaints, diagnosis, treatment and recommendations", "A calendar of future appointments only", "A list of the client's medications in alphabetical order, with the dose and the pharmacy that filled each one", "The doctor's bill organized from the highest charge to the lowest, with insurance payments subtracted"], "a": 0, "fb": "Key document: A clear chronology lets the attorney and the adjuster see the course of treatment at a glance."}, {"cat": "Medical Records & Treatment", "stem": "In a demand, \"medical specials\" refers to:", "opts": ["the most serious injuries in the file", "the client's out-of-network providers only", "special requests made by the treating doctor", "the total of the client's medical expenses"], "a": 3, "fb": "Key term: The specials summary totals charges by provider and links each to its bill."}, {"cat": "Medical Records & Treatment", "stem": "A provider has not answered a records request for 30 days. What is the best action?", "opts": ["Follow up by phone and in writing, confirm they have a valid HIPAA authorization and any fee, and log every contact.", "Send the demand without that provider's treatment, and add it later in a supplemental demand if the records arrive.", "Ask the client to write a summary of the visits instead.", "Assume the provider has no records, close the request, and ask the client to describe the visits in a sworn statement instead."], "a": 0, "fb": "Records management: Persistent, documented follow-up is how complete records are obtained. Missing records mean missing value."}, {"cat": "Medical Records & Treatment", "stem": "Why does a demand package need both medical records and medical bills?", "opts": ["Bills alone are enough, because insurers do not read records.", "Records prove what treatment was given and why; bills prove what it cost.", "Records alone are enough, because the insurer calculates the costs.", "Neither is needed if the police report shows the other driver was at fault."], "a": 1, "fb": "Evidence point: Liability, injury and damages must all be proven. Records connect the injury to the accident; bills quantify it."}, {"cat": "Medical Records & Treatment", "stem": "A client stops physical therapy after three weeks because of his work schedule. What should staff do?", "opts": ["Ignore it, because therapy is not important to the claim.", "Tell the client to say he never stopped going.", "Record the gap and its reason, notify the attorney, and let the attorney decide how to address it.", "Add the missing therapy sessions to the chronology so the insurer does not notice any gap in treatment."], "a": 2, "fb": "Integrity: Records must never be altered or misrepresented. The attorney advises the client on treatment and the impact of the gap."}, {"cat": "Medical Records & Treatment", "stem": "Which describes imaging in a PI case?", "opts": ["Physical therapy exercises done at home, recorded in a daily log for the demand package", "The client's emergency room triage notes", "Photographs of the vehicles and the intersection taken by the police at the scene of the accident", "MRI, X-ray or CT studies that can show injuries such as fractures or disc herniations"], "a": 3, "fb": "Medical English: Imaging reports give objective findings, which often increase the value of a claim."}, {"cat": "Medical Records & Treatment", "stem": "Which email to a provider uses professional English?", "opts": ["\"Attached is a signed HIPAA authorization for our client, Ana López (DOB 03/14/1985). Please send complete records and an itemized bill from 01/10/2026 to present.\"", "\"You must send the records today or we will report you to the state medical board and file a complaint against your office and staff.\"", "\"Hey, can you send us everything you have on Ana ASAP? We need it for the demand and the adjuster keeps calling us. Thanks a lot!\"", "\"Necesitamos los récords de Ana López, gracias.\""], "a": 0, "fb": "Professional writing: Identify the patient, attach the authorization, specify the dates and the documents. Clear requests get faster responses."}, {"cat": "Medical Records & Treatment", "stem": "A physical therapy note says the client was \"discharged from care.\" What does this usually mean for the file?", "opts": ["The provider refuses to release any records.", "The client has been released from all legal obligations.", "Treatment with that provider has ended, so final records and bills can be requested and the file may move to demand.", "The client has been admitted to the hospital for surgery and will stay there until the doctor releases him again."], "a": 2, "fb": "Workflow point: Discharge from the last provider often triggers final records requests and the specials summary, subject to the attorney's review."}, {"cat": "Insurance Claims & Coverage", "stem": "What does bodily injury (BI) liability coverage pay for?", "opts": ["Injuries the insured driver causes to other people", "Damage to the insured's own car", "The insured's rental car while the car is repaired", "The insured driver's own medical bills, regardless of fault"], "a": 0, "fb": "Coverage map: BI is third-party coverage on the at-fault driver's policy. It is usually the main source of recovery for the client."}, {"cat": "Insurance Claims & Coverage", "stem": "What is personal injury protection (PIP)?", "opts": ["First-party no-fault coverage that pays the insured's own medical bills and some lost wages regardless of fault", "Coverage that pays only for the insured's vehicle repairs and rental car, regardless of who caused the crash or how serious it was", "Coverage on the at-fault driver's policy that pays for the injuries he causes to other drivers, passengers and pedestrians", "A special policy that covers only pedestrians"], "a": 0, "fb": "Coverage map: In no-fault states, PIP pays first. Its limits and application deadlines vary by state and policy."}, {"cat": "Insurance Claims & Coverage", "stem": "What is UM/UIM coverage?", "opts": ["Coverage on the at-fault driver's policy that pays his legal defense costs if the injured person files a lawsuit.", "Coverage on the client's own policy when the at-fault driver has no insurance or not enough.", "Coverage that pays the client's health insurance deductible only.", "Coverage required only for commercial trucks."], "a": 1, "fb": "Coverage map: Uninsured and underinsured motorist coverage often makes the difference in serious cases with low liability limits."}, {"cat": "Insurance Claims & Coverage", "stem": "What is a declarations page?", "opts": ["The client's sworn statement about the accident", "The policy page that summarizes the named insured, covered vehicles, coverages and limits", "The narrative section of the police report, where the officer describes how the accident happened", "The insurer's letter accepting liability for the accident and confirming the claim number"], "a": 1, "fb": "Key document: The declarations page (\"dec page\") shows exactly what coverage exists. Staff request it from every carrier."}, {"cat": "Insurance Claims & Coverage", "stem": "Which statement correctly distinguishes first-party and third-party claims?", "opts": ["First-party claims are for property damage; third-party claims are for injuries only.", "There is no difference; the terms are interchangeable.", "A first-party claim is against your own insurer; a third-party claim is against the at-fault party's insurer.", "A first-party claim is the first claim filed after the accident; a third-party claim is any claim filed more than two months later."], "a": 2, "fb": "Key concept: The client's duties and the insurer's obligations differ between first-party and third-party claims."}, {"cat": "Insurance Claims & Coverage", "stem": "When does an insurer declare a vehicle a \"total loss\"?", "opts": ["When the client decides he no longer wants the car", "Whenever the airbags deploy in the accident, regardless of how much damage the car actually has or what it is worth", "Only when the car is completely destroyed by fire or flood, so that no part of it can be sold or repaired", "When repair costs exceed a threshold related to the car's actual cash value, so the insurer pays the value"], "a": 3, "fb": "Property damage: Thresholds vary by state and insurer. Staff gather valuation evidence if the client disputes the offered value."}, {"cat": "Insurance Claims & Coverage", "stem": "A three-car accident requires a coverage chart. What should it include?", "opts": ["The client's own health insurance card, nothing else", "Only the name of the driver who caused the accident and the address where the police report can be requested", "Each driver, carrier, policy and claim number, coverage types and limits, and the adjuster's contact details", "The cost of each vehicle when new and the name and address of the dealership where each driver bought the car"], "a": 2, "fb": "Coverage skill: In multi-vehicle cases, several BI, PIP and UM/UIM claims may run at once. The chart prevents missed coverage."}, {"cat": "Insurance Claims & Coverage", "stem": "What is a recorded statement?", "opts": ["An interview recorded by an adjuster; the client should not give one to the adverse insurer without the attorney's approval", "A sworn statement given in court before a judge", "A video the client records of the accident scene on his phone, which must be sent to every insurer within 24 hours", "The voicemail greeting on the firm's phone line"], "a": 0, "fb": "Within role: Adjusters use recorded statements to find inconsistencies. The attorney decides whether and how any statement is given."}, {"cat": "Insurance Claims & Coverage", "stem": "What is MedPay coverage?", "opts": ["Coverage on the at-fault driver's policy that pays his own medical bills after an accident he caused, with no limits", "Coverage that pays the attorney's medical record fees", "A government program that pays all accident-related treatment for residents of no-fault states, with no limits at all", "Optional coverage on the client's own policy that pays medical bills regardless of fault, usually with low limits"], "a": 3, "fb": "Coverage map: MedPay can pay early bills quickly. Some policies or states allow the carrier to seek reimbursement from the settlement."}, {"cat": "Insurance Claims & Coverage", "stem": "Damages are $120,000. The at-fault driver has $25,000 in BI coverage per person, and the client has $100,000 in UIM coverage. Which claims should be opened?", "opts": ["The BI claim against the at-fault carrier and a UIM claim with the client's own carrier, following policy notice rules", "No claims until the client finishes treatment and the attorney decides whether to file a lawsuit against the driver", "Only the BI claim, because UIM coverage never applies when the at-fault driver has any insurance at all", "Only a claim with the client's health insurance"], "a": 0, "fb": "Coverage skill: Low liability limits are exactly when UIM matters. UIM policies often have notice and consent requirements before settling with the at-fault carrier, so the attorney must be involved early."}, {"cat": "Insurance Claims & Coverage", "stem": "Which statement about rental cars in a property damage claim is accurate?", "opts": ["The client may rent any vehicle for as long as the case lasts.", "Rental cars are never covered under any auto policy, so the client must always pay for a rental car himself.", "A property damage claim may include reasonable rental costs during repair or until a total-loss settlement.", "Rental costs are paid only after the injury claim settles."], "a": 2, "fb": "Property damage: Rental coverage depends on the policies involved and is usually limited in time and daily amount."}, {"cat": "Insurance Claims & Coverage", "stem": "Which email to an adjuster uses the right professional tone?", "opts": ["\"Hi! Just checking if you guys are going to pay or what?\"", "\"Dear Ms. Smith: Please confirm acceptance of liability for claim no. 4471-22 and provide your insured's BI limits. Thank you.\"", "\"Please tell us everything about our client's injuries.\"", "\"Your insured is a terrible driver and you know it. Pay up now or we will make sure everyone hears about how you treat claimants.\""], "a": 1, "fb": "Professional writing: Be polite, specific and short. Always include the claim number and a clear request."}, {"cat": "Insurance Claims & Coverage", "stem": "How can the client's health insurance be involved in a PI case?", "opts": ["It becomes the defendant in the lawsuit if it refuses to pay any of the client's accident-related bills.", "It may pay treatment bills and later assert a lien or reimbursement claim against the settlement.", "It cannot pay any bill related to an accident, because auto insurance must always pay first in every state.", "It automatically pays the client's pain and suffering."], "a": 1, "fb": "Coverage map: Health plans often have reimbursement rights, so their payments must be tracked from the start."}, {"cat": "Demands, Liens & Settlement", "stem": "What is a demand package?", "opts": ["A letter and exhibits sent to the insurer setting out liability, injuries and damages, with a demand", "The client's written request to the firm for a status update, which must be answered within ten business days", "The complaint filed with the court to start a lawsuit", "The insurer's first settlement offer, sent to the firm after it reviews the police report and the medical bills"], "a": 0, "fb": "Key document: A well-built demand tells the story of the case and supports every number with evidence."}, {"cat": "Demands, Liens & Settlement", "stem": "Which exhibits are typically included in a demand package?", "opts": ["The adjuster's personal contact information", "Police report, photographs, medical records and bills, and wage-loss documents", "The client's full tax returns for the last ten years", "The firm's retainer agreement, internal case notes and the attorney's settlement valuation"], "a": 1, "fb": "Demand skill: Exhibits should be indexed and match the numbers in the letter."}, {"cat": "Demands, Liens & Settlement", "stem": "What does a negotiation log record?", "opts": ["Each offer and counteroffer, with the date, amount and who made it", "The client's daily pain levels and medications, recorded in a diary for the demand", "The provider's appointment schedule and the client's attendance at each visit", "The attorney's billable hours"], "a": 0, "fb": "Negotiation support: A clear log lets the attorney see the movement in the negotiation and report to the client."}, {"cat": "Demands, Liens & Settlement", "stem": "In settlement negotiations, a counteroffer is:", "opts": ["an offer accepted without changes, which becomes a binding settlement", "a response to an offer that proposes a different amount or terms", "a court-ordered settlement amount", "a refusal to negotiate further"], "a": 1, "fb": "Key term: A counteroffer usually rejects the earlier offer. Staff log it exactly as stated."}, {"cat": "Demands, Liens & Settlement", "stem": "What is a lien in a PI settlement?", "opts": ["A legal claim on the settlement funds by someone who paid for or provided treatment", "The attorney's right to withdraw from the case", "A penalty the court imposes on the defendant for refusing to settle before the trial date", "The insurer's written refusal to pay a claim, sent after it reviews all the evidence in the file"], "a": 0, "fb": "Key term: Liens must be identified and resolved before the client receives the net settlement."}, {"cat": "Demands, Liens & Settlement", "stem": "What is subrogation?", "opts": ["An insurer's right to recover what it paid from the responsible party or the settlement", "The process of transferring a case to a new attorney when the client is unhappy with the first one", "A court's power to reduce a jury verdict", "The client's right to choose a new doctor"], "a": 0, "fb": "Key term: Health plans, MedPay carriers and others may have subrogation rights. Staff request their claimed amounts in writing."}, {"cat": "Demands, Liens & Settlement", "stem": "The client is a Medicare beneficiary and Medicare paid for some accident treatment. What is true?", "opts": ["Medicare's interest only matters in workers' compensation cases.", "Medicare never seeks reimbursement in accident cases, because it is a government program and not a private insurer.", "Medicare's conditional payments must be repaid from the settlement; staff request the amount and a final demand.", "The client can choose whether to repay Medicare after receiving the money, depending on the size of the settlement."], "a": 2, "fb": "Rule anchor: Under the Medicare Secondary Payer rules, Medicare must be reimbursed for conditional payments. Ignoring it can create liability for the client and others involved."}, {"cat": "Demands, Liens & Settlement", "stem": "What is a release in a PI settlement?", "opts": ["A document in which the client gives up claims against the defendant in exchange for the settlement", "A document that releases the client's medical records to the firm and to every insurer involved in the claim", "A letter releasing the attorney from the case when the client decides to hire a different firm before settlement", "A court order releasing the defendant from jail"], "a": 0, "fb": "Key document: Once signed, a release generally ends the claim. The attorney reviews its terms with the client."}, {"cat": "Demands, Liens & Settlement", "stem": "What does a settlement statement show?", "opts": ["The gross settlement, fees, costs, liens and net to the client, signed by the client before disbursement", "The insurer's internal valuation of the claim, including the adjuster's reserve and the reasons for each offer", "The defendant's driving record, including prior accidents and traffic tickets, obtained from the state DMV", "The full medical history of the client"], "a": 0, "fb": "Key document: The settlement statement makes every deduction transparent to the client."}, {"cat": "Demands, Liens & Settlement", "stem": "Settlement funds are received. How are they handled?", "opts": ["They are deposited in the firm's operating account and used for office expenses until the client asks for the money.", "They go into the firm's trust account and are paid out only after clearing, as the signed settlement statement shows.", "They are paid first to the medical providers, without telling the client, because providers always have priority.", "The check is endorsed and handed directly to the client in full."], "a": 1, "fb": "Trust accounting: Client funds belong in trust (IOLTA) and are disbursed only according to the signed settlement statement."}, {"cat": "Demands, Liens & Settlement", "stem": "Gross settlement: $60,000. Attorney's fee: 33⅓%. Case costs: $1,500. Liens: $8,500. What is the net to the client?", "opts": ["$38,500", "$30,000", "$31,500", "$40,000"], "a": 1, "fb": "Calculation: Fee = $20,000. $60,000 − $20,000 − $1,500 − $8,500 = $30,000. Always check the math against the retainer terms."}, {"cat": "Demands, Liens & Settlement", "stem": "Before disbursement, how should lien amounts be handled?", "opts": ["Pay whatever amount was listed in the first letter months ago, because lien amounts can never change after they are sent.", "Ignore liens if the client says they are not owed.", "Estimate the lien amounts from the medical bills and pay the estimates, so the client is not kept waiting.", "Request final, itemized lien amounts in writing; the attorney may negotiate reductions before payment."], "a": 3, "fb": "Lien management: Final written amounts protect the client and the firm. Many lienholders reduce their claims when asked."}, {"cat": "Demands, Liens & Settlement", "stem": "What is a time-limited demand?", "opts": ["A demand that gives the insurer a deadline to accept, so the date must be calendared precisely", "A demand the insurer sends to the client", "A demand that expires automatically if the client stops medical treatment before the case settles", "A demand that can only be sent after a lawsuit is filed"], "a": 0, "fb": "Deadline control: Some states have specific rules for these demands. Staff track the response date to the day."}, {"cat": "PI Case Software", "stem": "In PI case software, a \"matter stage\" is:", "opts": ["the amount of the last offer from the insurer, which the system updates automatically from the adjuster's emails", "the attorney assigned to the case", "the phase of the case, such as intake, treating, demand or negotiation, which drives tasks", "the physical location of the paper file in the office, such as the attorney's desk or the file room"], "a": 2, "fb": "Software concept: Stages trigger the right tasks at the right time and let managers see the pipeline."}, {"cat": "PI Case Software", "stem": "What is the \"statute date\" field in a PI matter?", "opts": ["The date the limitation period runs, confirmed by the attorney", "The date the client signed the retainer agreement and the firm opened the matter", "The date the settlement check arrived", "The date the demand was sent"], "a": 0, "fb": "Deadline control: The statute date is the most important field in the file. Dashboards should highlight approaching dates."}, {"cat": "PI Case Software", "stem": "Why must insurers, adjusters and providers be linked correctly to the matter?", "opts": ["So correspondence and documents go to the right party with the right claim information", "Because the software deletes any contact that is not linked to a matter within thirty days", "Only to produce the firm's marketing reports", "Because insurers require access to the firm's software"], "a": 0, "fb": "Data quality: Wrong links send letters to the wrong adjuster or provider and delay the case."}, {"cat": "PI Case Software", "stem": "What is a task template?", "opts": ["A spreadsheet of past settlements", "A blank form for the client's intake questionnaire, printed and filled in by hand", "A reusable set of tasks and deadlines created automatically at a stage", "A letter template for denying representation"], "a": 2, "fb": "Workflow: Templates make sure every case gets the same essential steps, such as sending LORs and requesting records."}, {"cat": "PI Case Software", "stem": "What is the main risk of generating documents from templates?", "opts": ["Templates cannot include the client's name, so every letter must be personalized by hand before it is printed.", "Wrong data in a field, such as a claim number, flows into every letter, so check merged fields before sending.", "Generated letters are not legally valid unless the attorney signs each one by hand with blue ink before mailing.", "Templates always print in the wrong language."], "a": 1, "fb": "Data quality: Automation multiplies both accuracy and errors. A quick review before sending prevents misdirected mail."}, {"cat": "PI Case Software", "stem": "Which items should be complete before a matter moves to the demand stage?", "opts": ["Treatment finished or stable, final records and bills received, and specials totaled", "The settlement statement and the release, signed by the client and the insurer", "Only the police report", "Only the signed retainer agreement and the client's photo identification"], "a": 0, "fb": "Workflow: Moving to demand too early undervalues the claim or forces a later supplement."}, {"cat": "PI Case Software", "stem": "What is a dashboard used for in PI case software?", "opts": ["Sending text messages to adjusters automatically", "Storing the client's medical images and radiology reports for the demand", "Calculating the attorney's fee", "Seeing matters, deadlines and overdue tasks at a glance"], "a": 3, "fb": "Software concept: Dashboards help case managers prioritize a large caseload."}, {"cat": "PI Case Software", "stem": "Litify, Filevine and CasePeer are:", "opts": ["medical billing code databases", "court electronic filing systems", "insurance company claim portals", "case management platforms commonly used by personal injury firms"], "a": 3, "fb": "Software map: The platforms differ, but they share concepts such as matters, stages, contacts, tasks and templates."}, {"cat": "PI Case Software", "stem": "What is a custom field in case software?", "opts": ["A field that stores the attorney's signature", "A field that only the software vendor can see and edit, used for billing the firm each month", "A field the firm adds to track data the default system lacks, such as rideshare app status", "A field that clients fill out in the waiting room"], "a": 2, "fb": "Software concept: Custom fields capture firm-specific data that feeds reports and templates."}, {"cat": "PI Case Software", "stem": "The same adjuster appears as two different contacts in the system. What should staff do?", "opts": ["Merge the duplicates so all correspondence and history are in one record", "Keep both records and alternate between them so that neither record becomes too long", "Ignore it, because duplicates do not affect anything", "Delete both and create a new contact for every letter"], "a": 0, "fb": "Data quality: Duplicates split the history and cause missed messages."}, {"cat": "PI Case Software", "stem": "The client is still treating, but someone wants to move the matter to the demand stage. What is the right approach?", "opts": ["Close th h no lawsuit filed, a reply to an adjuster's offer, and a records follow-up. What comes first?", "opts": ["All three have equal priority", "The reply to the adjuster", "The statute date: alert the attorney immediately", "The records follow-up, because the demand cannot go out without it"], "a": 2, "fb": "Prioritization: The statute date has the most severe and irreversible consequence."}, {"cat": "Capstone: Pre-Litigation Audit", "stem": "File audit: in a no-fault state, the client's PIP application was never submitted. Why is this urgent?", "opts": ["PIP only matters after the BI claim settles, because the at-fault carrier must pay all medical bills first.", "PIP benefits may be lost if the application is not filed within the policy or state deadline; escalate.", "PIP is optional coverage with no deadlines, so the application can be filed at any time before the case settles.", "The adverse insurer will file the PIP application for the client."], "a": 1, "fb": "Audit skill: No-fault benefits pay early bills. Missing the application can leave the client with unpaid treatment."}, {"cat": "Capstone: Pre-Litigation Audit", "stem": "File audit: a Medicare beneficiary's case has settled, but there is no conditional payment information in the file. What is needed before disbursement?", "opts": ["Only the client's verbal confirmation that Medicare paid nothing", "A letter to the defendant asking it to pay Medicare later", "Nothing, because Medicare is not a lienholder and has no right to be repaid from an injury settlement", "Medicare's conditional payment amount and final demand, so Medicare is repaid from the settlement"], "a": 3, "fb": "Audit skill: Medicare's recovery rights must be resolved. Staff request the information through Medicare's recovery contractor and log every step."}];
const COURSES = [{"code": "IL-PI-01", "name": "PI English Foundations"}, {"code": "IL-PI-02", "name": "Civil Liability to U.S. Negligence"}, {"code": "IL-PI-03", "name": "PI Intake & Sign-Ups"}, {"code": "IL-PI-04", "name": "Medical Records & Treatment"}, {"code": "IL-PI-05", "name": "Insurance Claims & Coverage"}, {"code": "IL-PI-06", "name": "Demands, Liens & Settlement"}, {"code": "IL-PI-07", "name": "PI Case Software"}, {"code": "IL-PI-08", "name": "Capstone: Pre-Litigation Audit"}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">This exam covers the core content of the ${COURSES.length}-course ${PATHWAY_NAME} pathway. Your results include a score for each course. ${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      ${courseTableHtml(completed)}
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function courseBreakdown(completed){
  const rows = COURSES.map(c => ({ code: c.code, name: c.name, correct: 0, total: 0 }));
  QUESTIONS.slice(0, completed).forEach((q, i) => {
    const r = rows.find(x => x.name === q.cat);
    if(!r) return;
    r.total++;
    if(state.answers[i] !== null && state.answers[i] === q.a) r.correct++;
  });
  return rows.filter(r => r.total > 0).map(r => ({ ...r, percent: Math.round((r.correct / r.total) * 100) }));
}
function courseTableHtml(completed){
  const rows = courseBreakdown(completed);
  if(!rows.length) return "";
  const limit = Math.round(PASS_THRESHOLD * 100);
  const below = rows.filter(r => r.percent < limit);
  return `
      <div class="section-label">Score by course</div>
      <div class="section-note">Each question maps to one of the ${COURSES.length} courses in the ${PATHWAY_NAME} pathway. Courses below ${limit}% are where the pathway will add the most for you.</div>
      <table class="results"><tr><th>Course</th><th>Score</th><th>%</th></tr>${rows.map(r =>
        `<tr><td><span class="coursecode">${r.code}</span>${r.name}</td><td>${r.correct} / ${r.total}</td><td class="${r.percent < limit ? "below" : ""}">${r.percent}%</td></tr>`).join("")}
      </table>
      ${below.length ? `<div class="footer-note"><strong>Recommended starting points:</strong> ${below.map(r => r.code).join(", ")}.</div>` : `<div class="footer-note">You scored at or above ${limit}% in every course you completed.</div>`}`;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push("SCORE BY COURSE");
  courseBreakdown(completed).forEach(r => lines.push(`${r.code} ${r.name}: ${r.correct}/${r.total} (${r.percent}%)`));
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();
</script>
</body>
</html>
