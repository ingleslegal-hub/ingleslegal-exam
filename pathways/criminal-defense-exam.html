<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:var(--panel-line); font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  table.results td.below{ color:var(--bad); font-weight:600; }
  .coursecode{ color:var(--bronze); font-weight:600; margin-right:6px; }
  .section-label{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:15px; color:var(--lifted-aubergine); margin:22px 0 4px; }
  .section-note{ font-family:"Archivo", Arial, sans-serif; font-size:12.5px; color:var(--body-on-light); margin:0 0 4px; line-height:1.5; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================

const TIER_LABEL = "Criminal Defense Pathway";
const PATHWAY_NAME = "Criminal Defense Legal Assistant";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwYCnCr75l6BUDyPIxPD2sbl5NvgENQWT5JFpMreAlQmg5dI85SEeecneWUVzknyzxr/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Criminal Defense English Foundations", "stem": "Which statement correctly distinguishes a felony from a misdemeanor in most U.S. jurisdictions?", "opts": ["A felony is a federal crime, and a misdemeanor is any crime charged by a state or county prosecutor.", "A felony is punishable by more than one year of imprisonment; a misdemeanor by up to one year.", "A felony is decided by a judge alone, and a misdemeanor is always decided by a jury of twelve citizens.", "A felony is any crime committed with a weapon, and a misdemeanor is any crime committed without one, whatever the sentence."], "a": 1, "fb": "Key concept: The usual dividing line is the possible punishment. Felonies are usually served in prison, misdemeanors in local jail."}, {"cat": "Criminal Defense English Foundations", "stem": "An infraction is:", "opts": ["a serious crime that requires a grand jury indictment before any trial can begin", "a violation of probation conditions that results in an arrest warrant", "a crime punishable by up to one year in the county jail and probation", "a minor violation punishable only by a fine, such as most traffic tickets"], "a": 3, "fb": "Key term: Infractions usually carry no jail time and often no right to a jury trial."}, {"cat": "Criminal Defense English Foundations", "stem": "Who is the prosecutor in a criminal case?", "opts": ["The judge who supervises the case from arrest to sentencing", "The officer who arrested the defendant and wrote the police report", "The government lawyer who brings the charges", "The lawyer appointed by the court to represent defendants who cannot afford one"], "a": 2, "fb": "Key term: Prosecutors have different titles: district attorney, state's attorney, assistant U.S. attorney."}, {"cat": "Criminal Defense English Foundations", "stem": "A public defender is:", "opts": ["a court employee who explains the charges to the jury before trial", "a prosecutor who handles only minor cases in municipal court and traffic court, usually without a jury", "a police officer assigned to protect the defendant's family during the case", "a government-paid lawyer appointed for defendants who cannot afford a private attorney"], "a": 3, "fb": "Key term: The right to appointed counsel comes from the Sixth Amendment (Gideon v. Wainwright)."}, {"cat": "Criminal Defense English Foundations", "stem": "An indictment is:", "opts": ["a formal charge issued by a grand jury", "the judge's final decision after a trial", "a charging document the prosecutor files without a grand jury after a preliminary hearing", "the police officer's written report of the arrest"], "a": 0, "fb": "Charging documents: Indictments come from grand juries; informations are filed by prosecutors; complaints often start the case."}, {"cat": "Criminal Defense English Foundations", "stem": "In many state cases, an \"information\" is:", "opts": ["the list of evidence the defense must give the prosecutor before trial", "a public notice that the defendant has been released from custody, posted on the jail's website", "a charging document filed by the prosecutor, often after a preliminary hearing", "a request the defense sends to the police for a copy of the report"], "a": 2, "fb": "False friend inside English: In criminal procedure, \"information\" is a formal charging document, not general data."}, {"cat": "Criminal Defense English Foundations", "stem": "Which constitutional amendment protects the right not to be a witness against oneself (the right to remain silent)?", "opts": ["The Eighth Amendment", "The Fourth Amendment", "The Fifth Amendment", "The Sixth Amendment"], "a": 2, "fb": "Rights map: Fourth (searches and seizures), Fifth (self-incrimination, double jeopardy, due process), Sixth (counsel, speedy and public trial, jury, confrontation), Eighth (excessive bail, cruel and unusual punishment)."}, {"cat": "Criminal Defense English Foundations", "stem": "The right to the assistance of counsel and to a speedy and public trial come from:", "opts": ["the Second Amendment", "the Sixth Amendment", "the Fourth Amendment", "the First Amendment"], "a": 1, "fb": "Rights map: The Sixth Amendment also guarantees an impartial jury and the right to confront witnesses."}, {"cat": "Criminal Defense English Foundations", "stem": "Miranda warnings are required before:", "opts": ["the prosecutor offers a plea agreement to the defense", "a judge reads the charges to the defendant at arraignment", "custodial interrogation by the police", "any conversation between a police officer and a member of the public on the street"], "a": 2, "fb": "Key concept: Both custody and interrogation are needed. Whether a statement was taken without proper warnings is a question for the attorney."}, {"cat": "Criminal Defense English Foundations", "stem": "A probation officer:", "opts": ["represents the defendant at the sentencing hearing", "investigates crimes and arrests suspects for the prosecutor", "decides whether there is probable cause to charge the defendant with a felony or a misdemeanor", "supervises people serving probation and reports to the court"], "a": 3, "fb": "Key term: Probation officers also prepare presentence reports in many courts."}, {"cat": "Criminal Defense English Foundations", "stem": "A complaint in a criminal case is:", "opts": ["a charging document that often starts the case", "a letter the defendant writes to the judge about the jail conditions", "the defense attorney's written argument at the end of trial", "a request by the victim to drop the charges"], "a": 0, "fb": "Key term: In many courts, a complaint starts the case; a later information or indictment may replace it for felonies."}, {"cat": "Criminal Defense English Foundations", "stem": "\"Beyond a reasonable doubt\" is:", "opts": ["the standard used in civil personal injury trials", "the standard a grand jury uses to issue an indictment", "the standard of proof the prosecution must meet to convict", "the standard police need to make an arrest"], "a": 2, "fb": "Key concept: Arrests and indictments need probable cause; civil cases usually use a preponderance of the evidence."}, {"cat": "Criminal Defense English Foundations", "stem": "A defendant's mother calls and asks whether her son will go to prison. What is the best response for a legal assistant?", "opts": ["\"Don't worry, first-time defendants never go to prison, so he will be home soon and the case will probably be dismissed.\"", "\"Tell your son to plead guilty quickly, because that always reduces the sentence.\"", "\"Yes, with these charges he will probably get at least five years in state prison.\"", "\"I can't give legal advice, but I'll make sure the attorney knows you called and gets back to you.\""], "a": 3, "fb": "Within role: Predictions and advice are for the attorney. Staff stay calm, kind and within role."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "How does U.S. criminal practice compare with the accusatory systems adopted in many Latin American countries?", "opts": ["Both use oral, adversarial hearings, but U.S. practice relies heavily on plea bargaining and jury trials.", "The U.S. uses written procedures decided by investigating judges, while Latin America uses only oral hearings.", "Latin American systems use juries in every criminal case, while the U.S. never allows jury trials.", "Both systems are identical, including the use of juries in every case and the same names for each hearing."], "a": 0, "fb": "The Bridge: Similar structures hide different practices. Most U.S. cases end in plea agreements."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "In a criminal file, the Spanish word \"sentencia\" usually means:", "opts": ["the prosecutor's closing argument to the jury", "the court's judgment, which can be a conviction or an acquittal", "only the punishment imposed after a conviction, such as prison time", "the defendant's written statement to the police"], "a": 1, "fb": "False friend: In English, \"sentence\" means only the punishment. A \"sentencia absolutoria\" is an acquittal, not a sentence."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "The Spanish word \"convicción\" usually means:", "opts": ["a guilty plea entered at arraignment", "the sentence imposed by the judge", "a firm belief; a finding of guilt is \"condena\"", "a criminal conviction entered by a judge after a guilty verdict"], "a": 2, "fb": "False friend: \"Conviction\" in English legal usage translates as \"condena,\" not \"convicción.\""}, {"cat": "Acusatorio to U.S. Procedure", "stem": "Why should \"delito grave\" not automatically be translated as \"felony\"?", "opts": ["Because \"delito grave\" always means a misdemeanor under U.S. law, so translating it as \"felony\" would exaggerate it", "Because offense categories differ between systems, so the translation must reflect the actual classification", "Because U.S. courts do not use the word \"felony\" in official documents, only in newspapers and on television news", "Because \"felony\" applies only to crimes committed outside the United States"], "a": 1, "fb": "Translation skill: Equivalence must be checked, not assumed. A translator's note can explain the term."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "In Spanish court documents, \"alegato\" usually refers to:", "opts": ["an allegation of fact contained in the charging document filed by the prosecutor", "the list of witnesses the defense will call at the trial or the hearing", "a legal argument, such as a closing argument, not an \"allegation\"", "the defendant's alibi presented to the police"], "a": 2, "fb": "False friend: \"Alegato de clausura\" is the closing argument. An allegation is a claim of fact (in Spanish, often \"imputación\" or \"alegación\")."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "What is a plea bargain?", "opts": ["A negotiated agreement: the defendant pleads to a charge in exchange for concessions", "An agreement between the victim and the police to drop the investigation", "A request by the defendant to postpone the trial until a new judge is assigned to the case", "A payment the defendant makes to the court to avoid a criminal record"], "a": 0, "fb": "Key concept: Plea bargaining resolves the large majority of U.S. criminal cases."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "What does a grand jury decide?", "opts": ["The length of the sentence after the defendant is convicted", "Whether the defendant should be released on bail before trial", "Whether there is probable cause to indict, not whether the defendant is guilty", "Whether the defendant is guilty beyond a reasonable doubt at the end of the trial"], "a": 2, "fb": "Key concept: Federal felonies require a grand jury indictment; many states use grand juries less often."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "An acquittal is:", "opts": ["a verdict of not guilty", "an agreement to dismiss the case after classes", "a sentence of probation instead of jail", "a reduction of the charge from a felony to a misdemeanor"], "a": 0, "fb": "Key term: An acquittal ends the case on that charge; double jeopardy generally prevents a retrial."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "Which pairing of legal standards is correct?", "opts": ["Reasonable suspicion for a conviction; clear and convincing evidence for an arrest", "Beyond a reasonable doubt for an arrest; probable cause for a conviction", "Preponderance of the evidence for an arrest and for a conviction", "Probable cause for an arrest; beyond a reasonable doubt for a conviction"], "a": 3, "fb": "Key concept: Standards rise as the stakes rise. Translations of these terms must be exact."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "A police report in Spanish says: \"El detenido se negó a declarar.\" What is the accurate translation?", "opts": ["The detainee denied the charges against him.", "The detainee declined to make a statement.", "The detainee confessed after being questioned.", "The detainee refused to be arrested by the officers."], "a": 1, "fb": "Translation accuracy: \"Negarse a declarar\" means refusing to give a statement. \"Denied the charges\" changes the legal meaning."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "In U.S. criminal jury trials, a verdict to convict must be:", "opts": ["approved by a simple majority of the jurors", "unanimous", "approved by a two-thirds majority of the jurors", "confirmed by the prosecutor after the jury votes"], "a": 1, "fb": "Key concept: The Supreme Court confirmed in Ramos v. Louisiana (2020) that state convictions for serious offenses require a unanimous jury."}, {"cat": "Acusatorio to U.S. Procedure", "stem": "What should a translator do with a Spanish police document so that its legal meaning does not change?", "opts": ["Translate it completely, keeping its legal meaning, and note unclear or illegible parts", "Summarize the important parts in English and leave out anything that seems irrelevant to the charges", "Improve the grammar and add details so the report reads more clearly", "Replace legal terms with the closest U.S. terms without any note"], "a": 0, "fb": "Translation skill: Courts and attorneys rely on exact content. Never summarize or improve evidence."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "A woman calls about her detained brother. What is the right approach?", "opts": ["Ask her to describe what her brother did so you can tell the attorney whether he is guilty", "Discuss every detail of the case with her, because close family members are covered by the attorney-client privilege", "Refuse to speak with her at all and hang up immediately", "Identify who is calling; she is not the client, so share only general information unless the attorney says otherwise"], "a": 3, "fb": "Within role: Confidentiality protects the client. Families are important, but they are not the client."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "Why should staff warn clients and families not to discuss the facts of the case on jail phone calls?", "opts": ["Jail calls are not allowed in Spanish", "Jail calls are usually recorded and can be used as evidence", "Jail calls are too expensive for long conversations about the case", "Jail calls automatically end after one minute"], "a": 1, "fb": "Risk control: Recorded jail calls are a common source of evidence against defendants."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "A booking number is:", "opts": ["the reservation number for a visit with the attorney", "the number the jail assigns to a person when booked into custody", "the case number the court assigns to the criminal charges after the first appearance", "the number of the police officer who made the arrest"], "a": 1, "fb": "Key term: The booking number helps locate the person and arrange visits or bond."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "What is an inmate locator?", "opts": ["An online search tool to find where a person is in custody", "A court officer who brings defendants to the courtroom", "A device the jail uses to track people released on bond", "A private investigator who finds missing witnesses"], "a": 0, "fb": "Practical tool: Counties, state prisons and the federal Bureau of Prisons have separate locators."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "Bail is:", "opts": ["money or conditions set to help ensure the defendant returns to court", "the amount the victim receives as compensation for the crime", "a fee the defense attorney charges for the first appearance", "a fine the defendant pays as punishment after a conviction, set by the judge at sentencing"], "a": 0, "fb": "Key term: Bail rules vary widely by state; some states have eliminated cash bail."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "When a family uses a bail bondsman, what usually happens?", "opts": ["The court returns the full premium to the family when the case ends, whatever the result", "The bondsman becomes the defendant's attorney for the case", "The bondsman posts the bond for a premium, which is usually non-refundable", "The family pays nothing unless the defendant is convicted"], "a": 2, "fb": "Key term: Where commercial bail is allowed, the premium is the bondsman's fee. Staff explain this in general terms only."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "\"Release on own recognizance\" (ROR) means:", "opts": ["release only after the full bail amount is paid in cash to the court clerk by a family member", "release into the custody of immigration authorities", "release to a residential treatment program chosen by the defendant", "release on the defendant's promise to return to court, without paying bail"], "a": 3, "fb": "Key term: Release conditions may still apply, such as staying away from a witness."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "Which is an example of a release condition?", "opts": ["Writing a letter of apology to the arresting officer", "Having no contact with the alleged victim", "Changing the defendant's name on all identity documents", "Paying the attorney's fee in full within a week"], "a": 1, "fb": "Key term: Violating release conditions can lead to re-arrest. Staff help clients track them."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "What is an ICE detainer?", "opts": ["An order from a criminal judge that the defendant be deported after the trial ends, whatever the verdict", "A form the defendant signs to request voluntary departure from the United States", "A request that the jail hold a person up to 48 hours past release so ICE can take custody", "A warrant issued by the state prosecutor for an immigration crime"], "a": 2, "fb": "Key term: Detainers (Form I-247A) change the strategy on bail and release. They must be escalated immediately."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "During intake, the family mentions that their detained relative has an \"immigration hold.\" What should staff do?", "opts": ["Tell the family to post bail right away so he is released before ICE arrives at the jail", "Tell the family the hold will disappear automatically after the arraignment", "Alert the attorney immediately; posting bail may lead to a transfer to ICE custody", "Ignore it, because immigration issues are not part of a criminal case"], "a": 2, "fb": "Escalation: Criminal and immigration consequences interact. The attorney decides the strategy."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "The \"first appearance\" (initial appearance) is generally:", "opts": ["the sentencing hearing after a guilty plea, where the judge decides the punishment and any probation terms", "the trial date when the jury hears the evidence and the witnesses for both sides testify in court", "the first meeting between the defendant and the prosecutor to negotiate", "the first hearing after arrest, where the charges are explained and release or bail is addressed"], "a": 3, "fb": "Process map: Names and timing vary by state; in some courts the first appearance and arraignment are combined."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "A father says: \"Mi hijo está preso desde anoche; lo agarraron manejando borracho.\" What is the accurate intake note?", "opts": ["Caller's son has been in prison for one night for drinking in public.", "Caller's son was convicted last night of driving under the influence and was sentenced to spend the night in jail.", "Caller's son has been in custody since last night; he was arrested for allegedly driving while intoxicated.", "Caller's son admitted to the police that he was driving drunk and he wants to plead guilty at his first hearing."], "a": 2, "fb": "Translation accuracy: Arrested is not convicted. \"Allegedly\" keeps the note neutral."}, {"cat": "Defense Intake, Jail Calls & Bond", "stem": "How can staff find a defendant's case number and next court date?", "opts": ["Wait for the prosecutor to send a letter to the defendant's family", "Search the court's online case records using the defendant's name and date of birth", "Call the arresting officer and ask for the court's internal records and the prosecutor's file", "Check the jail's commissary account for the case information"], "a": 1, "fb": "Practical tool: Name plus date of birth avoids confusing people with similar names."}, {"cat": "Arrest to Trial", "stem": "Which sequence is typical for a felony case?", "opts": ["Arrest, initial appearance, preliminary hearing or grand jury, arraignment, pretrial motions, trial", "Arrest, trial, arraignment, preliminary hearing, initial appearance, pretrial motions, sentencing, verdict", "Initial appearance, trial, arrest, pretrial motions, arraignment, grand jury", "Arraignment, arrest, verdict, preliminary hearing, sentencing, pretrial motions"], "a": 0, "fb": "Process map: Names and order vary by jurisdiction, but this is the standard flow staff learn to track."}, {"cat": "Arrest to Trial", "stem": "At an arraignment, the defendant:", "opts": ["meets with the probation officer for the first time", "is formally told the charges and enters a plea", "receives the sentence after being found guilty", "testifies about the facts of the case in front of a jury"], "a": 1, "fb": "Key term: Most defendants plead not guilty at arraignment while the case proceeds."}, {"cat": "Arrest to Trial", "stem": "At a preliminary hearing, the judge decides:", "opts": ["whether the jury has been selected correctly", "whether there is probable cause to send the case to trial", "the sentence the defendant will receive if convicted", "whether the defendant is guilty beyond a reasonable doubt"], "a": 1, "fb": "Key term: Preliminary hearings are common for felonies in many states."}, {"cat": "Arrest to Trial", "stem": "A motion to suppress asks the court to:", "opts": ["postpone the trial to a later date because a key defense witness is unavailable or sick", "dismiss the case because the defendant has apologized to the victim", "reduce the bail amount set at the first appearance", "exclude evidence obtained illegally, for example through an unlawful search"], "a": 3, "fb": "Key term: Suppression motions often turn on details in police reports and body-camera video."}, {"cat": "Arrest to Trial", "stem": "A continuance is:", "opts": ["the jury's decision to continue deliberating overnight", "a postponement of a hearing or trial to a later date", "a decision to continue the defendant's detention without bail", "an order that the case continue in a different county"], "a": 1, "fb": "Key term: Every continuance means a new date to calendar and communicate to the client."}, {"cat": "Arrest to Trial", "stem": "A subpoena is:", "opts": ["a letter from the prosecutor offering a plea agreement", "a court order requiring a person to appear and testify, or to produce documents", "a notice that the defendant missed a court date and must pay a fine to the clerk", "a written request to the judge for permission to file a late motion after the court's deadline"], "a": 1, "fb": "Key term: A subpoena duces tecum requires documents or records to be produced."}, {"cat": "Arrest to Trial", "stem": "A trial notebook is:", "opts": ["an organized file with the pleadings, witness outlines, exhibits and key law for trial", "the court reporter's official transcript of the trial testimony, prepared after the verdict", "the defendant's diary written while in custody, which the defense must give the prosecutor", "the jury's notes taken during the trial"], "a": 0, "fb": "Trial preparation: Staff build and maintain the notebook so the attorney finds everything instantly."}, {"cat": "Arrest to Trial", "stem": "What is a witness list?", "opts": ["A list of the jurors selected for the trial", "A list of family members allowed to visit the defendant", "A list of the police officers at the arrest scene", "A list of the people a party expects to call to testify"], "a": 3, "fb": "Trial preparation: Witness lists often have filing deadlines before trial."}, {"cat": "Arrest to Trial", "stem": "A verdict is:", "opts": ["the sentence the judge imposes after a conviction at a separate hearing", "the charge listed in the police report", "the jury's (or judge's) decision on guilt at the end of trial", "the prosecutor's first offer in plea negotiations"], "a": 2, "fb": "Key term: Guilty or not guilty. Sentencing is a separate stage."}, {"cat": "Arrest to Trial", "stem": "Which client update is appropriate for a legal assistant after a hearing?", "opts": ["\"You don't need to come to the next hearing; the attorney will handle it.\"", "\"The case will be dismissed next time, so don't worry about it.\"", "\"The judge clearly doesn't like you, so you should expect a harsh sentence at the next hearing on July 14. / El juez no lo quiere.\"", "\"Your next court date is July 14 at 9:00 a.m., Courtroom 3B. Please arrive 30 minutes early. / Su próxima fecha en corte es el 14 de julio.\""], "a": 3, "fb": "Within role: Give accurate dates and logistics. Attendance requirements and predictions come from the attorney."}, {"cat": "Arrest to Trial", "stem": "In a misdemeanor DUI case, why should staff check for a driver's license (DMV) deadline right after arrest?", "opts": ["Because the DMV deadline is always the same as the trial date", "Because many states set a separate, short deadline to request an administrative license hearing", "Because the DMV decides whether the defendant is guilty of the DUI charge before the criminal court does", "Because the court cannot schedule the arraignment until the DMV approves it"], "a": 1, "fb": "Deadline control: The license case runs separately from the criminal case and can have very short deadlines."}, {"cat": "Arrest to Trial", "stem": "What is an exhibit list?", "opts": ["A list of the charges the prosecutor dropped", "A list of the attorney's previous trials and results, filed with the court to show experience", "A list of the documents and physical evidence a party plans to use at trial", "A list of the court's hearing dates for the month, posted outside each courtroom"], "a": 2, "fb": "Trial preparation: Exhibits must be numbered, copied and disclosed according to court rules."}, {"cat": "Arrest to Trial", "stem": "What usually happens at a pretrial conference?", "opts": ["The judge announces the sentence for the defendant", "The defendant testifies under oath about the facts so the judge can set the trial date", "The jury hears opening statements from both attorneys and the first witness for the prosecution", "The parties discuss scheduling, trial readiness and plea offers with the court"], "a": 3, "fb": "Process map: Staff prepare the file and calendar any new dates set at the conference."}, {"cat": "Discovery Management", "stem": "In a criminal case, discovery is:", "opts": ["the jury's review of the evidence during deliberations", "the defendant's first statement to the police", "the process by which the defense obtains the prosecution's evidence", "the moment the police first discover the crime and begin the investigation at the scene"], "a": 2, "fb": "Key term: Discovery rules vary by jurisdiction, but the defense must track everything received."}, {"cat": "Discovery Management", "stem": "What is Brady material?", "opts": ["Evidence the defense must hand over to the prosecution before trial", "Evidence favorable to the defendant that the prosecution must disclose", "Evidence collected only by private investigators", "Evidence the judge has excluded from the trial"], "a": 1, "fb": "Key concept: Brady v. Maryland (1963) requires disclosure of exculpatory evidence material to guilt or punishment."}, {"cat": "Discovery Management", "stem": "In a police file, a \"supplement\" is:", "opts": ["an additional report that adds information after the original report", "the judge's handwritten note attached to the arrest warrant or the search warrant", "a summary of the case written by the defense attorney for the client's family", "a vitamin the defendant takes while in custody"], "a": 0, "fb": "Key term: Supplements often contain key details, so discovery indexes list them separately."}, {"cat": "Discovery Management", "stem": "Body-worn camera (BWC) footage is:", "opts": ["video recorded by a security camera inside a store", "video the defendant records on his phone", "video recorded by a camera worn by a police officer", "video of the trial recorded by the court"], "a": 2, "fb": "Key term: BWC video can confirm or contradict the police report."}, {"cat": "Discovery Management", "stem": "\"Chain of custody\" refers to:", "opts": ["the documented history of who handled a piece of evidence, and when", "the sequence of judges assigned to a case from arraignment to sentencing", "the list of jails where a defendant has been held", "the order in which defendants are brought from the jail to the courtroom each morning"], "a": 0, "fb": "Key concept: Gaps in the chain of custody can affect whether evidence is reliable or admissible."}, {"cat": "Discovery Management", "stem": "How should a body-camera video be summarized for the attorney?", "opts": ["With timestamps (for example, 00:04:12) next to each key event and statement", "With a general paragraph describing the overall mood of the video and the officer's attitude", "With only the last minute of the video, where the arrest happens", "With the reviewer's opinion about whether the officer was lying"], "a": 0, "fb": "Discovery skill: Timestamps let the attorney go straight to the important moments."}, {"cat": "Discovery Management", "stem": "What is the right method for a Spanish-language recording that will be reviewed by the attorney?", "opts": ["Transcribe it verbatim in Spanish, then translate it into English, marking inaudible parts", "Write a summary in English of what the speakers probably meant", "Translate only the parts that seem important directly into English, without making a Spanish transcript", "Correct the speakers' grammar and slang so the transcript is easier for the attorney to read"], "a": 0, "fb": "Translation skill: Verbatim transcription plus translation preserves the evidence."}, {"cat": "Discovery Management", "stem": "What does a discovery log record?", "opts": ["The questions the jury sent to the judge during the trial and deliberations", "Each item received, the date, the source and its identifying numbers", "The attorney's billable hours on the case", "The defendant's daily activities while in custody, including visits and phone calls"], "a": 1, "fb": "Discovery skill: The log proves what was received, and when, if disputes arise."}, {"cat": "Discovery Management", "stem": "What is Bates numbering?", "opts": ["A system that gives every page in a production a unique number", "The system the jail uses to number its cells and assign them to people in custody", "The number of times a witness has testified", "The court's system for numbering trial exhibits"], "a": 0, "fb": "Key term: Bates numbers make documents easy to cite and track."}, {"cat": "Discovery Management", "stem": "Why must jail calls produced in discovery be reviewed carefully?", "opts": ["They may contain statements by the defendant that the prosecution could use", "They contain the judge's private opinions about the case and the defendant", "They replace the need to review police reports", "They are always irrelevant to the charges"], "a": 0, "fb": "Discovery skill: Staff log calls with timestamps and flag any statements about the case."}, {"cat": "Discovery Management", "stem": "The police report says the suspect \"ran,\" but the body-camera video shows him walking away. What should staff do?", "opts": ["Call the officer directly and ask him to correct the report before the trial begins", "Ignore it, because police reports are always accurate and the video may be edited", "Edit the report so it matches the video", "Flag the inconsistency for the attorney, with the timestamps and report page"], "a": 3, "fb": "Discovery skill: Inconsistencies are valuable for the defense. Document them precisely."}, {"cat": "Discovery Management", "stem": "How should lab results be handled in discovery?", "opts": ["Summarize them in one sentence for the attorney and discard the original pages to save space in the file", "Index them with dates and identifying numbers and note the chain-of-custody documents", "File them without reading them, because only experts can review lab results", "Send them to the client's family for an opinion"], "a": 1, "fb": "Discovery skill: Organized lab records help the attorney decide whether an expert is needed."}, {"cat": "Discovery Management", "stem": "The police report says a statement was taken in English, but the body-camera video shows the client speaking Spanish with a bilingual officer. What should staff do?", "opts": ["Do nothing, because the language of a police interview never matters to the court or the attorney", "Tell the client that the statement cannot be used against him", "Flag it with the timestamps; it may affect how the statement and any warnings were given", "Translate the officer's questions into English and replace the report"], "a": 2, "fb": "Discovery skill: Language issues can be important. Staff flag; the attorney evaluates."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "What is a plea agreement?", "opts": ["An agreement between the defense attorney and the client about fees", "A written agreement: the defendant pleads to certain charges in exchange for concessions", "A promise by the judge to dismiss the case if the defendant apologizes", "A request to the judge for more time to prepare for trial because new discovery has arrived"], "a": 1, "fb": "Key document: Plea forms often include detailed rights waivers that must be explained to the client in a language they understand."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "A plea of \"no contest\" (nolo contendere) generally:", "opts": ["means the defendant admits guilt and also agrees to pay the victim's civil damages", "means the defendant is found not guilty and the case is dismissed without any record of the arrest or charges", "means the defendant refuses to enter any plea, so the case is suspended", "results in a conviction without admitting guilt, and usually cannot be used as an admission in a civil case"], "a": 3, "fb": "Key term: For immigration purposes, a no contest plea can still count as a conviction."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "What is deferred adjudication?", "opts": ["The court defers a finding of guilt and dismisses the case if conditions are completed", "A trial that is postponed until the defendant turns 18 and can be tried as an adult in the regular court", "A sentence served only on weekends so that the defendant can keep his job during the week", "A decision by the prosecutor not to file any charges"], "a": 0, "fb": "Key term: Even if the case is later dismissed, deferred adjudication can count as a conviction for immigration purposes."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "What did the Supreme Court hold in Padilla v. Kentucky (2010)?", "opts": ["Immigration judges must approve every plea agreement involving a noncitizen.", "Defense counsel must advise noncitizen clients of the deportation risks of a plea.", "Noncitizens cannot be prosecuted in state criminal courts unless the federal government gives permission first.", "Police must ask every person about immigration status at arrest."], "a": 1, "fb": "Rule anchor: Padilla makes immigration consequences part of effective assistance of counsel. Staff flag every noncitizen file."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "A \"crime involving moral turpitude\" (CIMT) is:", "opts": ["a minor traffic infraction under state law", "any crime committed inside a church, temple or other religious building, punished more severely by state law", "an immigration-law category of offenses that can make a noncitizen inadmissible or deportable", "a crime that only applies to public officials who abuse their position for money, such as bribery"], "a": 2, "fb": "Key term: Whether an offense is a CIMT is a complex legal question for an attorney with immigration expertise."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "What is a mitigation packet?", "opts": ["Documents such as character letters, employment and treatment records, offered to reduce the sentence", "A request to the judge to move the trial to another county", "A list of the prosecutor's weaknesses in the case, prepared by the defense for the jury", "A set of documents that prove the defendant was not at the scene"], "a": 0, "fb": "Sentencing support: Letters in Spanish must be translated and certified."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "Letters of support for sentencing are written in Spanish by the client's family. What should staff do?", "opts": ["Rewrite them in English with stronger language to make them more persuasive for the judge", "Discard any letter that is not written in perfect Spanish", "Have them translated accurately into English with a certification, and keep the originals", "Submit them in Spanish, because the judge can use an online translator"], "a": 2, "fb": "Translation skill: Accurate, certified translations preserve the writers' own words."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "Probation is:", "opts": ["the time a defendant waits in jail before trial", "a period during which the case is investigated by the police before any charges are filed in court", "a reward given to defendants who win at trial, allowing early release from other cases", "supervision in the community, with conditions, instead of or after custody"], "a": 3, "fb": "Key term: Probation violations can lead to custody, so compliance tracking matters."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "Which task is part of tracking probation compliance?", "opts": ["Recording the client's personal opinion of the probation officer and the officer's attitude", "Recording the prosecutor's other cases and the outcome of each one in the same court", "Recording the jurors' names from the trial", "Recording required classes, community service hours, fees and check-in dates"], "a": 3, "fb": "Compliance tracking: A missed condition can create a violation. Calendar reminders help clients comply."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "When should staff create an immigration-review flag in a criminal file?", "opts": ["Only after the client has been sentenced to prison for more than one year", "Only if the client asks about immigration", "Only if the charge is a felony, a drug offense or a domestic violence case", "Whenever the client is not a U.S. citizen, before any plea"], "a": 3, "fb": "Risk control: Even misdemeanors and dismissed-after-plea cases can have immigration consequences."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "At a sentencing hearing, the judge:", "opts": ["decides the punishment after a conviction", "decides which jury will hear the case", "decides whether the police had probable cause", "decides whether the defendant is guilty"], "a": 0, "fb": "Process map: Staff prepare the mitigation materials and calendar the hearing."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "By pleading guilty, a defendant generally gives up:", "opts": ["the right to ever appeal any issue in any court", "the right to have an attorney for the rest of the case, including at the sentencing hearing and on probation", "the right to receive a copy of the judgment", "the right to a trial, including confronting witnesses and the right against self-incrimination at trial"], "a": 3, "fb": "Key concept: Courts must ensure the plea is knowing and voluntary, which is why accurate interpretation is essential."}, {"cat": "Pleas, Sentencing & Immigration", "stem": "In immigration law, an \"aggravated felony\":", "opts": ["is a broad category that can include some offenses classified as misdemeanors under state law", "includes only crimes punished by more than ten years in federal prison, such as drug trafficking or murder", "applies only to violent crimes committed with a firearm", "is the same as any felony under state law, so a misdemeanor under state law can never qualify as one"], "a": 0, "fb": "Key term: The immigration definition is separate from state labels, which is why every noncitizen file needs review."}, {"cat": "Calendars, Software & Records", "stem": "A court docket is:", "opts": ["the bail bondsman's list of clients", "the jury's list of questions for the judge", "the cell where defendants wait before entering the courtroom", "the official record of the filings and hearings in a case"], "a": 3, "fb": "Key term: Docket searches confirm dates and filings."}, {"cat": "Calendars, Software & Records", "stem": "What can happen when a defendant fails to appear (FTA) in court?", "opts": ["The defendant's bail is automatically refunded to the family that posted it", "The judge may issue a bench warrant, and a new charge may be filed", "The case is automatically dismissed because the defendant did not participate", "The hearing is held without any consequences"], "a": 1, "fb": "Deadline control: An FTA can mean arrest and loss of bail. Calendaring and reminders prevent it."}, {"cat": "Calendars, Software & Records", "stem": "A \"rap sheet\" is:", "opts": ["the jail's daily menu", "the defense attorney's billing statement", "a person's criminal history record", "a list of songs played in the courtroom"], "a": 2, "fb": "Key term: Criminal histories affect plea offers, sentencing and record-clearing eligibility."}, {"cat": "Calendars, Software & Records", "stem": "Where does a client's driving record usually come from?", "opts": ["The federal Bureau of Prisons", "The county jail where the client was booked", "The client's car insurance agent", "The state department of motor vehicles (DMV)"], "a": 3, "fb": "Records map: Driving records matter in DUI and traffic-related cases."}, {"cat": "Calendars, Software & Records", "stem": "What is the general difference between expungement and record sealing?", "opts": ["They are identical in every state, with no differences in effect", "Expungement usually erases or sets aside the record; sealing hides it from public view", "Sealing removes the conviction for immigration purposes; expungement does not", "Expungement applies only to federal cases; sealing applies only to traffic tickets"], "a": 1, "fb": "Key concept: Definitions and effects vary by state. Staff use checklists; the attorney decides eligibility."}, {"cat": "Calendars, Software & Records", "stem": "Does an expunged conviction generally disappear for U.S. immigration purposes?", "opts": ["No; expunged convictions generally still count for immigration purposes", "No, but only for traffic infractions", "Yes; an expungement always removes the conviction for every purpose", "Yes, but only if the client was under 30 at the time"], "a": 0, "fb": "Risk control: Clients often believe expungement solves immigration problems. Staff route these questions to the attorney."}, {"cat": "Calendars, Software & Records", "stem": "A firm handles cases in several courts. What is the best calendaring practice?", "opts": ["Enter every date from official court sources, with court, courtroom and time, and set reminders", "Calendar only the trial dates, not the shorter hearings", "Rely on clients to tell the firm their court dates, because they receive the notices directly from the court", "Keep each attorney's dates in separate personal notebooks so that no one else in the office can change them"], "a": 0, "fb": "Deadline control: One shared, accurate calendar prevents missed appearances."}, {"cat": "Calendars, Software & Records", "stem": "How do court portals help a legal assistant?", "opts": ["They allow staff to file pleas for clients without the attorney", "They provide the prosecutor's private notes", "They allow docket searches to confirm hearing dates, filings and status", "They allow staff to change hearing dates without the judge if the client is busy"], "a": 2, "fb": "Practical tool: Always confirm dates against the official docket."}, {"cat": "Calendars, Software & Records", "stem": "Which fields are essential for a criminal matter in case software?", "opts": ["The client's favorite food, hobbies and the names of his friends from the neighborhood", "The prosecutor's home address", "Only the client's name and phone number", "Case number, court, charges, next court date, custody or bond status, and immigration flag"], "a": 3, "fb": "Data quality: These fields drive calendars, tasks and risk alerts."}, {"cat": "Calendars, Software & Records", "stem": "A record-clearing eligibility checklist usually reviews:", "opts": ["only the client's current employer", "only the name of the judge who handled the case and the courtroom number where it was heard", "the offense type, completion of the sentence, any waiting period and any new offenses", "only whether the client is happy with the outcome of the case and wants to clear the record"], "a": 2, "fb": "Workflow: The checklist organizes facts; the attorney decides eligibility under the state's law."}, {"cat": "Calendars, Software & Records", "stem": "Before a client comes to the office or court, why might staff check for outstanding warrants?", "opts": ["So staff can tell the police where the client will be at the time of the appointment", "Because warrants expire if no one looks at them", "So the attorney can address any warrant before the client is arrested unexpectedly", "Because the court requires staff to report warrants to the media"], "a": 2, "fb": "Risk control: Staff gather the information; the attorney advises the client."}, {"cat": "Calendars, Software & Records", "stem": "Two clients share the same name. How should staff avoid mixing up their records?", "opts": ["Store both clients in the same file", "Ask each client to change the spelling of his name", "Use additional identifiers, such as date of birth and case number, on every record and search", "Use only the first name for one of them and only the last name for the other one"], "a": 2, "fb": "Data quality: Mixed-up records can lead to wrong advice or missed dates."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: the hearing notice says March 12, but the firm's calendar shows March 21. What is the risk and the action?", "opts": ["A failure to appear and a bench warrant; confirm the date on the docket, fix the calendar and alert the attorney", "No risk, because the court always calls the client by phone if he does not appear on the scheduled date", "No risk, because March 21 is the later and safer date", "A small risk; simply tell the client to go to court on both dates to be safe, so no correction to the calendar is needed"], "a": 0, "fb": "Audit skill: Calendar errors in criminal cases can lead to arrest."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: three hours of body-camera video have not been reviewed, and the trial is in two weeks. What should staff do?", "opts": ["Wait until after the trial to review it", "Escalate to the attorney and plan the review immediately, with a timestamped summary", "Skip the video, because the police report already describes everything that happened", "Review only the first ten minutes of the video"], "a": 1, "fb": "Audit skill: Unreviewed discovery can hide the defense's best evidence."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a non-citizen client is about to plead guilty, and the file has no immigration review. What is the fatal flaw?", "opts": ["The missing copy of the client's birth certificate, which the court needs to accept the plea", "The missing signature on the fee agreement", "There is no flaw, because immigration issues are not part of criminal cases", "The missing immigration-consequences review; escalate to the attorney before the plea"], "a": 3, "fb": "Audit skill: Under Padilla, failing to address immigration consequences can be a serious error."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a client with an ICE detainer is scheduled to have bail posted by his family this afternoon. What should staff do?", "opts": ["Alert the attorney before the bail is posted; the client may be transferred to ICE custody", "Let the family post bail this afternoon, because getting out of jail always helps the client", "Tell the family that ICE detainers expire when bail is paid", "Call ICE directly to ask whether they will pick him up when he is released from the county jail"], "a": 0, "fb": "Audit skill: Strategy around detainers belongs to the attorney and must happen before release."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a translated police report says \"the suspect denied the charges,\" but the Spanish original says \"se negó a declarar.\" What should staff do?", "opts": ["Correct the translation to \"declined to make a statement\" and flag the error to the attorney", "Delete the Spanish original from the file", "Leave it, because both phrases mean the same thing in a police report", "Ask the client which version he prefers"], "a": 0, "fb": "Audit skill: A translation error can change the legal meaning of evidence."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: the client's file says \"deferred adjudication — no conviction, no immigration issues.\" What is wrong with this note?", "opts": ["Only that the note should be written in Spanish so the client can read it during his next office visit", "Only that deferred adjudication is called probation in every state", "Deferred adjudication can still count as a conviction for immigration purposes, so review is needed", "Nothing; deferred adjudication never has any consequences once the client completes the conditions"], "a": 2, "fb": "Audit skill: Staff must not record legal conclusions that may be wrong."}, {"cat": "Capstone: Defense File Audit", "stem": "Which is the best one-sentence oral briefing to the attorney?", "opts": ["\"I told Ruiz the jury will believe him, so he should not take the plea offer.\"", "\"State v. Ruiz: trial June 2; 90 minutes of body-cam left to review; lab report not received.\"", "\"Ruiz's mother called again and was upset.\"", "\"The Ruiz case is going fine, I guess, but I haven't looked at it closely in a while.\""], "a": 1, "fb": "Briefing skill: Case, date, what is outstanding."}, {"cat": "Capstone: Defense File Audit", "stem": "Three items arrive together: a client in custody with a hearing tomorrow and no interpreter requested, a request for a copy of an old invoice, and a discovery item to log. What comes first?", "opts": ["All three have equal priority", "Request the interpreter for tomorrow's hearing and alert the attorney", "The invoice copy, because the client's family needs it today", "The discovery log entry"], "a": 1, "fb": "Prioritization: Without an interpreter, tomorrow's hearing may not go forward fairly or at all."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a client on probation missed a required class last week. What should staff do?", "opts": ["Ignore it, because one missed class never matters", "Report the client to the probation officer without telling the attorney", "Tell the client to say he attended the class, since one absence is hard for anyone to check", "Inform the attorney promptly and help the client document the reason and reschedule"], "a": 3, "fb": "Audit skill: Early action can prevent a violation; the attorney decides how to address it."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a staff note says, \"Told client the expungement will fix his immigration case.\" What is the problem?", "opts": ["Only that the note does not include the date", "Only that the client should have been told in writing, with a copy of the signed expungement order attached to the letter", "No problem, because expungement always fixes immigration issues once the court signs the order", "Staff gave legal advice that is likely wrong; expungement generally does not remove immigration consequences"], "a": 3, "fb": "Audit skill: Wrong advice can cause real harm. Staff stay within role."}, {"cat": "Capstone: Defense File Audit", "stem": "File audit: a defendant's sister asks staff for a copy of the police reports and videos. What should staff do?", "opts": ["Give her the reports but not the videos", "Email the full discovery to the sister, because family members are allowed to see all the evidence", "Post the video online so the family can see it", "Do not share discovery without the attorney's approval; protective orders may apply"], "a": 3, "fb": "Audit skill: Discovery is often subject to restrictions. When in doubt, ask the attorney."}];
const COURSES = [{"code": "IL-CRIM-01", "name": "Criminal Defense English Foundations"}, {"code": "IL-CRIM-02", "name": "Acusatorio to U.S. Procedure"}, {"code": "IL-CRIM-03", "name": "Defense Intake, Jail Calls & Bond"}, {"code": "IL-CRIM-04", "name": "Arrest to Trial"}, {"code": "IL-CRIM-05", "name": "Discovery Management"}, {"code": "IL-CRIM-06", "name": "Pleas, Sentencing & Immigration"}, {"code": "IL-CRIM-07", "name": "Calendars, Software & Records"}, {"code": "IL-CRIM-08", "name": "Capstone: Defense File Audit"}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">This exam covers the core content of the ${COURSES.length}-course ${PATHWAY_NAME} pathway. Your results include a score for each course. ${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. You'll see the correct answer and rationale right after each question, and a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];
    const answered = given !== null || state.awaitingNext;

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div id="rationaleHolder"></div>
      <div class="navrow"><span></span><span></span></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(answered){
        if(idx === q.a) cls += " correct";
        else if(idx === given) cls += " incorrect";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    if(answered){
      const wasRight = given === q.a;
      document.getElementById("rationaleHolder").innerHTML = `
        <div class="rationale"><strong>${wasRight ? "Correct." : "Not quite."}</strong> ${q.fb}</div>
        <div class="navrow"><span></span><button class="btn gold" onclick="advance()">${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
      `;
    }
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${Math.round((s/(be-bs))*100)}%</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${Math.round(pct*100)}%</td></tr>
      </table>
      ${courseTableHtml(completed)}
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${Math.round(pct*100)}%${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}</div>
      </div>
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function courseBreakdown(completed){
  const rows = COURSES.map(c => ({ code: c.code, name: c.name, correct: 0, total: 0 }));
  QUESTIONS.slice(0, completed).forEach((q, i) => {
    const r = rows.find(x => x.name === q.cat);
    if(!r) return;
    r.total++;
    if(state.answers[i] !== null && state.answers[i] === q.a) r.correct++;
  });
  return rows.filter(r => r.total > 0).map(r => ({ ...r, percent: Math.round((r.correct / r.total) * 100) }));
}
function courseTableHtml(completed){
  const rows = courseBreakdown(completed);
  if(!rows.length) return "";
  const limit = Math.round(PASS_THRESHOLD * 100);
  const below = rows.filter(r => r.percent < limit);
  return `
      <div class="section-label">Score by course</div>
      <div class="section-note">Each question maps to one of the ${COURSES.length} courses in the ${PATHWAY_NAME} pathway. Courses below ${limit}% are where the pathway will add the most for you.</div>
      <table class="results"><tr><th>Course</th><th>Score</th><th>%</th></tr>${rows.map(r =>
        `<tr><td><span class="coursecode">${r.code}</span>${r.name}</td><td>${r.correct} / ${r.total}</td><td class="${r.percent < limit ? "below" : ""}">${r.percent}%</td></tr>`).join("")}
      </table>
      ${below.length ? `<div class="footer-note"><strong>Recommended starting points:</strong> ${below.map(r => r.code).join(", ")}.</div>` : `<div class="footer-note">You scored at or above ${limit}% in every course you completed.</div>`}`;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${Math.round((s/(be-bs))*100)}%)`);
  }
  lines.push("");
  lines.push("SCORE BY COURSE");
  courseBreakdown(completed).forEach(r => lines.push(`${r.code} ${r.name}: ${r.correct}/${r.total} (${r.percent}%)`));
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${Math.round(pct*100)}%) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();
</script>
