    document.getElementById("barInner").style.width = Math.round((be/TOTAL)*100) + "%";
    const bScore = scoreBetween(bs, be);
    const bMax = be - bs;
    const bPct = Math.round((bScore/bMax)*100);
    card.innerHTML = `
      <h2>Batch ${bn} of ${NUM_BATCHES} complete</h2>
      <div class="scorebox">
        <div class="cell"><div class="num">${bScore}/${bMax}</div><div class="lbl">This batch</div></div>
        <div class="cell"><div class="num">${bPct}%</div><div class="lbl">Batch score</div></div>
      </div>
      <div class="navrow">
        ${bn < NUM_BATCHES ? '<button class="btn ghost" onclick="stopNow()">Stop here and see my results</button>' : '<span></span>'}
        <button class="btn gold" onclick="continueAfterBatch()">${bn < NUM_BATCHES ? "Continue to next batch" : "See final results"}</button>
      </div>
    `;
    return;
  }

  if(state.screen === "final"){
    progressShell.style.display = "none";
    const completed = state.completedCount || TOTAL;
    const partial = completed < TOTAL;
    const score = scoreBetween(0, completed);
    const pct = score / completed;
    const passed = pct >= PASS_THRESHOLD;
    const rows = [];
    const fullBatches = Math.floor(completed / BATCH_SIZE);
    for(let bn=1; bn<=fullBatches; bn++){
      const [bs,be] = batchBounds(bn);
      const s = scoreBetween(bs,be);
      rows.push(`<tr><td>Batch ${bn} (Q${bs+1}&ndash;${be})</td><td>${s} / ${be-bs}</td><td>${fmtPct(s/(be-bs))}</td></tr>`);
    }
    card.innerHTML = `
      <h1>${partial ? "Exam Stopped Early — Provisional Results" : "Exam Complete"}</h1>
      <div class="sub">${state.candidate.name || "Candidate"}${state.candidate.email ? " &middot; " + state.candidate.email : ""} &middot; ${completed} of ${TOTAL} questions completed</div>
      <table class="results"><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows.join("")}
        <tr><td><strong>${partial ? "Overall so far" : "Overall"}</strong></td><td>${score} / ${completed}</td><td>${fmtPct(pct)}</td></tr>
      </table>
      ${courseTableHtml(completed)}
      <div class="placement">
        <div class="headline">${TIER_LABEL} — ${passed ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""}</div>
        <div>Passing threshold is ${Math.round(PASS_THRESHOLD*100)}%. You scored ${fmtPct(pct)}${partial ? " based on " + completed + " of " + TOTAL + " questions." : "."}${passed ? "" : " " + shortBy(score, completed)}</div>
      </div>
      ${certCardForExam(completed, partial, passed, score, pct)}
      ${nextStepHTML(completed, passed)}
      ${discountHTML()}
      ${shareHTML(fmtPct(pct))}
      ${reviewHTML(completed)}
      <div class="navrow">
        <button class="btn ghost" onclick="downloadResults()">Download my results</button>
        ${partial ? '<button class="btn gold" onclick="resumeExam()">Keep going</button>' : '<span></span>'}
      </div>
      <div class="synctag" id="syncTag">${RESULTS_WEBHOOK_URL ? "Submitting your results..." : ""}</div>
      <div class="footer-note">${RESULTS_WEBHOOK_URL ? "Results and feedback will also be emailed to you shortly." : "Please use Download my results to keep a copy for your records."}</div>
    `;
    if(RESULTS_WEBHOOK_URL){ submitResults(score, pct, passed); }
    return;
  }
}

function courseBreakdown(completed){
  const rows = COURSES.map(c => ({ code: c.code, name: c.name, correct: 0, total: 0 }));
  QUESTIONS.slice(0, completed).forEach((q, i) => {
    const r = rows.find(x => x.name === q.cat);
    if(!r) return;
    r.total++;
    if(state.answers[i] !== null && state.answers[i] === q.a) r.correct++;
  });
  return rows.filter(r => r.total > 0).map(r => ({ ...r, percent: Math.round((r.correct / r.total) * 100) }));
}
function courseTableHtml(completed){
  const rows = courseBreakdown(completed);
  if(!rows.length) return "";
  const limit = Math.round(PASS_THRESHOLD * 100);
  const below = rows.filter(r => r.percent < limit);
  return `
      <div class="section-label">Score by course</div>
      <div class="section-note">Each question maps to one of the ${COURSES.length} courses in the ${PATHWAY_NAME} pathway. Courses below ${limit}% are where the pathway will add the most for you.</div>
      <table class="results"><tr><th>Course</th><th>Score</th><th>%</th></tr>${rows.map(r =>
        `<tr><td><span class="coursecode">${r.code}</span>${r.name}</td><td>${r.correct} / ${r.total}</td><td class="${r.percent < limit ? "below" : ""}">${r.percent}%</td></tr>`).join("")}
      </table>
      ${below.length ? `<div class="footer-note"><strong>Recommended starting points:</strong> ${below.map(r => r.code).join(", ")}.</div>` : `<div class="footer-note">You scored at or above ${limit}% in every course you completed.</div>`}`;
}

function shortBy(score, completed){
  const need = Math.ceil(PASS_THRESHOLD*completed - 1e-9) - score;
  return need > 0 ? "You were " + need + " correct answer" + (need === 1 ? "" : "s") + " short of passing." : "";
}
function topicStats(completed){
  const map = {}; const order = [];
  for(let i=0;i<completed;i++){
    const c = QUESTIONS[i].cat;
    if(!map[c]){ map[c] = {cat:c, right:0, total:0}; order.push(c); }
    map[c].total++; if(state.answers[i] === QUESTIONS[i].a) map[c].right++;
  }
  return order.map(c => map[c]);
}
const DISCOUNT_CODE = "EXAM10";
const DISCOUNT_PCT = 10;
const DISCOUNT_DAYS = 7;
const COURSES_URL = "https://www.ingleslegal.com/courses";
const EXAM_URL = "https://ingleslegal-hub.github.io/ingleslegal-exam/pathways/immigration-exam.html";
const EXAM_NAME = TIER_LABEL + " exam";
function copyText(text, btn, label){
  const done = () => { if(!btn) return; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1800); };
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
}
function discountHTML(){
  const until = new Date(Date.now() + DISCOUNT_DAYS*24*60*60*1000);
  const d = until.toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"});
  return `<div class="offer">
    <div class="tagline">Exam taker offer</div>
    <div class="headline">${DISCOUNT_PCT}% off any Ingles Legal course</div>
    <p>Use this code at checkout within the next ${DISCOUNT_DAYS} days, until <strong>${d}</strong>.</p>
    <div class="coderow"><code>${DISCOUNT_CODE}</code><button type="button" class="btn gold" onclick="copyText(DISCOUNT_CODE, this, 'Copy code')">Copy code</button></div>
  </div>`;
}
function shareText(pctText){ return "I scored " + pctText + " on the " + EXAM_NAME + " at Ingles Legal. Try it free: " + EXAM_URL; }
function inviteText(){ return "I just took the free " + EXAM_NAME + " from Ingles Legal and thought you might want to try it: " + EXAM_URL; }
let _sharePct = "";
function doShare(btn){
  const text = shareText(_sharePct);
  if(navigator.share){ navigator.share({ title: "Ingles Legal - " + EXAM_NAME, text: text, url: EXAM_URL }).catch(() => {}); }
  else { copyText(text, btn, "Share"); }
}
function shareHTML(pctText){
  _sharePct = pctText;
  const wa = "https://wa.me/?text=" + encodeURIComponent(shareText(pctText));
  const mail = "mailto:?subject=" + encodeURIComponent("Free legal English exam from Ingles Legal") + "&body=" + encodeURIComponent(inviteText());
  return `<div class="sharebox">
    <div class="headline">Share your result</div>
    <p>Know a colleague learning legal English? Invite them to take the exam.</p>
    <div class="sharerow">
      <button type="button" class="btn gold" onclick="doShare(this)">Share</button>
      <a class="btn ghost" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn ghost" href="${mail}">Email a colleague</a>
    </div>
  </div>`;
}
function nextStepHTML(completed, passed){
  const limit = Math.round(PASS_THRESHOLD * 100);
  const weak = courseBreakdown(completed).filter(r => r.percent < limit).sort((a,b) => a.percent - b.percent).slice(0,3);
  let body;
  if(passed){
    body = "Great work. You are ready to apply the " + PATHWAY_NAME + " skills in real case work. Explore our courses to keep growing.";
  } else if(weak.length){
    body = "Start with: <strong>" + weak.map(r => r.code + " " + r.name).join(", ") + "</strong>. Review the answers below, then retake this exam to measure your progress.";
  } else {
    body = "Review the answers below, then retake this exam to measure your progress.";
  }
  return `<div class="nextstep"><div class="headline">Your next step</div><p>${body}</p><a class="btn gold" href="${COURSES_URL}" target="_blank" rel="noopener">Explore Ingles Legal courses</a></div>`;
}
function filterReview(v){
  document.querySelectorAll(".review .rv").forEach(el => { el.style.display = (!v || el.dataset.cat === v) ? "" : "none"; });
}
function reviewItem(q, i){
  const given = state.answers[i];
  const ok = given === q.a;
  const L = n => String.fromCharCode(65+n);
  return `<div class="rv ${ok ? "ok" : ""}" data-cat="${q.cat}">
    <div class="rq">Question ${i+1} &middot; ${q.cat}</div>
    <div class="rs">${q.stem}</div>
    ${ok ? "" : `<div class="ra bad"><strong>Your answer:</strong> ${given === null ? "Skipped" : L(given) + ". " + q.opts[given]}</div>`}
    <div class="ra good"><strong>${ok ? "Your answer (correct):" : "Correct answer:"}</strong> ${L(q.a)}. ${q.opts[q.a]}</div>
    <div class="rationale">${q.fb}</div>
  </div>`;
}
function reviewHTML(completed){
  const missed = [], right = [];
  for(let i=0;i<completed;i++){ (state.answers[i] === QUESTIONS[i].a ? right : missed).push(i); }
  const cats = topicStats(completed).map(t => t.cat);
  let html = '<div class="review"><h2>Answer review</h2>';
  if(cats.length > 1){
    html += '<div class="filterrow">Filter by topic:<select onchange="filterReview(this.value)"><option value="">All topics</option>' + cats.map(c => '<option value="' + c.replace(/"/g,"&quot;") + '">' + c + '</option>').join("") + '</select></div>';
  }
  if(missed.length){
    html += `<p class="sub">Questions to review (${missed.length})</p>` + missed.map(i => reviewItem(QUESTIONS[i], i)).join("");
  } else {
    html += '<p class="sub">You answered every question correctly.</p>';
  }
  if(right.length){
    html += `<details class="rvgroup"><summary>Questions you answered correctly (${right.length})</summary>` + right.map(i => reviewItem(QUESTIONS[i], i)).join("") + "</details>";
  }
  return html + "</div>";
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const currentBatch = state.screen === "batchEnd" ? state._justFinishedBatch : batchOfIndex(state.qIndex);
  let html = "";
  for(let b=1; b<=NUM_BATCHES; b++){
    let cls = "tab";
    if(b < currentBatch || (state.screen === "batchEnd" && b <= currentBatch)) cls += " done";
    else if(b === currentBatch && state.screen !== "batchEnd") cls += " active";
    html += `<div class="${cls}">Batch ${b}</div>`;
  }
  tabs.innerHTML = html;
}

function beginExam(){
  state.candidate.name = document.getElementById("inName").value.trim();
  state.candidate.email = document.getElementById("inEmail").value.trim();
  state.startedAt = new Date().toISOString();
  state.screen = "question";
  state.qIndex = 0;
  render();
}
function selectAnswer(idx){
  state.answers[state.qIndex] = idx;
  render();
}
function advance(){
  if(state.answers[state.qIndex] === null) return;
  const finishedIndex = state.qIndex;
  const isLastInBatch = (finishedIndex + 1) % BATCH_SIZE === 0 || finishedIndex + 1 === TOTAL;
  if(isLastInBatch){
    state._justFinishedBatch = batchOfIndex(finishedIndex);
    sendBatch(state._justFinishedBatch);
    state.screen = "batchEnd";
  } else {
    state.qIndex = finishedIndex + 1;
    state.screen = "question";
  }
  render();
}
function continueAfterBatch(){
  if(state._justFinishedBatch >= NUM_BATCHES){
    state.completedCount = TOTAL;
    state.stoppedEarly = false;
    state.screen = "final";
  }
  else { state.qIndex = state._justFinishedBatch * BATCH_SIZE; state.screen = "question"; }
  render();
}

function stopNow(){
  state.completedCount = batchBounds(state._justFinishedBatch)[1];
  state.stoppedEarly = true;
  state.screen = "final";
  render();
}

function resumeExam(){
  state.qIndex = Math.min(state.completedCount, TOTAL - 1);
  state.screen = "question";
  render();
}

function batchSummary(){
  const out = [];
  for(let bn = 1; bn <= NUM_BATCHES; bn++){
    const [bs, be] = batchBounds(bn);
    if(state.answers[be - 1] === null) break;
    const s = scoreBetween(bs, be);
    out.push({ batch: bn, score: s, total: be - bs, percent: Math.round((s / (be - bs)) * 100) });
  }
  return out;
}

function sendBatch(bn){
  if(!RESULTS_WEBHOOK_URL) return;
  const b = batchSummary().find(x => x.batch === bn);
  if(!b) return;
  fetch(RESULTS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      type: "batch", tier: TIER_LABEL,
      name: state.candidate.name, email: state.candidate.email,
      ...b, startedAt: state.startedAt, completedAt: new Date().toISOString()
    })
  }).catch(() => {});
}

async function submitResults(score, pct, passed){
  try{
    const payload = {
      type: "final", tier: TIER_LABEL, name: state.candidate.name, email: state.candidate.email,
      batches: batchSummary(),
      startedAt: state.startedAt, completedAt: new Date().toISOString(),
      score, total: TOTAL, percent: Math.round(pct*1000)/10, passed,
      answers: QUESTIONS.map((q,i) => ({ cat: q.cat, given: state.answers[i], correct: q.a }))
    };
    const res = await fetch(RESULTS_WEBHOOK_URL, {
      method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload)
    });
    document.getElementById("syncTag").textContent = res.ok ? "Results submitted." : "Could not submit automatically — please use Download and send manually.";
  } catch(e){
    const tag = document.getElementById("syncTag");
    if(tag) tag.textContent = "Could not submit automatically — please use Download and send manually.";
  }
}

function downloadResults(){
  const completed = state.completedCount || TOTAL;
  const partial = completed < TOTAL;
  const score = scoreBetween(0, completed); const pct = score/completed;
  let lines = [];
  lines.push(`INGLESLEGAL ${TIER_LABEL.toUpperCase()} EXAM — RESULTS` + (partial ? " (PARTIAL — STOPPED EARLY)" : ""));
  lines.push("==========================================");
  lines.push("Candidate: " + (state.candidate.name || "(not provided)"));
  lines.push("Email: " + (state.candidate.email || "(not provided)"));
  lines.push("Started: " + state.startedAt);
  lines.push("Completed: " + new Date().toISOString());
  lines.push("Questions completed: " + completed + " of " + TOTAL);
  lines.push("");
  const fullBatches = Math.floor(completed / BATCH_SIZE);
  for(let bn=1; bn<=fullBatches; bn++){
    const [bs,be] = batchBounds(bn);
    const s = scoreBetween(bs,be);
    lines.push(`Batch ${bn} (Q${bs+1}-${be}): ${s}/${be-bs} (${fmtPct(s/(be-bs))})`);
  }
  lines.push("");
  lines.push("SCORE BY COURSE");
  courseBreakdown(completed).forEach(r => lines.push(`${r.code} ${r.name}: ${r.correct}/${r.total} (${r.percent}%)`));
  lines.push("");
  lines.push(`OVERALL: ${score}/${completed} (${fmtPct(pct)}) — ${pct>=PASS_THRESHOLD ? "PASSED" : "Not yet passing"}${partial ? " (provisional)" : ""} (threshold ${Math.round(PASS_THRESHOLD*100)}%)`);
  lines.push("");
  lines.push("DETAILED ANSWERS");
  QUESTIONS.slice(0, completed).forEach((q,i) => {
    const given = state.answers[i];
    const givenLetter = given === null ? "SKIPPED" : String.fromCharCode(65+given);
    const correctLetter = String.fromCharCode(65+q.a);
    lines.push(`Q${i+1} [${q.cat}] — Given: ${givenLetter} | Correct: ${correctLetter} | ${given===q.a?"CORRECT":"INCORRECT"}`);
    if(given !== q.a){
      lines.push("   " + q.stem.replace(/\s+/g," "));
      lines.push("   Correct answer: " + correctLetter + ". " + q.opts[q.a]);
      lines.push("   Explanation: " + q.fb);
    }
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.candidate.name || "candidate").replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `Ingleslegal_${TIER_LABEL.replace(/\s+/g,"_")}_${safeName}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Progress saving + leave warning ----
const SAVE_KEY = "ingleslegal_" + TIER_LABEL.replace(/\s+/g, "_");
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.screen === "question" || s.screen === "batchEnd") && Array.isArray(s.answers) && s.answers.length === TOTAL) return s;
  }catch(e){}
  return null;
}

window.addEventListener("beforeunload", e => {
  if(state.screen === "question" || state.screen === "batchEnd"){
    e.preventDefault(); e.returnValue = "";
  }
});

const saved = loadProgress();
if(saved && confirm("You have an exam in progress (question " + (saved.qIndex + 1) + " of " + TOTAL + "). Resume where you left off?")){
  state = saved;
} else {
  clearProgress();
}
render();

  if(on){ const h = rep.offsetHeight || 1476; rep.style.zoom = String(Math.min(794/820, 1070/h)); }
  else { rep.style.zoom = ""; certZoomToScreen(); }
}
function certZoomToScreen(){
  const rep = document.querySelector("#certOverlay .il-rep"); if(!rep) return;
  rep.style.zoom = String(Math.min(1, (window.innerWidth - 24) / 820));
}
window.addEventListener("beforeprint", () => certFit(true));
window.addEventListener("afterprint", () => certFit(false));
window.addEventListener("resize", certZoomToScreen);

function openCertificate(thenPrint){
  if(!_certD) return;
  certInjectStyles();
  closeCertificate();
  const o = document.createElement("div"); o.id = "certOverlay";
  o.innerHTML = `<div class="certbar"><button type="button" class="${_certD.btn.gold}" onclick="printCertificate()">Save as PDF / Print</button><button type="button" class="${_certD.btn.ghost}" onclick="downloadCertificateFile()">Download file</button><button type="button" class="${_certD.btn.ghost}" onclick="closeCertificate()">Close</button></div><div class="certscroll">${certReportHTML(_certD)}</div>`;
  document.body.appendChild(o); document.body.style.overflow = "hidden"; certZoomToScreen();
  if(thenPrint) setTimeout(printCertificate, 350);
}
function closeCertificate(){
  const o = document.getElementById("certOverlay"); if(o) o.remove();
  document.body.style.overflow = "";
}
function printCertificate(){ try{ window.print(); }catch(e){ alert("Printing is blocked here. Use Download file, then open it and print or save as PDF."); } }
function downloadCertificateFile(){
  if(!_certD) return;
  const html = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingles Legal Certificate ' + _certD.id + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">'
    + '<style>body{margin:0;background:#cfc8bb;padding:24px}' + CERT_CSS + '@page{size:A4 portrait;margin:0}@media print{body{background:#fff;padding:0}.il-rep{zoom:.74;margin:0 auto}}</style></head><body>'
    + certReportHTML(_certD) + '</body></html>';
  const blob = new Blob([html], {type:"text/html"}), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "Ingleslegal_Certificate_" + _certD.id + ".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function certRegister(D, webhookUrl){
  if(!webhookUrl) return;
  fetch(webhookUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({
    type:"certificate", id:D.id, kind:D.kind, name:D.name, email:D.email, exam:D.exam, level:D.level,
    percent:D.pct, correct:D.correct, total:D.total, issuedAt:new Date().toISOString()
  })}).catch(() => {});
}
/* Shows the results-screen card and registers the certificate once. D must be complete. */
function certCardHTML(D, webhookUrl){
  certInjectStyles();
  _certD = D;
  if(!D._registered){ D._registered = true; certRegister(D, webhookUrl); }
  return `<div class="certcard"><div class="ct">Certificate of Passing</div><div class="headline">Your certificate is ready</div>
    <p>You passed with <strong>${D.pct}%</strong>. Open your skills report with your strongest areas and next opportunities, save it as a PDF, or share it.</p>
    <div class="certrow"><button type="button" class="${D.btn.gold}" onclick="openCertificate()">View certificate</button><button type="button" class="${D.btn.ghost}" onclick="openCertificate(true)">Save as PDF</button></div>
    <div class="certidline">Certificate ID: ${D.id}</div></div>`;
}
function certPct1(c, t){ return Math.round(c / t * 1000) / 10; }

/* ---- Exam-specific certificate data (tier and pathway exams) ---- */
function certBuildExamData(completed, score, pct){
  const isPath = typeof PATHWAY_NAME !== "undefined";
  const mk = (n, c, t) => ({ n: n, c: c, t: t, p: certPct1(c, t) });
  const skills = isPath
    ? courseBreakdown(completed).map(r => mk(r.name, r.correct, r.total))
    : topicStats(completed).map(t => mk(t.cat, t.right, t.total));
  const sorted = skills.slice().sort((a, b) => b.p - a.p);
  const num = parseInt((TIER_LABEL.match(/\d+/) || ["1"])[0], 10);
  let pathway, why, prefix, exam, level;
  if(isPath){
    prefix = (COURSES[0].code.split("-")[1]) || "PW";
    exam = PATHWAY_NAME + " Pathway Exam";
    level = COURSES.length + "-Course Bilingual Pathway";
    pathway = PATHWAY_NAME;
    const low = sorted.slice(-2).reverse().map(s => s.n);
    why = low.length ? "Next, deepen: " + low.join(" and ") + "." : "Keep building your skills in this pathway.";
  } else {
    prefix = "T" + num;
    exam = TIER_LABEL + " Certification Exam";
    level = (["Foundation", "Intermediate", "Advanced"][num - 1] || "Legal") + " Legal English";
    const rec = recommendPathways(completed)[0];
    pathway = PATHWAYS[rec.key].name;
    why = PATHWAYS[rec.key].blurb;
  }
  if(!state._certId) state._certId = certNewId(prefix);
  return {
    id: state._certId, kind: isPath ? "pathway" : "tier",
    name: state.candidate.name || "Candidate", email: state.candidate.email || "",
    exam: exam, level: level, date: certDate(),
    pct: Math.round(pct * 1000) / 10, correct: score, total: completed,
    topLabel: isPath ? "Strongest courses" : "Strongest skills",
    snapLabel: isPath ? "Score by course" : "Skills snapshot",
    skills: skills, pathway: pathway, pathwayWhy: why,
    offerUntil: certDate(new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)),
    btn: { gold: "btn gold", ghost: "btn ghost" }
  };
}
function certCardForExam(completed, partial, passed, score, pct){
  if(partial || !passed) return "";
  if(!state._certD){ state._certD = certBuildExamData(completed, score, pct); }
  return certCardHTML(state._certD, RESULTS_WEBHOOK_URL);
}
</script>
