<!DOCTYPE html>
<html lang="en">
<head>

<title>Ingleslegal — Immigration Pathway Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --aubergine:#2A1B33; --gold:#C9A96E; --cream:#F1EBDE; --bronze:#A9713F;
    --panel-line:#6E5A79; --lifted-aubergine:#503A5C; --light-section:#FBF8F1;
    --body-on-light:#6B5F62; --ok:#2f6f4f; --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--light-section); color:var(--body-on-light); font-family:"Spectral", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .topbar{ background:var(--aubergine); color:var(--cream); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .wordmark{ font-family:"Archivo", Arial, sans-serif; font-weight:600; letter-spacing:-0.01em; font-size:19px; }
  .wordmark .ingles{ color:var(--gold); } .wordmark .legal{ color:var(--cream); }
  .tag{ font-size:11px; color:#B9AAC4; font-family:"Archivo", Arial, sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{ max-width:740px; margin:0 auto; padding:28px 20px 60px; }
  .card{ background:#fff; border:1px solid rgba(110,90,121,.18); border-radius:3px; padding:32px 30px; box-shadow:0 1px 3px rgba(42,27,51,.06); }
  h1{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--lifted-aubergine); letter-spacing:-0.01em;}
  h2{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:19px; margin:0 0 14px; color:var(--lifted-aubergine); }
  .sub{ font-family:"Archivo", Arial, sans-serif; color:var(--body-on-light); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .progress-shell{ max-width:740px; margin:0 auto; padding:14px 20px 0; font-family:"Archivo", Arial, sans-serif; }
  .tabs{ display:flex; gap:4px; margin-bottom:6px; }
  .tab{ flex:1; text-align:center; font-size:11px; padding:6px 2px; border-radius:2px 2px 0 0; color:var(--panel-line); background:#efe9db; letter-spacing:.4px; font-weight:600; }
  .tab.active{ background:var(--aubergine); color:var(--cream); }
  .tab.done{ background:var(--gold); color:var(--aubergine); }
  .bar-outer{ height:6px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar-inner{ height:100%; background:linear-gradient(90deg, var(--aubergine), var(--gold)); width:0%; transition:width .25s ease; }
  .qmeta{ font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:12px; color:var(--bronze); margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase;}
  .stem{ font-family:"Spectral", Georgia, serif; font-size:18px; line-height:1.55; margin-bottom:22px; color:var(--lifted-aubergine); white-space:pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background:#fffdf9; border:1.5px solid rgba(110,90,121,.25); border-radius:3px; padding:14px 16px; margin-bottom:10px; font-family:"Archivo", Arial, sans-serif; font-size:15px; cursor:pointer; transition:.12s; color:var(--body-on-light); }
  .opt:hover:not(:disabled){ border-color:var(--gold); background:#fff; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:#eef6f1; color:#1f4d38; }
  .opt.incorrect{ border-color:var(--bad); background:#f9eeec; color:#7a2c1e; }
  .opt.selected{ border-color:var(--gold); background:#faf3e4; color:var(--lifted-aubergine); box-shadow:0 0 0 1px var(--gold) inset; }
  .review h2{ margin-top:26px; }
  .rv{ border:1px solid rgba(110,90,121,.2); border-left:4px solid var(--bad); border-radius:3px; padding:14px 16px; margin:0 0 12px; font-family:"Archivo", Arial, sans-serif; background:#fff; }
  .rv.ok{ border-left-color:var(--ok); }
  .rv .rq{ font-size:12px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
  .rv .rs{ font-family:"Spectral", Georgia, serif; font-size:16px; line-height:1.5; color:var(--lifted-aubergine); margin-bottom:10px; white-space:pre-wrap; }
  .rv .ra{ font-size:14px; line-height:1.5; margin:3px 0; }
  .rv .ra.bad{ color:#7a2c1e; } .rv .ra.good{ color:#1f4d38; }
  .rv .rationale{ margin:10px 0 0; }
  details.rvgroup > summary{ cursor:pointer; font-family:"Archivo", Arial, sans-serif; font-weight:600; color:var(--lifted-aubergine); margin:8px 0 12px; }
  .opt .letter{ display:inline-block; width:22px; font-weight:600; color:var(--bronze); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-family:"Archivo", Arial, sans-serif;}
  .btn{ background:var(--aubergine); color:var(--cream); border:none; padding:12px 22px; border-radius:3px; font-family:"Archivo", Arial, sans-serif; font-weight:500; font-size:14px; cursor:pointer; letter-spacing:.3px; }
  .btn:hover{ background:var(--lifted-aubergine); }
  .btn.gold{ background:var(--gold); color:var(--aubergine); }
  .btn.gold:hover{ background:#d9bd8a; }
  .btn:disabled{ background:#d8d2c8; color:#8a8a8a; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--aubergine); border:1.5px solid var(--aubergine); }
  .field{ margin-bottom:14px; font-family:"Archivo", Arial, sans-serif; }
  .field label{ display:block; font-size:13px; color:var(--body-on-light); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1.5px solid rgba(110,90,121,.3); border-radius:3px; font-size:15px; font-family:"Archivo", Arial, sans-serif; }
  .banner{ background:var(--aubergine); color:var(--cream); padding:16px 20px; border-radius:3px; margin-bottom:20px; font-family:"Archivo", Arial, sans-serif; font-size:14px; line-height:1.5; }
  .rationale{ background:var(--light-section); border-left:3px solid var(--gold); border-radius:3px; padding:14px 16px; margin:16px 0; font-family:"Archivo", Arial, sans-serif; font-size:13.5px; line-height:1.55; color:var(--lifted-aubergine); }
  .rationale strong{ color:var(--bronze); }
  .scorebox{ display:flex; gap:14px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .scorebox .cell{ flex:1; background:var(--light-section); border:1px solid rgba(110,90,121,.2); border-radius:3px; padding:14px; text-align:center; }
  .scorebox .num{ font-family:"Archivo", Arial, sans-serif; font-size:26px; font-weight:600; color:var(--lifted-aubergine); }
  .scorebox .lbl{ font-size:11px; color:var(--bronze); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  table.results{ width:100%; border-collapse:collapse; font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:16px 0; }
  table.results th, table.results td{ border:1px solid rgba(110,90,121,.2); padding:8px 10px; text-align:left; }
  table.results th{ background:var(--aubergine); color:var(--cream); font-size:11px; text-transform:uppercase; font-weight:500; }
  table.results tr:nth-child(even) td{ background:var(--light-section); }
  .placement{ background:var(--aubergine); color:var(--cream); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; }
  .placement .headline{ font-weight:600; color:var(--gold); font-size:16px; margin-bottom:4px; }
  .footer-note{ font-family:"Archivo", Arial, sans-serif; font-size:12px; color:var(--body-on-light); margin-top:18px; line-height:1.5; }
  .synctag{ font-family:"Archivo", Arial, sans-serif; font-size:11px; color:var(--panel-line); margin-top:8px; }
  table.results td.below{ color:var(--bad); font-weight:600; }
  .coursecode{ color:var(--bronze); font-weight:600; margin-right:6px; }
  .section-label{ font-family:"Archivo", Arial, sans-serif; font-weight:600; font-size:15px; color:var(--lifted-aubergine); margin:22px 0 4px; }
  .section-note{ font-family:"Archivo", Arial, sans-serif; font-size:12.5px; color:var(--body-on-light); margin:0 0 4px; line-height:1.5; }
  .topics td.bartd{ width:34%; }
  .bar{ height:8px; background:#efe9db; border-radius:4px; overflow:hidden; }
  .bar span{ display:block; height:100%; background:var(--gold); }
  .bar.low span{ background:var(--bad); }
  .nextstep{ border:1px solid rgba(110,90,121,.3); border-left:3px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:var(--light-section); }
  .nextstep .headline{ font-weight:600; font-size:16px; margin-bottom:6px; color:var(--lifted-aubergine); }
  .nextstep p{ margin:0 0 12px; font-size:14px; line-height:1.55; }
  .nextstep a.btn{ display:inline-block; text-decoration:none; }
  .filterrow{ font-family:"Archivo", Arial, sans-serif; font-size:13px; margin:0 0 14px; }
  .filterrow select{ margin-left:8px; padding:7px 10px; border-radius:3px; border:1.5px solid rgba(110,90,121,.3); font-family:inherit; font-size:13px; }
  body.results-dark{ background:#1E1226; }
  body.results-dark .card{ background:var(--aubergine); border-color:var(--panel-line); box-shadow:0 2px 12px rgba(0,0,0,.4); }
  body.results-dark h1, body.results-dark h2{ color:var(--gold); }
  body.results-dark .sub, body.results-dark .footer-note, body.results-dark .nextstep p, body.results-dark .filterrow{ color:var(--cream); }
  body.results-dark .synctag{ color:#B9AAC4; }
  body.results-dark table.results th{ background:#1E1226; color:var(--gold); }
  body.results-dark table.results td{ border-color:rgba(110,90,121,.55); color:var(--cream); background:transparent; }
  body.results-dark table.results tr:nth-child(even) td{ background:rgba(255,255,255,.04); }
  body.results-dark .bar{ background:rgba(255,255,255,.12); }
  body.results-dark .placement{ background:#1E1226; }
  body.results-dark .nextstep{ background:#1E1226; border-color:rgba(110,90,121,.55); border-left-color:var(--gold); }
  body.results-dark .nextstep .headline{ color:var(--gold); }
  body.results-dark .rv{ background:#33213D; border-color:rgba(110,90,121,.55); border-left-color:var(--bad); }
  body.results-dark .rv.ok{ border-left-color:var(--ok); }
  body.results-dark .rv .rq{ color:var(--gold); }
  body.results-dark .rv .rs{ color:var(--cream); }
  body.results-dark .rv .ra.bad{ color:#E29585; }
  body.results-dark .rv .ra.good{ color:#7FCBA5; }
  body.results-dark .rationale{ background:rgba(201,169,110,.1); color:var(--cream); }
  body.results-dark .rationale strong{ color:var(--gold); }
  body.results-dark details.rvgroup > summary{ color:var(--cream); }
  body.results-dark .btn.ghost{ color:var(--gold); border-color:var(--gold); }
  body.results-dark .btn.ghost:hover{ background:rgba(201,169,110,.12); }
  body.results-dark .filterrow select{ background:#1E1226; color:var(--cream); border-color:var(--panel-line); }
  .offer{ border:1.5px solid var(--gold); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:linear-gradient(135deg, rgba(201,169,110,.16), rgba(201,169,110,.04)); }
  .offer .tagline{ font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:4px; }
  .offer .headline{ font-size:20px; font-weight:600; color:var(--cream); margin-bottom:6px; }
  .offer p{ margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--cream); }
  .offer .coderow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .offer code{ font-family:"Courier New", monospace; font-size:20px; letter-spacing:2px; font-weight:700; color:var(--gold); border:1.5px dashed var(--gold); padding:8px 16px; border-radius:3px; background:#1E1226; }
  .sharebox{ border:1px solid rgba(110,90,121,.55); border-radius:3px; padding:18px 20px; margin:18px 0; font-family:"Archivo", Arial, sans-serif; background:#1E1226; }
  .sharebox .headline{ font-weight:600; font-size:16px; color:var(--gold); margin-bottom:6px; }
  .sharebox p{ margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--cream); }
  .sharerow{ display:flex; gap:10px; flex-wrap:wrap; }
  .sharerow a.btn{ display:inline-block; text-decoration:none; }
  .rec{ border-top:1px solid rgba(110,90,121,.55); padding-top:12px; margin-top:12px; }
  .rec .recname{ font-weight:600; color:var(--cream); font-size:15px; }
  .rec .recwhy{ font-size:13px; color:#B9AAC4; margin:2px 0 8px; }
  .rec p{ margin:0 0 10px; }
  .rec .pill{ display:inline-block; font-size:10px; letter-spacing:.6px; text-transform:uppercase; background:var(--gold); color:var(--aubergine); padding:2px 8px; border-radius:10px; margin-right:8px; font-weight:700; vertical-align:middle; }
  body.results-dark .section-label{ color:var(--gold); }
  body.results-dark .section-note{ color:var(--cream); }
  body.results-dark .coursecode{ color:var(--gold); }
  body.results-dark table.results td.below{ color:#E29585; }
  @media (max-width:600px){ .wrap{ padding:16px 12px 40px; } .card{ padding:22px 18px; } h1{ font-size:22px; } .stem{font-size:16px;} }
</style>

<script>
// ============================================================
// Immigration Pathway — 100 questions covering the 8 courses of the
// Immigration Support Specialist pathway (IL-IMM-01 to IL-IMM-08).
// ============================================================
const TIER_LABEL = "Immigration Pathway";
const PATHWAY_NAME = "Immigration Support Specialist";
const PASS_THRESHOLD = 0.75; // fraction, e.g. 0.75
const RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwYCnCr75l6BUDyPIxPD2sbl5NvgENQWT5JFpMreAlQmg5dI85SEeecneWUVzknyzxr/exec"; // set once the Apps Script webhook is deployed; leave blank to skip auto-submit

const QUESTIONS = [{"cat": "Immigration English Foundations", "stem": "Which agency decides most applications and petitions for immigration benefits, such as Form I-130 and Form I-485?", "opts": ["U.S. Immigration and Customs Enforcement (ICE)", "U.S. Customs and Border Protection (CBP)", "The Executive Office for Immigration Review (EOIR)", "U.S. Citizenship and Immigration Services (USCIS)"], "a": 3, "fb": "Agency map: USCIS, part of DHS, adjudicates benefit requests. EOIR (Department of Justice) runs the immigration courts, CBP works at the border and ports of entry, and ICE handles interior enforcement and detention."}, {"cat": "Immigration English Foundations", "stem": "A client says: \"I have a hearing with the immigration judge next month.\" Which body runs that court?", "opts": ["The Executive Office for Immigration Review (EOIR), part of the Department of Justice", "USCIS, through the local field office that schedules interviews and decides green card cases", "The U.S. Department of State, through the National Visa Center", "The federal district court for the county where the client lives"], "a": 0, "fb": "Agency map: Immigration judges work for EOIR inside the Department of Justice. They are administrative courts, not the federal district courts, and they are separate from USCIS."}, {"cat": "Immigration English Foundations", "stem": "A U.S. citizen files Form I-130 for her husband. In this petition she is the ____ and he is the ____.", "opts": ["petitioner; beneficiary", "applicant; derivative", "beneficiary; petitioner", "respondent; applicant"], "a": 0, "fb": "Key term: The person who files the petition is the petitioner; the relative who will benefit from it is the beneficiary. Mixing them up on forms and cover letters is a common, avoidable error."}, {"cat": "Immigration English Foundations", "stem": "In removal proceedings before an immigration judge, the noncitizen is called the:", "opts": ["plaintiff", "respondent", "petitioner", "defendant"], "a": 1, "fb": "Key term: Removal proceedings are civil, not criminal, so the noncitizen is the respondent, not a defendant. DHS is the opposing party, represented by ICE attorneys."}, {"cat": "Immigration English Foundations", "stem": "Which statement correctly distinguishes a visa from status?", "opts": ["A visa and status are the same thing, so when the visa in the passport expires, the person is automatically out of status and must leave.", "Status is issued by a consulate abroad; a visa is granted by USCIS inside the United States.", "A visa shows how long the person may stay; status only shows the purpose of the trip.", "A visa is a travel document used to request admission at a port of entry; status is the lawful category a person holds while in the U.S."], "a": 3, "fb": "Linguistic precision: Clients often think an expired visa means they are unlawfully present. The authorized stay is shown on the I-94, not on the visa foil, so staff should never equate the two."}, {"cat": "Immigration English Foundations", "stem": "Which record shows a nonimmigrant's admission and the date by which he or she must leave the United States?", "opts": ["Form I-797C, Notice of Action", "The Visa Bulletin entry for the person's country", "The visa foil in the passport", "Form I-94, Arrival/Departure Record"], "a": 3, "fb": "Key document: The I-94 records the admission, the class of admission and the admit-until date. The visa foil only allows the person to seek admission."}, {"cat": "Immigration English Foundations", "stem": "A client reads you this number from a notice: \"IOE0912345678\". What is it?", "opts": ["The client's A-Number, which identifies the person's immigration file permanently", "A visa number assigned by the Visa Bulletin", "An immigration court case number assigned when the Notice to Appear is filed", "A USCIS receipt number, used to track that filing online"], "a": 3, "fb": "Key term: USCIS receipt numbers have three letters followed by ten digits. An A-Number starts with \"A\" followed by eight or nine digits, and the immigration court tracks cases by A-Number."}, {"cat": "Immigration English Foundations", "stem": "What is an A-Number?", "opts": ["A temporary case number that USCIS assigns to each new application and replaces every time a new form is filed", "The Alien Registration Number DHS assigns to a noncitizen, which stays with that person across filings", "The appointment number printed on a biometrics notice", "The number on the attorney's notice of appearance (Form G-28)"], "a": 1, "fb": "Key term: The A-Number identifies the person's immigration file (the A-file). It is permanent, which is why staff must copy it exactly on every form and court filing."}, {"cat": "Immigration English Foundations", "stem": "Form I-797C, Notice of Action, is most commonly used to:", "opts": ["approve the application and grant the requested immigration status, such as permanent residence", "deny the application and explain the reasons", "confirm that USCIS received a filing or schedule an appointment such as biometrics", "order the client to appear before an immigration judge"], "a": 2, "fb": "Key document: An I-797C receipt or appointment notice states that it does not grant any status or benefit. Clients often believe a receipt is an approval; staff should explain the difference carefully."}, {"cat": "Immigration English Foundations", "stem": "A client receives a Request for Evidence (RFE). What is the best plain-English explanation for a support role to give?", "opts": ["The client must appear in court on the date printed on the notice.", "The case has been denied, and the client must start the whole process again by filing new forms and paying new fees.", "USCIS has approved the case and is only asking for an additional fee.", "USCIS needs more documents before it decides, and the deadline is strict, so the attorney will review it right away."], "a": 3, "fb": "Within role: An RFE asks for more evidence before a decision. Staff explain what the document is and route it to the attorney without predicting the outcome."}, {"cat": "Immigration English Foundations", "stem": "What happens at a USCIS biometrics appointment?", "opts": ["An officer interviews the applicant under oath about the merits of the case.", "An immigration judge reviews the applicant's identity documents.", "Fingerprints, a photograph and a signature are taken at an Application Support Center.", "A civil surgeon designated by USCIS performs the immigration medical exam and vaccinations."], "a": 2, "fb": "Key term: Biometrics are collected for identity and background checks. The medical exam (Form I-693) and the interview are separate steps."}, {"cat": "Immigration English Foundations", "stem": "Which description fits a lawful permanent resident (LPR)?", "opts": ["A green card holder who may live and work permanently in the United States", "A naturalized U.S. citizen who has received a U.S. passport and may vote in federal elections", "A person admitted on a B-2 tourist visa who may stay for six months and extend once", "A person whose asylum application is pending"], "a": 0, "fb": "Key term: An LPR holds a green card but is not yet a citizen. Naturalization is a later, separate process."}, {"cat": "Immigration English Foundations", "stem": "The file note says the client was \"paroled into the United States.\" In immigration English this means that:", "opts": ["the client was admitted as a lawful permanent resident at the border", "the client was released early from a criminal sentence and must now report regularly to a supervising officer", "DHS allowed the person to enter or remain temporarily without a formal admission", "the client overstayed a visa and must report to an officer"], "a": 2, "fb": "False friend inside English: Immigration parole is permission to be in the U.S. temporarily without an admission. It is unrelated to criminal parole, and confusing the two can alarm a client."}, {"cat": "Latin American Civil Documents", "stem": "Under USCIS rules, a document in Spanish submitted with an application must be accompanied by:", "opts": ["an apostille from the client's home country placed on both the Spanish original and the English translation", "a translation stamped by a notario público in the home country", "a summary translation of the key facts only", "a full English translation with the translator's certification of competence and accuracy"], "a": 3, "fb": "Rule anchor: 8 C.F.R. 103.2(b)(3) requires a complete English translation and a certification that the translator is competent to translate and that the translation is complete and accurate. Notarization is not required by that rule."}, {"cat": "Latin American Civil Documents", "stem": "A Colombian birth record lists the client as \"Juan Carlos Pérez Gómez.\" His U.S. bank records say \"Juan C. Perez.\" What is the best practice in the file?", "opts": ["Use whichever version appears on the most recent document in the file.", "Use only \"Juan C. Perez\" on every form, and remove the maternal surname from the translation of the birth record.", "Edit the birth record translation so it matches the bank records.", "Use the full legal name consistently and list variants such as \"Juan C. Perez\" as other names used."], "a": 3, "fb": "Identity consistency: Forms ask for other names used. A translation must never be altered to match other records; instead, the variants are disclosed and explained."}, {"cat": "Latin American Civil Documents", "stem": "In the name \"Juan Carlos Pérez Gómez,\" the surname \"Gómez\" is usually the:", "opts": ["paternal surname", "middle name", "married name", "maternal surname (second surname)"], "a": 3, "fb": "The Bridge: Spanish naming usually places the father's first surname first and the mother's first surname second. U.S. forms often treat the second surname as a middle name, which creates mismatches."}, {"cat": "Latin American Civil Documents", "stem": "A Mexican client gives you an \"acta de nacimiento.\" What is it?", "opts": ["A hospital discharge record for the newborn", "A notarized affidavit in which two witnesses describe the birth", "A birth certificate issued by the civil registry (Registro Civil)", "A baptismal certificate issued by the parish where the child was baptized"], "a": 2, "fb": "The Bridge: The acta de nacimiento from the Registro Civil is the primary civil record of birth. Church or hospital records are secondary evidence."}, {"cat": "Latin American Civil Documents", "stem": "What is the U.S. Department of State's Reciprocity Schedule used for in an immigration file?", "opts": ["Checking which civil documents exist in a country, what they are called and where to obtain them", "Checking the visa fees that are refunded to applicants whose cases are denied at the consulate in that country", "Checking the priority dates that are current for each country", "Checking which translators USCIS has approved for that country"], "a": 0, "fb": "Research tool: The Reciprocity Schedule lists, country by country, the available civil documents, their correct names and issuing authorities, and when a document is unavailable."}, {"cat": "Latin American Civil Documents", "stem": "A client's birth certificate cannot be obtained. What does USCIS generally expect instead?", "opts": ["A certified translation of the client's passport, which USCIS accepts in place of the birth record", "A personal statement written and signed by the client alone, explaining why the record cannot be found", "Proof that the record is unavailable, plus secondary evidence such as early school or religious records", "Nothing, because the requirement is waived automatically"], "a": 2, "fb": "Rule anchor: Under 8 C.F.R. 103.2(b)(2), the applicant shows that primary evidence does not exist or cannot be obtained and submits secondary evidence instead."}, {"cat": "Latin American Civil Documents", "stem": "If neither the primary record nor secondary evidence is available, USCIS regulations allow the applicant to submit:", "opts": ["an affidavit from the beneficiary alone, explaining in detail why neither the record nor any secondary evidence exists", "affidavits from two or more people who are not parties to the case and have direct personal knowledge of the event", "a declaration from the certified translator", "a letter from the attorney of record confirming the facts of the birth, signed under penalty of perjury and notarized"], "a": 1, "fb": "Rule anchor: 8 C.F.R. 103.2(b)(2)(i) permits affidavits from at least two persons with direct personal knowledge, explaining how they know the facts."}, {"cat": "Latin American Civil Documents", "stem": "What is an apostille?", "opts": ["A certificate that authenticates the origin of a public document for use in another Hague Apostille Convention country", "A certified English translation of a foreign civil document, prepared by a translator registered with the foreign ministry", "A court order from the home country that corrects an error in a civil record so it can be submitted to U.S. agencies", "A USCIS form that replaces a missing birth certificate"], "a": 0, "fb": "Key term: An apostille certifies the signature and seal on a public document. It does not translate or correct the document."}, {"cat": "Latin American Civil Documents", "stem": "A client provides a \"sentencia de divorcio\" from Ecuador. The best English name for it in the file index is:", "opts": ["divorce decree", "divorce sentence", "divorce allegation", "divorce petition"], "a": 0, "fb": "False friend: \"Sentencia\" is a court judgment. In English, \"sentence\" means a criminal punishment, so \"divorce sentence\" is wrong and confusing."}, {"cat": "Latin American Civil Documents", "stem": "Why do inconsistent dates and names across a client's documents matter?", "opts": ["They do not matter, because USCIS officers are instructed to ignore dates and spellings on foreign civil documents.", "Staff should quietly choose the most common version in the file and correct the others to match it before filing.", "They can lead to an RFE, credibility doubts at interview or a denial, so every mismatch is flagged for the attorney.", "They matter only when the client also has a criminal record."], "a": 2, "fb": "Risk control: Consistency is the core skill of this course. Staff document and flag discrepancies; the attorney decides how to explain or correct them."}, {"cat": "Latin American Civil Documents", "stem": "On a USCIS form, \"a.k.a.\" introduces:", "opts": ["the name used only in the person's home country", "the name of the person's authorized agent or legal representative", "another name the person uses or has used (\"also known as\")", "the name printed on the person's visa"], "a": 2, "fb": "Key term: A.k.a. means \"also known as.\" Listing every name used, including spelling variants and names after marriage, protects the client's credibility."}, {"cat": "Latin American Civil Documents", "stem": "A Guatemalan client's birth was registered 15 years after the birth (a late registration). How should staff handle it?", "opts": ["Leave it out of the package and file without any birth evidence.", "Flag it for the attorney, because additional evidence of the birth facts, such as early school or baptismal records, may be needed.", "Treat it exactly like a timely registration: late registrations carry the same weight, so no additional evidence or review is needed.", "Translate the registration date as if it were the date of birth, so that every document in the package shows one consistent date of birth."], "a": 1, "fb": "Evidence weight: Delayed registrations may receive less weight, so supporting evidence is often needed. The registration date and the birth date must never be confused in translation."}, {"cat": "Immigration Intake & Red Flags", "stem": "What does \"entry without inspection\" (EWI) mean?", "opts": ["The person came into the U.S. without being inspected and admitted or paroled at a port of entry.", "The person entered with a valid visa at an airport, but CBP never created an electronic I-94 record for the trip.", "The person was admitted lawfully with a visa and later fell out of status by staying past the I-94 date.", "The person was inspected at the border but not fingerprinted."], "a": 0, "fb": "Key term: EWI describes manner of entry. Whether the last entry was with inspection matters for options such as adjustment of status, so it must be recorded precisely."}, {"cat": "Immigration Intake & Red Flags", "stem": "Why does the intake build a complete timeline of every entry and exit?", "opts": ["It is only needed for clients who arrived in the last five years.", "The timeline is only required for naturalization cases, where the applicant must prove continuous residence.", "USCIS calculates the filing fee from the number of entries, so every trip abroad increases the total amount due.", "The manner of each entry and any periods of unlawful presence can change which options and bars apply."], "a": 3, "fb": "Risk control: Departures after unlawful presence can trigger bars, and the type of each entry affects eligibility. The attorney needs the full chronology before advising."}, {"cat": "Immigration Intake & Red Flags", "stem": "Generally, a person who accrues one year or more of unlawful presence and then leaves the U.S. faces a bar to returning for:", "opts": ["ten years", "six months", "three years", "a lifetime, in every case"], "a": 0, "fb": "Rule anchor: INA 212(a)(9)(B) provides a 3-year bar after more than 180 days but less than one year of unlawful presence, and a 10-year bar after one year or more, triggered by departure. Waivers may exist; the attorney evaluates them."}, {"cat": "Immigration Intake & Red Flags", "stem": "Which intake answer must be escalated to the attorney immediately?", "opts": ["The client has a valid passport from his home country that expires in less than six months.", "The client once told a border officer he was a U.S. citizen to be allowed in.", "The client prefers phone calls in Spanish.", "The client's spouse works in construction and is paid in cash by different employers."], "a": 1, "fb": "Red flag: A false claim to U.S. citizenship can make a person permanently inadmissible. Staff record the statement accurately and escalate it the same day."}, {"cat": "Immigration Intake & Red Flags", "stem": "A client says she was deported in 2015 and came back in 2017 without inspection. Why is this critical?", "opts": ["A prior removal followed by unlawful reentry can trigger serious bars and reinstatement of the old order, so the attorney must review it first.", "It matters only if she also has a criminal conviction, because removal orders without convictions expire after two years.", "It only changes the filing fee for her application, because USCIS charges an additional fee to anyone with a prior removal order on file.", "It is irrelevant if she has a U.S. citizen child."], "a": 0, "fb": "Red flag: Reentry after removal can lead to a permanent bar and reinstatement of removal. Filing anything without attorney review could expose the client to enforcement."}, {"cat": "Immigration Intake & Red Flags", "stem": "What is \"notario fraud\"?", "opts": ["Errors a notary public makes when stamping a certified translation", "A licensed attorney charging a flat fee for an immigration case instead of an hourly fee", "A USCIS certification program that authorizes notaries public to prepare immigration forms and represent clients at interviews and hearings", "People falsely claiming authority to give immigration legal advice, exploiting the fact that a Latin American notario is a lawyer"], "a": 3, "fb": "The Bridge: In the U.S., a notary public only witnesses signatures and cannot give legal advice. Many clients arrive after being harmed by \"notarios,\" so staff screen for prior filings prepared by them."}, {"cat": "Immigration Intake & Red Flags", "stem": "A client asks the bilingual assistant: \"Do I qualify for a green card through my son?\" The best response is:", "opts": ["\"Yes, all parents of U.S. citizens qualify automatically, so we can file the petition as soon as you pay.\"", "\"No, you need to wait ten years before you can apply.\"", "\"I'll note your question for the attorney, who will review your situation and advise you.\"", "\"Probably. I'll start filling out the forms for you tonight.\""], "a": 2, "fb": "Within role: Deciding eligibility is legal advice, which only the attorney (or an accredited representative) can give. Staff take the question and route it."}, {"cat": "Immigration Intake & Red Flags", "stem": "The client says: \"I was arrested once, but the case was dismissed.\" What should the intake record?", "opts": ["The arrest, its date, place and outcome, and a note to obtain the certified court disposition", "Only the phrase \"no criminal record\" in the summary", "Nothing, because a dismissed case never appears in background checks and never has to be disclosed on forms", "The client's opinion about whether the arrest was fair, and the name of the arresting officer if he remembers it"], "a": 0, "fb": "Risk control: Immigration forms ask about arrests, not only convictions. The attorney needs the disposition documents to evaluate the effect."}, {"cat": "Immigration Intake & Red Flags", "stem": "In the first part of an immigration intake, what does the attorney usually need most?", "opts": ["The client's preferred payment plan, billing address and the name of the person who referred them to the firm", "Identity, immigration history (entries, status, prior filings and removals) and any criminal history", "The names and employers of every relative living in the United States", "The client's social media passwords"], "a": 1, "fb": "Intake as risk control: Identity, immigration history and criminal history drive eligibility and risk. Other details can be collected later."}, {"cat": "Immigration Intake & Red Flags", "stem": "Which question is neutral, non-leading intake English?", "opts": ["\"How did you enter the United States the last time?\"", "\"You entered legally, right?\"", "\"Please tell me you had a visa.\"", "\"You didn't cross illegally, did you?\""], "a": 0, "fb": "Interview skill: Leading questions push the client toward an answer and can produce inaccurate records. Open, neutral questions get facts the attorney can rely on."}, {"cat": "Immigration Intake & Red Flags", "stem": "A client who entered with a visa lost her paper I-94. Where can staff usually retrieve her most recent I-94 record?", "opts": ["From the consulate that issued the visa", "From the client's employer", "From EOIR's automated case information portal", "On CBP's official I-94 website"], "a": 3, "fb": "Practical tool: CBP maintains electronic I-94 records and travel history online. Staff should print the record for the file and the attorney."}, {"cat": "Immigration Intake & Red Flags", "stem": "A client says: \"Me agarró la migra en la frontera y me soltaron con un papel.\" What is the most accurate English intake note?", "opts": ["Client entered the United States legally with papers.", "Client states she was apprehended by immigration authorities at the border and released with a document (obtain a copy).", "Client was formally deported at the border after a hearing and is now barred from returning to the United States for ten years.", "Client was arrested at the border, criminally charged with illegal entry, and released after paying a bond (case pending)."], "a": 1, "fb": "Translation accuracy: The note must stay neutral and must not add legal conclusions. The \"papel\" could be a Notice to Appear, a parole document or something else, so the copy is essential."}, {"cat": "Immigration Intake & Red Flags", "stem": "Who may give legal advice about which immigration form a client should file?", "opts": ["Any bilingual staff member who has at least two years of experience preparing immigration forms", "A licensed attorney or a DOJ-accredited representative of a recognized organization", "A certified translator who has handled similar cases", "A notary public licensed in the client's state"], "a": 1, "fb": "Within role: Under 8 C.F.R. 292.1, attorneys and accredited representatives may represent clients. Staff support the work but do not choose forms or strategy."}, {"cat": "Family-Based Cases", "stem": "Under U.S. immigration law, the immediate relatives of a U.S. citizen are:", "opts": ["spouses only, once the marriage has lasted two years", "spouses, unmarried children under 21, and parents of a citizen who is at least 21", "spouses and children of any age, married or unmarried, as long as the citizen files the petition", "spouses, brothers, sisters and parents of a citizen of any age, as long as they are not married"], "a": 1, "fb": "Rule anchor: INA 201(b)(2)(A)(i) defines immediate relatives. Siblings and married or adult children fall into the preference categories instead."}, {"cat": "Family-Based Cases", "stem": "What is the main practical difference between immediate relatives and the family preference categories?", "opts": ["Immediate relatives have no annual numerical limit; preference categories must wait for a visa number based on the priority date.", "Preference categories never require an affidavit of support.", "Immediate relatives must always process abroad at a consulate, while preference categories always adjust status inside the U.S.", "Immediate relatives need a labor certification before filing."], "a": 0, "fb": "Key concept: Preference relatives wait in line according to the Visa Bulletin. Immediate relatives can move forward as soon as the case is processed."}, {"cat": "Family-Based Cases", "stem": "In a family-based case, the priority date is generally:", "opts": ["the date the I-130 was approved", "the date of the green card interview", "the date USCIS received the properly filed I-130", "the date the beneficiary last entered the U.S."], "a": 2, "fb": "Key term: The priority date is the filing date of the petition. It is the client's place in line and appears on the I-797 notice."}, {"cat": "Family-Based Cases", "stem": "Who publishes the Visa Bulletin, and how often?", "opts": ["The National Visa Center, separately for each case", "The U.S. Department of State, every month", "USCIS, once a year", "EOIR, every quarter"], "a": 1, "fb": "Key tool: The monthly Visa Bulletin shows which priority dates may move forward, by category and country of chargeability."}, {"cat": "Family-Based Cases", "stem": "A lawful permanent resident files an I-130 for his wife. Which category applies?", "opts": ["F2A", "F4", "Immediate relative", "F3"], "a": 0, "fb": "Category map: F2A covers spouses and minor unmarried children of LPRs. Only spouses of U.S. citizens are immediate relatives."}, {"cat": "Family-Based Cases", "stem": "A U.S. citizen files an I-130 for her married 30-year-old son. Which category applies?", "opts": ["F1", "Immediate relative", "F3", "F2B"], "a": 2, "fb": "Category map: F1 is unmarried sons and daughters (21+) of citizens, F2B is unmarried sons and daughters (21+) of LPRs, F3 is married sons and daughters of citizens, and F4 is brothers and sisters of adult citizens."}, {"cat": "Family-Based Cases", "stem": "Which statement correctly contrasts adjustment of status with consular processing?", "opts": ["Adjustment of status happens at a consulate abroad after the NVC stage; consular processing happens at a USCIS field office inside the U.S.", "Both processes are completed inside the U.S.; the only difference is the filing fee.", "Consular processing is only available to asylees and refugees.", "Adjustment of status is completed inside the U.S. with USCIS (Form I-485); consular processing ends with a visa interview abroad."], "a": 3, "fb": "Key concept: Whether a client can adjust inside the U.S. depends on eligibility (for example, the manner of last entry). The attorney decides the route; staff build the right package."}, {"cat": "Family-Based Cases", "stem": "In a consular processing case, what does the National Visa Center (NVC) do after the I-130 is approved?", "opts": ["It collects fees, civil documents and the affidavit of support, and schedules the consular interview.", "It holds hearings on removal cases for beneficiaries who are already inside the United States without status.", "It mails green cards to applicants inside the United States.", "It reviews the evidence of the relationship and decides whether to approve or deny the I-130 petition."], "a": 0, "fb": "Process map: The NVC (Department of State) prepares the case for the consulate. Staff upload documents and track its requests."}, {"cat": "Family-Based Cases", "stem": "Form I-864 is the:", "opts": ["Application for Employment Authorization, which allows the intending immigrant to work while the case is pending", "Affidavit of Support, in which the sponsor accepts financial responsibility for the intending immigrant", "Petition to Remove Conditions on Residence, filed jointly by couples who were married less than two years at approval", "Application for Travel Document"], "a": 1, "fb": "Key form: The I-864 is a legally enforceable contract. Most sponsors must show income of at least 125% of the federal poverty guidelines for the household size."}, {"cat": "Family-Based Cases", "stem": "The petitioning spouse's income is too low for the I-864. What is a common solution the attorney may consider?", "opts": ["Filing a new I-130 for a different relative", "Adding a qualifying joint sponsor or counting qualifying assets", "Skipping the I-864, because spouses are exempt from it", "Paying a higher filing fee to waive the income requirement"], "a": 1, "fb": "Practice point: A joint sponsor who meets the requirement on their own, or assets of sufficient value, can address an income shortfall."}, {"cat": "Family-Based Cases", "stem": "Forms I-765 and I-131, filed together with an I-485, request:", "opts": ["a work permit (EAD) and an advance parole travel document while the I-485 is pending", "a fee waiver and expedited processing", "a waiver of unlawful presence and an immigrant visa to be issued by the consulate after the interview", "citizenship and a U.S. passport for the applicant once the adjustment of status application is approved"], "a": 0, "fb": "Package map: The I-485 package typically includes I-130 (if not already filed), I-485, I-864, I-765 and often I-131. Staff build the checklist for each."}, {"cat": "Family-Based Cases", "stem": "Which evidence most strongly supports a bona fide marriage?", "opts": ["Two detailed letters in which the spouses describe how they met and say they love each other", "A joint lease, joint bank statements showing shared expenses, and the birth certificate of the couple's child", "A single wedding photo with no other guests", "The petitioner's tax return filed as \"single\" for the year of the marriage, plus the marriage certificate"], "a": 1, "fb": "Evidence quality: Documents that show a shared life over time carry the most weight. A return filed as \"single\" contradicts the marriage and must be flagged."}, {"cat": "Family-Based Cases", "stem": "A couple has been married 14 months when the green card is approved. What does the spouse receive?", "opts": ["A temporary work permit only", "A ten-year green card with no conditions, because the marriage was more than one year old at approval", "A two-year conditional green card; the couple later files Form I-751 to remove the conditions", "A green card valid until the spouse naturalizes, with no need to file anything else with USCIS"], "a": 2, "fb": "Rule anchor: If the marriage is less than two years old when residence is granted, residence is conditional. The I-751 is generally filed in the 90 days before the card expires; staff must calendar it."}, {"cat": "Humanitarian Relief", "stem": "Which form is used to apply for asylum?", "opts": ["Form I-589", "Form I-130", "Form I-918", "Form I-821"], "a": 0, "fb": "Form map: I-589 is asylum and withholding of removal; I-918 is the U visa; I-821 is TPS; I-130 is a family petition."}, {"cat": "Humanitarian Relief", "stem": "The one-year deadline to apply for asylum is generally counted from:", "opts": ["the date of the first immigration court hearing", "the applicant's last arrival in the United States", "the applicant's first arrival in the United States", "the date the persecution began in the home country"], "a": 1, "fb": "Rule anchor: Under 8 C.F.R. 208.4(a)(2), the year runs from the last arrival. Limited exceptions exist for changed or extraordinary circumstances; only the attorney evaluates them."}, {"cat": "Humanitarian Relief", "stem": "Which of the following is NOT one of the five protected grounds for asylum?", "opts": ["Membership in a particular social group", "General economic hardship in the home country", "Religion", "Political opinion"], "a": 1, "fb": "Key concept: The five grounds are race, religion, nationality, membership in a particular social group and political opinion. Poverty alone does not qualify."}, {"cat": "Humanitarian Relief", "stem": "Which form is the law enforcement certification required for a U visa?", "opts": ["Form I-485, Supplement J", "Form I-914, Supplement A", "Form I-589, Supplement A", "Form I-918, Supplement B"], "a": 3, "fb": "Form map: Supplement B is signed by a certifying official. I-589 Supplement A lists additional children, I-914 Supplement A is for a T visa applicant's family members, and I-485 Supplement J relates to employment-based cases."}, {"cat": "Humanitarian Relief", "stem": "Which set of facts reflects the core U visa requirements?", "opts": ["The person is married to a U.S. citizen and has lived in the U.S. for three years.", "The person was a victim of a qualifying crime, suffered substantial abuse, and has been or is likely to be helpful to law enforcement.", "The person's abuser was arrested, convicted and sentenced for the crime by a state or federal court.", "The person entered the U.S. lawfully, has no criminal record of any kind, and reported the crime to police within 30 days."], "a": 1, "fb": "Rule anchor: A conviction of the perpetrator is not required. Helpfulness is shown through the Supplement B certification."}, {"cat": "Humanitarian Relief", "stem": "What is a VAWA self-petition?", "opts": ["A petition the abusive U.S. citizen or LPR spouse files on behalf of the abused spouse, after completing a counseling program", "A petition available only to spouses who have been married to the U.S. citizen or LPR for at least five years and lived together the whole time", "A request the police file with USCIS for the victim", "A petition (Form I-360) that an abused spouse, child or parent of a U.S. citizen or LPR files without the abuser's cooperation"], "a": 3, "fb": "Key concept: VAWA lets survivors file on their own. Federal confidentiality protections apply, so staff must never contact the abuser about the case."}, {"cat": "Humanitarian Relief", "stem": "The T visa is designed for:", "opts": ["temporary seasonal workers", "victims of any crime who reported it to the police", "nationals of countries designated for TPS", "victims of a severe form of human trafficking"], "a": 3, "fb": "Form map: T visas are filed on Form I-914. Trafficking cases often involve labor exploitation, so careful screening at intake matters."}, {"cat": "Humanitarian Relief", "stem": "What does Temporary Protected Status (TPS) provide?", "opts": ["Automatic asylum for all members of a designated group, without any need to prove individual persecution before an immigration judge", "A visa issued by U.S. consulates to enter the country", "Temporary protection from removal and eligibility for work authorization for nationals of countries designated by DHS", "Permanent residence for any national of a Latin American country who has lived in the U.S. for at least five years"], "a": 2, "fb": "Key concept: DHS designates countries for TPS because of conditions such as armed conflict or disasters. Registration and re-registration windows are strict and must be calendared."}, {"cat": "Humanitarian Relief", "stem": "Which is the best practice when drafting a client declaration?", "opts": ["Reuse a strong declaration from another client from the same country, changing only the names and dates.", "Write it in the third person, summarizing only the main events, and have the client sign the English version without reviewing it.", "Write in the client's voice, in chronological order, with specific details, and read it back to the client in Spanish before signing.", "Add dramatic details that make the story more persuasive."], "a": 2, "fb": "Credibility: The declaration must match the client's own account and the rest of the record. Inconsistencies or borrowed text can destroy a case."}, {"cat": "Humanitarian Relief", "stem": "Which approach reflects trauma-informed interviewing?", "opts": ["Push through the whole story in one session so the client does not have to come back.", "Ask the client to repeat the worst event several times, in full detail, to test whether the story stays consistent.", "Interrupt emotional answers to keep the client focused on dates.", "Explain the purpose, allow breaks, and avoid re-traumatizing questioning while still recording facts accurately."], "a": 3, "fb": "Client communication: Trauma affects memory and how people tell their stories. A calm, structured approach produces a more complete and reliable declaration."}, {"cat": "Humanitarian Relief", "stem": "Who signs Form I-918, Supplement B in a U visa case?", "opts": ["The victim's immigration attorney, after reviewing the police report and the victim's declaration", "A certifying official of a certifying agency, such as a police department, prosecutor's office or judge", "The immigration judge in removal proceedings, after hearing testimony from the victim and the investigating officers", "The victim's employer or landlord"], "a": 1, "fb": "Process point: Staff prepare the certification request package for the agency, but only the certifying official can sign it."}, {"cat": "Humanitarian Relief", "stem": "In asylum law, \"persecution\" refers to:", "opts": ["Serious harm, or the threat of it, by the government or by groups it cannot or will not control, on account of a protected ground", "Any unfair treatment at work, such as being passed over for promotion or paid less than coworkers who do the same job", "General violence and crime in the country that affect everyone in the population equally, regardless of who they are", "Being prosecuted under fair laws for an ordinary crime"], "a": 0, "fb": "Key term: Persecution requires serious harm linked to a protected ground. Generalized crime or ordinary prosecution usually does not qualify."}, {"cat": "Humanitarian Relief", "stem": "A client arrived 10 months ago and has never applied for asylum. What should staff do first?", "opts": ["Tell the client that the one-year deadline only applies to people who are already in removal proceedings in court.", "File an incomplete I-589 without attorney review to stop the clock.", "Flag the approaching one-year deadline to the attorney immediately and calendar it with reminders.", "Wait until the client gathers all the supporting evidence and country reports before mentioning the deadline to anyone."], "a": 2, "fb": "Deadline control: The one-year deadline is one of the most important dates in humanitarian work. Filing decisions belong to the attorney; incomplete or frivolous filings carry serious risks."}, {"cat": "Removal Defense & EOIR", "stem": "Which charging document begins removal proceedings in immigration court?", "opts": ["Form I-797C, Notice of Action", "Form I-94, Arrival/Departure Record", "Form EOIR-28", "Notice to Appear (Form I-862)"], "a": 3, "fb": "Key document: The NTA lists the charges and the allegations of fact. Proceedings begin when DHS files it with the immigration court."}, {"cat": "Removal Defense & EOIR", "stem": "What can happen if a respondent misses a hearing after receiving proper written notice?", "opts": ["The case is dismissed and DHS must start over.", "The immigration judge may order removal in absentia.", "The case is automatically continued to a new date.", "The hearing is rescheduled once without consequences."], "a": 1, "fb": "Rule anchor: INA 240(b)(5) allows an in absentia removal order. This is why calendaring and address updates are the most important staff tasks in court cases."}, {"cat": "Removal Defense & EOIR", "stem": "Which statement correctly contrasts the two main types of hearings?", "opts": ["Master calendar hearings are held only at USCIS field offices.", "A master calendar hearing is a short preliminary hearing for pleadings and scheduling; an individual hearing is the merits hearing.", "A master calendar hearing is the final trial with witnesses; an individual hearing is a short scheduling conference with the clerk.", "Both hearings are identical in purpose and length, but individual hearings are held only for respondents who are currently detained by ICE."], "a": 1, "fb": "Key concept: Many master calendar hearings take only minutes. Individual hearings require full evidence packets filed by the court's deadlines."}, {"cat": "Removal Defense & EOIR", "stem": "What is Form EOIR-28?", "opts": ["The application for cancellation of removal", "The respondent's change of address form for the immigration court and USCIS", "The attorney's notice of entry of appearance before the immigration court", "A motion to reopen a closed case"], "a": 2, "fb": "Form map: EOIR-28 is for immigration court, EOIR-27 is for the Board of Immigration Appeals, and G-28 is for USCIS."}, {"cat": "Removal Defense & EOIR", "stem": "A respondent in immigration court moves to a new address. What is required?", "opts": ["Nothing, as long as the attorney knows the new address", "Telling the judge in person at the next hearing", "Notifying the court within five days of the move, using Form EOIR-33/IC", "Notifying USCIS within 30 days using Form AR-11, which updates the court automatically"], "a": 2, "fb": "Rule anchor: 8 C.F.R. 1003.15(d)(2) requires notice to the court within five days. A separate address change with USCIS does not update the court's record."}, {"cat": "Removal Defense & EOIR", "stem": "In immigration court, a \"continuance\" is:", "opts": ["a postponement of a hearing to a later date", "a dismissal of the charges", "a transfer of the case to another court", "a final decision on the merits"], "a": 0, "fb": "Key term: Continuances must be requested by motion and are granted for good cause. Staff calendar the new date as soon as it is issued."}, {"cat": "Removal Defense & EOIR", "stem": "Who is the opposing party in immigration court?", "opts": ["The U.S. Department of State", "USCIS adjudications officers from the field office that denied the application", "DHS, represented by ICE attorneys of the Office of the Principal Legal Advisor", "The local district attorney's office, which prosecutes immigration violations in state court"], "a": 2, "fb": "Process map: Filings in court must be served on the DHS (ICE OPLA) office for that court."}, {"cat": "Removal Defense & EOIR", "stem": "Where are the formatting and filing deadline rules for immigration court evidence packets found?", "opts": ["In the Foreign Affairs Manual for consulates", "In the USCIS Policy Manual's fee schedule", "In the Immigration Court Practice Manual", "In the Visa Bulletin"], "a": 2, "fb": "Key resource: The Practice Manual covers pagination, tabbed exhibits, tables of contents, proof of service and deadlines, which differ for detained and non-detained cases."}, {"cat": "Removal Defense & EOIR", "stem": "In a court filing, a proof of service is:", "opts": ["a signed statement that a copy was served on the opposing party, with the date and method", "a copy of the respondent's photo identification", "the judge's signature and stamp on the first page, showing that the court accepted the filing", "the post office receipt with no other statement"], "a": 0, "fb": "Filing rule: Filings without proper proof of service on DHS can be rejected."}, {"cat": "Removal Defense & EOIR", "stem": "Spanish-language documents filed with the immigration court must be:", "opts": ["accompanied by an English translation with the translator's certification of competence and accuracy", "accepted without translation in courts near the border, where judges and staff are expected to read Spanish", "translated only on the first page", "translated orally by the court interpreter at the hearing, so no written translation needs to be filed"], "a": 0, "fb": "Filing rule: The Practice Manual requires certified English translations. The court interpreter interprets testimony, not documents."}, {"cat": "Removal Defense & EOIR", "stem": "Why is it essential to calendar a case from the Notice to Appear and every hearing notice the moment they arrive?", "opts": ["Because a missed hearing can lead to an in absentia removal order, and hearing dates can change with new notices", "Because USCIS cancels the client's pending receipt numbers if the court calendar is not updated within 24 hours", "Because DHS charges the respondent a late fee for every missed hearing, which must be paid before the next one", "Because the Visa Bulletin depends on the hearing date"], "a": 0, "fb": "Deadline control: Some NTAs do not list a date and the court sends notices later. Staff monitor the mail and the court's case information system and calendar every change."}, {"cat": "Removal Defense & EOIR", "stem": "EOIR's electronic filing system for immigration court and the BIA is called:", "opts": ["PACER", "EAMS", "ELIS", "ECAS (EOIR Courts &amp; Appeals System)"], "a": 3, "fb": "System map: PACER is for federal courts, ELIS is a USCIS electronic system and EAMS is California's workers' compensation system."}, {"cat": "Removal Defense & EOIR", "stem": "A client missed her hearing because she was in the hospital and received a removal order in absentia. What should staff do?", "opts": ["Refile her old application with USCIS to cancel the order.", "Alert the attorney immediately; a motion to reopen for exceptional circumstances generally must be filed within 180 days.", "Wait for ICE to contact her before taking any action.", "Tell her the order expires automatically after one year if ICE does not detain her, so no action is needed now."], "a": 1, "fb": "Rule anchor: INA 240(b)(5)(C)(i) sets a 180-day limit for motions based on exceptional circumstances. Hospital records should be gathered at once."}, {"cat": "Case Software & Status Tracking", "stem": "Where can a client check the status of a pending USCIS case?", "opts": ["On EOIR's automated case portal, using the USCIS receipt number", "On CBP's I-94 website", "In the monthly Visa Bulletin, which lists every pending case by receipt number", "On USCIS Case Status Online, using the 13-character receipt number"], "a": 3, "fb": "Status tracking: USCIS tracks each filing by receipt number. Staff log every receipt in the case system so status checks are routine."}, {"cat": "Case Software & Status Tracking", "stem": "EOIR's automated case information system identifies a court case by the respondent's:", "opts": ["A-Number", "USCIS receipt number", "Social Security number", "passport number"], "a": 0, "fb": "Status tracking: Court cases are tracked by A-Number, while USCIS filings are tracked by receipt number. Mixing them up wastes time and causes missed updates."}, {"cat": "Case Software & Status Tracking", "stem": "How do staff use USCIS's published processing times?", "opts": ["They apply only to immigration court cases, where the judge must decide within the posted number of days.", "They tell clients that every case must be decided within 90 days by law, and that USCIS pays a penalty if it is late.", "They are confidential and cannot be shared with clients.", "They compare the receipt date with the posted time for that form and office before making an inquiry."], "a": 3, "fb": "Practice point: An inquiry is generally appropriate only after a case is outside the posted processing time. Staff explain times as estimates, not promises."}, {"cat": "Case Software & Status Tracking", "stem": "What is a FOIA request used for in an immigration case?", "opts": ["Requesting the client's prior immigration records, such as the A-file, from agencies like USCIS, CBP or EOIR", "Asking USCIS to speed up a pending application because the client has an urgent family or medical situation", "Appealing the denial of an application to the Administrative Appeals Office within the required 30-day deadline after the decision", "Requesting a new hearing date in immigration court"], "a": 0, "fb": "Key tool: Records obtained through FOIA reveal prior filings, entries and statements that the attorney must review before filing anything new."}, {"cat": "Case Software & Status Tracking", "stem": "To obtain the record of proceedings from a client's old immigration court case, the FOIA request goes to:", "opts": ["the client's local police department", "EOIR", "the IRS", "the Department of State"], "a": 1, "fb": "Records map: EOIR holds court records, USCIS holds the A-file and benefit records, and CBP holds border encounter records."}, {"cat": "Case Software & Status Tracking", "stem": "What is the benefit and the main risk of form auto-fill in an immigration case manager?", "opts": ["It removes the need for review, because the software checks every answer against current immigration law before printing.", "It submits forms directly to USCIS without the client's signature.", "It saves time, but one wrong data point copies into every form in the package, so every field must be checked.", "It has no risk, because USCIS corrects typographical errors automatically."], "a": 2, "fb": "Data quality: Auto-fill multiplies both accuracy and errors. A wrong A-Number or date of birth on every form can trigger rejections or RFEs."}, {"cat": "Case Software & Status Tracking", "stem": "Why should every receipt number be logged in the case management system?", "opts": ["Only so the firm can bill the client for each form", "So deadlines, notices and status checks can be tracked for each filing and the whole team can see the case", "Because USCIS requires firms to upload every receipt number to its website within ten days of receiving it", "Because USCIS receipt numbers expire after 90 days if they are not logged in an approved case management system"], "a": 1, "fb": "Case visibility: Firms run hundreds of open receipts. A complete log prevents lost notices and missed follow-ups."}, {"cat": "Case Software & Status Tracking", "stem": "Which bilingual client update is appropriate for a support role?", "opts": ["\"Don't worry about the RFE, it's nothing. / No se preocupe por el RFE, no es nada.\"", "\"You can travel now since your case is pending. / Puede viajar ahora porque su caso está pendiente.\"", "\"Good news: your case will be approved next month, so you can start planning your trip. / Buenas noticias: su caso será aprobado el próximo mes.\"", "\"We received your biometrics notice for March 3 at 9:00 a.m. Please bring the letter and your ID. / Recibimos su cita de biométricos para el 3 de marzo.\""], "a": 3, "fb": "Within role: Updates report facts and next steps. Predictions and travel advice are legal advice and can harm the client."}, {"cat": "Case Software & Status Tracking", "stem": "Docketwise and INSZoom are best described as:", "opts": ["certified translation services", "immigration court e-filing systems", "official USCIS government portals for filing forms and paying fees online", "immigration case management platforms with form libraries and auto-fill"], "a": 3, "fb": "Software map: These platforms organize clients, forms, receipts and reminders. Government systems (USCIS online accounts, ECAS) are separate."}, {"cat": "Case Software & Status Tracking", "stem": "A client receives an RFE. What is the best calendaring practice?", "opts": ["Wait to calendar it until the client sends the documents.", "Calendar the due date with reminders well ahead (for example 30, 14 and 7 days), assign an owner and record the notice date.", "Enter only the due date in the calendar, and rely on USCIS to send an email reminder a few days before the deadline.", "Calendar it 30 days after the client brings in the notice, since the deadline starts from that day."], "a": 1, "fb": "Deadline control: RFE deadlines run from the notice date and are strict. Layered reminders and a named owner prevent missed responses."}, {"cat": "Case Software & Status Tracking", "stem": "A client has moved and has a pending USCIS application. Which filing updates the address with USCIS?", "opts": ["A new Form G-28 sent to the immigration court", "A new Form I-130, filed with the new address", "Form AR-11 or the USCIS online change of address, generally within 10 days of moving", "Form EOIR-33, filed with the immigration court within five days of moving"], "a": 2, "fb": "Rule anchor: 8 C.F.R. 265.1 requires noncitizens to report a change of address to USCIS within 10 days. A pending case may also need its own address update. Court cases need the separate EOIR-33."}, {"cat": "Case Software & Status Tracking", "stem": "How should staff send documents containing A-Numbers and passport data to the attorney or client?", "opts": ["Through the firm's secure client portal or another approved encrypted method", "By posting them in a shared social media group for the case", "Through a personal WhatsApp account, because it is faster and the client already uses it", "By unencrypted email to any address the client provides by phone"], "a": 0, "fb": "Data protection: Immigration files hold highly sensitive personal data. Using approved secure channels protects the client and the firm."}, {"cat": "Capstone: Immigration File Audit", "stem": "File audit: the I-485 lists the beneficiary's date of birth as 05/04/1990, but the I-130 lists 04/05/1990. What is the issue and the right action?", "opts": ["The dates conflict (U.S. MM/DD vs. Latin American DD/MM); verify against the birth certificate and correct before filing.", "File as is and let the client explain the difference at the interview, since officers expect small errors in foreign files.", "There is no issue, because USCIS reads every date in the package using the format of the applicant's country of birth.", "Change the birth certificate translation to match the I-130."], "a": 0, "fb": "Audit skill: Date-format confusion is one of the most common errors in Latin American files. The birth record is the source of truth."}, {"cat": "Capstone: Immigration File Audit", "stem": "File audit: an asylum client arrived 11 months and 3 weeks ago, and her declaration is unfinished. What is the most urgent action?", "opts": ["Wait for the country condition reports before raising the issue.", "Escalate to the attorney now: the one-year deadline is about to expire, and the filing decision belongs to the attorney.", "Tell the client that the deadline can be extended by sending a letter to USCIS.", "Keep polishing the declaration until it is perfect, because a strong declaration matters more than the filing date."], "a": 1, "fb": "Prioritization: A missed one-year deadline can bar asylum. The deadline outranks every other task in the file."}, {"cat": "Capstone: Immigration File Audit", "stem": "File audit: a removal client moved three months ago, no EOIR-33 was filed, and a hearing notice went to the old address. What is the fatal flaw?", "opts": ["The unsigned Form G-28 in the USCIS file", "The client's expired I-94 from a prior admission, which makes the court treat the client as unlawfully present", "The missing USCIS receipt number on the court filings, which prevents the judge from finding the case", "The missing change of address with the court, which can lead to a missed hearing and an in absentia order"], "a": 3, "fb": "Audit skill: Address control is the backbone of removal defense. The attorney must be told immediately so the hearing date can be confirmed."}, {"cat": "Capstone: Immigration File Audit", "stem": "File audit: a family-based package includes a Spanish birth certificate with an English translation but no translator's certification. What is the risk and the fix?", "opts": ["Notarize the Spanish original; the translation does not need a certification.", "USCIS may reject the evidence or issue an RFE; add a proper translator's certification before filing.", "Remove the translation and file the Spanish original only.", "There is no risk, because only consulates review translations; USCIS accepts any English version of the document."], "a": 1, "fb": "Audit skill: Every foreign-language document needs a complete translation and a signed certification under 8 C.F.R. 103.2(b)(3)."}, {"cat": "Capstone: Immigration File Audit", "stem": "Which is the best one-sentence oral briefing to the attorney?", "opts": ["\"The client says she will definitely win, so I went ahead and filed the I-589 yesterday without the declaration.\"", "\"I think we should probably look at the Ramírez file at some point soon, maybe next week, when things are calmer.\"", "\"Ramírez: the asylum deadline is May 3, nine days away; the declaration is 80% drafted and we still need the police report.\"", "\"Ramírez is fine; there is nothing to report this week.\""], "a": 2, "fb": "Briefing skill: State the file, the risk, the date, the status and what is missing. Clear, specific English lets the attorney decide fast."}, {"cat": "Capstone: Immigration File Audit", "stem": "File audit: the sponsor's income is below 125% of the poverty guidelines and there is no joint sponsor. What is the risk?", "opts": ["There is no risk, because spouses of U.S. citizens are exempt from the income requirement of the affidavit of support.", "The only effect is a delay in the Visa Bulletin, because low-income sponsors are moved to a later priority date in the category.", "The case will be approved automatically if the marriage is genuine.", "The case may receive an RFE or be refused on financial grounds; flag it so the attorney can add a joint sponsor or assets."], "a": 3, "fb": "Audit skill: An insufficient affidavit of support is a common cause of delays and refusals in family cases."}, {"cat": "Capstone: Immigration File Audit", "stem": "A client in removal proceedings also has a pending I-130 with USCIS. Which notices must be tracked?", "opts": ["Only the USCIS notices, because a pending I-130 automatically ends the court case and cancels future hearings", "Neither, because the attorney receives everything automatically", "Both: USCIS notices by receipt number and court notices by A-Number, with both addresses kept current", "Only the court notices, because USCIS stops processing during removal"], "a": 2, "fb": "Audit skill: Parallel processes with two agencies need two tracking systems and two address updates."}, {"cat": "Capstone: Immigration File Audit", "stem": "The intake says the client first entered in 2018, but his I-94 shows an admission with a visa in 2019. What should staff do?", "opts": ["Change the intake to 2019, because the I-94 is always correct and the client's memory is not reliable evidence of entry.", "Change the I-94 date in the file to 2018 to match the client, since the client's own account is the best evidence of entry.", "Ignore it, because the year of entry rarely matters.", "Record the discrepancy, ask the client to clarify, and report both facts to the attorney without changing either record."], "a": 3, "fb": "Audit skill: There may be two entries (for example, an earlier entry without inspection). Only the attorney decides how the history is presented."}, {"cat": "Capstone: Immigration File Audit", "stem": "Three items arrive on the same day: an RFE due in 60 days, a hearing tomorrow with missing exhibits, and a client asking for a status update. What comes first?", "opts": ["All three have equal priority", "The client's status update, because client satisfaction comes first", "The hearing tomorrow with missing exhibits: alert the attorney immediately", "The RFE due in 60 days"], "a": 2, "fb": "Prioritization: Rank tasks by the severity of the consequence and the time left. A hearing tomorrow outranks a deadline two months away."}, {"cat": "Capstone: Immigration File Audit", "stem": "A new client brings an I-589 prepared by a \"notario\" that contains facts she says are untrue. What is the best action?", "opts": ["Correct the false facts on a new I-589 and have her sign it today, so the corrected version replaces the old one.", "Ignore the problem, because the notario, not the client, is responsible for what the form says.", "Do not file or change anything; record what she says and escalate to the attorney, who will advise on correcting the record.", "File it as is, because it was already prepared and signed, and changing it now would look even worse to the asylum officer at the interview."], "a": 2, "fb": "Audit skill: False statements in a prior filing are a serious credibility and legal issue. Correcting the record is a strategic decision for the attorney."}, {"cat": "Capstone: Immigration File Audit", "stem": "An RFE response is assembled, but the original RFE notice is not in the package. Why does this matter?", "opts": ["It matters only for responses filed online.", "It does not matter, because USCIS keeps a copy of every notice and matches responses using the client's name.", "USCIS instructs applicants to place the RFE notice on top of the response so the evidence is matched to the case.", "Only the first page of the notice is needed, placed at the back of the package after all the evidence and the index."], "a": 2, "fb": "Audit skill: Following USCIS's response instructions exactly prevents misfiled evidence and decisions made without the response."}];
const COURSES = [{"code": "IL-IMM-01", "name": "Immigration English Foundations"}, {"code": "IL-IMM-02", "name": "Latin American Civil Documents"}, {"code": "IL-IMM-03", "name": "Immigration Intake & Red Flags"}, {"code": "IL-IMM-04", "name": "Family-Based Cases"}, {"code": "IL-IMM-05", "name": "Humanitarian Relief"}, {"code": "IL-IMM-06", "name": "Removal Defense & EOIR"}, {"code": "IL-IMM-07", "name": "Case Software & Status Tracking"}, {"code": "IL-IMM-08", "name": "Capstone: Immigration File Audit"}];

const TOTAL = QUESTIONS.length;
const BATCH_SIZE = 50;
const NUM_BATCHES = Math.ceil(TOTAL / BATCH_SIZE);

let state = {
  screen: "start",
  candidate: { name: "", email: "" },
  answers: new Array(TOTAL).fill(null),
  qIndex: 0,
  startedAt: null,
  awaitingNext: false,
  completedCount: 0,
  stoppedEarly: false,
};

function batchBounds(batchNum){
  const start = (batchNum - 1) * BATCH_SIZE;
  return [start, Math.min(start + BATCH_SIZE, TOTAL)];
}
function batchOfIndex(i){ return Math.floor(i / BATCH_SIZE) + 1; }
function scoreBetween(start, end){
  let c = 0;
  for(let i=start;i<end;i++){ if(state.answers[i] !== null && state.answers[i] === QUESTIONS[i].a) c++; }
  return c;
}
function fmtPct(x){
  let v = Math.round(x*1000)/10;
  if(x < PASS_THRESHOLD && v >= PASS_THRESHOLD*100) v = Math.round(PASS_THRESHOLD*1000 - 1)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}
function totalScore(){ return scoreBetween(0, TOTAL); }

function render(){
  document.body.classList.toggle("results-dark", state.screen === "final");
  if(state.screen === "question" || state.screen === "batchEnd") saveProgress();
  if(state.screen === "final") clearProgress();
  const card = document.getElementById("card");
  const progressShell = document.getElementById("progressShell");

  if(state.screen === "start"){
    progressShell.style.display = "none";
    card.innerHTML = `
      <h1>${TIER_LABEL} Certification Exam</h1>
      <div class="sub">This exam covers the core content of the ${COURSES.length}-course ${PATHWAY_NAME} pathway. Your results include a score for each course. ${TOTAL} questions across ${NUM_BATCHES} batches of ${BATCH_SIZE}. Correct answers and explanations are included in your final report, and you'll see a score check after every batch. After any batch except the last, you can stop and get a provisional result based on what you've completed so far, or continue for a complete, non-provisional result.</div>
      <div class="field"><label>Full name</label><input id="inName" type="text" placeholder="Jane Candidate"></div>
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="jane@example.com"></div>
      <div class="navrow"><span></span><button class="btn gold" onclick="beginExam()">Begin Exam</button></div>
      <div class="footer-note">Your email is used only to send you your results and feedback.</div>
    `;
    return;
  }

  if(state.screen === "question"){
    progressShell.style.display = "block";
    renderTabs();
    const i = state.qIndex;
    const q = QUESTIONS[i];
    const pct = Math.round((i/TOTAL)*100);
    document.getElementById("barInner").style.width = pct + "%";
    const given = state.answers[i];

    card.innerHTML = `
      <div class="qmeta">${q.cat} &middot; Question ${i+1} of ${TOTAL} &middot; Batch ${batchOfIndex(i)} of ${NUM_BATCHES}</div>
      <div class="stem">${q.stem}</div>
      <div id="optsHolder"></div>
      <div class="navrow"><span></span><button class="btn gold" id="nextBtn" onclick="advance()" ${given === null ? "disabled" : ""}>${(i+1)%BATCH_SIZE===0 || i+1===TOTAL ? "Continue" : "Next question"}</button></div>
    `;
    const holder = document.getElementById("optsHolder");
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      let cls = "opt";
      if(idx === given) cls += " selected";
      btn.className = cls;
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}.</span> ${opt}`;
      btn.onclick = () => selectAnswer(idx);
      holder.appendChild(btn);
    });
    return;
  }

  if(state.screen === "batchEnd"){
    progressShell.style.display = "block";
    renderTabs();
    const bn = state._justFinishedBatch;
    const [bs, be] = batchBounds(bn);
